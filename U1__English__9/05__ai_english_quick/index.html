    { id: 'solarized-light', label: 'Solarized Light', swatch: '#fdf6e3' },
    { id: 'graphite', label: '石墨深色', swatch: '#0f1115' },
    { id: 'solarized-dark', label: 'Solarized Dark', swatch: '#002b36' },
    { id: 'nord', label: 'Nord', swatch: '#2e3440' },
    { id: 'gruvbox', label: 'Gruvbox', swatch: '#282828' },
    { id: 'auto', label: '跟随系统', swatch: 'linear-gradient(135deg, #ffffff 50%, #0f1115 50%)' },
  ];

  // 各 section 类型的 en / cn 两侧字段（顺序即渲染顺序），与 config.js 的 SECTION_TYPES 对应
  const SIDE_FIELDS = {
    vocab: { en: ['word', 'pos', 'ipa'], cn: ['meaning', 'reading'] },
    phrases: { en: ['phrase'], cn: ['meaning'] },
    sentences: { en: ['text_en'], cn: ['text_cn'] },
  };

  // 常驻字段（不参与遮挡）：note / kind
  const RESIDENT_FIELD = { phrases: 'note', sentences: 'kind' };

  // 「我的收藏」类型筛选下拉的选项文案，跟 SIDE_FIELDS 的 key 对应
  const SECTION_TYPE_LABELS = { vocab: '词汇', phrases: '短语', sentences: '句型' };

  // 「我的收藏」对号档位筛选下拉里，档位数字对应的中文数字（"1"→"一"，拼成"一档"）
  const MARK_LEVEL_CN = { 1: '一', 2: '二', 3: '三' };

  // ── 运行时状态 ───────────────────────────
  const state = {
    mode: DEFAULT_MODE,
    theme: DEFAULT_THEME,
    view: 'doc',       // 'doc'：正常文档视图；'favorites'：我的收藏视图；'quiz'：测验模式
    allExpanded: false, // 当前文档是否处于"全部展开"状态，决定切换按钮图标 ➕ / ➖
    quizPool: null,    // 测验模式当前这一轮打乱后的条目池，null 表示需要重新洗牌
    quizBatchOffset: 0, // 当前显示的是池子里第几批（每批 QUIZ_BATCH_SIZE 条）
    currentSlug: null, // index 模式下当前查看的 NoteDoc
    data: null,        // { docs, tree } 或 { doc }

    // 「我的收藏」词条列表的筛选条件，只存内存不持久化，刷新页面重置；'all' 表示不筛选
    favoritesTypeFilter: 'all', // 'all' | 'vocab' | 'phrases' | 'sentences'
    favoritesMarkFilter: 'all', // 'all' | 'none' | 1 | 2 | 3

    syncPanelOpen: false, // "同步设置"面板是否展开，只存内存，刷新页面重置为收起

    // 收藏跨设备同步状态，只存内存不持久化
    sync: {
      status: 'unconfigured', // 'unconfigured' | 'idle' | 'syncing' | 'error'
      lastError: null,
      lastSyncedAt: null,
      pushTimer: null, // 推送 debounce 用的 setTimeout 句柄
    },
  };


  /**
   * 读取页面内嵌的 JSON 数据
   * @returns {object}
   */
  function loadData() {

    const node = document.querySelector('[data-role="livenotes-data"]');

    return JSON.parse(node.textContent);
  }

  /**
   * 转义 HTML 文本节点中的特殊字符
   * @param {*} value
   * @returns {string}
   */
  function escapeHtml(value) {

    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  /**
   * 转义 HTML 属性值（在 escapeHtml 基础上再处理引号）
   * @param {*} value
   * @returns {string}
   */
  function escapeAttr(value) {

    return escapeHtml(value).replace(/"/g, '&quot;');
  }

  /**
   * 当前正在查看的 NoteDoc 的 slug（单篇模式取内嵌 doc，index 模式取 state.currentSlug）
   * @returns {string|null}
   */
  function currentSlug() {

    return state.data.doc ? state.data.doc.slug : state.currentSlug;
  }

  /**
   * 按 slug 取当前应渲染的 NoteDoc
   * @param {string|null} slug
   * @returns {object|null}
   */
  function findDoc(slug) {

    if (state.data.doc) {

      return state.data.doc;
    }

    return (state.data.docs || []).find((doc) => doc.slug === slug) || null;
  }

  /**
   * 从 localStorage 恢复模式，无则用默认
   * @returns {'en'|'cn'}
   */
  function loadMode() {

    try {

      return localStorage.getItem(STORAGE_MODE_KEY) || DEFAULT_MODE;
    } catch (err) {

      // localStorage 不可用（隐私模式 / 被禁用）时回退默认
      return DEFAULT_MODE;
    }
  }

  /**
   * 持久化当前模式
   * @param {'en'|'cn'} mode
   * @returns {void}
   */
  function saveMode(mode) {

    try {
      localStorage.setItem(STORAGE_MODE_KEY, mode);
    } catch (err) {
      // 静默降级：不影响页面使用
    }
  }

  /**
   * 从 localStorage 恢复主题 id，无 / 非法值时回退默认
   * @returns {string}
   */
  function loadTheme() {

    try {
      const saved = localStorage.getItem(STORAGE_THEME_KEY);

      return THEMES.some((theme) => theme.id === saved) ? saved : DEFAULT_THEME;
    } catch (err) {

      return DEFAULT_THEME;
    }
  }

  /**
   * 持久化主题 id
   * @param {string} themeId
   * @returns {void}
   */
  function saveTheme(themeId) {

    try {
      localStorage.setItem(STORAGE_THEME_KEY, themeId);
    } catch (err) {
      // 静默降级
    }
  }

  /**
   * 应用主题：light 移除 data-theme（用基础令牌），其余写到 <html data-theme>
   * @param {string} themeId
   * @returns {void}
   */
  function applyTheme(themeId) {

    state.theme = themeId;

    if (themeId === 'light') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', themeId);
    }

    updateThemeSwatch(themeId);
  }

  /**
   * 更新收起态色块的背景色，跟当前主题保持一致
   * @param {string} themeId
   * @returns {void}
   */
  function updateThemeSwatch(themeId) {

    const theme = THEMES.find((item) => item.id === themeId);

    if (!theme) {

      return;
    }

    // 顶部和内容区底部都有色块（同一个 data-role），两个都要同步
    document.querySelectorAll('[data-role="theme-swatch"]').forEach((swatchEl) => {
      swatchEl.style.background = theme.swatch;
    });
  }

  /**
   * 填充主题下拉框选项、同步当前值并绑定切换事件。
   * 顶部的 select 是静态标记、只需要初始化一次；内容区底部的 select 每次 renderContent /
   * renderQuizView 都会被 innerHTML 重新创建，所以每次渲染完都要再调一次这个函数——
   * 用 dataset 标记跳过已经初始化过的，避免重复绑定 change 监听
   * @returns {void}
   */
  function setupThemeSelect() {

    document.querySelectorAll('[data-role="theme-select"]').forEach((selectEl) => {

      if (selectEl.dataset.themeReady) {

        return;
      }

      selectEl.innerHTML = THEMES
        .map((theme) => `<option value="${theme.id}">${theme.label}</option>`)
        .join('');
      selectEl.value = state.theme;

      selectEl.addEventListener('change', () => {
        applyTheme(selectEl.value);
        saveTheme(selectEl.value);
      });

      selectEl.dataset.themeReady = 'true';
    });
  }

  /**
   * 读取某篇已展开的 item key 列表
   * @param {string} slug
   * @returns {Set<string>}
   */
  function loadExpanded(slug) {

    try {
      const raw = localStorage.getItem(STORAGE_EXPANDED_PREFIX + slug);
      const list = raw ? JSON.parse(raw) : [];

      return new Set(Array.isArray(list) ? list : []);
    } catch (err) {

      return new Set();
    }
  }

  /**
   * 持久化某篇已展开的 item key 列表
   * @param {string} slug
   * @param {Set<string>} keys
   * @returns {void}
   */
  function saveExpanded(slug, keys) {

    try {
      localStorage.setItem(STORAGE_EXPANDED_PREFIX + slug, JSON.stringify([...keys]));
    } catch (err) {
      // 静默降级
    }
  }

  /**
   * 读取整个收藏列表（doc + item 两级共用一个数组）
   * @returns {object[]}
   */
  function loadFavorites() {

    try {
      const raw = localStorage.getItem(STORAGE_FAVORITES_KEY);
      const list = raw ? JSON.parse(raw) : [];

      return Array.isArray(list) ? list : [];
    } catch (err) {

      return [];
    }
  }

  /**
   * 持久化整个收藏列表
   * @param {object[]} list
   * @returns {void}
   */
  function saveFavorites(list) {

    try {
      localStorage.setItem(STORAGE_FAVORITES_KEY, JSON.stringify(list));
    } catch (err) {
      // 静默降级
    }
  }

  /**
   * 读取本机保存的同步配置（Token / Gist ID），没有就返回空字符串
   * @returns {{ token: string, gistId: string }}
   */
  function loadSyncConfig() {

    try {

      return {
        token: localStorage.getItem(STORAGE_SYNC_TOKEN_KEY) || '',
        gistId: localStorage.getItem(STORAGE_SYNC_GIST_ID_KEY) || '',
      };
    } catch (err) {

      return { token: '', gistId: '' };
    }
  }

  /**
   * 保存同步配置到本机（每台设备各自存一份，不参与 Gist 同步内容本身）
   * @param {{ token: string, gistId: string }} config
   * @returns {void}
   */
  function saveSyncConfig(config) {

    try {
      localStorage.setItem(STORAGE_SYNC_TOKEN_KEY, config.token || '');
      localStorage.setItem(STORAGE_SYNC_GIST_ID_KEY, config.gistId || '');
    } catch (err) {
      // 静默降级
    }
  }

  /**
   * 清空本机的同步配置（只影响这台设备，不影响 Gist 本身，也不影响其它设备）
   * @returns {void}
   */
  function clearSyncConfig() {

    try {
      localStorage.removeItem(STORAGE_SYNC_TOKEN_KEY);
      localStorage.removeItem(STORAGE_SYNC_GIST_ID_KEY);
    } catch (err) {
      // 静默降级
    }
  }

  /**
   * 判断这台设备是否已经配置好同步（Token + Gist ID 都有才算）
   * @returns {boolean}
   */
  function isSyncConfigured() {

    const { token, gistId } = loadSyncConfig();

    return Boolean(token && gistId);
  }

  /**
   * 判断某条收藏记录是不是"空"的（取消收藏、且 item 没有评分）——
   * 空记录只是为了同步时能覆盖别的设备上的旧数据才保留，过一段时间可以物理清理掉
   * @param {object} fav
   * @returns {boolean}
   */
  function isFavoriteRecordEmpty(fav) {

    if (fav.kind === 'doc') {

      return !fav.favorited;
    }

    return !fav.favorited && !fav.mark;
  }

  /**
   * 清理"已经空了很久"的墓碑记录，避免收藏列表随时间无限增长。保留窗口留够时间
   * （TOMBSTONE_RETENTION_MS），确保正常同步节奏内的设备都已经拿到过这条删除
   * @param {object[]} list
   * @returns {object[]}
   */
  function gcStaleFavorites(list) {

    const cutoff = Date.now() - TOMBSTONE_RETENTION_MS;

    return list.filter((fav) => !isFavoriteRecordEmpty(fav) || favoriteUpdatedAtMs(fav) > cutoff);
  }

  /**
   * 判断合并结果是否跟远端数据完全一致——一致就说明本地没有任何远端还没有的更新，
   * 拉取之后不需要再推一次
   * @param {object[]} merged
   * @param {object[]} remote
   * @returns {boolean}
   */
  function remoteAlreadyHasAll(merged, remote) {

    if (merged.length !== remote.length) {

      return false;
    }

    const remoteMap = new Map(remote.map((fav) => [`${fav.kind}:${fav.id}`, fav]));

    return merged.every((fav) => {
      const remoteFav = remoteMap.get(`${fav.kind}:${fav.id}`);

      return remoteFav && favoriteUpdatedAtMs(remoteFav) === favoriteUpdatedAtMs(fav);
    });
  }

  /**
   * 发一次 GitHub Gist API 请求，统一处理鉴权头和错误信息
   * @param {string} method
   * @param {string} path - 拼在 GIST_API_BASE 后面，比如 `/<gistId>`，创建时传空串
   * @param {string} token
   * @param {object} [body]
   * @returns {Promise<object|null>}
   */
  async function gistApiRequest(method, path, token, body) {

    const headers = {
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
    };

    if (token) {
      headers.Authorization = `token ${token}`;
    }

    if (body !== undefined) {
      headers['Content-Type'] = 'application/json';
    }

    const res = await fetch(`${GIST_API_BASE}${path}`, {
      method,
      headers,
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });

    if (!res.ok) {
      const message = res.status === 401 || res.status === 403
        ? 'Token 无效或权限不足，请重新设置同步'
        : res.status === 404
          ? 'Gist 不存在，请检查 Gist ID'
          : `GitHub API 请求失败（状态码 ${res.status}）`;
      const err = new Error(message);

      err.status = res.status;

      throw err;
    }

    return res.status === 204 ? null : res.json();
  }

  /**
   * 创建一个新的私有 Gist 当同步后端，返回新建的 Gist ID
   * （只有第一台设备需要建，建完把 ID 复制到其它设备，其它设备不要再选自动创建）
   * @param {string} token
   * @returns {Promise<string>}
   */
  async function createGist(token) {

    const gist = await gistApiRequest('POST', '', token, {
      description: 'livenotes 收藏数据（跨设备自动同步用，请勿手动编辑）',
      public: false,
      files: {
        [GIST_FILENAME]: {
          content: JSON.stringify({ updatedAt: new Date().toISOString(), records: [] }, null, 2),
        },
      },
    });

    return gist.id;
  }

  /**
   * 从 Gist 读取收藏记录数组
   * @param {string} gistId
   * @param {string} token
   * @returns {Promise<object[]>}
   */
  async function fetchGistRecords(gistId, token) {

    const gist = await gistApiRequest('GET', `/${gistId}`, token);
    const file = gist.files && gist.files[GIST_FILENAME];

    if (!file) {

      return [];
    }

    let text = file.content || '';

    // 内容超过 1MB 时 GitHub 会截断 content 字段，要另外用 raw_url 拉完整内容；
    // 收藏数据体量很小，正常用不到，这里只是防呆
    if (file.truncated && file.raw_url) {
      const rawRes = await fetch(file.raw_url);

      text = await rawRes.text();
    }

    try {
      const parsed = JSON.parse(text);

      return Array.isArray(parsed.records) ? parsed.records : [];
    } catch (err) {

      return [];
    }
  }

  /**
   * 把收藏记录数组写回 Gist
   * @param {string} gistId
   * @param {string} token
   * @param {object[]} records
   * @returns {Promise<void>}
   */
  async function updateGistRecords(gistId, token, records) {

    await gistApiRequest('PATCH', `/${gistId}`, token, {
      files: {
        [GIST_FILENAME]: {
          content: JSON.stringify({ updatedAt: new Date().toISOString(), records }, null, 2),
        },
      },
    });
  }

  /**
   * 同步状态文字 + 图标，工具条和设置面板共用
   * @returns {string}
   */
  function formatSyncStatusText() {

    const { status, lastError, lastSyncedAt } = state.sync;

    if (status === 'syncing') {

      return '⟳ 同步中…';
    }

    if (status === 'error') {

      return `⚠ 同步失败：${lastError || '未知错误'}`;
    }

    if (status === 'idle') {
      const time = lastSyncedAt
        ? new Date(lastSyncedAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
        : '';

      return time ? `✓ 已同步（${time}）` : '✓ 已同步';
    }

    return '未设置跨设备同步';
  }

  /**
   * 收藏视图里如果正显示着同步状态徽标，原地刷新文字/颜色，不用整个视图重渲染
   * （更新状态经常发生在异步请求中途，这时候不适合触发整页重渲染打断用户）
   * @returns {void}
   */
  function refreshSyncStatusBadge() {

    const badgeEl = document.querySelector('[data-role="sync-status"]');

    if (!badgeEl) {

      return;
    }

    badgeEl.textContent = formatSyncStatusText();
    badgeEl.className = `sync-status sync-status--${state.sync.status}`;
  }

  /**
   * 更新同步状态（写进内存 state，并顺带刷新页面上的状态徽标）
   * @param {'unconfigured'|'idle'|'syncing'|'error'} status
   * @param {Error} [err]
   * @returns {void}
   */
  function updateSyncStatus(status, err) {

    state.sync.status = status;
    state.sync.lastError = err ? err.message : null;

    if (status === 'idle') {
      state.sync.lastSyncedAt = new Date().toISOString();
    }

    if (err) {
      console.warn('[livenotes sync]', err);
    }

    refreshSyncStatusBadge();
  }

  /**
   * 拉取合并后刷新当前正在看的视图（收藏 / 测验 / 正文），让星标 / 评分状态跟合并结果同步。
   * 侧边栏的文档星标只在 init() 渲染一次，这里暂不刷新——要看到别的设备新收藏的整篇文档，
   * 目前还需要刷新页面，先记录成已知的后续可以补的点
   * @returns {void}
   */
  function refreshAfterSync() {

    if (state.view === 'favorites') {
      renderFavoritesView();

      return;
    }

    if (state.view === 'quiz') {
      renderQuizView();

      return;
    }

    const slug = currentSlug();
    const doc = findDoc(slug);

    if (doc) {
      renderContent(doc);
    }
  }

  /**
   * 从 Gist 拉取最新数据，跟本地合并；如果合并结果里有本地独有、远端还没有的更新，
   * 合并后立刻推一次回去（双向同步的核心：既拉又可能补推）
   * @returns {Promise<void>}
   */
  async function pullFavoritesFromGist() {

    const { token, gistId } = loadSyncConfig();

    if (!token || !gistId) {

      return;
    }

    updateSyncStatus('syncing');

    try {
      const remote = await fetchGistRecords(gistId, token);
      const local = loadFavorites();
      const merged = mergeFavoriteLists(remote, local);

      saveFavorites(merged);
      refreshAfterSync();

      if (!remoteAlreadyHasAll(merged, remote)) {
        await updateGistRecords(gistId, token, gcStaleFavorites(merged));
      }

      updateSyncStatus('idle');
    } catch (err) {
      updateSyncStatus('error', err);
    }
  }

  /**
   * 把本地当前收藏数据（清理过期墓碑后）推送到 Gist
   * @returns {Promise<void>}
   */
  async function pushFavoritesToGist() {

    const { token, gistId } = loadSyncConfig();

    if (!token || !gistId) {

      return;
    }

    updateSyncStatus('syncing');

    try {
      const cleaned = gcStaleFavorites(loadFavorites());

      saveFavorites(cleaned);
      await updateGistRecords(gistId, token, cleaned);
      updateSyncStatus('idle');
    } catch (err) {
      updateSyncStatus('error', err);
    }
  }

  /**
   * 推送 debounce：收藏变化后等 SYNC_PUSH_DEBOUNCE_MS 无新改动再真正推送，
   * 避免连续点收藏/评分时每次操作都发一次请求
   * @returns {void}
   */
  function schedulePushFavorites() {

    if (!isSyncConfigured()) {

      return;
    }

    if (state.sync.pushTimer) {
      clearTimeout(state.sync.pushTimer);
    }

    state.sync.pushTimer = setTimeout(() => {
      state.sync.pushTimer = null;
      pushFavoritesToGist();
    }, SYNC_PUSH_DEBOUNCE_MS);
  }

  /**
   * 本地写入收藏 + 触发一次 debounce 推送，所有用户产生的收藏改动都要走这个函数
   * （从 Gist 拉取合并后的写入不走这个，直接调 saveFavorites，避免拉取触发的写入又排一次推送）
   * @param {object[]} list
   * @returns {void}
   */
  function persistFavorites(list) {

    saveFavorites(list);
    schedulePushFavorites();
  }

  /**
   * 页面加载、以及页面从后台切回前台时自动拉取一次远端数据；只有配置好同步才会真正发请求
   * @returns {void}
   */
  function setupFavoritesSync() {

    if (isSyncConfigured()) {
      pullFavoritesFromGist();
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && isSyncConfigured()) {
        pullFavoritesFromGist();
      }
    });
  }

  /**
   * "保存"按钮：读设置面板里的 Token / Gist ID 输入框，Gist ID 留空则自动创建一个新 Gist，
   * 保存配置后立刻拉取一次做首次同步
   * @returns {Promise<void>}
   */
  async function handleSaveSyncConfig() {

    const tokenInput = document.querySelector('[data-role="sync-token-input"]');
    const gistIdInput = document.querySelector('[data-role="sync-gist-id-input"]');

    if (!tokenInput || !gistIdInput) {

      return;
    }

    const token = tokenInput.value.trim();
    let gistId = gistIdInput.value.trim();

    if (!token) {
      window.alert('请先填写 Token');

      return;
    }

    updateSyncStatus('syncing');

    try {
      if (!gistId) {
        gistId = await createGist(token);
        window.alert(`已创建新 Gist，ID 是：\n${gistId}\n\n请把这个 ID 复制到其它设备的同步设置里，其它设备不要再留空创建。`);
      }

      saveSyncConfig({ token, gistId });
      await pullFavoritesFromGist();
    } catch (err) {
      updateSyncStatus('error', err);
      window.alert(`同步设置失败：${err.message}`);
    }

    renderFavoritesView();
  }

  /**
   * "退出同步"按钮：只清空这台设备保存的 Token/Gist ID，不影响 Gist 本身和其它设备
   * @returns {void}
   */
  function handleClearSyncConfig() {

    if (!window.confirm('确定要退出同步吗？只会清空这台设备保存的 Token/Gist ID，不会删除 Gist 或影响其它设备。')) {

      return;
    }

    clearSyncConfig();
    updateSyncStatus('unconfigured');
    renderFavoritesView();
  }

  /**
   * "立即同步"按钮：手动触发一次完整同步，不用等自动拉取/推送的时机
   * （`pullFavoritesFromGist` 本身就是双向的：拉远端合并本地，本地有远端没有的更新会自动
   * 补推回去，所以点这一个按钮就够了，不需要分开的"上传"按钮）
   * @returns {Promise<void>}
   */
  async function handleSyncNow() {

    if (!isSyncConfigured()) {
      window.alert('请先在"同步设置"里填好 Token 和 Gist ID');

      return;
    }

    // 有正在等待的 debounce 推送就取消掉，马上同步这一次已经把它覆盖了，不用重复推
    if (state.sync.pushTimer) {
      clearTimeout(state.sync.pushTimer);
      state.sync.pushTimer = null;
    }

    await pullFavoritesFromGist();
    renderFavoritesView();
  }

  /**
   * 在收藏列表里查找某条记录的下标
   * @param {object[]} list
   * @param {'doc'|'item'} kind
   * @param {string} id
   * @returns {number} 未找到返回 -1
   */
  function favoriteIndex(list, kind, id) {

    return list.findIndex((fav) => fav.kind === kind && fav.id === id);
  }

  /**
   * 判断某篇文档是否已整篇收藏
   * @param {string} docSlug
   * @returns {boolean}
   */
  function isDocFavorited(docSlug) {

    const list = loadFavorites();
    const index = favoriteIndex(list, 'doc', docSlug);

    return index >= 0 && Boolean(list[index].favorited);
  }

  /**
   * 取某条 item 的标注记录（收藏 + 评分共用同一条记录），不存在返回 null
   * @param {string} itemId - `${docSlug}::${sectionType}:${itemIndex}`
   * @returns {object|null}
   */
  function findItemRecord(itemId) {

    return loadFavorites().find((fav) => fav.kind === 'item' && fav.id === itemId) || null;
  }

  /**
   * 判断某条 item 是否已收藏
   * @param {string} itemId - `${docSlug}::${sectionType}:${itemIndex}`
   * @returns {boolean}
   */
  function isItemFavorited(itemId) {

    const record = findItemRecord(itemId);

    return Boolean(record && record.favorited);
  }

  /**
   * 取某条 item 的测验评分（1~3），没评过返回 null
   * @param {string} itemId - `${docSlug}::${sectionType}:${itemIndex}`
   * @returns {number|null}
   */
  function getItemMark(itemId) {

    const record = findItemRecord(itemId);

    return record ? record.mark : null;
  }

  /**
   * 按 slug 找到或新建一条整篇文档收藏记录，返回 { list, record }
   * 新建时 favorited 是 false，由调用方接着填（同步用：不物理删除记录，见 toggleFavoriteDoc）
   * @param {object} doc - NoteDoc
   * @returns {{ list: object[], record: object }}
   */
  function ensureDocRecord(doc) {

    const list = loadFavorites();
    const index = favoriteIndex(list, 'doc', doc.slug);

    if (index >= 0) {

      return { list, record: list[index] };
    }

    const record = {
      kind: 'doc',
      id: doc.slug,
      docSlug: doc.slug,
      docTitle: doc.title || doc.slug,
      chapter: doc.chapter,
      favorited: false,
      favoritedAt: null,
      addedAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
    };

    list.push(record);

    return { list, record };
  }

  /**
   * 切换整篇文档的收藏状态。取消收藏不物理删除记录，只是把 favorited 置为 false
   * （跨设备同步需要靠这条"取消"记录本身去覆盖别的设备上的旧数据，见 mergeFavoriteLists）
   * @param {object} doc - NoteDoc
   * @returns {void}
   */
  function toggleFavoriteDoc(doc) {

    const { list, record } = ensureDocRecord(doc);
    const now = new Date().toISOString();

    record.favorited = !record.favorited;
    record.favoritedAt = record.favorited ? now : null;
    record.updatedAt = now;
    record.docTitle = doc.title || doc.slug;
    record.chapter = doc.chapter;

    persistFavorites(list);
  }

  /**
   * 组装 toggleFavoriteItem / setItemMark 需要的 context
   * @param {object} doc - NoteDoc
   * @param {object} section - Section
   * @param {number} itemIndex
   * @returns {object}
   */
  function buildItemContext(doc, section, itemIndex) {

    return {
      docSlug: doc.slug,
      docTitle: doc.title || doc.slug,
      chapter: doc.chapter,
      sectionType: section.type,
      sectionHeading: section.heading,
      itemIndex,
      item: section.items[itemIndex],
    };
  }

  /**
   * 按 context 找到或新建一条 item 标注记录（收藏 / 评分共用），返回 { list, record }
   * 新建时 favorited/mark 都是空，由调用方接着填
   * @param {object} context - { docSlug, docTitle, chapter, sectionType, sectionHeading, itemIndex, item }
   * @returns {{ list: object[], record: object }}
   */
  function ensureItemRecord(context) {

    const id = `${context.docSlug}::${context.sectionType}:${context.itemIndex}`;
    const list = loadFavorites();
    const index = favoriteIndex(list, 'item', id);

    if (index >= 0) {

      return { list, record: list[index] };
    }

    const record = {
      kind: 'item',
      id,
      docSlug: context.docSlug,
      docTitle: context.docTitle,
      chapter: context.chapter,
      sectionType: context.sectionType,
      sectionHeading: context.sectionHeading,
      itemIndex: context.itemIndex,
      snapshot: {
        en: context.item.en,
        cn: context.item.cn,
        note: context.item.note,
        kind: context.item.kind,
      },
      favorited: false,
      favoritedAt: null,
      mark: null,
      markedAt: null,
      updatedAt: new Date().toISOString(),
    };

    list.push(record);

    return { list, record };
  }

  /**
   * 切换单条 item 的收藏状态（收藏 / 评分共用同一条记录，见 ensureItemRecord）。
   * 取消收藏不物理删除记录，只是把 favorited 置为 false（跨设备同步需要靠这条"取消"
   * 记录本身去覆盖别的设备上的旧数据，见 mergeFavoriteLists；真正的物理清理见 gcStaleFavorites）
   * @param {object} context - { docSlug, docTitle, chapter, sectionType, sectionHeading, itemIndex, item }
   * @returns {void}
   */
  function toggleFavoriteItem(context) {

    const { list, record } = ensureItemRecord(context);
    const now = new Date().toISOString();

    record.favorited = !record.favorited;
    record.favoritedAt = record.favorited ? now : null;
    record.updatedAt = now;

    persistFavorites(list);
  }

  /**
   * 设置单条 item 的测验评分：再点一次当前档位会清空评分
   * @param {object} context - { docSlug, docTitle, chapter, sectionType, sectionHeading, itemIndex, item }
   * @param {1|2|3} level
   * @returns {void}
   */
  function setItemMark(context, level) {

    const { list, record } = ensureItemRecord(context);
    const now = new Date().toISOString();

    record.mark = record.mark === level ? null : level;
    record.markedAt = record.mark ? now : null;

    // 设置了评分（不是取消）就顺带自动收藏，方便测验时顺手标记；取消评分不会跟着取消收藏，
    // 避免误清掉本来手动收藏的记录
    if (record.mark !== null && !record.favorited) {
      record.favorited = true;
      record.favoritedAt = now;
    }

    record.updatedAt = now;

    persistFavorites(list);
  }

  /**
   * 「我的收藏」视图里取消收藏（doc / item 用同一套逻辑）：只清掉 favorited，
   * 不物理删除记录——item 如果还有评分（mark）会继续显示评分；doc/item 的"取消"记录本身
   * 需要保留下来才能在跨设备同步时覆盖别的设备上的旧数据（见 mergeFavoriteLists）
   * @param {'doc'|'item'} kind
   * @param {string} id
   * @returns {void}
   */
  function removeFavorite(kind, id) {

    const list = loadFavorites();
    const index = favoriteIndex(list, kind, id);

    if (index === -1) {

      return;
    }

    const record = list[index];

    record.favorited = false;
    record.favoritedAt = null;
    record.updatedAt = new Date().toISOString();

    persistFavorites(list);
    renderFavoritesView();
  }

  /**
   * 判断当前页面能否直接跳转到目标文档
   * （单篇页面只内嵌自己那一篇，只有目标就是自己时才能跳）
   * @param {string} docSlug
   * @returns {boolean}
   */
  function canJumpToDoc(docSlug) {

    if (state.data.doc) {

      return state.data.doc.slug === docSlug;
    }

    return (state.data.docs || []).some((doc) => doc.slug === docSlug);
  }

  /**
   * 把收藏列表导出为 json 文件并触发浏览器下载
   * @returns {void}
   */
  function exportFavorites() {

    const json = JSON.stringify(loadFavorites(), null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const dateStr = new Date().toISOString().slice(0, 10);

    const linkEl = document.createElement('a');
    linkEl.href = url;
    linkEl.download = `livenotes-favorites-${dateStr}.json`;
    document.body.appendChild(linkEl);
    linkEl.click();
    document.body.removeChild(linkEl);

    URL.revokeObjectURL(url);
  }

  /**
   * 把当前同步配置（Token + Gist ID）导出为 json 文件下载，方便在别的设备/别的网址上
   * 一次性导入，不用手动复制粘贴两个输入框
   * @returns {void}
   */
  function exportSyncConfig() {

    const config = loadSyncConfig();

    if (!config.token && !config.gistId) {
      window.alert('还没有设置同步，没有可导出的配置');

      return;
    }

    const json = JSON.stringify(config, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);

    const linkEl = document.createElement('a');
    linkEl.href = url;
    linkEl.download = 'livenotes-sync-config.json';
    document.body.appendChild(linkEl);
    linkEl.click();
    document.body.removeChild(linkEl);

    URL.revokeObjectURL(url);
    window.alert('已导出，注意：这个文件里是明文 Token，导入完所有设备后建议删掉，不要一直留在下载目录里');
  }

  /**
   * 取一条收藏记录的"最后修改时间"，没有 updatedAt 的旧数据退化用其它时间字段兜底，
   * 都没有就当作最旧（合并时优先保留有明确时间戳的一方）
   * @param {object} fav
   * @returns {number} 毫秒时间戳
   */
  function favoriteUpdatedAtMs(fav) {

    const raw = fav.updatedAt || fav.markedAt || fav.favoritedAt || fav.addedAt || null;

    return raw ? new Date(raw).getTime() : 0;
  }

  /**
   * 合并两份收藏列表：按 kind+id 分组，每组只保留 updatedAt 较新的一条（record 级
   * last-write-wins）。同时用于 Gist 跨设备同步的拉取合并、和手动导入 json 的合并——
   * 取消收藏/清空评分也是一条"更新"（favorited: false），新的一方照样会覆盖旧的一方，
   * 不会被对面设备的旧数据复活（见 toggleFavoriteItem/toggleFavoriteDoc/removeFavorite
   * 不物理删除记录的注释）
   * @param {object[]} a
   * @param {object[]} b
   * @returns {object[]}
   */
  function mergeFavoriteLists(a, b) {

    const merged = new Map();

    [...a, ...b].forEach((fav) => {

      if (!fav || !fav.kind || !fav.id) {

        return;
      }

      // 兼容收藏 / 评分合并存储之前导出的旧格式：item 记录存在即代表已收藏
      if (fav.kind === 'item' && fav.favorited === undefined) {
        fav.favorited = true;
        fav.favoritedAt = fav.favoritedAt ?? fav.addedAt ?? null;
        fav.mark = fav.mark ?? null;
        fav.markedAt = fav.markedAt ?? null;
      }

      const key = `${fav.kind}:${fav.id}`;
      const existing = merged.get(key);

      if (!existing || favoriteUpdatedAtMs(fav) >= favoriteUpdatedAtMs(existing)) {
        merged.set(key, fav);
      }
    });

    return Array.from(merged.values());
  }

  /**
   * 合并导入的收藏 json：跟本地数据按 mergeFavoriteLists 的规则合并（record 级
   * last-write-wins），不是简单的"已存在就跳过"
   * @param {object[]} incoming
   * @returns {void}
   */
  function mergeFavorites(incoming) {

    const merged = mergeFavoriteLists(loadFavorites(), incoming);

    persistFavorites(merged);
    renderFavoritesView();
    window.alert(`导入完成，当前共 ${merged.length} 条收藏记录`);
  }

  /**
   * 绑定导入收藏用的隐藏文件选择框
   * @returns {void}
   */
  function setupFavoritesImport() {

    const inputEl = document.querySelector('[data-role="favorites-import-input"]');

    if (!inputEl) {

      return;
    }

    inputEl.addEventListener('change', () => {

      const file = inputEl.files && inputEl.files[0];

      if (!file) {

        return;
      }

      const reader = new FileReader();

      reader.onload = () => {

        try {
          const incoming = JSON.parse(reader.result);

          mergeFavorites(Array.isArray(incoming) ? incoming : []);
        } catch (err) {
          window.alert('导入失败：文件内容不是有效的收藏 json');
        }

        inputEl.value = '';
      };

      reader.readAsText(file);
    });
  }

  /**
   * 绑定导入同步配置用的隐藏文件选择框：读到 { token, gistId } 后直接保存并触发一次同步，
   * 不用再手动粘贴两个输入框
   * @returns {void}
   */
  function setupSyncConfigImport() {

    const inputEl = document.querySelector('[data-role="sync-config-import-input"]');

    if (!inputEl) {

      return;
    }

    inputEl.addEventListener('change', () => {

      const file = inputEl.files && inputEl.files[0];

      if (!file) {

        return;
      }

      const reader = new FileReader();

      reader.onload = async () => {

        try {
          const config = JSON.parse(reader.result);

          if (!config || !config.token) {
            window.alert('导入失败：文件内容不是有效的同步配置');
          } else {
            saveSyncConfig({ token: config.token, gistId: config.gistId || '' });
            await pullFavoritesFromGist();
            renderFavoritesView();
          }
        } catch (err) {
          window.alert('导入失败：文件内容不是有效的同步配置');
        }

        inputEl.value = '';
      };

      reader.readAsText(file);
    });
  }

  /**
   * 渲染某一侧（en 或 cn）的单元格 HTML
   * @param {string} type - section 类型
   * @param {'en'|'cn'} which - 哪一侧
   * @param {object} side - item[which] 对象
   * @returns {string}
   */
  function formatSide(type, which, side) {

    const fields = SIDE_FIELDS[type][which];

    return fields
      .map((field) => `<span class="cell cell--${field}">${escapeHtml(side[field])}</span>`)
      .join('');
  }

  /**
   * 渲染常驻信息（note / kind）；无内容时返回空串
   * @param {object} section
   * @param {object} item
   * @returns {string}
   */
  function formatResident(section, item) {

    const field = RESIDENT_FIELD[section.type];

    if (!field || !item[field]) {

      return '';
    }

    return `<div class="resident resident--${field}">${escapeHtml(item[field])}</div>`;
  }

  /**
   * 渲染侧边栏章节树（仅 index 模式）
   * @param {{ chapter: string, files: object[] }[]} tree
   * @returns {void}
   */
  function renderSidebar(tree) {

    const sidebarEl = document.querySelector('[data-role="sidebar"]');
    const favorites = loadFavorites();

    const groupsHtml = tree.map((group, groupIndex) => {

      const linksHtml = group.files.map((file) => {

        const docRecord = favorites.find((fav) => fav.kind === 'doc' && fav.id === file.slug);
        const favorited = Boolean(docRecord && docRecord.favorited);

        return `
        <li class="doc-item">
          <button type="button" class="doc-link" data-slug="${escapeAttr(file.slug)}">${escapeHtml(file.title || file.slug)}</button>
          <button type="button" class="fav-btn${favorited ? ' is-favorited' : ''}" data-action="toggle-favorite-doc" data-slug="${escapeAttr(file.slug)}" aria-label="收藏整篇">${favorited ? '★' : '☆'}</button>
        </li>`;
      }).join('');

      // 默认展开第一个章节
      return `
        <details class="chapter"${groupIndex === 0 ? ' open' : ''}>
          <summary class="chapter-title">${escapeHtml(group.chapter)}</summary>
          <ul class="doc-list">${linksHtml}</ul>
        </details>`;
    }).join('');

    // 构建期传了 homeLink 才显示"返回全部课程"，本地单独跑一门课时不出现；固定贴在
    // 侧边栏最底部（配合 .sidebar-scroll 的 flex 布局，章节数少时也不会往上飘），
    // 避免跟上面的章节/文件点击混在一起
    const homeLink = state.data.homeLink;
    const homeLinkHtml = homeLink
      ? `<a class="sidebar-home" href="${escapeAttr(homeLink)}">◀ 全部课程</a>`
      : '';

    sidebarEl.innerHTML = `<div class="sidebar-scroll">${groupsHtml}</div>${homeLinkHtml}`;
  }

  /**
   * 高亮侧边栏中当前篇对应的链接
   * @param {string} slug
   * @returns {void}
   */
  function highlightActiveLink(slug) {

    document.querySelectorAll('.doc-link').forEach((el) => {
      el.classList.toggle('is-active', el.dataset.slug === slug);
    });
  }

  /**
   * 渲染内容区最下面的一组按钮（EN⇄CN / 全部展开收起），跟顶部的按钮共用同一个 data-action，
   * 点击行为、状态同步都自动一致——划到内容底部不用再翻回顶部就能切换
   * @param {string} [leadingHtml] - 排在最前面的额外按钮（目前只有测验视图的"换一批"用），
   *   跟后面几个按钮之间留一道更宽的间隔（见 style.css 的 .bottom-controls-leading）
   * @returns {string}
   */
  function renderBottomControls(leadingHtml = '') {

    return `
      <div class="bottom-controls">
        ${leadingHtml}
        <button type="button" data-action="toggle-mode" class="btn btn-mode"></button>
        <button type="button" data-action="toggle-all-expanded" class="btn btn-expand-toggle"></button>
        <button type="button" data-action="toggle-quiz-view" class="btn btn-quiz">📇 测验</button>
        <button type="button" data-action="toggle-favorites-view" class="btn btn-favorites">★ 收藏</button>
      </div>`;
  }

  /**
   * 渲染内容区：某个 NoteDoc 的三段表格
   * @param {object} doc - NoteDoc
   * @returns {void}
   */
  function renderContent(doc) {

    const contentEl = document.querySelector('[data-role="content"]');

    const shownSide = state.mode;
    const hiddenSide = state.mode === 'en' ? 'cn' : 'en';
    const revealText = hiddenSide === 'cn' ? '中文' : 'EN';

    // 恢复该篇已展开的 item
    const expanded = loadExpanded(doc.slug);

    // 该篇内已收藏的 item id 集合，用于渲染每个 item 的收藏星标状态
    const favoriteIds = new Set(
      loadFavorites().filter((fav) => fav.kind === 'item' && fav.favorited).map((fav) => fav.id)
    );

    const sectionsHtml = doc.sections.map((section) => {

      const itemsHtml = section.items.map((item, index) => {

        const key = `${section.type}:${index}`;
        const expandedClass = expanded.has(key) ? ' is-expanded' : '';
        const favorited = favoriteIds.has(`${doc.slug}::${key}`);

        return `
          <li class="item${expandedClass}" data-key="${key}">
            <div class="shown-side">${formatSide(section.type, shownSide, item[shownSide])}</div>
            <div class="item-actions">
              <button type="button" class="fav-btn${favorited ? ' is-favorited' : ''}" data-action="toggle-favorite-item" aria-label="收藏">${favorited ? '★' : '☆'}</button>
              <button type="button" class="reveal-btn"><span class="reveal-arrow" aria-hidden="true">▸</span><span class="reveal-text">${revealText}</span></button>
            </div>
            <div class="hidden-side">${formatSide(section.type, hiddenSide, item[hiddenSide])}</div>
            ${formatResident(section, item)}
          </li>`;
      }).join('');

      return `
        <section class="section section--${section.type}">
          <h2 class="section-title">${escapeHtml(section.heading)}</h2>
          <ul class="item-list">${itemsHtml}</ul>
        </section>`;
    }).join('');

    contentEl.innerHTML = `
      <header class="doc-header"><h2 class="doc-title">${escapeHtml(doc.title || doc.slug)}</h2></header>
      ${sectionsHtml}
      ${renderBottomControls()}`;

    // 根据这篇实际的展开状态同步"全部展开/收起"切换按钮的图标（+ / −）
    const totalItems = doc.sections.reduce((sum, section) => sum + section.items.length, 0);
    state.allExpanded = totalItems > 0 && expanded.size === totalItems;
    updateExpandToggleIcon();
    updateModeButtonAppearance();
  }

  /**
   * 渲染收藏列表视图顶部的导出/导入/同步工具条 + 展开时的同步设置面板
   * @returns {string}
   */
  function renderFavoritesToolbar() {

    return `
      <div class="favorites-toolbar">
        <button type="button" class="btn" data-action="export-favorites">导出收藏</button>
        <button type="button" class="btn" data-action="import-favorites">导入收藏</button>
        <button type="button" class="btn" data-action="toggle-sync-panel">同步设置 <span aria-hidden="true">${state.syncPanelOpen ? '▾' : '▸'}</span></button>
        <button type="button" class="btn" data-action="sync-now">🔄 立即同步</button>
        <span class="sync-status sync-status--${state.sync.status}" data-role="sync-status">${escapeHtml(formatSyncStatusText())}</span>
      </div>
      ${renderSyncPanel()}`;
  }

  /**
   * 渲染"同步设置"面板（收起时返回空串）：Token/Gist ID 表单 + 退出同步
   * @returns {string}
   */
  function renderSyncPanel() {

    if (!state.syncPanelOpen) {

      return '';
    }

    const config = loadSyncConfig();
    const configured = isSyncConfigured();

    return `
      <div class="sync-panel">
        <label class="sync-field">
          <span>GitHub Token（只需要勾 gist 权限）</span>
          <input type="password" data-role="sync-token-input" value="${escapeAttr(config.token)}" placeholder="ghp_…" autocomplete="off">
        </label>
        <label class="sync-field">
          <span>共享的 Gist ID（第一台设备留空自动创建）</span>
          <input type="text" data-role="sync-gist-id-input" value="${escapeAttr(config.gistId)}" placeholder="留空自动创建" autocomplete="off">
        </label>
        <div class="sync-panel-actions">
          <div class="sync-panel-actions-group">
            <button type="button" class="btn btn-sync-primary" data-action="save-sync-config">保存${configured ? '并同步' : ''}</button>
            ${configured ? '<button type="button" class="btn btn-sync-danger" data-action="clear-sync-config">退出同步</button>' : ''}
          </div>
          <div class="sync-panel-actions-group">
            <button type="button" class="btn" data-action="export-sync-config">导出配置</button>
            <button type="button" class="btn" data-action="import-sync-config">导入配置</button>
          </div>
        </div>
        <p class="favorites-hint">
          Token / Gist ID 只存在这台设备本地，不会出现在收藏数据里。第一台设备保存时把 Gist ID
          留空会自动创建一个，把生成的 ID 复制到其它设备粘贴进这个输入框——其它设备不要再留空创建，
          否则会各自建出不同的 Gist，互相不同步。私有 Gist 不会被搜索到，但知道链接的人仍能看到内容。
          嫌手动复制粘贴麻烦的话，也可以"导出配置"存成文件，去别的设备/别的网址上"导入配置"
          一步到位——但这个文件是明文 Token，导入完记得删掉，不要一直留着。
        </p>
      </div>`;
  }

  /**
   * 渲染一条「整篇文档」收藏记录
   * @param {object} fav - kind === 'doc' 的收藏记录
   * @returns {string}
   */
  function renderDocFavoriteRow(fav) {

    const jumpable = canJumpToDoc(fav.docSlug);

    const titleHtml = jumpable
      ? `<button type="button" class="fav-jump" data-action="jump-to-doc" data-slug="${escapeAttr(fav.docSlug)}">${escapeHtml(fav.docTitle)}</button>`
      : `<span class="fav-jump fav-jump--disabled" title="打开总目录 index.html 才能跳转">${escapeHtml(fav.docTitle)}</span>`;

    return `
      <li class="favorite-row">
        <div class="shown-side">
          <span class="cell cell--chapter">${escapeHtml(fav.chapter || '')}</span>
          ${titleHtml}
        </div>
        <div class="item-actions">
          <button type="button" class="fav-btn is-favorited" data-action="remove-favorite" data-kind="doc" data-id="${escapeAttr(fav.id)}" aria-label="取消收藏">★</button>
        </div>
      </li>`;
  }

  /**
   * 渲染一条「单条 item」收藏记录（用收藏时刻的快照展示，不依赖当前页面是否有原文档数据）
   * @param {object} fav - kind === 'item' 的收藏记录
   * @returns {string}
   */
  function renderItemFavoriteRow(fav) {

    const snapshot = fav.snapshot || {};
    const jumpable = canJumpToDoc(fav.docSlug);
    const itemKey = `${fav.sectionType}:${fav.itemIndex}`;

    const jumpHtml = jumpable
      ? `<button type="button" class="fav-jump" data-action="jump-to-item" data-slug="${escapeAttr(fav.docSlug)}" data-key="${escapeAttr(itemKey)}">跳转原文</button>`
      : `<span class="fav-jump fav-jump--disabled" title="打开总目录 index.html 才能跳转">跳转原文</span>`;

    const residentText = snapshot.note || snapshot.kind || '';

    return `
      <li class="favorite-row">
        <div class="shown-side">
          <div class="favorite-meta">${escapeHtml(fav.docTitle)} · ${escapeHtml(fav.sectionHeading || '')}</div>
          <div class="favorite-both-sides">
            ${formatSide(fav.sectionType, 'en', snapshot.en || {})}
            ${formatSide(fav.sectionType, 'cn', snapshot.cn || {})}
          </div>
          ${residentText ? `<div class="resident">${escapeHtml(residentText)}</div>` : ''}
        </div>
        <div class="item-actions">
          ${jumpHtml}
          ${renderMarkBadges(fav.mark)}
          <button type="button" class="fav-btn is-favorited" data-action="remove-favorite" data-kind="item" data-id="${escapeAttr(fav.id)}" aria-label="取消收藏">★</button>
        </div>
      </li>`;
  }

  /**
   * 估算文本显示宽度：中日韩字符算 2、其它算 1（粗略近似，配合等宽字体对齐用）
   * @param {string} text
   * @returns {number}
   */
  function estimateDisplayWidth(text) {

    return [...text].reduce((sum, ch) => sum + (/[一-鿿]/.test(ch) ? 2 : 1), 0);
  }

  /**
   * 把一批 { label, count } 拼成 <option> 列表，label 用不换行空格（&nbsp;，普通空格在 HTML
   * 里会被折叠掉）补齐到这批里最长的宽度，配合 .favorites-filter-select 的等宽字体，让每一项
   * 的 "--" 分隔符和后面的数量尽量对齐在同一列
   * @param {{ value: string, label: string, count: number, selected: boolean }[]} entries
   * @returns {string}
   */
  function renderAlignedOptions(entries) {

    const maxWidth = Math.max(...entries.map((entry) => estimateDisplayWidth(entry.label)));

    return entries.map((entry) => {

      const pad = ' '.repeat(Math.max(0, maxWidth - estimateDisplayWidth(entry.label)));

      return `<option value="${escapeAttr(entry.value)}"${entry.selected ? ' selected' : ''}>${escapeHtml(entry.label)}${pad} -- ${entry.count}</option>`;
    }).join('');
  }

  /**
   * 渲染"收藏的词条"上方的类型 / 对号档位筛选条，选项文案里带上各筛选项的实际数量
   * @param {object[]} itemFavs - 全部已收藏的 item 记录（未筛选）
   * @returns {string}
   */
  function renderFavoritesFilterBar(itemFavs) {

    const typeOptions = renderAlignedOptions(['all', 'vocab', 'phrases', 'sentences'].map((type) => ({
      value: type,
      label: type === 'all' ? '全部' : SECTION_TYPE_LABELS[type],
      count: type === 'all' ? itemFavs.length : itemFavs.filter((fav) => fav.sectionType === type).length,
      selected: state.favoritesTypeFilter === type,
    })));

    const markOptions = renderAlignedOptions(['all', 'none', '1', '2', '3'].map((markValue) => ({
      value: markValue,
      // 纯中文数字"一档/二档/三档"：全部选项都是纯中文 2 字，字体宽度比例一致，容易对齐；
      // 中文数字跟后面阿拉伯数字的数量也不会看混
      label: markValue === 'all' ? '全部' : markValue === 'none' ? '未评' : `${MARK_LEVEL_CN[markValue]}档`,
      count: itemFavs.filter((fav) => {

        if (markValue === 'all') return true;
        if (markValue === 'none') return !fav.mark;

        return fav.mark === Number(markValue);
      }).length,
      selected: String(state.favoritesMarkFilter) === markValue,
    })));

    return `
      <div class="favorites-toolbar">
        <select class="btn favorites-filter-select" data-role="favorites-type-filter" aria-label="按类型筛选">${typeOptions}</select>
        <select class="btn favorites-filter-select" data-role="favorites-mark-filter" aria-label="按对号档位筛选">${markOptions}</select>
      </div>`;
  }

  /**
   * 按当前筛选条件（state.favoritesTypeFilter / favoritesMarkFilter）过滤词条收藏列表
   * @param {object[]} itemFavs
   * @returns {object[]}
   */
  function applyFavoritesFilter(itemFavs) {

    return itemFavs.filter((fav) => {

      if (state.favoritesTypeFilter !== 'all' && fav.sectionType !== state.favoritesTypeFilter) {

        return false;
      }

      if (state.favoritesMarkFilter === 'none' && fav.mark) {

        return false;
      }

      if (state.favoritesMarkFilter !== 'all' && state.favoritesMarkFilter !== 'none'
          && fav.mark !== Number(state.favoritesMarkFilter)) {

        return false;
      }

      return true;
    });
  }

  /**
   * 给筛选条的两个下拉框绑定 change 事件：每次 renderFavoritesView 都会重建 DOM，
   * 所以每次渲染完都要重新绑定一次
   * @returns {void}
   */
  function setupFavoritesFilterSelects() {

    const typeSelect = document.querySelector('[data-role="favorites-type-filter"]');
    const markSelect = document.querySelector('[data-role="favorites-mark-filter"]');

    if (typeSelect) {
      typeSelect.addEventListener('change', () => {
        state.favoritesTypeFilter = typeSelect.value;
        renderFavoritesView();
      });
    }

    if (markSelect) {
      markSelect.addEventListener('change', () => {
        state.favoritesMarkFilter = markSelect.value;
        renderFavoritesView();
      });
    }
  }

  /**
   * 渲染「我的收藏」整个视图到内容区
   * @returns {void}
   */
  function renderFavoritesView() {

    const contentEl = document.querySelector('[data-role="content"]');
    const favorites = loadFavorites();
    const docFavs = favorites.filter((fav) => fav.kind === 'doc' && fav.favorited);
    const itemFavs = favorites.filter((fav) => fav.kind === 'item' && fav.favorited);

    if (docFavs.length === 0 && itemFavs.length === 0) {
      contentEl.innerHTML = `
        ${renderFavoritesToolbar()}
        <p class="favorites-empty">还没有收藏。点击文档旁或词条旁的 ☆ 试试。</p>`;

      return;
    }

    // 类型 / 对号档位筛选只作用于"词条"列表，"文档"列表没有类型/评分的概念
    const filteredItemFavs = applyFavoritesFilter(itemFavs);
    const docFavsHtml = docFavs.map(renderDocFavoriteRow).join('');
    const itemFavsHtml = filteredItemFavs.map(renderItemFavoriteRow).join('');

    contentEl.innerHTML = `
      ${renderFavoritesToolbar()}
      ${docFavs.length ? `
        <section class="section">
          <h2 class="section-title">收藏的文档（${docFavs.length}）</h2>
          <ul class="item-list">${docFavsHtml}</ul>
        </section>` : ''}
      ${itemFavs.length ? `
        <section class="section">
          <h2 class="section-title">收藏的词条（${filteredItemFavs.length} / ${itemFavs.length}）</h2>
          ${renderFavoritesFilterBar(itemFavs)}
          ${filteredItemFavs.length
            ? `<ul class="item-list">${itemFavsHtml}</ul>`
            : '<p class="favorites-empty">没有符合筛选条件的词条。</p>'}
        </section>` : ''}`;

    setupFavoritesFilterSelects();
  }

  /**
   * 清掉「我的收藏」「测验」两个视图切换按钮的高亮，同一时刻只有一个视图能高亮
   * @returns {void}
   */
  function clearViewToggleButtons() {

    // 顶部和内容区底部都有这两个按钮（同一个 data-action），两边都要清
    document.querySelectorAll('[data-action="toggle-favorites-view"]').forEach((btn) => {
      btn.classList.remove('is-active');
    });

    document.querySelectorAll('[data-action="toggle-quiz-view"]').forEach((btn) => {
      btn.classList.remove('is-active');
    });
  }

  /**
   * 切换到「我的收藏」视图，或从收藏视图切回当前文档
   * @returns {void}
   */
  function toggleFavoritesView() {

    state.view = state.view === 'favorites' ? 'doc' : 'favorites';

    clearViewToggleButtons();

    document.querySelectorAll('[data-action="toggle-favorites-view"]').forEach((btn) => {
      btn.classList.toggle('is-active', state.view === 'favorites');
    });

    if (state.view === 'favorites') {
      renderFavoritesView();

      return;
    }

    const doc = findDoc(currentSlug());

    if (doc) {
      renderContent(doc);
    }
  }

  /**
   * 从收藏 / 测验视图跳转回某篇文档：单篇页面里只能跳自己，index 页面走 selectDoc
   * @param {string} slug
   * @returns {void}
   */
  function jumpToDoc(slug) {

    if (state.data.doc) {
      state.view = 'doc';

      clearViewToggleButtons();
      renderContent(state.data.doc);

      return;
    }

    selectDoc(slug);
  }

  /**
   * 从收藏视图跳转到某篇文档的某条 item：跳转后自动展开并滚动定位
   * @param {string} slug
   * @param {string} key - `${sectionType}:${itemIndex}`
   * @returns {void}
   */
  function jumpToItem(slug, key) {

    jumpToDoc(slug);

    requestAnimationFrame(() => {

      const itemEl = document.querySelector(`[data-role="content"] .item[data-key="${CSS.escape(key)}"]`);

      if (!itemEl) {

        return;
      }

      if (!itemEl.classList.contains('is-expanded')) {
        itemEl.classList.add('is-expanded');

        const expanded = loadExpanded(slug);
        expanded.add(key);
        saveExpanded(slug, expanded);
      }

      itemEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }

  /**
   * Fisher-Yates 洗牌，不改动原数组
   * @param {Array} list
   * @returns {Array}
   */
  function shuffleArray(list) {

    const result = list.slice();

    for (let i = result.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));

      [result[i], result[j]] = [result[j], result[i]];
    }

    return result;
  }

  /**
   * 把全部文档的全部 item 摊平成一个池子，供测验模式抽取（只有 index.html 有全部文档数据）
   * @returns {object[]} 每条含 id / docSlug / docTitle / chapter / sectionType / sectionHeading / itemIndex / item
   */
  function buildQuizPool() {

    const pool = [];

    (state.data.docs || []).forEach((doc) => {

      doc.sections.forEach((section) => {

        section.items.forEach((item, itemIndex) => {
          pool.push({
            id: `${doc.slug}::${section.type}:${itemIndex}`,
            docSlug: doc.slug,
            docTitle: doc.title || doc.slug,
            chapter: doc.chapter,
            sectionType: section.type,
            sectionHeading: section.heading,
            itemIndex,
            item,
          });
        });
      });
    });

    return pool;
  }

  /**
   * 渲染评分用的 3 个对号按钮，点亮到当前评分档位（再点一次已点亮的档位会清空，见 setItemMark）
   * @param {number|null} mark
   * @returns {string}
   */
  function renderMarkButtons(mark) {

    return [1, 2, 3].map((level) => {

      const filled = mark !== null && level <= mark;

      return `<button type="button" class="mark-btn${filled ? ' is-filled' : ''}" data-action="set-quiz-mark" data-level="${level}" aria-label="评分 ${level}">✓</button>`;
    }).join('');
  }

  /**
   * 渲染只读的评分展示（3 个对号，不可点击），用于「我的收藏」列表里展示测验评分
   * @param {number|null} mark
   * @returns {string}
   */
  function renderMarkBadges(mark) {

    if (!mark) {

      return '';
    }

    const dots = [1, 2, 3].map((level) => {

      const filled = level <= mark;

      return `<span class="mark-btn${filled ? ' is-filled' : ''}" aria-hidden="true">✓</span>`;
    }).join('');

    return `<span class="mark-badges" title="测验评分：${mark}/3">${dots}</span>`;
  }

  /**
   * 渲染测验模式里的一条 item（数据来自 buildQuizPool 的池子条目，不是某一篇 doc 的 section）
   * @param {object} entry - buildQuizPool 里的一条
   * @returns {string}
   */
  function renderQuizItemRow(entry, recordsById) {

    const shownSide = state.mode;
    const hiddenSide = state.mode === 'en' ? 'cn' : 'en';
    const revealText = hiddenSide === 'cn' ? '中文' : 'EN';
    const record = recordsById.get(entry.id);
    const favorited = Boolean(record && record.favorited);
    const mark = record ? record.mark : null;

    return `
      <li class="item" data-key="${entry.id}">
        <div class="shown-side">
          <div class="favorite-meta">${escapeHtml(entry.sectionHeading)}</div>
          ${formatSide(entry.sectionType, shownSide, entry.item[shownSide])}
        </div>
        <div class="item-actions">
          <button type="button" class="fav-btn${favorited ? ' is-favorited' : ''}" data-action="toggle-favorite-quiz-item" aria-label="收藏">${favorited ? '★' : '☆'}</button>
          ${renderMarkButtons(mark)}
          <button type="button" class="reveal-btn"><span class="reveal-arrow" aria-hidden="true">▸</span><span class="reveal-text">${revealText}</span></button>
        </div>
        <div class="hidden-side">${formatSide(entry.sectionType, hiddenSide, entry.item[hiddenSide])}</div>
        ${formatResident({ type: entry.sectionType }, entry.item)}
      </li>`;
  }

  /**
   * 开始新一轮测验：重新摊平打乱全部文档的 item，批次从头开始
   * @returns {void}
   */
  function startNewQuizPool() {

    state.quizPool = shuffleArray(buildQuizPool());
    state.quizBatchOffset = 0;
  }

  /**
   * 渲染「测验模式」整个视图：只渲染当前这一批（QUIZ_BATCH_SIZE 条），
   * 而不是一次性把全部文档摊平的内容都塞进页面——内容多的话会有几百条，一次性渲染很卡
   * @returns {void}
   */
  function renderQuizView() {

    const contentEl = document.querySelector('[data-role="content"]');

    if (!state.quizPool) {
      startNewQuizPool();
    }

    state.allExpanded = false;

    if (state.quizPool.length === 0) {
      contentEl.innerHTML = `
        <header class="doc-header"><h2 class="doc-title">📇 测验模式</h2></header>
        <p class="favorites-empty">没有可供测验的内容。</p>`;
      updateExpandToggleIcon();
      updateModeButtonAppearance();

      return;
    }

    const batch = state.quizPool.slice(state.quizBatchOffset, state.quizBatchOffset + QUIZ_BATCH_SIZE);

    // 只读一次 localStorage 建查找表，避免每条 item 都单独读一次
    const recordsById = new Map(
      loadFavorites().filter((fav) => fav.kind === 'item').map((fav) => [fav.id, fav])
    );
    const itemsHtml = batch.map((entry) => renderQuizItemRow(entry, recordsById)).join('');

    const totalBatches = Math.ceil(state.quizPool.length / QUIZ_BATCH_SIZE);
    const currentBatch = Math.floor(state.quizBatchOffset / QUIZ_BATCH_SIZE) + 1;

    contentEl.innerHTML = `
      <header class="doc-header"><h2 class="doc-title">📇 测验模式</h2></header>
      <div class="favorites-toolbar">
        <button type="button" class="btn" data-action="next-quiz-batch">换一批</button>
        <span class="favorites-hint">
          第 ${currentBatch}/${totalBatches} 批，共 ${state.quizPool.length} 条；展开/收起状态不会保存
        </span>
      </div>
      <ul class="item-list">${itemsHtml}</ul>
      ${renderBottomControls('<button type="button" class="btn bottom-controls-leading" data-action="next-quiz-batch">换一批</button>')}`;

    updateExpandToggleIcon();
    updateModeButtonAppearance();
  }

  /**
   * 「换一批」按钮：按批次顺序往后翻，一轮抽完（翻到底）自动重新洗牌开始下一轮
   * @returns {void}
   */
  function nextQuizBatch() {

    state.quizBatchOffset += QUIZ_BATCH_SIZE;

    if (state.quizBatchOffset >= state.quizPool.length) {
      startNewQuizPool();
    }

    renderQuizView();
  }

  /**
   * 切换到「测验模式」视图，或从测验视图切回当前文档
   * @returns {void}
   */
  function toggleQuizView() {

    state.view = state.view === 'quiz' ? 'doc' : 'quiz';

    clearViewToggleButtons();

    document.querySelectorAll('[data-action="toggle-quiz-view"]').forEach((btn) => {
      btn.classList.toggle('is-active', state.view === 'quiz');
    });

    if (state.view === 'quiz') {
      state.quizPool = null;
      renderQuizView();

      return;
    }

    const doc = findDoc(currentSlug());

    if (doc) {
      renderContent(doc);
    }
  }

  /**
   * 按测验 item 的全局 id 在当前池子里找到对应条目
   * @param {string} id
   * @returns {object|null}
   */
  function findQuizEntry(id) {

    return (state.quizPool || []).find((entry) => entry.id === id) || null;
  }

  /**
   * 测验视图里 item 上「收藏」按钮点击处理
   * @param {HTMLElement} buttonEl
   * @returns {void}
   */
  function handleToggleFavoriteQuizItem(buttonEl) {

    const itemEl = buttonEl.closest('.item');
    const entry = itemEl && findQuizEntry(itemEl.dataset.key);

    if (!entry) {

      return;
    }

    toggleFavoriteItem(entry);

    const favorited = isItemFavorited(entry.id);
    buttonEl.classList.toggle('is-favorited', favorited);
    buttonEl.textContent = favorited ? '★' : '☆';
  }

  /**
   * 测验视图里评分按钮点击处理：更新该条的 3 个对号
   * @param {HTMLElement} buttonEl
   * @returns {void}
   */
  function handleSetQuizMark(buttonEl) {

    const itemEl = buttonEl.closest('.item');
    const entry = itemEl && findQuizEntry(itemEl.dataset.key);

    if (!entry) {

      return;
    }

    setItemMark(entry, Number(buttonEl.dataset.level));

    const mark = getItemMark(entry.id);

    itemEl.querySelectorAll('.mark-btn').forEach((markBtn) => {
      const btnLevel = Number(markBtn.dataset.level);

      markBtn.classList.toggle('is-filled', mark !== null && btnLevel <= mark);
    });

    // 设置评分可能顺带触发了自动收藏（见 setItemMark），同步一下星标按钮的外观
    const favorited = isItemFavorited(entry.id);
    const favBtn = itemEl.querySelector('.fav-btn');

    if (favBtn) {
      favBtn.classList.toggle('is-favorited', favorited);
      favBtn.textContent = favorited ? '★' : '☆';
    }
  }

  /**
   * 侧边栏「收藏整篇」按钮点击处理：切换收藏状态并更新按钮外观
   * @param {HTMLElement} buttonEl
   * @returns {void}
   */
  function handleToggleFavoriteDoc(buttonEl) {

    const slug = buttonEl.dataset.slug;
    const doc = findDoc(slug);

    if (!doc) {

      return;
    }

    toggleFavoriteDoc(doc);

    const favorited = isDocFavorited(slug);
    buttonEl.classList.toggle('is-favorited', favorited);
    buttonEl.textContent = favorited ? '★' : '☆';

    if (state.view === 'favorites') {
      renderFavoritesView();
    }
  }

  /**
   * item 上「收藏」按钮点击处理：切换收藏状态并更新按钮外观
   * @param {HTMLElement} buttonEl
   * @returns {void}
   */
  function handleToggleFavoriteItem(buttonEl) {

    const itemEl = buttonEl.closest('.item');
    const slug = currentSlug();
    const doc = findDoc(slug);

    if (!itemEl || !doc) {

      return;
    }

    const key = itemEl.dataset.key;
    const [sectionType, indexStr] = key.split(':');
    const itemIndex = Number(indexStr);
    const section = doc.sections.find((sec) => sec.type === sectionType);

    if (!section || !section.items[itemIndex]) {

      return;
    }

    toggleFavoriteItem(buildItemContext(doc, section, itemIndex));

    const favorited = isItemFavorited(`${doc.slug}::${key}`);
    buttonEl.classList.toggle('is-favorited', favorited);
    buttonEl.textContent = favorited ? '★' : '☆';

    if (state.view === 'favorites') {
      renderFavoritesView();
    }
  }

  /**
   * 同步 EN⇄CN 按钮的文字：显示"当前显示侧 → 隐藏侧"，点一下文字方向跟着反过来
   * @returns {void}
   */
  function updateModeButtonAppearance() {

    const label = state.mode === 'en' ? 'EN → CN' : 'CN → EN';

    // 顶部和内容区底部都有这个按钮（同一个 data-action），两个都要同步
    document.querySelectorAll('[data-action="toggle-mode"]').forEach((buttonEl) => {
      buttonEl.textContent = label;
    });
  }

  /**
   * 切换 EN ⇄ CN 模式：交换默认显示/隐藏侧，清空展开态并重渲染
   * @returns {void}
   */
  function toggleMode() {

    // 收藏视图下不响应模式切换
    if (state.view === 'favorites') {

      return;
    }

    state.mode = state.mode === 'en' ? 'cn' : 'en';
    saveMode(state.mode);
    updateModeButtonAppearance();

    // 测验模式没有单一的"当前文档"，直接用当前池子重渲染，不走 doc 分支
    if (state.view === 'quiz') {
      renderQuizView();

      return;
    }

    const slug = currentSlug();
    const doc = findDoc(slug);

    // 切换模式即清空该篇展开记录
    if (slug) {
      saveExpanded(slug, new Set());
    }

    if (doc) {
      renderContent(doc);
    }
  }

  /**
   * 展开或收起单个 item 的隐藏侧
   * @param {HTMLElement} itemEl
   * @returns {void}
   */
  function toggleItem(itemEl) {

    itemEl.classList.toggle('is-expanded');

    // 测验模式的展开状态不持久化：池子每次进入都会重新打乱，记住单条状态没有意义
    if (state.view === 'quiz') {

      return;
    }

    const slug = currentSlug();

    if (!slug) {

      return;
    }

    const expanded = loadExpanded(slug);
    const key = itemEl.dataset.key;

    if (itemEl.classList.contains('is-expanded')) {
      expanded.add(key);
    } else {
      expanded.delete(key);
    }

    saveExpanded(slug, expanded);
  }

  /**
   * 全部展开 / 全部收起当前页所有 item
   * @param {boolean} shouldExpand
   * @returns {void}
   */
  function setAllExpanded(shouldExpand) {

    // 收藏视图下不响应全部展开/收起
    if (state.view === 'favorites') {

      return;
    }

    const items = document.querySelectorAll('[data-role="content"] .item');

    items.forEach((itemEl) => {
      itemEl.classList.toggle('is-expanded', shouldExpand);
    });

    // 测验模式的展开状态不持久化
    if (state.view === 'quiz') {

      return;
    }

    const slug = currentSlug();

    if (!slug) {

      return;
    }

    const expanded = loadExpanded(slug);

    items.forEach((itemEl) => {
      if (shouldExpand) {
        expanded.add(itemEl.dataset.key);
      } else {
        expanded.delete(itemEl.dataset.key);
      }
    });

    saveExpanded(slug, expanded);
  }

  /**
   * 同步"全部展开/收起"切换按钮的图标、文案：➕ 表示当前可以展开，➖ 表示当前可以收起
   * @returns {void}
   */
  function updateExpandToggleIcon() {

    const label = state.allExpanded ? '全部收起' : '全部展开';
    const icon = state.allExpanded ? '➖' : '➕';

    // 顶部和内容区底部都有这个按钮（同一个 data-action），两个都要同步
    document.querySelectorAll('[data-action="toggle-all-expanded"]').forEach((buttonEl) => {
      buttonEl.textContent = icon;
      buttonEl.title = label;
      buttonEl.setAttribute('aria-label', label);
    });
  }

  /**
   * 「全部展开/收起」合并成一个按钮：点一下切换状态，同时改变图标
   * @returns {void}
   */
  function toggleAllExpanded() {

    // 收藏视图下不响应，跟 setAllExpanded 的守卫保持一致，避免图标跟实际状态错位
    if (state.view === 'favorites') {

      return;
    }

    state.allExpanded = !state.allExpanded;

    setAllExpanded(state.allExpanded);
    updateExpandToggleIcon();
  }

  /**
   * 读取 CSS 变量并解析成数字（px），解析失败时回退默认值
   * @param {string} varName - 形如 '--breakpoint'
   * @param {number} fallback
   * @returns {number}
   */
  function readCssNumberVar(varName, fallback) {

    const raw = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
    const parsed = parseInt(raw, 10);

    return Number.isNaN(parsed) ? fallback : parsed;
  }

  /**
   * 判断当前是否处于窄屏断点（与 style.css 的 `--breakpoint` 保持一致）
   * @returns {boolean}
   */
  function isNarrowViewport() {

    const breakpoint = readCssNumberVar('--breakpoint', 900);

    return window.matchMedia(`(max-width: ${breakpoint}px)`).matches;
  }

  /**
   * 窄屏下监听滚动方向，模拟 Safari 地址栏那种「下滑隐藏、上滑出现」的效果：
   * 往下滑就把「☰ + 标题」这条收起来让出屏幕空间，往上滑（哪怕滑一点点）立刻露出来，
   * 滚到接近顶部时也强制露出来。宽屏不受影响（这条本来就不是 fixed 定位）。
   * @returns {void}
   */
  function setupAutoHideTopbar() {

    const topbarLeftEl = document.querySelector('.topbar-left');

    if (!topbarLeftEl) {

      return;
    }

    let lastScrollY = window.scrollY;
    let isTicking = false;

    window.addEventListener('scroll', () => {

      if (!isNarrowViewport() || isTicking) {

        return;
      }

      isTicking = true;

      requestAnimationFrame(() => {

        const currentScrollY = window.scrollY;

        if (currentScrollY < 8 || currentScrollY < lastScrollY) {
          topbarLeftEl.classList.remove('is-hidden');
        } else {
          topbarLeftEl.classList.add('is-hidden');
        }

        lastScrollY = currentScrollY;
        isTicking = false;
      });
    }, { passive: true });
  }

  /**
   * 从 localStorage 恢复宽屏下侧边栏是否收起
   * @returns {boolean}
   */
  function loadSidebarCollapsed() {

    try {

      return localStorage.getItem(STORAGE_SIDEBAR_COLLAPSED_KEY) === 'true';
    } catch (err) {

      return false;
    }
  }

  /**
   * 持久化宽屏下侧边栏是否收起
   * @param {boolean} collapsed
   * @returns {void}
   */
  function saveSidebarCollapsed(collapsed) {

    try {
      localStorage.setItem(STORAGE_SIDEBAR_COLLAPSED_KEY, collapsed ? 'true' : 'false');
    } catch (err) {
      // 静默降级
    }
  }

  /**
   * 从 localStorage 恢复侧边栏宽度（px），无 / 非法值时回退 CSS 默认值
   * @returns {number}
   */
  function loadSidebarWidth() {

    const defaultWidth = readCssNumberVar('--sidebar-width', 288);

    try {
      const raw = localStorage.getItem(STORAGE_SIDEBAR_WIDTH_KEY);
      const parsed = parseInt(raw, 10);

      return Number.isNaN(parsed) ? defaultWidth : parsed;
    } catch (err) {

      return defaultWidth;
    }
  }

  /**
   * 持久化侧边栏宽度（px）
   * @param {number} width
   * @returns {void}
   */
  function saveSidebarWidth(width) {

    try {
      localStorage.setItem(STORAGE_SIDEBAR_WIDTH_KEY, String(Math.round(width)));
    } catch (err) {
      // 静默降级
    }
  }

  /**
   * 把宽度应用到 --sidebar-width CSS 变量（正文的居中公式会跟着自动重新计算）
   * @param {number} width
   * @returns {void}
   */
  function applySidebarWidth(width) {

    document.documentElement.style.setProperty('--sidebar-width', `${width}px`);
  }

  /**
   * 切换侧边栏：窄屏是抽屉滑入/滑出，宽屏是收起/展开（同一个 ☰ 按钮触发）
   * @returns {void}
   */
  function toggleSidebar() {

    const sidebarEl = document.querySelector('.sidebar');

    if (isNarrowViewport()) {
      sidebarEl.classList.toggle('is-open');

      return;
    }

    const collapsed = sidebarEl.classList.toggle('is-collapsed');
    saveSidebarCollapsed(collapsed);
  }

  /**
   * 绑定侧边栏拖拽调宽：鼠标按住分隔条拖动，松手后持久化宽度
   * @returns {void}
   */
  function setupSidebarResize() {

    const resizerEl = document.querySelector('[data-role="sidebar-resizer"]');

    if (!resizerEl) {

      return;
    }

    resizerEl.addEventListener('mousedown', (event) => {

      event.preventDefault();

      const minWidth = readCssNumberVar('--sidebar-min-width', 220);
      const maxWidth = readCssNumberVar('--sidebar-max-width', 480);

      resizerEl.classList.add('is-dragging');
      document.body.classList.add('is-resizing-sidebar');

      const onMouseMove = (moveEvent) => {

        const width = Math.min(maxWidth, Math.max(minWidth, moveEvent.clientX));
        applySidebarWidth(width);
      };

      const onMouseUp = () => {

        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
        resizerEl.classList.remove('is-dragging');
        document.body.classList.remove('is-resizing-sidebar');

        saveSidebarWidth(readCssNumberVar('--sidebar-width', 288));
      };

      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    });
  }

  /**
   * 切换当前查看的 NoteDoc（index 模式）
   * @param {string} slug
   * @returns {void}
   */
  function selectDoc(slug) {

    const doc = findDoc(slug);

    if (!doc) {

      return;
    }

    state.currentSlug = slug;
    state.view = 'doc';

    clearViewToggleButtons();

    renderContent(doc);
    highlightActiveLink(slug);

    // 窄屏选完自动收起抽屉
    document.querySelector('.sidebar').classList.remove('is-open');
  }

  /**
   * 取章节树里第一篇的 slug
   * @param {{ files: object[] }[]} tree
   * @returns {string|null}
   */
  function firstDocSlug(tree) {

    for (const group of tree) {

      if (group.files.length > 0) {

        return group.files[0].slug;
      }
    }

    return null;
  }

  /**
   * 事件委托：顶部按钮、侧边栏链接、内容区点击
   * @returns {void}
   */
  function bindEvents() {

    document.addEventListener('click', (event) => {
      const sidebarEl = document.querySelector('.sidebar');

      // 窄屏抽屉展开时，点击抽屉之外的地方就收起抽屉，这次点击不再触发别的交互
      if (
        sidebarEl
        && sidebarEl.classList.contains('is-open')
        && !event.target.closest('.sidebar')
        && !event.target.closest('.drawer-toggle')
      ) {
        sidebarEl.classList.remove('is-open');

        return;
      }

      const actionEl = event.target.closest('[data-action]');

      if (actionEl) {
        const { action } = actionEl.dataset;

        if (action === 'toggle-mode') toggleMode();
        if (action === 'toggle-all-expanded') toggleAllExpanded();
        if (action === 'toggle-sidebar') toggleSidebar();
        if (action === 'toggle-favorites-view') toggleFavoritesView();
        if (action === 'toggle-favorite-doc') handleToggleFavoriteDoc(actionEl);
        if (action === 'toggle-favorite-item') handleToggleFavoriteItem(actionEl);
        if (action === 'remove-favorite') removeFavorite(actionEl.dataset.kind, actionEl.dataset.id);
        if (action === 'jump-to-doc') jumpToDoc(actionEl.dataset.slug);
        if (action === 'jump-to-item') jumpToItem(actionEl.dataset.slug, actionEl.dataset.key);
        if (action === 'export-favorites') exportFavorites();
        if (action === 'import-favorites') document.querySelector('[data-role="favorites-import-input"]').click();
        if (action === 'toggle-sync-panel') {
          state.syncPanelOpen = !state.syncPanelOpen;
          renderFavoritesView();
        }
        if (action === 'save-sync-config') handleSaveSyncConfig();
        if (action === 'clear-sync-config') handleClearSyncConfig();
        if (action === 'sync-now') handleSyncNow();
        if (action === 'export-sync-config') exportSyncConfig();
        if (action === 'import-sync-config') document.querySelector('[data-role="sync-config-import-input"]').click();
        if (action === 'toggle-quiz-view') toggleQuizView();
        if (action === 'next-quiz-batch') nextQuizBatch();
        if (action === 'toggle-favorite-quiz-item') handleToggleFavoriteQuizItem(actionEl);
        if (action === 'set-quiz-mark') handleSetQuizMark(actionEl);

        return;
      }

      // 侧边栏文件链接
      const linkEl = event.target.closest('.doc-link');

      if (linkEl) {
        selectDoc(linkEl.dataset.slug);

        return;
      }

      // 点击 item 的揭示按钮或整行
      const itemEl = event.target.closest('.item');

      if (itemEl) {
        toggleItem(itemEl);
      }
    });
  }

  /**
   * 入口
   * @returns {void}
   */
  function init() {

    state.data = loadData();
    state.mode = loadMode();
    state.view = 'doc';

    updateModeButtonAppearance();

    // 单篇页面没有章节树数据，侧边栏渲染不出导航内容，直接连 ☰ 按钮一起隐藏
    if (state.data.doc) {
      document.body.classList.add('single-doc');
    }

    applyTheme(loadTheme());
    setupThemeSelect();
    setupFavoritesImport();
    setupSyncConfigImport();
    setupFavoritesSync();
    setupSidebarResize();
    setupAutoHideTopbar();

    // 恢复侧边栏宽度与宽屏下的收起状态
    applySidebarWidth(loadSidebarWidth());
    document.querySelector('.sidebar').classList.toggle('is-collapsed', loadSidebarCollapsed());

    bindEvents();

    // 单篇模式：data.doc 存在；index 模式：data.docs + data.tree
    if (state.data.doc) {
      renderContent(state.data.doc);

      return;
    }

    renderSidebar(state.data.tree);

    // 默认选中第一篇
    const firstSlug = firstDocSlug(state.data.tree);

    if (firstSlug) {
      selectDoc(firstSlug);
    }
  }

  init();
})();
</script>
</body>
</html>
