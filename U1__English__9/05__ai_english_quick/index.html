  <style>/*
 * style.css — livenotes 响应式样式
 *
 * 侧边栏始终 position: fixed 悬浮，不占文档流宽度：
 *   宽屏（>= 900px）：默认展开，.is-collapsed 收起；右边缘可拖拽调宽；正文相对整个视口居中
 *   窄屏：默认收起（抽屉），.is-open 滑入；内容单栏铺满，没有拖拽调宽
 * 热区按钮 >= 44px，不依赖 :hover（用 :active / :focus-visible）
 * 详见 ARCHITECTURE.md §4「布局」
 */

:root {
  --breakpoint: 900px;
  --hit-size: 44px;
  --sidebar-width: 288px;
  --sidebar-min-width: 220px;
  --sidebar-max-width: 480px;
  --topbar-h: 56px;
  --content-max: 760px;
  --radius: 10px;
  --gap: 16px;

  /* 配色令牌（浅色为主） */
  --color-bg: #ffffff;
  --color-surface: #ffffff;
  --color-text: #1a1a1a;
  --color-muted: #6b7280;
  --color-border: #e5e7eb;
  --color-accent: #2563eb;
  --color-on-accent: #ffffff;

  /* 隐藏侧展开后的背景，与显示侧区分 */
  --mask-bg: #f3f4f6;

  --shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.05);
}

/*
 * 主题：每个主题只覆盖约 9 个配色令牌，布局规则复用。
 * 默认（无 data-theme）= 浅色；data-theme="auto" 跟随系统浅 / 深。
 * 主题 id 与 template/app.js 的 THEMES 列表一一对应。
 */

/* 跟随系统：仅当系统为深色时套用「石墨深色」令牌 */
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    --color-bg: #0f1115;
    --color-surface: #171a21;
    --color-text: #e6e8eb;
    --color-muted: #9aa3af;
    --color-border: #2a2f3a;
    --color-accent: #60a5fa;
    --color-on-accent: #0f1115;
    --mask-bg: #232a36;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 16px rgba(0, 0, 0, 0.35);
  }
}

/* 纸质 Sepia：暖米黄，经典阅读模式 */
:root[data-theme="sepia"] {
  --color-bg: #f4ecd8;
  --color-surface: #faf4e4;
  --color-text: #5b4636;
  --color-muted: #8c7a63;
  --color-border: #e2d6bb;
  --color-accent: #a3682f;
  --color-on-accent: #faf4e4;
  --mask-bg: #ece0c6;
  --shadow: 0 1px 2px rgba(91, 70, 54, 0.10), 0 4px 12px rgba(91, 70, 54, 0.07);
}

/* Gruvbox Light：暖米黄底、深棕字，跟已有的 Gruvbox 深色配对 */
:root[data-theme="gruvbox-light"] {
  --color-bg: #fbf1c7;
  --color-surface: #f9f5d7;
  --color-text: #3c3836;
  --color-muted: #7c6f64;
  --color-border: #ebdbb2;
  --color-accent: #af3a03;
  --color-on-accent: #fbf1c7;
  --mask-bg: #ebdbb2;
  --shadow: 0 1px 2px rgba(60, 56, 54, 0.10), 0 4px 12px rgba(60, 56, 54, 0.07);
}

/* 牛皮纸 Kraft：更深一点的黄褐色底，强调色用烧橙棕 */
:root[data-theme="kraft"] {
  --color-bg: #e8dcc3;
  --color-surface: #f0e6d2;
  --color-text: #4a3f2f;
  --color-muted: #8a7a63;
  --color-border: #d4c4a0;
  --color-accent: #b5651d;
  --color-on-accent: #f0e6d2;
  --mask-bg: #ddcfab;
  --shadow: 0 1px 2px rgba(74, 63, 47, 0.12), 0 4px 12px rgba(74, 63, 47, 0.08);
}

/* 米黄旧纸 Parchment：比 Sepia 更浅更柔和的米白纸感 */
:root[data-theme="parchment"] {
  --color-bg: #f7f3e9;
  --color-surface: #fbf8f0;
  --color-text: #3a3a35;
  --color-muted: #7a7566;
  --color-border: #e5ddc8;
  --color-accent: #8c6d46;
  --color-on-accent: #fbf8f0;
  --mask-bg: #eee6d3;
  --shadow: 0 1px 2px rgba(58, 58, 53, 0.08), 0 4px 12px rgba(58, 58, 53, 0.05);
}

/* Solarized Light */
:root[data-theme="solarized-light"] {
  --color-bg: #fdf6e3;
  --color-surface: #fdf6e3;
  --color-text: #586e75;
  --color-muted: #93a1a1;
  --color-border: #e6dfc6;
  --color-accent: #268bd2;
  --color-on-accent: #fdf6e3;
  --mask-bg: #eee8d5;
  --shadow: 0 1px 2px rgba(101, 123, 131, 0.10), 0 4px 12px rgba(101, 123, 131, 0.06);
}

/* 石墨深色：中性深灰 */
:root[data-theme="graphite"] {
  --color-bg: #0f1115;
  --color-surface: #171a21;
  --color-text: #e6e8eb;
  --color-muted: #9aa3af;
  --color-border: #2a2f3a;
  --color-accent: #60a5fa;
  --color-on-accent: #0f1115;
  --mask-bg: #232a36;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 16px rgba(0, 0, 0, 0.35);
}

/* Solarized Dark */
:root[data-theme="solarized-dark"] {
  --color-bg: #002b36;
  --color-surface: #073642;
  --color-text: #93a1a1;
  --color-muted: #657b83;
  --color-border: #0b3f4c;
  --color-accent: #268bd2;
  --color-on-accent: #fdf6e3;
  --mask-bg: #0b4a5a;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.45), 0 6px 16px rgba(0, 0, 0, 0.40);
}

/* Nord：冷蓝极简 */
:root[data-theme="nord"] {
  --color-bg: #2e3440;
  --color-surface: #343b49;
  --color-text: #d8dee9;
  --color-muted: #8b98b0;
  --color-border: #434c5e;
  --color-accent: #88c0d0;
  --color-on-accent: #2e3440;
  --mask-bg: #3b4252;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.40), 0 6px 16px rgba(0, 0, 0, 0.32);
}

/* Gruvbox：暖褐复古 */
:root[data-theme="gruvbox"] {
  --color-bg: #282828;
  --color-surface: #32302f;
  --color-text: #ebdbb2;
  --color-muted: #a89984;
  --color-border: #504945;
  --color-accent: #fe8019;
  --color-on-accent: #282828;
  --mask-bg: #3c3836;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.42), 0 6px 16px rgba(0, 0, 0, 0.34);
}

* { box-sizing: border-box; }

/*
 * iOS 部分容器 App（比如 Documents by Readdle）内置的网页预览会把"点一下页面"识别成
 * "切换阅读器顶部工具栏"的手势，点整行揭示/按钮时会跟着一起触发，体验很差。
 * touch-action: manipulation 去掉双击缩放的判定延迟，让单击更快被网页自己的点击逻辑
 * 消费掉，减少被宿主 App 误判成"点了空白页面"的概率（如果宿主用的是原生手势识别器，
 * 这个也不一定完全压得住，是尽力而为的兼容写法）。
 */
.item, .doc-link, .btn, .reveal-btn, .fav-btn, .mark-btn, .fav-jump,
.drawer-toggle, .theme-picker-wrap, .sidebar-resizer {
  touch-action: manipulation;
}

body {
  margin: 0;
  font-size: clamp(15px, 2.5vw, 17px);
  line-height: 1.6;
  color: var(--color-text);
  background: var(--color-bg);
  font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  overflow-x: hidden; /* 禁止横向溢出 */
}

/* ── 顶部工具条 ───────────────────────────── */
.topbar {
  position: sticky;
  top: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: var(--topbar-h);
  padding: 8px 16px;
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

/* 标题跟 ☰ 按钮一样能点，触发同一个 toggleSidebar（见 page.html 的 data-action），
   加个手型光标 + 点击反馈，不然看不出能点 */
.app-title {
  margin: 0;
  font-size: clamp(15px, 3vw, 18px);
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  transition: opacity 0.15s ease;
}

.app-title:active { opacity: 0.6; }

.controls {
  margin-left: auto;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

/*
 * 宽屏：标题独立留在左边，按钮组居中到工具条正中间。
 * 用 grid 三列（左 / 中 / 右）而不是 position: absolute——之前用绝对定位时，
 * 按钮组一旦在中等宽度下换行变成两行，会因为脱离文档流而跟下方正文重叠
 * （工具条自身高度不会跟着换行长高）。grid 让按钮组留在正常文档流里，
 * 换行时工具条本身会跟着长高，不会盖住正文。
 */
@media (min-width: 901px) {
  .topbar {
    display: grid;
    grid-template-columns: auto 1fr auto;
    column-gap: 12px;
  }

  .topbar-left { grid-column: 1; }

  .app-title { max-width: min(32vw, 400px); }

  .controls {
    grid-column: 2;
    justify-self: center;
    margin-left: 0;
    justify-content: center;
    max-width: min(90vw, 640px);
  }

  .back-link {
    grid-column: 3;
    justify-self: end;
  }
}

.btn {
  min-width: var(--hit-size);
  min-height: var(--hit-size);
  padding: 6px 14px;
  font: inherit;
  color: var(--color-text);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  cursor: pointer;
}

.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

/* EN⇄CN 模式按钮：背景跟「➕/➖」按钮一样用普通 .btn 素色，不用强调色；靠文字区分当前模式 */
.btn-mode {
  white-space: nowrap;
}

/* 「全部展开/收起」合并按钮：➕/➖ 图标本身已经是粗体符号，字号调大一点更醒目 */
.btn-expand-toggle {
  font-size: 20px;
  font-weight: 700;
  line-height: 1;
}

/* 「★ 收藏」入口按钮：平时浅色底，跟收藏星标的金色呼应但不抢眼；打开收藏列表视图时换成强调色 */
.btn-favorites {
  color: #b45f06;
  background: rgba(245, 165, 36, 0.15);
  border-color: rgba(245, 165, 36, 0.5);
}

.btn-favorites.is-active {
  color: var(--color-on-accent);
  background: var(--color-accent);
  border-color: var(--color-accent);
}

/* 「📇 测验」入口按钮：打开测验模式时高亮 */
.btn-quiz.is-active {
  color: var(--color-on-accent);
  background: var(--color-accent);
  border-color: var(--color-accent);
}

/*
 * 测验模式评分按钮：3 个对号，点第几个就点亮到第几个（类似打分条）。
 * 用固定的灰 / 黄两色（不用主题令牌），跟收藏星标的金色区分开，避免混淆成同一种标记。
 */
.mark-btn {
  min-width: 32px;
  min-height: var(--hit-size);
  padding: 4px 6px;
  font-size: 16px;
  font-weight: 700;
  color: rgba(128, 128, 128, 0.5);
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  cursor: pointer;
}

.mark-btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

/* 点亮态用实心黄底 + 深色对号，比只变文字颜色更醒目，一眼能扫出点亮了几个 */
.mark-btn.is-filled {
  color: #78350f;
  background: #facc15;
  border-color: #facc15;
}

/* 收藏星标按钮：侧边栏文档条目 / item 上通用，已收藏用金色区分（跨主题固定色，保持可辨识） */
.fav-btn {
  flex: 0 0 auto;
  min-width: var(--hit-size);
  min-height: var(--hit-size);
  padding: 4px 10px;
  font-size: 18px;
  line-height: 1;
  color: var(--color-muted);
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  cursor: pointer;
}

.fav-btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

/* 已收藏：实心金底 + 白色星标，跟评分对号的"点亮=实心底"用同一套视觉语言，一眼能看出已收藏 */
.fav-btn.is-favorited {
  color: #ffffff;
  background: #f5a524;
  border-color: #f5a524;
}

/* 「我的收藏」列表里只读展示评分（不可点击），跟评分按钮共用 .mark-btn 样式 */
.mark-badges {
  display: inline-flex;
  gap: 4px;
}

.mark-badges .mark-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: auto;
  cursor: default;
}

/*
 * 主题选择：收起态只显示一个方形色块（颜色跟当前主题一致），不显示主题名字。
 * 原生 select 还在，但整个变透明盖在色块上面——点击色块其实点到的是透明的 select，
 * 照常弹出原生选项列表（列表里的文字正常显示，浏览器原生渲染，不用自己写下拉逻辑）。
 */
.theme-picker-wrap {
  position: relative;
  display: inline-flex;
  min-width: var(--hit-size);
  min-height: var(--hit-size);
}

/*
 * 描边用固定的深浅双层（不用 --color-border）：外圈深、内圈浅，不管色块本身是深是浅，
 * 总有一层能跟它区分开，不会跟当前主题背景糊在一起。再加个 🎨 图标，一眼就能认出是主题按钮，
 * 不用完全依赖色块本身的对比度。
 */
.theme-swatch {
  display: flex;
  align-items: center;
  justify-content: center;
  width: var(--hit-size);
  height: var(--hit-size);
  border-radius: var(--radius);
  border: 1px solid rgba(0, 0, 0, 0.25);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35), 0 1px 2px rgba(0, 0, 0, 0.18);
  font-size: 16px;
  line-height: 1;
}

.theme-select {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
}

.theme-picker-wrap:focus-within .theme-swatch {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}

.back-link {
  color: var(--color-accent);
  text-decoration: none;
  white-space: nowrap;
}

.back-link:active { opacity: 0.7; }

/* 汉堡按钮：切换侧边栏，窄屏是抽屉滑入/滑出，宽屏是收起/展开，两种宽度下都常驻显示 */
.drawer-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: var(--hit-size);
  min-height: var(--hit-size);
  font-size: 18px;
  color: var(--color-text);
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: transform 0.15s ease, background 0.15s ease;
}

.drawer-toggle:active {
  background: var(--mask-bg);
  transform: translateY(1px);
}

/* 拖拽调宽时锁定光标、禁止选中文字 */
body.is-resizing-sidebar {
  cursor: col-resize;
  user-select: none;
}

/* ── 布局：侧边栏 fixed 悬浮，不占文档流宽度 ── */
.sidebar {
  position: fixed;
  top: var(--topbar-h);
  left: 0;
  bottom: 0;
  width: var(--sidebar-width);
  z-index: 65;
  display: flex;
  flex-direction: column;
  padding: 12px;
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  transition: transform 0.2s ease;
}

/* 章节树滚动区：占满剩余高度，"返回全部课程"（.sidebar-home）留在它外面，
   固定贴底，不随章节多少变化 */
.sidebar-scroll {
  flex: 1 1 auto;
  min-height: 0; /* 让 flex 子元素允许收缩出现滚动条，而不是撑破容器 */
  overflow-y: auto;
}

.content {
  min-width: 0; /* 允许内容收缩，配合子元素换行避免横向溢出 */
  width: 100%;
  max-width: var(--content-max);
  margin: 0 auto;
  padding: 20px clamp(16px, 4vw, 32px) 64px;
}

/* 拖拽调宽分隔条：贴着侧边栏右边缘，只在宽屏出现（见下方媒体查询） */
.sidebar-resizer { display: none; }

/*
 * 单篇页面没有章节树数据，侧边栏渲染不出导航内容，连 ☰ 按钮一起隐藏，避免空框和摆设按钮；
 * 测验模式需要全部文档数据摊平抽取，单篇页面也做不到，一并隐藏
 */
body.single-doc .drawer-toggle,
body.single-doc .sidebar,
body.single-doc .sidebar-resizer,
body.single-doc .btn-quiz {
  display: none;
}

@media (min-width: 901px) {
  body.single-doc .content { margin-left: auto; }
}

/* ── 侧边栏：章节树 ───────────────────────── */

/* "返回全部课程"：只在构建时传了 --home-link 才会出现，多课程站点发布时用，放在章节树
   最下面（划到底才会碰到，避免跟上面的章节/文件误点），箭头跟单篇页面的"返回总目录"
   （.back-link）保持同一种符号 */
.sidebar-home {
  display: block;
  flex: 0 0 auto;
  min-height: var(--hit-size);
  padding: 10px 6px;
  margin-top: 4px;
  font-weight: 600;
  color: var(--color-accent);
  text-decoration: none;
  border-top: 1px solid var(--color-border);
}

.sidebar-home:active { opacity: 0.7; }

.chapter { border-bottom: 1px solid var(--color-border); }

.chapter-title {
  padding: 10px 6px;
  font-weight: 600;
  cursor: pointer;
}

.doc-list {
  list-style: none;
  margin: 0 0 8px;
  padding: 0;
}

/* 文件条目：文件名按钮 + 收藏星标并排 */
.doc-item {
  display: flex;
  align-items: stretch;
  gap: 4px;
}

.doc-link {
  display: block;
  width: auto;
  flex: 1 1 auto;
  min-width: 0;
  min-height: var(--hit-size);
  padding: 8px 10px;
  font: inherit;
  text-align: left;
  color: var(--color-text);
  background: transparent;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
}

.doc-link:active { background: var(--mask-bg); }

.doc-link.is-active {
  color: var(--color-accent);
  background: var(--mask-bg);
  font-weight: 600;
}

/* ── 内容区 ───────────────────────────────── */
.doc-header { margin-bottom: 16px; }

/* 内容区最下面的 EN⇄CN / 全部展开收起，跟顶部一样的按钮，划到底不用翻回顶部就能切换 */
.bottom-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 32px;
  padding-top: 20px;
  border-top: 1px solid var(--color-border);
}

/* 测验视图"换一批"排最前面，跟后面几个按钮之间留道更宽的间隔，一眼看出不是一组 */
.bottom-controls-leading { margin-right: 16px; }

.doc-title {
  margin: 0;
  font-size: clamp(19px, 4vw, 24px);
}

.section { margin-top: 28px; }

.section-title {
  margin: 0 0 12px;
  padding-bottom: 6px;
  font-size: clamp(16px, 3vw, 19px);
  border-bottom: 2px solid var(--color-accent);
}

.item-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* item：显示侧在左，揭示按钮在右，隐藏侧 / 常驻信息整行排在下方 */
.item {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px 12px;
  padding: 12px 14px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  cursor: pointer;
}

.shown-side {
  align-self: center;
  overflow-wrap: anywhere;
}

/* 收藏星标 + 揭示按钮的容器，占 item 网格第二列 */
.item-actions {
  grid-column: 2;
  align-self: center;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 6px;
}

.reveal-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: var(--hit-size);
  min-width: var(--hit-size);
  padding: 4px 12px;
  font: inherit;
  color: var(--color-accent);
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  white-space: nowrap;
  cursor: pointer;
}

.reveal-btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

.reveal-arrow {
  display: inline-block;
  transition: transform 0.15s ease;
}

.item.is-expanded .reveal-arrow { transform: rotate(90deg); }

.hidden-side {
  display: none;
  grid-column: 1 / -1;
  padding: 10px 12px;
  background: color-mix(in srgb, var(--mask-bg) 50%, var(--color-surface));
  border-radius: 8px;
  overflow-wrap: anywhere;
}

.item.is-expanded .hidden-side { display: block; }

.resident {
  grid-column: 1 / -1;
  color: var(--color-muted);
  font-size: 0.9em;
}

/* 词汇表单元格排版：单词加大加粗突出主角，词性/音标进一步弱化拉开主次对比 */
.cell { margin-right: 10px; }

.cell--word,
.cell--phrase {
  font-size: 1.15em;
  font-weight: 700;
}

/* 句型 & 金句：只稍微加粗，不加大字号——分量比单词/短语轻一点 */
.cell--text_en { font-weight: 600; }

.cell--pos {
  color: var(--color-muted);
  font-size: 0.85em;
}

.cell--ipa {
  color: var(--color-muted);
  font-size: 0.85em;
  font-family: ui-monospace, "SF Mono", "Consolas", monospace;
}

/*
 * 释义 / 读法各自一个色块（同一行），用已有的主题变量而不是写死颜色，
 * 保证深色主题下也有足够对比度：释义用强调色实心块（更显眼，这是核心信息），
 * 读法用中性浅底块（弱化，只是辅助的拼音读法）。这是收藏页（.favorite-row）
 * 用的原版底色，不要改这个——用户明确说收藏页这个配色挺好看，不要动
 */
.cell--meaning {
  display: inline-block;
  margin: 2px 6px 2px 0;
  padding: 3px 10px;
  border-radius: var(--radius);
  background: var(--mask-bg);
  color: var(--color-accent);
  border: 1px solid var(--color-accent);
  font-weight: 600;
}

.cell--reading {
  display: inline-block;
  margin: 2px 0;
  padding: 3px 10px;
  border-radius: var(--radius);
  background: var(--mask-bg);
  color: var(--color-muted);
}

/*
 * 课程章节页（.item，含测验模式）的释义色块单独换一版底色：这里的色块套在
 * .hidden-side 揭示区域里，.hidden-side 的背景刚好也是 --mask-bg，色块背景
 * 跟容器背景重叠、糊成一片（收藏页没有这层包裹，色块直接摆在卡片底色上，
 * 所以不受影响，维持上面原版）。用 color-mix 跟强调色混出淡色调，不管套在
 * 哪层背景里都能跟周围区分开。读法不用单独处理，跟 .hidden-side 背景融为
 * 一体就是想要的效果（只有释义要用色块凸显出来）
 */
.item .cell--meaning {
  background: color-mix(in srgb, var(--color-accent) 15%, var(--color-surface));
}

/* 读法背景设成透明，永远跟着 .hidden-side 容器的背景走，不用另外维护一份颜色去对齐 */
.item .cell--reading {
  background: transparent;
}

/* ── 我的收藏视图 ─────────────────────────── */
.favorites-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}

/* 收藏页两个筛选下拉给统一宽度，不管并排还是窄屏换行堆叠，头（左边）尾（右边）都能对齐；
   等宽字体配合 app.js 的 renderAlignedOptions 补空格，让选项里的 "--" 分隔符尽量对齐 */
.favorites-filter-select {
  width: 150px;
  text-align: left;
  font-family: ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace;
}

.favorites-hint {
  color: var(--color-muted);
  font-size: 0.85em;
}

.favorites-empty { color: var(--color-muted); }

/* 同步状态徽标：颜色跟具体状态挂钩，不跟主题色走（保证 10 个主题下都一眼能分清"正常/进行中/出错"） */
.sync-status {
  font-size: 0.85em;
  color: var(--color-muted);
}

.sync-status--idle { color: #16a34a; }
.sync-status--syncing { color: var(--color-muted); }
.sync-status--error { color: #dc2626; }

/* 同步设置面板：跟工具条其它按钮同一行下方展开，用 surface 底色+ 边框跟正文区分开 */
.sync-panel {
  width: 100%;
  margin-top: 4px;
  padding: 14px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.sync-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 0.9em;
}

.sync-field input {
  font: inherit;
  padding: 6px 10px;
  color: var(--color-text);
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
}

/* "保存/退出同步"靠左，"导出/导入配置"靠右，同一排但分成两组，一眼能看出不是同类操作 */
.sync-panel-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 10px;
}

.sync-panel-actions-group {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

/* "保存并同步"是这个面板的主操作，用强调色跟其它素色按钮区分开 */
.btn-sync-primary {
  color: var(--color-on-accent);
  background: var(--color-accent);
  border-color: var(--color-accent);
}

/* "退出同步"会清空本机配置，用警示色描边提示这是需要谨慎点的操作 */
.btn-sync-danger {
  color: #dc2626;
  border-color: #dc2626;
}

/* 收藏列表行：布局仿 .item，但不复用 .item 类名，避免被「点整行揭示」的事件委托误触发 */
.favorite-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px 12px;
  padding: 12px 14px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.fav-jump {
  font: inherit;
  color: var(--color-accent);
  background: transparent;
  border: 0;
  padding: 0;
  text-align: left;
  text-decoration: underline;
  cursor: pointer;
}

.fav-jump--disabled {
  color: var(--color-muted);
  text-decoration: none;
  cursor: default;
}

.favorite-meta {
  margin-bottom: 4px;
  color: var(--color-muted);
  font-size: 0.85em;
}

.favorite-both-sides {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  overflow-wrap: anywhere;
}

.cell--chapter {
  margin-right: 8px;
  color: var(--color-muted);
  font-size: 0.85em;
}

/* ── 宽屏：侧边栏收起/展开、拖拽调宽、正文相对整窗居中 ── */
@media (min-width: 901px) {
  /* 默认展开，.is-collapsed 时滑出隐藏 */
  .sidebar.is-collapsed { transform: translateX(-100%); }

  /* 正文按 max(侧边栏宽度, 整窗居中该有的位置) 计算左边距：
     窗口够宽时严格整窗居中；不够宽时退化成贴着侧边栏右边，避免被遮挡 */
  .content {
    margin-left: max(var(--sidebar-width), calc((100% - var(--content-max)) / 2));
    margin-right: auto;
  }

  /* 侧边栏收起后，正文完全按整窗居中 */
  .sidebar.is-collapsed ~ .content { margin-left: auto; }

  .sidebar-resizer {
    display: block;
    position: fixed;
    top: var(--topbar-h);
    left: var(--sidebar-width);
    bottom: 0;
    width: 6px;
    margin-left: -3px;
    z-index: 66;
    cursor: col-resize;
    background: transparent;
  }

  .sidebar-resizer:hover,
  .sidebar-resizer.is-dragging { background: var(--color-accent); opacity: 0.35; }

  /* 侧边栏收起时分隔条也一起隐藏 */
  .sidebar.is-collapsed ~ .sidebar-resizer { display: none; }
}

/* ── 窄屏：侧边栏转抽屉 ───────────────────── */
@media (max-width: 900px) {
  .sidebar {
    width: min(84vw, 320px);
    z-index: 70;
    transform: translateX(-100%);
    box-shadow: var(--shadow);
  }

  .sidebar.is-open { transform: none; }

  .content {
    max-width: none;
    padding: 16px 16px 56px;
  }

  /*
   * 只让「☰ + 标题」这一条吸顶（position: fixed），按钮那一行（.controls）跟着页面正常滚动，
   * 不再整个工具条都吸顶——手机屏幕小，两行按钮常驻会占掉很大一块阅读区域
   */
  .topbar {
    position: static;
    margin-top: var(--topbar-h);
  }

  .topbar-left {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 60;
    min-height: var(--topbar-h);
    padding: 8px 16px;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    transition: transform 0.25s ease;
  }

  /* 往下滑时收起（滑出屏幕外），往上滑或接近顶部时用 app.js 的滚动监听移除这个类重新露出来 */
  .topbar-left.is-hidden {
    transform: translateY(-100%);
  }

  /* 词条卡片：操作按钮挪到内容下方单独一行，不跟内容抢横向空间；按钮整体缩小一圈 */
  .item {
    grid-template-columns: 1fr;
  }

  .item-actions {
    grid-column: 1;
    justify-content: flex-start;
  }

  .item-actions .fav-btn,
  .item-actions .mark-btn,
  .item-actions .reveal-btn {
    min-width: 36px;
    min-height: 36px;
    padding: 2px 8px;
    font-size: 14px;
  }
}
