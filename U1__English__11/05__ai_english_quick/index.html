  <style>/*
 * style.css — livenotes 响应式样式
 *
 * 侧边栏始终 position: fixed 悬浮，不占文档流宽度：
 *   宽屏（>= 900px）：默认展开，.is-collapsed 收起；右边缘可拖拽调宽；正文相对整个视口居中
 *   窄屏：默认收起（抽屉），.is-open 滑入；内容单栏铺满，没有拖拽调宽
 * 热区按钮 >= 44px，不依赖 :hover（用 :active / :focus-visible）
 * 详见 ARCHITECTURE.md §4「布局」
 */

:root {
  --breakpoint: 900px;
  --hit-size: 44px;
  --sidebar-width: 288px;
  --sidebar-min-width: 220px;
  --sidebar-max-width: 480px;
  --topbar-h: 56px;
  --content-max: 760px;
  --radius: 10px;
  --gap: 16px;

  /* 配色令牌（浅色为主） */
  --color-bg: #ffffff;
  --color-surface: #ffffff;
  --color-text: #1a1a1a;
  --color-muted: #6b7280;
  --color-border: #e5e7eb;
  --color-accent: #2563eb;
  --color-on-accent: #ffffff;

  /* 隐藏侧展开后的背景，与显示侧区分 */
  --mask-bg: #f3f4f6;

  --shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.05);
}

/*
 * 主题：每个主题只覆盖约 9 个配色令牌，布局规则复用。
 * 默认（无 data-theme）= 浅色；data-theme="auto" 跟随系统浅 / 深。
 * 主题 id 与 template/app.js 的 THEMES 列表一一对应。
 */

/* 跟随系统：仅当系统为深色时套用「石墨深色」令牌 */
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    --color-bg: #0f1115;
    --color-surface: #171a21;
    --color-text: #e6e8eb;
    --color-muted: #9aa3af;
    --color-border: #2a2f3a;
    --color-accent: #60a5fa;
    --color-on-accent: #0f1115;
    --mask-bg: #232a36;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 16px rgba(0, 0, 0, 0.35);
  }
}

/* 纸质 Sepia：暖米黄，经典阅读模式 */
:root[data-theme="sepia"] {
  --color-bg: #f4ecd8;
  --color-surface: #faf4e4;
  --color-text: #5b4636;
  --color-muted: #8c7a63;
  --color-border: #e2d6bb;
  --color-accent: #a3682f;
  --color-on-accent: #faf4e4;
  --mask-bg: #ece0c6;
  --shadow: 0 1px 2px rgba(91, 70, 54, 0.10), 0 4px 12px rgba(91, 70, 54, 0.07);
}

/* Gruvbox Light：暖米黄底、深棕字，跟已有的 Gruvbox 深色配对 */
:root[data-theme="gruvbox-light"] {
  --color-bg: #fbf1c7;
  --color-surface: #f9f5d7;
  --color-text: #3c3836;
  --color-muted: #7c6f64;
  --color-border: #ebdbb2;
  --color-accent: #af3a03;
  --color-on-accent: #fbf1c7;
  --mask-bg: #ebdbb2;
  --shadow: 0 1px 2px rgba(60, 56, 54, 0.10), 0 4px 12px rgba(60, 56, 54, 0.07);
}

/* 牛皮纸 Kraft：更深一点的黄褐色底，强调色用烧橙棕 */
:root[data-theme="kraft"] {
  --color-bg: #e8dcc3;
  --color-surface: #f0e6d2;
  --color-text: #4a3f2f;
  --color-muted: #8a7a63;
  --color-border: #d4c4a0;
  --color-accent: #b5651d;
  --color-on-accent: #f0e6d2;
  --mask-bg: #ddcfab;
  --shadow: 0 1px 2px rgba(74, 63, 47, 0.12), 0 4px 12px rgba(74, 63, 47, 0.08);
}

/* 米黄旧纸 Parchment：比 Sepia 更浅更柔和的米白纸感 */
:root[data-theme="parchment"] {
  --color-bg: #f7f3e9;
  --color-surface: #fbf8f0;
  --color-text: #3a3a35;
  --color-muted: #7a7566;
  --color-border: #e5ddc8;
  --color-accent: #8c6d46;
  --color-on-accent: #fbf8f0;
  --mask-bg: #eee6d3;
  --shadow: 0 1px 2px rgba(58, 58, 53, 0.08), 0 4px 12px rgba(58, 58, 53, 0.05);
}

/* Solarized Light */
:root[data-theme="solarized-light"] {
  --color-bg: #fdf6e3;
  --color-surface: #fdf6e3;
  --color-text: #586e75;
  --color-muted: #93a1a1;
  --color-border: #e6dfc6;
  --color-accent: #268bd2;
  --color-on-accent: #fdf6e3;
  --mask-bg: #eee8d5;
  --shadow: 0 1px 2px rgba(101, 123, 131, 0.10), 0 4px 12px rgba(101, 123, 131, 0.06);
}

/* 石墨深色：中性深灰 */
:root[data-theme="graphite"] {
  --color-bg: #0f1115;
  --color-surface: #171a21;
  --color-text: #e6e8eb;
  --color-muted: #9aa3af;
  --color-border: #2a2f3a;
  --color-accent: #60a5fa;
  --color-on-accent: #0f1115;
  --mask-bg: #232a36;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 16px rgba(0, 0, 0, 0.35);
}

/* Solarized Dark */
:root[data-theme="solarized-dark"] {
  --color-bg: #002b36;
  --color-surface: #073642;
  --color-text: #93a1a1;
  --color-muted: #657b83;
  --color-border: #0b3f4c;
  --color-accent: #268bd2;
  --color-on-accent: #fdf6e3;
  --mask-bg: #0b4a5a;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.45), 0 6px 16px rgba(0, 0, 0, 0.40);
}

/* Nord：冷蓝极简 */
:root[data-theme="nord"] {
  --color-bg: #2e3440;
  --color-surface: #343b49;
  --color-text: #d8dee9;
  --color-muted: #8b98b0;
  --color-border: #434c5e;
  --color-accent: #88c0d0;
  --color-on-accent: #2e3440;
  --mask-bg: #3b4252;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.40), 0 6px 16px rgba(0, 0, 0, 0.32);
}

/* Gruvbox：暖褐复古 */
:root[data-theme="gruvbox"] {
  --color-bg: #282828;
  --color-surface: #32302f;
  --color-text: #ebdbb2;
  --color-muted: #a89984;
  --color-border: #504945;
  --color-accent: #fe8019;
  --color-on-accent: #282828;
  --mask-bg: #3c3836;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.42), 0 6px 16px rgba(0, 0, 0, 0.34);
}

* { box-sizing: border-box; }

/*
 * iOS 部分容器 App（比如 Documents by Readdle）内置的网页预览会把"点一下页面"识别成
 * "切换阅读器顶部工具栏"的手势，点整行揭示/按钮时会跟着一起触发，体验很差。
 * touch-action: manipulation 去掉双击缩放的判定延迟，让单击更快被网页自己的点击逻辑
 * 消费掉，减少被宿主 App 误判成"点了空白页面"的概率（如果宿主用的是原生手势识别器，
 * 这个也不一定完全压得住，是尽力而为的兼容写法）。
 */
.item, .doc-link, .btn, .fav-btn, .mark-btn, .fav-jump, .speak-btn,
.drawer-toggle, .theme-picker-wrap, .sidebar-resizer {
  touch-action: manipulation;
}

body {
  margin: 0;
  font-size: clamp(15px, 2.5vw, 17px);
  line-height: 1.6;
  color: var(--color-text);
  background: var(--color-bg);
  font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  overflow-x: hidden; /* 禁止横向溢出 */
}

/* ── 顶部工具条 ───────────────────────────── */
.topbar {
  position: sticky;
  top: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: var(--topbar-h);
  padding: 8px 16px;
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

/* 标题跟 ☰ 按钮一样能点，触发同一个 toggleSidebar（见 page.html 的 data-action），
   加个手型光标 + 点击反馈，不然看不出能点 */
.app-title {
  margin: 0;
  font-size: clamp(15px, 3vw, 18px);
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  transition: opacity 0.15s ease;
}

.app-title:active { opacity: 0.6; }

.controls {
  margin-left: auto;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

/*
 * 宽屏：标题独立留在左边，按钮组居中到工具条正中间。
 * 用 grid 三列（左 / 中 / 右）而不是 position: absolute——之前用绝对定位时，
 * 按钮组一旦在中等宽度下换行变成两行，会因为脱离文档流而跟下方正文重叠
 * （工具条自身高度不会跟着换行长高）。grid 让按钮组留在正常文档流里，
 * 换行时工具条本身会跟着长高，不会盖住正文。
 */
@media (min-width: 901px) {
  .topbar {
    display: grid;
    grid-template-columns: auto 1fr auto;
    column-gap: 12px;
  }

  .topbar-left { grid-column: 1; }

  .app-title { max-width: min(32vw, 400px); }

  .controls {
    grid-column: 2;
    justify-self: center;
    margin-left: 0;
    justify-content: center;
    max-width: min(90vw, 640px);
  }

  .back-link {
    grid-column: 3;
    justify-self: end;
  }
}

.btn {
  min-width: var(--hit-size);
  min-height: var(--hit-size);
  padding: 6px 14px;
  font: inherit;
  color: var(--color-text);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  cursor: pointer;
}

.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

/* EN⇄CN 模式按钮：背景跟「➕/➖」按钮一样用普通 .btn 素色，不用强调色；靠文字区分当前模式 */
.btn-mode {
  white-space: nowrap;
}

/* 「全部展开/收起」合并按钮：➕/➖ 图标本身已经是粗体符号，字号调大一点更醒目 */
.btn-expand-toggle {
  font-size: 20px;
  font-weight: 700;
  line-height: 1;
}

/* 「★ 收藏」入口按钮：平时浅色底，跟收藏星标的金色呼应但不抢眼；打开收藏列表视图时换成强调色 */
.btn-favorites {
  color: #b45f06;
  background: rgba(245, 165, 36, 0.15);
  border-color: rgba(245, 165, 36, 0.5);
}

.btn-favorites.is-active {
  color: var(--color-on-accent);
  background: var(--color-accent);
  border-color: var(--color-accent);
}

/* 「📇 测验」入口按钮：打开测验模式时高亮 */
.btn-quiz.is-active {
  color: var(--color-on-accent);
  background: var(--color-accent);
  border-color: var(--color-accent);
}

/* 「🎧 听力」入口按钮：打开听力视图时高亮，跟测验按钮同一套视觉语言 */
.btn-listening.is-active {
  color: var(--color-on-accent);
  background: var(--color-accent);
  border-color: var(--color-accent);
}

/* 朗读语音选择：语音名字长短不一，限个最大宽度，太长的用省略号截断 */
.voice-select {
  max-width: 140px;
  padding: 4px 6px;
  font: inherit;
  color: var(--color-text);
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/*
 * 测验模式评分按钮：3 个对号，点第几个就点亮到第几个（类似打分条）。
 * 用固定的灰 / 黄两色（不用主题令牌），跟收藏星标的金色区分开，避免混淆成同一种标记。
 */
.mark-btn {
  min-width: 32px;
  min-height: var(--hit-size);
  padding: 4px 6px;
  font-size: 16px;
  font-weight: 700;
  color: rgba(128, 128, 128, 0.5);
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  cursor: pointer;
}

.mark-btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

/* 点亮态用实心黄底 + 深色对号，比只变文字颜色更醒目，一眼能扫出点亮了几个 */
.mark-btn.is-filled {
  color: #78350f;
  background: #facc15;
  border-color: #facc15;
}

/*
 * 听力测试选项：纵向堆叠的整行按钮，点了立刻判对错——答对的选项变绿，
 * 选错时被点的那个变红、同时把真正的答案也标绿，方便看清正确答案是哪个。
 * disabled 后不用默认的变灰半透明（会盖掉对/错颜色），保持完全不透明可读。
 */
.listening-question { margin-bottom: 10px; }

/* "查看原文"按钮加宽：用固定 width（不是 min-width）保证一定比文字自然宽度大 */
.listening-reveal-btn { width: 180px; }

.listening-choices {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* 按钮内部纵向堆叠：上面一行是文字+图标，下面是展开后的英文解释，
   两行共用同一个按钮背景色，看起来是一整块 */
.listening-choice-btn {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 6px;
  width: 100%;
  text-align: left;
}

/* 文字靠左，答完题插入的 ✓/✗ 图标（.listening-choice-icon）靠右，
   flex + space-between 两个都有内容时自动分居两端 */
.listening-choice-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
}

/* 对/错只改内部背景色，文字颜色、边框颜色都保持不变 */
.listening-choice-btn.is-correct {
  background: #c8f0d9;
}

.listening-choice-btn.is-wrong {
  background: #fbd0d0;
}

/* 答案下面的英文解释现在是按钮的子元素（不再是兄弟节点），用后代选择器
   让它跟着按钮的对/错背景色走，不用额外加 class */
.listening-choice-btn.is-correct .listening-choice-en {
  background: #c8f0d9;
}

.listening-choice-btn.is-wrong .listening-choice-en {
  background: #fbd0d0;
}

/* 圆形描边小徽章，比单纯的文字颜色更醒目，但不像实心色块那么抢眼 */
.listening-choice-icon {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid currentColor;
  font-size: 13px;
  font-weight: 700;
  line-height: 1;
}

.listening-choice-icon--correct { color: #16a34a; }
.listening-choice-icon--wrong { color: #dc2626; }

/* 每个选项对应的英文原文：答完题才会一起露出来（见 handleListeningChoice），
   再点任意一个选项按钮会一起收起/展开，不是每条单独控制，本身不用单独点击；
   用原生 hidden 属性控制，不要在这里另外写 display，避免跟 [hidden] 的默认隐藏
   样式打架（设置菜单那次就是因为这个才卡住的） */
.listening-choice-en {
  padding: 4px 10px;
  color: var(--color-muted);
  font-size: 0.85em;
  background: var(--mask-bg);
  border-radius: var(--radius);
}

/* 收藏星标按钮：侧边栏文档条目 / item 上通用，已收藏用金色区分（跨主题固定色，保持可辨识） */
.fav-btn {
  flex: 0 0 auto;
  min-width: var(--hit-size);
  min-height: var(--hit-size);
  padding: 4px 10px;
  font-size: 18px;
  line-height: 1;
  color: var(--color-muted);
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  cursor: pointer;
}

.fav-btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

/* 已收藏：实心金底 + 白色星标，跟评分对号的"点亮=实心底"用同一套视觉语言，一眼能看出已收藏 */
.fav-btn.is-favorited {
  color: #ffffff;
  background: #f5a524;
  border-color: #f5a524;
}

/* 「我的收藏」列表里只读展示评分（不可点击），跟评分按钮共用 .mark-btn 样式 */
.mark-badges {
  display: inline-flex;
  gap: 4px;
}

.mark-badges .mark-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: auto;
  cursor: default;
}

/*
 * 主题选择：收起态只显示一个方形色块（颜色跟当前主题一致），不显示主题名字。
 * 原生 select 还在，但整个变透明盖在色块上面——点击色块其实点到的是透明的 select，
 * 照常弹出原生选项列表（列表里的文字正常显示，浏览器原生渲染，不用自己写下拉逻辑）。
 */
.theme-picker-wrap {
  position: relative;
  display: inline-flex;
  min-width: var(--hit-size);
  min-height: var(--hit-size);
}

/*
 * 描边用固定的深浅双层（不用 --color-border）：外圈深、内圈浅，不管色块本身是深是浅，
 * 总有一层能跟它区分开，不会跟当前主题背景糊在一起。再加个 🎨 图标，一眼就能认出是主题按钮，
 * 不用完全依赖色块本身的对比度。
 */
.theme-swatch {
  display: flex;
  align-items: center;
  justify-content: center;
  width: var(--hit-size);
  height: var(--hit-size);
  border-radius: var(--radius);
  border: 1px solid rgba(0, 0, 0, 0.25);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35), 0 1px 2px rgba(0, 0, 0, 0.18);
  font-size: 16px;
  line-height: 1;
}

.theme-select {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
}

.theme-picker-wrap:focus-within .theme-swatch {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}

/* 设置菜单：⚙️ 按钮 + 弹出面板，主题/朗读语音这些不常切换的选项收在里面，
   面板绝对定位悬浮在按钮下方，不占用顶部工具条的常驻宽度 */
.settings-menu-wrap {
  position: relative;
  display: inline-flex;
}

/* 设置按钮：菜单展开时换成强调色底，跟"点亮/按下"的状态呼应，展开收起一眼能看出来 */
.settings-menu-wrap > .btn.is-active {
  color: var(--color-on-accent);
  background: var(--color-accent);
  border-color: var(--color-accent);
}

/* 用 class 控制显示/隐藏，不用 hidden 属性——原生 [hidden] 是靠 display:none 生效的，
   跟这里本来就要写的 display:flex 优先级会打架（同优先级时后写的规则赢，[hidden] 的效果
   反而被盖掉），改成 .is-open 类就没有这个冲突，也是项目里侧边栏抽屉一直用的做法 */
.settings-menu {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 65;
  flex-direction: column;
  gap: 12px;
  min-width: 200px;
  padding: 12px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.settings-menu.is-open {
  display: flex;
}

/* 文字标签和控件各占一行（而不是同一行左右分布）：面板宽度有限，语音名字这种长文本
   跟中文标签挤在同一行，标签会因为没有空间被迫一个字一个字往下换行 */
.settings-menu-item {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  font-size: 0.9em;
}

/* 主题这一项空间够（色块按钮宽度固定，不像语音名字那样长短不一），改回同一行：
   文字靠左，色块按钮靠右对齐 */
.settings-menu-item--row {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.settings-menu-item .voice-select {
  width: 100%;
  max-width: none;
}

.back-link {
  color: var(--color-accent);
  text-decoration: none;
  white-space: nowrap;
}

.back-link:active { opacity: 0.7; }

/* 汉堡按钮：切换侧边栏，窄屏是抽屉滑入/滑出，宽屏是收起/展开，两种宽度下都常驻显示 */
.drawer-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: var(--hit-size);
  min-height: var(--hit-size);
  font-size: 18px;
  color: var(--color-text);
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: transform 0.15s ease, background 0.15s ease;
}

.drawer-toggle:active {
  background: var(--mask-bg);
  transform: translateY(1px);
}

/* 拖拽调宽时锁定光标、禁止选中文字 */
body.is-resizing-sidebar {
  cursor: col-resize;
  user-select: none;
}

/* ── 布局：侧边栏 fixed 悬浮，不占文档流宽度 ── */
.sidebar {
  position: fixed;
  top: var(--topbar-h);
  left: 0;
  bottom: 0;
  width: var(--sidebar-width);
  z-index: 65;
  display: flex;
  flex-direction: column;
  padding: 12px;
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  transition: transform 0.2s ease;
}

/* 章节树滚动区：占满剩余高度，"返回全部课程"（.sidebar-home）留在它外面，
   固定贴底，不随章节多少变化 */
.sidebar-scroll {
  flex: 1 1 auto;
  min-height: 0; /* 让 flex 子元素允许收缩出现滚动条，而不是撑破容器 */
  overflow-y: auto;
}

.content {
  min-width: 0; /* 允许内容收缩，配合子元素换行避免横向溢出 */
  width: 100%;
  max-width: var(--content-max);
  margin: 0 auto;
  padding: 20px clamp(16px, 4vw, 32px) 64px;
}

/* 拖拽调宽分隔条：贴着侧边栏右边缘，只在宽屏出现（见下方媒体查询） */
.sidebar-resizer { display: none; }

/*
 * 单篇页面没有章节树数据，侧边栏渲染不出导航内容，连 ☰ 按钮一起隐藏，避免空框和摆设按钮；
 * 测验 / 听力模式都需要全部文档数据摊平抽取，单篇页面也做不到，一并隐藏
 */
body.single-doc .drawer-toggle,
body.single-doc .sidebar,
body.single-doc .sidebar-resizer,
body.single-doc .btn-quiz,
body.single-doc .btn-listening {
  display: none;
}

@media (min-width: 901px) {
  body.single-doc .content { margin-left: auto; }
}

/* ── 侧边栏：章节树 ───────────────────────── */

/* "返回全部课程"：只在构建时传了 --home-link 才会出现，多课程站点发布时用，放在章节树
   最下面（划到底才会碰到，避免跟上面的章节/文件误点），箭头跟单篇页面的"返回总目录"
   （.back-link）保持同一种符号 */
.sidebar-home {
  display: block;
  flex: 0 0 auto;
  min-height: var(--hit-size);
  padding: 10px 6px;
  margin-top: 4px;
  font-weight: 600;
  color: var(--color-accent);
  text-decoration: none;
  border-top: 1px solid var(--color-border);
}

.sidebar-home:active { opacity: 0.7; }

.chapter { border-bottom: 1px solid var(--color-border); }

.chapter-title {
  padding: 10px 6px;
  font-weight: 600;
  cursor: pointer;
}

.doc-list {
  list-style: none;
  margin: 0 0 8px;
  padding: 0;
}

/* 文件条目：文件名按钮 + 收藏星标并排 */
.doc-item {
  display: flex;
  align-items: stretch;
  gap: 4px;
}

.doc-link {
  display: block;
  width: auto;
  flex: 1 1 auto;
  min-width: 0;
  min-height: var(--hit-size);
  padding: 8px 10px;
  font: inherit;
  text-align: left;
  color: var(--color-text);
  background: transparent;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
}

.doc-link:active { background: var(--mask-bg); }

.doc-link.is-active {
  color: var(--color-accent);
  background: var(--mask-bg);
  font-weight: 600;
}

/* ── 内容区 ───────────────────────────────── */
.doc-header { margin-bottom: 16px; }

/* 标题上方的章节标签（比如"01 - Overview"），小字弱化，帮助区分现在在哪一章 */
.doc-chapter-label {
  margin-bottom: 4px;
  color: var(--color-muted);
  font-size: 0.85em;
}

/* 标题两侧带"上一节/下一节"按钮时改成一行：按钮固定宽度不缩，标题占剩余空间、居中，
   标题长的话自己换行，不会把按钮挤变形 */
.doc-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.doc-title-row .doc-title {
  flex: 1;
  min-width: 0;
  text-align: center;
}

/* 内容区底部单独一排"上一节/下一节"，两端对齐 */
.doc-pager {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-top: 20px;
}

.doc-pager-btn {
  flex: 0 0 auto;
  white-space: nowrap;
}

/* 翻到列表头/尾时对应按钮禁用：置灰 + 不响应点击，但保留占位不让布局跳动 */
.doc-pager-btn--disabled {
  color: var(--color-muted);
  opacity: 0.5;
  cursor: default;
}

/* 悬浮"回到顶部"按钮：固定在右下角，默认淡出 + 不可点（pointer-events: none 避免
   挡住底下的内容），滚动超过阈值时 app.js 加 .is-visible 才淡入、恢复可点 */
.back-to-top {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 55;
  display: flex;
  align-items: center;
  justify-content: center;
  width: var(--hit-size);
  height: var(--hit-size);
  border-radius: 50%;
  font-size: 26px;
  line-height: 1;
  color: var(--color-on-accent);
  background: var(--color-accent);
  border: none;
  box-shadow: var(--shadow);
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transform: translateY(8px);
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.back-to-top.is-visible {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

.back-to-top:active { transform: translateY(1px); }

/* 内容区最下面的 EN⇄CN / 全部展开收起，跟顶部一样的按钮，划到底不用翻回顶部就能切换 */
.bottom-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 32px;
  padding-top: 20px;
  border-top: 1px solid var(--color-border);
}

/* 测验视图"换一批"排最前面，跟后面几个按钮之间留道更宽的间隔，一眼看出不是一组 */
.bottom-controls-leading { margin-right: 16px; }

.doc-title {
  margin: 0;
  font-size: clamp(19px, 4vw, 24px);
}

.section { margin-top: 28px; }

.section-title {
  margin: 0 0 12px;
  padding-bottom: 6px;
  font-size: clamp(16px, 3vw, 19px);
  border-bottom: 2px solid var(--color-accent);
}

.item-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* item：内容和操作按钮同属一个可换行的行（.side-cells-row），空间够就同一行、
   不够才换行，不再用固定两栏 grid 把按钮锁死在单独一行（历史上是两栏 grid，窄屏
   下按钮被挤到内容下方单独一行，哪怕内容那行还有剩余空间也用不上，改成 flex 换行
   流之后，按钮会先尝试跟内容拼在同一行，真放不下才换到下一行）；揭示侧 / 常驻
   信息还是各自整行排在下方，块级元素天然占满宽度，不需要 grid 的 1/-1 跨列写法 */
.item {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px 14px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  cursor: pointer;
}

.shown-side {
  overflow-wrap: anywhere;
}

/* 内容 cell 和操作按钮同一行、可换行；.item-actions 用 margin-left: auto 顶到
   这一行的最右边——空间够就跟内容拼在同一行右侧，空间不够整行换行时，
   margin-left: auto 在新的一行里同样会把按钮顶到右边，效果不受换不换行影响 */
.side-cells-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 12px;
}

.item-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-left: auto;
}

/* 朗读按钮紧挨着收藏按钮，两个都是容易被拇指扫到的位置，单独加宽间隔防止连续误触
   （用相邻选择器只加宽这两者之间的间隔，评分对号/跳转链接之间的间隔不受影响） */
.speak-btn + .fav-btn {
  margin-left: 12px;
}

/* 卡片里的收藏星标单独加宽（桌面端 --hit-size 44px 的 2 倍），移动端另有更大倍数的
   覆盖（见 @media 区块）。高度维持项目原本统一的 --hit-size，不额外加高 */
.item-actions .fav-btn,
.item-actions .speak-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 88px;
}

.hidden-side {
  display: none;
  padding: 10px 12px;
  background: color-mix(in srgb, var(--mask-bg) 50%, var(--color-surface));
  border-radius: 8px;
  overflow-wrap: anywhere;
}

.item.is-expanded .hidden-side { display: block; }

.resident {
  color: var(--color-muted);
  font-size: 0.9em;
}

/* 词汇表单元格排版：单词加大加粗突出主角，词性/音标进一步弱化拉开主次对比 */
.cell { margin-right: 10px; }

/* 朗读按钮：放在操作按钮区（收藏星标前面），跟收藏按钮同一套视觉语言——
   带边框的方块按钮、按下有位移反馈，不是内联小图标 */
.speak-btn {
  flex: 0 0 auto;
  min-width: var(--hit-size);
  min-height: var(--hit-size);
  padding: 4px 10px;
  font-size: 16px;
  line-height: 1;
  color: var(--color-muted);
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  cursor: pointer;
}

.speak-btn:active { transform: translateY(1px); }
.speak-btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

.cell--word,
.cell--phrase {
  font-size: 1.15em;
  font-weight: 700;
}

/* 句型 & 金句：只稍微加粗，不加大字号——分量比单词/短语轻一点 */
.cell--text_en { font-weight: 600; }

.cell--pos {
  color: var(--color-muted);
  font-size: 0.85em;
}

.cell--ipa {
  color: var(--color-muted);
  font-size: 0.85em;
  font-family: ui-monospace, "SF Mono", "Consolas", monospace;
}

/*
 * 释义 / 读法各自一个色块（同一行），用已有的主题变量而不是写死颜色，
 * 保证深色主题下也有足够对比度：释义用强调色实心块（更显眼，这是核心信息），
 * 读法用中性浅底块（弱化，只是辅助的拼音读法）。这是收藏页（.favorite-row）
 * 用的原版底色，不要改这个——用户明确说收藏页这个配色挺好看，不要动
 */
.cell--meaning {
  display: inline-block;
  margin: 2px 6px 2px 0;
  padding: 3px 10px;
  border-radius: var(--radius);
  background: var(--mask-bg);
  color: var(--color-accent);
  border: 1px solid var(--color-accent);
  font-weight: 600;
}

.cell--reading {
  display: inline-block;
  margin: 2px 0;
  padding: 3px 10px;
  border-radius: var(--radius);
  background: var(--mask-bg);
  color: var(--color-muted);
}

/*
 * 课程章节页（.item，含测验模式）的释义色块单独换一版底色：这里的色块套在
 * .hidden-side 揭示区域里，.hidden-side 的背景刚好也是 --mask-bg，色块背景
 * 跟容器背景重叠、糊成一片（收藏页没有这层包裹，色块直接摆在卡片底色上，
 * 所以不受影响，维持上面原版）。用 color-mix 跟强调色混出淡色调，不管套在
 * 哪层背景里都能跟周围区分开。读法不用单独处理，跟 .hidden-side 背景融为
 * 一体就是想要的效果（只有释义要用色块凸显出来）
 */
.item .cell--meaning {
  background: color-mix(in srgb, var(--color-accent) 15%, var(--color-surface));
}

/* 读法背景设成透明，永远跟着 .hidden-side 容器的背景走，不用另外维护一份颜色去对齐 */
.item .cell--reading {
  background: transparent;
}

/* ── 我的收藏视图 ─────────────────────────── */
/* "导出/导入收藏"一组、"同步设置/立即同步/状态"另一组，固定分两排，
   不会把同步设置跟立即同步拆到两行、也不会四个按钮挤一行 */
.favorites-toolbar {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 20px;
}

.favorites-toolbar-group {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

/* 类型 / 对号档位两个筛选下拉，跟工具条分开单独一个类（之前误用 .favorites-toolbar，
   工具条改成纵向堆叠时筛选条被一起带歪，拆开避免以后互相影响） */
.favorites-filter-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

/* 收藏页两个筛选下拉给统一宽度，不管并排还是窄屏换行堆叠，头（左边）尾（右边）都能对齐；
   等宽字体配合 app.js 的 renderAlignedOptions 补空格，让选项里的 "--" 分隔符尽量对齐 */
.favorites-filter-select {
  width: 150px;
  text-align: left;
  font-family: ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace;
}

.favorites-hint {
  color: var(--color-muted);
  font-size: 0.85em;
}

.favorites-empty { color: var(--color-muted); }

/* 同步状态徽标：颜色跟具体状态挂钩，不跟主题色走（保证 10 个主题下都一眼能分清"正常/进行中/出错"） */
.sync-status {
  font-size: 0.85em;
  color: var(--color-muted);
}

.sync-status--idle { color: #16a34a; }
.sync-status--syncing { color: var(--color-muted); }
.sync-status--error { color: #dc2626; }

/* 同步设置面板：跟工具条其它按钮同一行下方展开，用 surface 底色+ 边框跟正文区分开 */
.sync-panel {
  width: 100%;
  margin-top: 4px;
  padding: 14px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.sync-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 0.9em;
}

.sync-field input {
  font: inherit;
  padding: 6px 10px;
  color: var(--color-text);
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
}

/* "保存/退出同步"靠左，"导出/导入配置"靠右，同一排但分成两组，一眼能看出不是同类操作 */
.sync-panel-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 10px;
}

.sync-panel-actions-group {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

/* "保存并同步"是这个面板的主操作，用强调色跟其它素色按钮区分开 */
.btn-sync-primary {
  color: var(--color-on-accent);
  background: var(--color-accent);
  border-color: var(--color-accent);
}

/* "退出同步"会清空本机配置，用警示色描边提示这是需要谨慎点的操作 */
.btn-sync-danger {
  color: #dc2626;
  border-color: #dc2626;
}

/* 收藏列表行：布局仿 .item（同样是 flex 纵向堆叠 + .side-cells-row 换行流），
   但不复用 .item 类名，避免被「点整行揭示」的事件委托误触发 */
.favorite-row {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px 14px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.fav-jump {
  font: inherit;
  color: var(--color-accent);
  background: transparent;
  border: 0;
  padding: 0;
  text-align: left;
  text-decoration: underline;
  cursor: pointer;
}

.fav-jump--disabled {
  color: var(--color-muted);
  text-decoration: none;
  cursor: default;
}

.favorite-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 8px;
  margin-bottom: 4px;
  color: var(--color-muted);
  font-size: 0.85em;
}

/* 收藏日期顶到这一行最右边，空间够就跟前面文字同一行、不够才换行（同一套 margin-left: auto 手法） */
.favorite-time {
  margin-left: auto;
  white-space: nowrap;
}

/* en/cn 各自一行（.favorite-side），不要把两侧的 cell 混在同一个 flex 行里——
   混在一起时短的 cell（比如释义）会跟上一行内容挤在一起换行，长的 cell（比如读法）
   又被挤到单独一行，释义和读法这两个本该一起看的字段反而被拆散了 */
.favorite-both-sides {
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow-wrap: anywhere;
}

.favorite-side {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 12px;
}

.cell--chapter {
  margin-right: 8px;
  color: var(--color-muted);
  font-size: 0.85em;
}

/* ── 宽屏：侧边栏收起/展开、拖拽调宽、正文相对整窗居中 ── */
@media (min-width: 901px) {
  /* 默认展开，.is-collapsed 时滑出隐藏 */
  .sidebar.is-collapsed { transform: translateX(-100%); }

  /* 正文按 max(侧边栏宽度, 整窗居中该有的位置) 计算左边距：
     窗口够宽时严格整窗居中；不够宽时退化成贴着侧边栏右边，避免被遮挡 */
  .content {
    margin-left: max(var(--sidebar-width), calc((100% - var(--content-max)) / 2));
    margin-right: auto;
  }

  /* 侧边栏收起后，正文完全按整窗居中 */
  .sidebar.is-collapsed ~ .content { margin-left: auto; }

  .sidebar-resizer {
    display: block;
    position: fixed;
    top: var(--topbar-h);
    left: var(--sidebar-width);
    bottom: 0;
    width: 6px;
    margin-left: -3px;
    z-index: 66;
    cursor: col-resize;
    background: transparent;
  }

  .sidebar-resizer:hover,
  .sidebar-resizer.is-dragging { background: var(--color-accent); opacity: 0.35; }

  /* 侧边栏收起时分隔条也一起隐藏 */
  .sidebar.is-collapsed ~ .sidebar-resizer { display: none; }
}

/* ── 窄屏：侧边栏转抽屉 ───────────────────── */
@media (max-width: 900px) {
  .sidebar {
    width: min(84vw, 320px);
    z-index: 70;
    transform: translateX(-100%);
    box-shadow: var(--shadow);
  }

  .sidebar.is-open { transform: none; }

  .content {
    max-width: none;
    padding: 16px 16px 56px;
  }

  /*
   * 只让「☰ + 标题」这一条吸顶（position: fixed），按钮那一行（.controls）跟着页面正常滚动，
   * 不再整个工具条都吸顶——手机屏幕小，两行按钮常驻会占掉很大一块阅读区域
   */
  .topbar {
    position: static;
    margin-top: var(--topbar-h);
  }

  .topbar-left {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 60;
    min-height: var(--topbar-h);
    padding: 8px 16px;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    transition: transform 0.25s ease;
  }

  /* 往下滑时收起（滑出屏幕外），往上滑或接近顶部时用 app.js 的滚动监听移除这个类重新露出来 */
  .topbar-left.is-hidden {
    transform: translateY(-100%);
  }

  .item-actions .mark-btn {
    min-width: 36px;
    min-height: 36px;
    padding: 2px 8px;
    font-size: 14px;
  }

  /* 收藏星标按钮：128px 太宽容易误触，减半 → 64px；朗读按钮宽度跟收藏按钮保持一致；
     高度维持跟其它移动端按钮一样的 36px，不额外加高撑高卡片 */
  .item-actions .fav-btn,
  .item-actions .speak-btn {
    min-width: 64px;
    min-height: 36px;
    padding: 2px 8px;
    font-size: 14px;
  }
}

  <header class="topbar">

 * app.js — livenotes 前端交互
 *
 * 两层控制（见 _AI_READ/ARCHITECTURE.md §4）：
 *   ① 顶部 EN ⇄ CN 模式切换 → 决定默认隐藏哪一侧
 *   ② 每个 item 独立揭示按钮 → 隐藏侧从下方展开 / 收起
 * 顶部便捷键：全部展开 / 全部收起
 * 顶部主题下拉：切换配色主题（含「跟随系统」）
 * 状态（模式、主题、已展开项）存 localStorage
 */

(function () {
  'use strict';

  // ── 常量 ─────────────────────────────────
  const STORAGE_MODE_KEY = 'livenotes:mode';
  const STORAGE_EXPANDED_PREFIX = 'livenotes:expanded:';
  const STORAGE_THEME_KEY = 'livenotes:theme';
  const STORAGE_FAVORITES_KEY = 'livenotes:favorites';
  const STORAGE_SIDEBAR_COLLAPSED_KEY = 'livenotes:sidebar-collapsed';
  const STORAGE_SIDEBAR_WIDTH_KEY = 'livenotes:sidebar-width';
  const STORAGE_SYNC_TOKEN_KEY = 'livenotes:sync-token';
  const STORAGE_SYNC_GIST_ID_KEY = 'livenotes:sync-gist-id';
  const STORAGE_VOICE_KEY = 'livenotes:voice';

  // ── 收藏跨设备同步（GitHub Gist）──────────
  const GIST_API_BASE = 'https://api.github.com/gists';
  const GIST_FILENAME = 'livenotes-favorites.json';
  const SYNC_PUSH_DEBOUNCE_MS = 3000; // 收藏变化后等这么久没有新改动才推送，避免连续操作时每次都发请求
  const TOMBSTONE_RETENTION_MS = 30 * 24 * 60 * 60 * 1000; // 取消收藏/清空评分后的"墓碑"记录保留 30 天再物理清理
  const DEFAULT_MODE = 'en'; // 默认显示英文、隐藏中文
  const DEFAULT_THEME = 'kraft';
  const QUIZ_BATCH_SIZE = 10; // 测验模式一批显示多少条，内容多时避免一次性渲染几百条卡顿

  // 可选主题（id 与 style.css 的 :root[data-theme="id"] 一一对应）；light 为基础主题，不写 data-theme
  // swatch：收起态色块的背景，跟对应主题 style.css 里的 --color-bg 保持一致（改主题配色时这里也要同步改）
  // auto 没有固定单一颜色，用斜切黑白表示"跟随系统"
  const THEMES = [
    { id: 'light', label: '浅色', swatch: '#ffffff' },
    { id: 'sepia', label: '纸质 Sepia', swatch: '#f4ecd8' },
    { id: 'gruvbox-light', label: 'Gruvbox Light', swatch: '#fbf1c7' },
    { id: 'kraft', label: '牛皮纸 Kraft', swatch: '#e8dcc3' },
    { id: 'parchment', label: '米黄旧纸 Parchment', swatch: '#f7f3e9' },
    { id: 'solarized-light', label: 'Solarized Light', swatch: '#fdf6e3' },
    { id: 'graphite', label: '石墨深色', swatch: '#0f1115' },
    { id: 'solarized-dark', label: 'Solarized Dark', swatch: '#002b36' },
    { id: 'nord', label: 'Nord', swatch: '#2e3440' },
    { id: 'gruvbox', label: 'Gruvbox', swatch: '#282828' },
    { id: 'auto', label: '跟随系统', swatch: 'linear-gradient(135deg, #ffffff 50%, #0f1115 50%)' },
  ];

  // 各 section 类型的 en / cn 两侧字段（顺序即渲染顺序），与 config.js 的 SECTION_TYPES 对应
  const SIDE_FIELDS = {
    vocab: { en: ['word', 'pos', 'ipa'], cn: ['meaning', 'reading'] },
    phrases: { en: ['phrase'], cn: ['meaning'] },
    sentences: { en: ['text_en'], cn: ['text_cn'] },
  };

  // 常驻字段（不参与遮挡）：note / kind
  const RESIDENT_FIELD = { phrases: 'note', sentences: 'kind' };

  // 朗读按钮读哪个字段：词汇读单词本身，不读词性/音标；短语读整个短语；句型读整句英文
  const SPEAK_FIELD = { vocab: 'word', phrases: 'phrase', sentences: 'text_en' };

  // 「我的收藏」类型筛选下拉的选项文案，跟 SIDE_FIELDS 的 key 对应
  const SECTION_TYPE_LABELS = { vocab: '词汇', phrases: '短语', sentences: '句型' };

  // 「我的收藏」对号档位筛选下拉里，档位数字对应的中文数字（"1"→"一"，拼成"一档"）
  const MARK_LEVEL_CN = { 1: '一', 2: '二', 3: '三' };

  // ── 运行时状态 ───────────────────────────
  const state = {
    mode: DEFAULT_MODE,
    theme: DEFAULT_THEME,
    view: 'doc',       // 'doc'：正常文档视图；'favorites'：我的收藏视图；'quiz'：测验模式
    allExpanded: false, // 当前文档是否处于"全部展开"状态，决定切换按钮图标 ➕ / ➖
    quizPool: null,    // 测验模式当前这一轮打乱后的条目池，null 表示需要重新洗牌
    quizBatchOffset: 0, // 当前显示的是池子里第几批（每批 QUIZ_BATCH_SIZE 条）
    listeningPool: null,    // 听力模式当前这一轮的条目池，结构跟 quizPool 一样
    listeningBatchOffset: 0, // 当前显示的是听力池子里第几批
    currentSlug: null, // index 模式下当前查看的 NoteDoc
    data: null,        // { docs, tree } 或 { doc }

    // 「我的收藏」词条列表的筛选条件，只存内存不持久化，刷新页面重置；'all' 表示不筛选
    favoritesTypeFilter: 'all', // 'all' | 'vocab' | 'phrases' | 'sentences'
    favoritesMarkFilter: 'all', // 'all' | 'none' | 1 | 2 | 3

    syncPanelOpen: false, // "同步设置"面板是否展开，只存内存，刷新页面重置为收起

    // 收藏跨设备同步状态，只存内存不持久化
    sync: {
      status: 'unconfigured', // 'unconfigured' | 'idle' | 'syncing' | 'error'
      lastError: null,
      lastSyncedAt: null,
      pushTimer: null, // 推送 debounce 用的 setTimeout 句柄
    },
  };


  /**
   * 读取页面内嵌的 JSON 数据
   * @returns {object}
   */
  function loadData() {

    const node = document.querySelector('[data-role="livenotes-data"]');

    return JSON.parse(node.textContent);
  }

  /**
   * 转义 HTML 文本节点中的特殊字符
   * @param {*} value
   * @returns {string}
   */
  function escapeHtml(value) {

    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  /**
   * 转义 HTML 属性值（在 escapeHtml 基础上再处理引号）
   * @param {*} value
   * @returns {string}
   */
  function escapeAttr(value) {

    return escapeHtml(value).replace(/"/g, '&quot;');
  }

  /**
   * 当前正在查看的 NoteDoc 的 slug（单篇模式取内嵌 doc，index 模式取 state.currentSlug）
   * @returns {string|null}
   */
  function currentSlug() {

    return state.data.doc ? state.data.doc.slug : state.currentSlug;
  }

  /**
   * 当前页面所属的课程短标识（构建时嵌进页面数据，单篇/index 模式都有），
   * 没有就返回空串——用于收藏时记录"这条来自哪门课"
   * @returns {string}
   */
  function currentCourseLabel() {

    return state.data.courseLabel || '';
  }

  /**
   * 更新顶部标题文字（课程标识 + 当前章节，没有章节就只显示课程标识）和浏览器标签页
   * 标题；正文视图切换文档、进/出收藏 · 测验视图都要调用这个保持同步
   * @param {string} [chapter] - 当前章节，不传就只显示课程标识（收藏/测验视图没有
   *   "当前章节"这个概念）
   * @returns {void}
   */
  function updateAppTitle(chapter) {

    const courseLabel = currentCourseLabel();
    const text = courseLabel
      ? (chapter ? `${courseLabel} · ${chapter}` : courseLabel)
      : (chapter || 'livenotes');

    const titleEl = document.querySelector('.app-title');

    if (titleEl) {
      titleEl.textContent = text;
    }

    document.title = text;
  }

  /**
   * 收藏记录展示用的"课程 · "前缀；老记录没有 courseLabel 字段，返回空串
   * （跨课程收藏混在同一个列表里时，用来提示这条是哪门课的）
   * @param {object} fav
   * @returns {string}
   */
  function formatCoursePrefix(fav) {

    return fav.courseLabel ? `${escapeHtml(fav.courseLabel)} · ` : '';
  }

  /**
   * 收藏记录的"收藏于 xxx"展示文字，没有 favoritedAt（比如纯打了评分没收藏）就返回空串
   * @param {object} fav
   * @returns {string}
   */
  function formatFavoritedAt(fav) {

    if (!fav.favoritedAt) {

      return '';
    }

    const date = new Date(fav.favoritedAt);

    return `收藏于 ${date.toLocaleDateString('zh-CN', {
      year: 'numeric', month: '2-digit', day: '2-digit',
    })}`;
  }

  /**
   * 按 slug 取当前应渲染的 NoteDoc
   * @param {string|null} slug
   * @returns {object|null}
   */
  function findDoc(slug) {

    if (state.data.doc) {

      return state.data.doc;
    }

    return (state.data.docs || []).find((doc) => doc.slug === slug) || null;
  }

  /**
   * 摊平章节树成一条线性的文档顺序列表（按构建时扫描出来的章节 / 文件顺序），
   * "上一节 / 下一节"就是这条线上的前一个 / 后一个。单篇页面没有 tree 数据，返回空数组
   * @returns {{slug: string, title: string}[]}
   */
  function flattenDocOrder() {

    return (state.data.tree || []).flatMap((group) => group.files);
  }

  /**
   * 取某篇文档在摊平顺序里的前一篇 / 后一篇，取不到（在列表头尾，或单篇页面没有
   * tree 数据）返回 null
   * @param {string} slug
   * @param {1|-1} direction
   * @returns {{slug: string, title: string}|null}
   */
  function getAdjacentDoc(slug, direction) {

    const order = flattenDocOrder();
    const index = order.findIndex((entry) => entry.slug === slug);

    if (index === -1) {

      return null;
    }

    return order[index + direction] || null;
  }

  /**
   * 渲染单个"上一节"或"下一节"按钮；没有对应邻居（在列表头尾）时渲染成禁用态的 span
   * @param {{slug: string, title: string}|null} entry
   * @param {-1|1} direction
   * @returns {string}
   */
  function renderDocPagerButton(entry, direction) {

    const label = direction === -1 ? '◀ 上一节' : '下一节 ▶';
    const action = direction === -1 ? 'prev-doc' : 'next-doc';

    if (!entry) {

      return `<span class="btn doc-pager-btn doc-pager-btn--disabled" aria-disabled="true">${label}</span>`;
    }

    return `<button type="button" class="btn doc-pager-btn" data-action="${action}" data-slug="${escapeAttr(entry.slug)}" title="${escapeAttr(entry.title)}">${label}</button>`;
  }

  /**
   * 渲染"上一节 / 下一节"翻页条（两个按钮一起，用于内容区底部）；单篇页面
   * （没有 tree 数据）不渲染，返回空串
   * @param {string} slug - 当前文档 slug
   * @returns {string}
   */
  function renderDocPager(slug) {

    if (!state.data.tree) {

      return '';
    }

    return `<div class="doc-pager">${renderDocPagerButton(getAdjacentDoc(slug, -1), -1)}${renderDocPagerButton(getAdjacentDoc(slug, 1), 1)}</div>`;
  }

  /**
   * 从 localStorage 恢复模式，无则用默认
   * @returns {'en'|'cn'}
   */
  function loadMode() {

    try {

      return localStorage.getItem(STORAGE_MODE_KEY) || DEFAULT_MODE;
    } catch (err) {

      // localStorage 不可用（隐私模式 / 被禁用）时回退默认
      return DEFAULT_MODE;
    }
  }

  /**
   * 持久化当前模式
   * @param {'en'|'cn'} mode
   * @returns {void}
   */
  function saveMode(mode) {

    try {
      localStorage.setItem(STORAGE_MODE_KEY, mode);
    } catch (err) {
      // 静默降级：不影响页面使用
    }
  }

  /**
   * 从 localStorage 恢复主题 id，无 / 非法值时回退默认
   * @returns {string}
   */
  function loadTheme() {

    try {
      const saved = localStorage.getItem(STORAGE_THEME_KEY);

      return THEMES.some((theme) => theme.id === saved) ? saved : DEFAULT_THEME;
    } catch (err) {

      return DEFAULT_THEME;
    }
  }

  /**
   * 持久化主题 id
   * @param {string} themeId
   * @returns {void}
   */
  function saveTheme(themeId) {

    try {
      localStorage.setItem(STORAGE_THEME_KEY, themeId);
    } catch (err) {
      // 静默降级
    }
  }

  /**
   * 应用主题：light 移除 data-theme（用基础令牌），其余写到 <html data-theme>
   * @param {string} themeId
   * @returns {void}
   */
  function applyTheme(themeId) {

    state.theme = themeId;

    if (themeId === 'light') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', themeId);
    }

    updateThemeSwatch(themeId);
  }

  /**
   * 更新收起态色块的背景色，跟当前主题保持一致
   * @param {string} themeId
   * @returns {void}
   */
  function updateThemeSwatch(themeId) {

    const theme = THEMES.find((item) => item.id === themeId);

    if (!theme) {

      return;
    }

    // 顶部和内容区底部都有色块（同一个 data-role），两个都要同步
    document.querySelectorAll('[data-role="theme-swatch"]').forEach((swatchEl) => {
      swatchEl.style.background = theme.swatch;
    });
  }

  /**
   * 填充主题下拉框选项、同步当前值并绑定切换事件。
   * 顶部的 select 是静态标记、只需要初始化一次；内容区底部的 select 每次 renderContent /
   * renderQuizView 都会被 innerHTML 重新创建，所以每次渲染完都要再调一次这个函数——
   * 用 dataset 标记跳过已经初始化过的，避免重复绑定 change 监听
   * @returns {void}
   */
  function setupThemeSelect() {

    document.querySelectorAll('[data-role="theme-select"]').forEach((selectEl) => {

      if (selectEl.dataset.themeReady) {

        return;
      }

      selectEl.innerHTML = THEMES
        .map((theme) => `<option value="${theme.id}">${theme.label}</option>`)
        .join('');
      selectEl.value = state.theme;

      selectEl.addEventListener('change', () => {
        applyTheme(selectEl.value);
        saveTheme(selectEl.value);
      });

      selectEl.dataset.themeReady = 'true';
    });
  }

  /**
   * 读取某篇已展开的 item key 列表
   * @param {string} slug
   * @returns {Set<string>}
   */
  function loadExpanded(slug) {

    try {
      const raw = localStorage.getItem(STORAGE_EXPANDED_PREFIX + slug);
      const list = raw ? JSON.parse(raw) : [];

      return new Set(Array.isArray(list) ? list : []);
    } catch (err) {

      return new Set();
    }
  }

  /**
   * 持久化某篇已展开的 item key 列表
   * @param {string} slug
   * @param {Set<string>} keys
   * @returns {void}
   */
  function saveExpanded(slug, keys) {

    try {
      localStorage.setItem(STORAGE_EXPANDED_PREFIX + slug, JSON.stringify([...keys]));
    } catch (err) {
      // 静默降级
    }
  }

  /**
   * 读取整个收藏列表（doc + item 两级共用一个数组）
   * @returns {object[]}
   */
  function loadFavorites() {

    try {
      const raw = localStorage.getItem(STORAGE_FAVORITES_KEY);
      const list = raw ? JSON.parse(raw) : [];

      return Array.isArray(list) ? list : [];
    } catch (err) {

      return [];
    }
  }

  /**
   * 持久化整个收藏列表
   * @param {object[]} list
   * @returns {void}
   */
  function saveFavorites(list) {

    try {
      localStorage.setItem(STORAGE_FAVORITES_KEY, JSON.stringify(list));
    } catch (err) {
      // 静默降级
    }
  }

  /**
   * 读取本机保存的同步配置（Token / Gist ID），没有就返回空字符串
   * @returns {{ token: string, gistId: string }}
   */
  function loadSyncConfig() {

    try {

      return {
        token: localStorage.getItem(STORAGE_SYNC_TOKEN_KEY) || '',
        gistId: localStorage.getItem(STORAGE_SYNC_GIST_ID_KEY) || '',
      };
    } catch (err) {

      return { token: '', gistId: '' };
    }
  }

  /**
   * 保存同步配置到本机（每台设备各自存一份，不参与 Gist 同步内容本身）
   * @param {{ token: string, gistId: string }} config
   * @returns {void}
   */
  function saveSyncConfig(config) {

    try {
      localStorage.setItem(STORAGE_SYNC_TOKEN_KEY, config.token || '');
      localStorage.setItem(STORAGE_SYNC_GIST_ID_KEY, config.gistId || '');
    } catch (err) {
      // 静默降级
    }
  }

  /**
   * 清空本机的同步配置（只影响这台设备，不影响 Gist 本身，也不影响其它设备）
   * @returns {void}
   */
  function clearSyncConfig() {

    try {
      localStorage.removeItem(STORAGE_SYNC_TOKEN_KEY);
      localStorage.removeItem(STORAGE_SYNC_GIST_ID_KEY);
    } catch (err) {
      // 静默降级
    }
  }

  /**
   * 判断这台设备是否已经配置好同步（Token + Gist ID 都有才算）
   * @returns {boolean}
   */
  function isSyncConfigured() {

    const { token, gistId } = loadSyncConfig();

    return Boolean(token && gistId);
  }

  /**
   * 判断某条收藏记录是不是"空"的（取消收藏、且 item 没有评分）——
   * 空记录只是为了同步时能覆盖别的设备上的旧数据才保留，过一段时间可以物理清理掉
   * @param {object} fav
   * @returns {boolean}
   */
  function isFavoriteRecordEmpty(fav) {

    if (fav.kind === 'doc') {

      return !fav.favorited;
    }

    return !fav.favorited && !fav.mark;
  }

  /**
   * 清理"已经空了很久"的墓碑记录，避免收藏列表随时间无限增长。保留窗口留够时间
   * （TOMBSTONE_RETENTION_MS），确保正常同步节奏内的设备都已经拿到过这条删除
   * @param {object[]} list
   * @returns {object[]}
   */
  function gcStaleFavorites(list) {

    const cutoff = Date.now() - TOMBSTONE_RETENTION_MS;

    return list.filter((fav) => !isFavoriteRecordEmpty(fav) || favoriteUpdatedAtMs(fav) > cutoff);
  }

  /**
   * 判断合并结果是否跟远端数据完全一致——一致就说明本地没有任何远端还没有的更新，
   * 拉取之后不需要再推一次
   * @param {object[]} merged
   * @param {object[]} remote
   * @returns {boolean}
   */
  function remoteAlreadyHasAll(merged, remote) {

    if (merged.length !== remote.length) {

      return false;
    }

    const remoteMap = new Map(remote.map((fav) => [`${fav.kind}:${fav.id}`, fav]));

    return merged.every((fav) => {
      const remoteFav = remoteMap.get(`${fav.kind}:${fav.id}`);

      return remoteFav && favoriteUpdatedAtMs(remoteFav) === favoriteUpdatedAtMs(fav);
    });
  }

  /**
   * 发一次 GitHub Gist API 请求，统一处理鉴权头和错误信息
   * @param {string} method
   * @param {string} path - 拼在 GIST_API_BASE 后面，比如 `/<gistId>`，创建时传空串
   * @param {string} token
   * @param {object} [body]
   * @returns {Promise<object|null>}
   */
  async function gistApiRequest(method, path, token, body) {

    const headers = {
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
    };

    if (token) {
      headers.Authorization = `token ${token}`;
    }

    if (body !== undefined) {
      headers['Content-Type'] = 'application/json';
    }

    const res = await fetch(`${GIST_API_BASE}${path}`, {
      method,
      headers,
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });

    if (!res.ok) {
      const message = res.status === 401 || res.status === 403
        ? 'Token 无效或权限不足，请重新设置同步'
        : res.status === 404
          ? 'Gist 不存在，请检查 Gist ID'
          : `GitHub API 请求失败（状态码 ${res.status}）`;
      const err = new Error(message);

      err.status = res.status;

      throw err;
    }

    return res.status === 204 ? null : res.json();
  }

  /**
   * 创建一个新的私有 Gist 当同步后端，返回新建的 Gist ID
   * （只有第一台设备需要建，建完把 ID 复制到其它设备，其它设备不要再选自动创建）
   * @param {string} token
   * @returns {Promise<string>}
   */
  async function createGist(token) {

    const gist = await gistApiRequest('POST', '', token, {
      description: 'livenotes 收藏数据（跨设备自动同步用，请勿手动编辑）',
      public: false,
      files: {
        [GIST_FILENAME]: {
          content: JSON.stringify({ updatedAt: new Date().toISOString(), records: [] }, null, 2),
        },
      },
    });

    return gist.id;
  }

  /**
   * 从 Gist 读取收藏记录数组
   * @param {string} gistId
   * @param {string} token
   * @returns {Promise<object[]>}
   */
  async function fetchGistRecords(gistId, token) {

    const gist = await gistApiRequest('GET', `/${gistId}`, token);
    const file = gist.files && gist.files[GIST_FILENAME];

    if (!file) {

      return [];
    }

    let text = file.content || '';

    // 内容超过 1MB 时 GitHub 会截断 content 字段，要另外用 raw_url 拉完整内容；
    // 收藏数据体量很小，正常用不到，这里只是防呆
    if (file.truncated && file.raw_url) {
      const rawRes = await fetch(file.raw_url);

      text = await rawRes.text();
    }

    try {
      const parsed = JSON.parse(text);

      return Array.isArray(parsed.records) ? parsed.records : [];
    } catch (err) {

      return [];
    }
  }

  /**
   * 把收藏记录数组写回 Gist
   * @param {string} gistId
   * @param {string} token
   * @param {object[]} records
   * @returns {Promise<void>}
   */
  async function updateGistRecords(gistId, token, records) {

    await gistApiRequest('PATCH', `/${gistId}`, token, {
      files: {
        [GIST_FILENAME]: {
          content: JSON.stringify({ updatedAt: new Date().toISOString(), records }, null, 2),
        },
      },
    });
  }

  /**
   * 同步状态文字 + 图标，工具条和设置面板共用
   * @returns {string}
   */
  function formatSyncStatusText() {

    const { status, lastError, lastSyncedAt } = state.sync;

    if (status === 'syncing') {

      return '⟳ 同步中…';
    }

    if (status === 'error') {

      return `⚠ 同步失败：${lastError || '未知错误'}`;
    }

    if (status === 'idle') {
      const time = lastSyncedAt
        ? new Date(lastSyncedAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
        : '';

      return time ? `✓ 已同步（${time}）` : '✓ 已同步';
    }

    return '未设置跨设备同步';
  }

  /**
   * 收藏视图里如果正显示着同步状态徽标，原地刷新文字/颜色，不用整个视图重渲染
   * （更新状态经常发生在异步请求中途，这时候不适合触发整页重渲染打断用户）
   * @returns {void}
   */
  function refreshSyncStatusBadge() {

    const badgeEl = document.querySelector('[data-role="sync-status"]');

    if (!badgeEl) {

      return;
    }

    badgeEl.textContent = formatSyncStatusText();
    badgeEl.className = `sync-status sync-status--${state.sync.status}`;
  }

  /**
   * 更新同步状态（写进内存 state，并顺带刷新页面上的状态徽标）
   * @param {'unconfigured'|'idle'|'syncing'|'error'} status
   * @param {Error} [err]
   * @returns {void}
   */
  function updateSyncStatus(status, err) {

    state.sync.status = status;
    state.sync.lastError = err ? err.message : null;

    if (status === 'idle') {
      state.sync.lastSyncedAt = new Date().toISOString();
    }

    if (err) {
      console.warn('[livenotes sync]', err);
    }

    refreshSyncStatusBadge();
  }

  /**
   * 拉取合并后刷新当前正在看的视图（收藏 / 测验 / 正文），让星标 / 评分状态跟合并结果同步。
   * 侧边栏的文档星标只在 init() 渲染一次，这里暂不刷新——要看到别的设备新收藏的整篇文档，
   * 目前还需要刷新页面，先记录成已知的后续可以补的点
   * @returns {void}
   */
  function refreshAfterSync() {

    if (state.view === 'favorites') {
      renderFavoritesView();

      return;
    }

    if (state.view === 'quiz') {
      renderQuizView();

      return;
    }

    const slug = currentSlug();
    const doc = findDoc(slug);

    if (doc) {
      renderContent(doc);
    }
  }

  /**
   * 从 Gist 拉取最新数据，跟本地合并；如果合并结果里有本地独有、远端还没有的更新，
   * 合并后立刻推一次回去（双向同步的核心：既拉又可能补推）
   * @returns {Promise<void>}
   */
  async function pullFavoritesFromGist() {

    const { token, gistId } = loadSyncConfig();

    if (!token || !gistId) {

      return;
    }

    updateSyncStatus('syncing');

    try {
      const remote = await fetchGistRecords(gistId, token);
      const local = loadFavorites();
      const merged = mergeFavoriteLists(remote, local);

      saveFavorites(merged);
      refreshAfterSync();

      if (!remoteAlreadyHasAll(merged, remote)) {
        await updateGistRecords(gistId, token, gcStaleFavorites(merged));
      }

      updateSyncStatus('idle');
    } catch (err) {
      updateSyncStatus('error', err);
    }
  }

  /**
   * 把本地当前收藏数据（清理过期墓碑后）推送到 Gist
   * @returns {Promise<void>}
   */
  async function pushFavoritesToGist() {

    const { token, gistId } = loadSyncConfig();

    if (!token || !gistId) {

      return;
    }

    updateSyncStatus('syncing');

    try {
      const cleaned = gcStaleFavorites(loadFavorites());

      saveFavorites(cleaned);
      await updateGistRecords(gistId, token, cleaned);
      updateSyncStatus('idle');
    } catch (err) {
      updateSyncStatus('error', err);
    }
  }

  /**
   * 推送 debounce：收藏变化后等 SYNC_PUSH_DEBOUNCE_MS 无新改动再真正推送，
   * 避免连续点收藏/评分时每次操作都发一次请求
   * @returns {void}
   */
  function schedulePushFavorites() {

    if (!isSyncConfigured()) {

      return;
    }

    if (state.sync.pushTimer) {
      clearTimeout(state.sync.pushTimer);
    }

    state.sync.pushTimer = setTimeout(() => {
      state.sync.pushTimer = null;
      pushFavoritesToGist();
    }, SYNC_PUSH_DEBOUNCE_MS);
  }

  /**
   * 本地写入收藏 + 触发一次 debounce 推送，所有用户产生的收藏改动都要走这个函数
   * （从 Gist 拉取合并后的写入不走这个，直接调 saveFavorites，避免拉取触发的写入又排一次推送）
   * @param {object[]} list
   * @returns {void}
   */
  function persistFavorites(list) {

    saveFavorites(list);
    schedulePushFavorites();
  }

  /**
   * 页面加载、以及页面从后台切回前台时自动拉取一次远端数据；只有配置好同步才会真正发请求
   * @returns {void}
   */
  function setupFavoritesSync() {

    if (isSyncConfigured()) {
      pullFavoritesFromGist();
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && isSyncConfigured()) {
        pullFavoritesFromGist();
      }
    });
  }

  /**
   * "保存"按钮：读设置面板里的 Token / Gist ID 输入框，Gist ID 留空则自动创建一个新 Gist，
   * 保存配置后立刻拉取一次做首次同步
   * @returns {Promise<void>}
   */
  async function handleSaveSyncConfig() {

    const tokenInput = document.querySelector('[data-role="sync-token-input"]');
    const gistIdInput = document.querySelector('[data-role="sync-gist-id-input"]');

    if (!tokenInput || !gistIdInput) {

      return;
    }

    const token = tokenInput.value.trim();
    let gistId = gistIdInput.value.trim();

    if (!token) {
      window.alert('请先填写 Token');

      return;
    }

    updateSyncStatus('syncing');

    try {
      if (!gistId) {
        gistId = await createGist(token);
        window.alert(`已创建新 Gist，ID 是：\n${gistId}\n\n请把这个 ID 复制到其它设备的同步设置里，其它设备不要再留空创建。`);
      }

      saveSyncConfig({ token, gistId });
      await pullFavoritesFromGist();
    } catch (err) {
      updateSyncStatus('error', err);
      window.alert(`同步设置失败：${err.message}`);
    }

    renderFavoritesView();
  }

  /**
   * "退出同步"按钮：只清空这台设备保存的 Token/Gist ID，不影响 Gist 本身和其它设备
   * @returns {void}
   */
  function handleClearSyncConfig() {

    if (!window.confirm('确定要退出同步吗？只会清空这台设备保存的 Token/Gist ID，不会删除 Gist 或影响其它设备。')) {

      return;
    }

    clearSyncConfig();
    updateSyncStatus('unconfigured');
    renderFavoritesView();
  }

  /**
   * "立即同步"按钮：手动触发一次完整同步，不用等自动拉取/推送的时机
   * （`pullFavoritesFromGist` 本身就是双向的：拉远端合并本地，本地有远端没有的更新会自动
   * 补推回去，所以点这一个按钮就够了，不需要分开的"上传"按钮）
   * @returns {Promise<void>}
   */
  async function handleSyncNow() {

    if (!isSyncConfigured()) {
      window.alert('请先在"同步设置"里填好 Token 和 Gist ID');

      return;
    }

    // 有正在等待的 debounce 推送就取消掉，马上同步这一次已经把它覆盖了，不用重复推
    if (state.sync.pushTimer) {
      clearTimeout(state.sync.pushTimer);
      state.sync.pushTimer = null;
    }

    await pullFavoritesFromGist();
    renderFavoritesView();
  }

  /**
   * 在收藏列表里查找某条记录的下标
   * @param {object[]} list
   * @param {'doc'|'item'} kind
   * @param {string} id
   * @returns {number} 未找到返回 -1
   */
  function favoriteIndex(list, kind, id) {

    return list.findIndex((fav) => fav.kind === kind && fav.id === id);
  }

  /**
   * 判断某篇文档是否已整篇收藏
   * @param {string} docSlug
   * @returns {boolean}
   */
  function isDocFavorited(docSlug) {

    const list = loadFavorites();
    const index = favoriteIndex(list, 'doc', docSlug);

    return index >= 0 && Boolean(list[index].favorited);
  }

  /**
   * 取某条 item 的标注记录（收藏 + 评分共用同一条记录），不存在返回 null
   * @param {string} itemId - `${docSlug}::${sectionType}:${itemIndex}`
   * @returns {object|null}
   */
  function findItemRecord(itemId) {

    return loadFavorites().find((fav) => fav.kind === 'item' && fav.id === itemId) || null;
  }

  /**
   * 判断某条 item 是否已收藏
   * @param {string} itemId - `${docSlug}::${sectionType}:${itemIndex}`
   * @returns {boolean}
   */
  function isItemFavorited(itemId) {

    const record = findItemRecord(itemId);

    return Boolean(record && record.favorited);
  }

  /**
   * 取某条 item 的测验评分（1~3），没评过返回 null
   * @param {string} itemId - `${docSlug}::${sectionType}:${itemIndex}`
   * @returns {number|null}
   */
  function getItemMark(itemId) {

    const record = findItemRecord(itemId);

    return record ? record.mark : null;
  }

  /**
   * 按 slug 找到或新建一条整篇文档收藏记录，返回 { list, record }
   * 新建时 favorited 是 false，由调用方接着填（同步用：不物理删除记录，见 toggleFavoriteDoc）
   * @param {object} doc - NoteDoc
   * @returns {{ list: object[], record: object }}
   */
  function ensureDocRecord(doc) {

    const list = loadFavorites();
    const index = favoriteIndex(list, 'doc', doc.slug);

    if (index >= 0) {

      return { list, record: list[index] };
    }

    const record = {
      kind: 'doc',
      id: doc.slug,
      docSlug: doc.slug,
      docTitle: doc.title || doc.slug,
      chapter: doc.chapter,
      courseLabel: currentCourseLabel(),
      favorited: false,
      favoritedAt: null,
      addedAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
    };

    list.push(record);

    return { list, record };
  }

  /**
   * 切换整篇文档的收藏状态。取消收藏不物理删除记录，只是把 favorited 置为 false
   * （跨设备同步需要靠这条"取消"记录本身去覆盖别的设备上的旧数据，见 mergeFavoriteLists）
   * @param {object} doc - NoteDoc
   * @returns {void}
   */
  function toggleFavoriteDoc(doc) {

    const { list, record } = ensureDocRecord(doc);
    const now = new Date().toISOString();

    record.favorited = !record.favorited;
    record.favoritedAt = record.favorited ? now : null;
    record.updatedAt = now;
    record.docTitle = doc.title || doc.slug;
    record.chapter = doc.chapter;
    record.courseLabel = currentCourseLabel();

    persistFavorites(list);
  }

  /**
   * 组装 toggleFavoriteItem / setItemMark 需要的 context
   * @param {object} doc - NoteDoc
   * @param {object} section - Section
   * @param {number} itemIndex
   * @returns {object}
   */
  function buildItemContext(doc, section, itemIndex) {

    return {
      docSlug: doc.slug,
      docTitle: doc.title || doc.slug,
      chapter: doc.chapter,
      sectionType: section.type,
      sectionHeading: section.heading,
      itemIndex,
      item: section.items[itemIndex],
    };
  }

  /**
   * 按 context 找到或新建一条 item 标注记录（收藏 / 评分共用），返回 { list, record }
   * 新建时 favorited/mark 都是空，由调用方接着填
   * @param {object} context - { docSlug, docTitle, chapter, sectionType, sectionHeading, itemIndex, item }
   * @returns {{ list: object[], record: object }}
   */
  function ensureItemRecord(context) {

    const id = `${context.docSlug}::${context.sectionType}:${context.itemIndex}`;
    const list = loadFavorites();
    const index = favoriteIndex(list, 'item', id);

    if (index >= 0) {

      return { list, record: list[index] };
    }

    const record = {
      kind: 'item',
      id,
      docSlug: context.docSlug,
      docTitle: context.docTitle,
      chapter: context.chapter,
      courseLabel: currentCourseLabel(),
      sectionType: context.sectionType,
      sectionHeading: context.sectionHeading,
      itemIndex: context.itemIndex,
      snapshot: {
        en: context.item.en,
        cn: context.item.cn,
        note: context.item.note,
        kind: context.item.kind,
      },
      favorited: false,
      favoritedAt: null,
      mark: null,
      markedAt: null,
      updatedAt: new Date().toISOString(),
    };

    list.push(record);

    return { list, record };
  }

  /**
   * 切换单条 item 的收藏状态（收藏 / 评分共用同一条记录，见 ensureItemRecord）。
   * 取消收藏不物理删除记录，只是把 favorited 置为 false（跨设备同步需要靠这条"取消"
   * 记录本身去覆盖别的设备上的旧数据，见 mergeFavoriteLists；真正的物理清理见 gcStaleFavorites）
   * @param {object} context - { docSlug, docTitle, chapter, sectionType, sectionHeading, itemIndex, item }
   * @returns {void}
   */
  function toggleFavoriteItem(context) {

    const { list, record } = ensureItemRecord(context);
    const now = new Date().toISOString();

    record.favorited = !record.favorited;
    record.favoritedAt = record.favorited ? now : null;
    record.updatedAt = now;

    persistFavorites(list);
  }

  /**
   * 间隔重复：根据这次评分算出下次复习间隔（天）。1 档＝不熟悉，明天再看；
   * 2/3 档在上一次间隔基础上乘 1.5 / 2.5 倍增长，第一次评分（没有上次间隔）给个
   * 固定起始值。这个函数只管算天数，不碰任何存储，方便以后单独测试/调参
   * @param {number} previousInterval - 上一次的间隔天数，从没评过是 0
   * @param {1|2|3} rating
   * @returns {number} 天数
   */
  function computeNextSrsInterval(previousInterval, rating) {

    if (rating === 1) {

      return 1;
    }

    if (!previousInterval) {

      return rating === 2 ? 2 : 4;
    }

    const multiplier = rating === 2 ? 1.5 : 2.5;

    return Math.max(1, Math.round(previousInterval * multiplier));
  }

  /**
   * 设置单条 item 的测验评分：再点一次当前档位会清空评分。
   * 顺带维护间隔重复的调度字段（srsInterval / srsDueAt）：评分时更新，清空评分时也
   * 一起清空（退回"随时都该复习"的状态），供 sortPoolBySrsPriority 用
   * @param {object} context - { docSlug, docTitle, chapter, sectionType, sectionHeading, itemIndex, item }
   * @param {1|2|3} level
   * @returns {void}
   */
  function setItemMark(context, level) {

    const { list, record } = ensureItemRecord(context);
    const now = new Date().toISOString();

    record.mark = record.mark === level ? null : level;
    record.markedAt = record.mark ? now : null;

    if (record.mark !== null) {
      record.srsInterval = computeNextSrsInterval(record.srsInterval || 0, record.mark);
      record.srsDueAt = new Date(Date.now() + record.srsInterval * 24 * 60 * 60 * 1000).toISOString();
    } else {
      record.srsInterval = null;
      record.srsDueAt = null;
    }

    // 设置了评分（不是取消）就顺带自动收藏，方便测验时顺手标记；取消评分不会跟着取消收藏，
    // 避免误清掉本来手动收藏的记录
    if (record.mark !== null && !record.favorited) {
      record.favorited = true;
      record.favoritedAt = now;
    }

    record.updatedAt = now;

    persistFavorites(list);
  }

  /**
   * 「我的收藏」视图里取消收藏（doc / item 用同一套逻辑）：只清掉 favorited，
   * 不物理删除记录——item 如果还有评分（mark）会继续显示评分；doc/item 的"取消"记录本身
   * 需要保留下来才能在跨设备同步时覆盖别的设备上的旧数据（见 mergeFavoriteLists）
   * @param {'doc'|'item'} kind
   * @param {string} id
   * @returns {void}
   */
  function removeFavorite(kind, id) {

    const list = loadFavorites();
    const index = favoriteIndex(list, kind, id);

    if (index === -1) {

      return;
    }

    const record = list[index];

    record.favorited = false;
    record.favoritedAt = null;
    record.updatedAt = new Date().toISOString();

    persistFavorites(list);
    renderFavoritesView();
  }

  /**
   * 判断当前页面能否直接跳转到目标文档
   * （单篇页面只内嵌自己那一篇，只有目标就是自己时才能跳）
   * @param {string} docSlug
   * @returns {boolean}
   */
  function canJumpToDoc(docSlug) {

    if (state.data.doc) {

      return state.data.doc.slug === docSlug;
    }

    return (state.data.docs || []).some((doc) => doc.slug === docSlug);
  }

  /**
   * 把收藏列表导出为 json 文件并触发浏览器下载
   * @returns {void}
   */
  function exportFavorites() {

    const json = JSON.stringify(loadFavorites(), null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const dateStr = new Date().toISOString().slice(0, 10);

    const linkEl = document.createElement('a');
    linkEl.href = url;
    linkEl.download = `livenotes-favorites-${dateStr}.json`;
    document.body.appendChild(linkEl);
    linkEl.click();
    document.body.removeChild(linkEl);

    URL.revokeObjectURL(url);
  }

  /**
   * 把当前同步配置（Token + Gist ID）导出为 json 文件下载，方便在别的设备/别的网址上
   * 一次性导入，不用手动复制粘贴两个输入框
   * @returns {void}
   */
  function exportSyncConfig() {

    const config = loadSyncConfig();

    if (!config.token && !config.gistId) {
      window.alert('还没有设置同步，没有可导出的配置');

      return;
    }

    const json = JSON.stringify(config, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);

    const linkEl = document.createElement('a');
    linkEl.href = url;
    linkEl.download = 'livenotes-sync-config.json';
    document.body.appendChild(linkEl);
    linkEl.click();
    document.body.removeChild(linkEl);

    URL.revokeObjectURL(url);
    window.alert('已导出，注意：这个文件里是明文 Token，导入完所有设备后建议删掉，不要一直留在下载目录里');
  }

  /**
   * 取一条收藏记录的"最后修改时间"，没有 updatedAt 的旧数据退化用其它时间字段兜底，
   * 都没有就当作最旧（合并时优先保留有明确时间戳的一方）
   * @param {object} fav
   * @returns {number} 毫秒时间戳
   */
  function favoriteUpdatedAtMs(fav) {

    const raw = fav.updatedAt || fav.markedAt || fav.favoritedAt || fav.addedAt || null;

    return raw ? new Date(raw).getTime() : 0;
  }

  /**
   * 合并两份收藏列表：按 kind+id 分组，每组只保留 updatedAt 较新的一条（record 级
   * last-write-wins）。同时用于 Gist 跨设备同步的拉取合并、和手动导入 json 的合并——
   * 取消收藏/清空评分也是一条"更新"（favorited: false），新的一方照样会覆盖旧的一方，
   * 不会被对面设备的旧数据复活（见 toggleFavoriteItem/toggleFavoriteDoc/removeFavorite
   * 不物理删除记录的注释）
   * @param {object[]} a
   * @param {object[]} b
   * @returns {object[]}
   */
  function mergeFavoriteLists(a, b) {

    const merged = new Map();

    [...a, ...b].forEach((fav) => {

      if (!fav || !fav.kind || !fav.id) {

        return;
      }

      // 兼容收藏 / 评分合并存储之前导出的旧格式：item 记录存在即代表已收藏
      if (fav.kind === 'item' && fav.favorited === undefined) {
        fav.favorited = true;
        fav.favoritedAt = fav.favoritedAt ?? fav.addedAt ?? null;
        fav.mark = fav.mark ?? null;
        fav.markedAt = fav.markedAt ?? null;
      }

      const key = `${fav.kind}:${fav.id}`;
      const existing = merged.get(key);

      if (!existing || favoriteUpdatedAtMs(fav) >= favoriteUpdatedAtMs(existing)) {
        merged.set(key, fav);
      }
    });

    return Array.from(merged.values());
  }

  /**
   * 合并导入的收藏 json：跟本地数据按 mergeFavoriteLists 的规则合并（record 级
   * last-write-wins），不是简单的"已存在就跳过"
   * @param {object[]} incoming
   * @returns {void}
   */
  function mergeFavorites(incoming) {

    const merged = mergeFavoriteLists(loadFavorites(), incoming);

    persistFavorites(merged);
    renderFavoritesView();
    window.alert(`导入完成，当前共 ${merged.length} 条收藏记录`);
  }

  /**
   * 绑定导入收藏用的隐藏文件选择框
   * @returns {void}
   */
  function setupFavoritesImport() {

    const inputEl = document.querySelector('[data-role="favorites-import-input"]');

    if (!inputEl) {

      return;
    }

    inputEl.addEventListener('change', () => {

      const file = inputEl.files && inputEl.files[0];

      if (!file) {

        return;
      }

      const reader = new FileReader();

      reader.onload = () => {

        try {
          const incoming = JSON.parse(reader.result);

          mergeFavorites(Array.isArray(incoming) ? incoming : []);
        } catch (err) {
          window.alert('导入失败：文件内容不是有效的收藏 json');
        }

        inputEl.value = '';
      };

      reader.readAsText(file);
    });
  }

  /**
   * 绑定导入同步配置用的隐藏文件选择框：读到 { token, gistId } 后直接保存并触发一次同步，
   * 不用再手动粘贴两个输入框
   * @returns {void}
   */
  function setupSyncConfigImport() {

    const inputEl = document.querySelector('[data-role="sync-config-import-input"]');

    if (!inputEl) {

      return;
    }

    inputEl.addEventListener('change', () => {

      const file = inputEl.files && inputEl.files[0];

      if (!file) {

        return;
      }

      const reader = new FileReader();

      reader.onload = async () => {

        try {
          const config = JSON.parse(reader.result);

          if (!config || !config.token) {
            window.alert('导入失败：文件内容不是有效的同步配置');
          } else {
            saveSyncConfig({ token: config.token, gistId: config.gistId || '' });
            await pullFavoritesFromGist();
            renderFavoritesView();
          }
        } catch (err) {
          window.alert('导入失败：文件内容不是有效的同步配置');
        }

        inputEl.value = '';
      };

      reader.readAsText(file);
    });
  }

  /**
   * 渲染某一侧（en 或 cn）的单元格 HTML
   * @param {string} type - section 类型
   * @param {'en'|'cn'} which - 哪一侧
   * @param {object} side - item[which] 对象
   * @returns {string}
   */
  function formatSide(type, which, side) {

    const fields = SIDE_FIELDS[type][which];

    return fields
      .map((field) => `<span class="cell cell--${field}">${escapeHtml(side[field])}</span>`)
      .join('');

  /**
   * 渲染朗读按钮，放在操作按钮区（收藏星标前面），不跟着 EN⇄CN 模式走——不管当前
   * 显示的是哪一侧，点了永远读这张卡片的英文内容；取不到可读文字就不渲染
   * @param {string} type - section 类型
   * @param {object} enSide - item.en 对象（不是"当前显示侧"，固定就是 en）
   * @returns {string}
   */
  function renderSpeakButton(type, enSide) {

    const text = (enSide && enSide[SPEAK_FIELD[type]]) || '';

    if (!text) {

      return '';
    }

    return `<button type="button" class="speak-btn" data-action="speak" data-text="${escapeAttr(text)}" aria-label="朗读">▶</button>`;

  /**
   * 当前设备 / 浏览器可用的英文语音列表（原始对象，未排序）
   * @returns {SpeechSynthesisVoice[]}
   */
  function getEnglishVoices() {

    if (typeof window.speechSynthesis === 'undefined') {

      return [];
    }

    return window.speechSynthesis.getVoices().filter((voice) => voice.lang.startsWith('en'));
  }

  /**
   * 从 localStorage 读用户手动选过的语音 voiceURI，没选过就是空串
   * @returns {string}
   */
  function loadVoicePreference() {

    try {

      return localStorage.getItem(STORAGE_VOICE_KEY) || '';
    } catch (err) {

      return '';
    }
  }

  /**
   * 持久化用户选的语音 voiceURI
   * @param {string} voiceURI
   * @returns {void}
   */
  function saveVoicePreference(voiceURI) {

    try {
      localStorage.setItem(STORAGE_VOICE_KEY, voiceURI || '');
    } catch (err) {
      // 静默降级
    }
  }

  /**
   * 挑一个用来朗读的英文语音：用户在下拉框里手动选过就用那个；没选过就自动挑一个
   * "听起来更自然"的（名字里带 Natural / Neural / Enhanced / Premium 这类标注，
   * 是现代系统内置的神经网络合成语音，比老式机械音自然很多），都没有就退回第一个
   * 英文语音；一个英文语音都没有就返回 null（用浏览器的默认语音兜底）
   * @returns {SpeechSynthesisVoice|null}
   */
  function pickBestEnglishVoice() {

    const voices = getEnglishVoices();

    if (voices.length === 0) {

      return null;
    }

    const savedURI = loadVoicePreference();
    const savedVoice = savedURI && voices.find((voice) => voice.voiceURI === savedURI);

    if (savedVoice) {

      return savedVoice;
    }

    const naturalVoice = voices.find((voice) => /natural|neural|enhanced|premium/i.test(voice.name));

    return naturalVoice || voices[0];
  }

  /**
   * 填充"朗读语音"下拉框：语音列表在部分浏览器（尤其 Chrome）里是异步加载的，
   * 先尝试直接填一次，voiceschanged 事件触发时再补填一次；没有可用英文语音就
   * 保持隐藏（page.html 里默认就是 hidden），不展示一个没用的空下拉框
   * @returns {void}
   */
  function setupVoiceSelect() {

    if (typeof window.speechSynthesis === 'undefined') {

      return;
    }

    const selectEl = document.querySelector('[data-role="voice-select"]');

    if (!selectEl) {

      return;
    }

    function populate() {

      const voices = getEnglishVoices();

      if (voices.length === 0) {

        return;
      }

      const currentVoice = pickBestEnglishVoice();

      selectEl.innerHTML = voices
        .map((voice) => `<option value="${escapeAttr(voice.voiceURI)}">${escapeHtml(voice.name)}（${escapeHtml(voice.lang)}）</option>`)
        .join('');
      selectEl.value = currentVoice ? currentVoice.voiceURI : voices[0].voiceURI;
      selectEl.hidden = false;
    }

    populate();
    window.speechSynthesis.addEventListener('voiceschanged', populate);

    selectEl.addEventListener('change', () => {
      saveVoicePreference(selectEl.value);
    });
  }

  /**
   * 朗读前清理掉不适合语音合成引擎念的符号：连续下划线（填空线，比如 "I ___ to
   * school"）会被逐个读成"下划线"，省略号会被读成"点点点"，都会念好几遍很难听——
   * 下划线直接去掉（留一个空格），省略号换成逗号制造停顿感。只影响朗读，页面上
   * 显示的原文本不受影响（这个函数只在 speakText 内部用）
   * @param {string} text
   * @returns {string}
   */
  function sanitizeSpeechText(text) {

    return text
      .replace(/_{2,}/g, ' ')
      .replace(/\.{2,}/g, ',')
      .replace(/\s+/g, ' ')
      .trim();
  }

  /**
   * 用浏览器自带的语音合成朗读一段英文；不支持的浏览器（极少见）静默跳过
   * @param {string} text
   * @returns {void}
   */
  function speakText(text) {

    if (!text || typeof window.speechSynthesis === 'undefined') {

      return;
    }

    // 先打断上一次还没念完的朗读，避免连续点击时声音叠在一起
    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(sanitizeSpeechText(text));
    const voice = pickBestEnglishVoice();

    if (voice) {
      utterance.voice = voice;
      utterance.lang = voice.lang;
    } else {
      utterance.lang = 'en-US';
    }

    window.speechSynthesis.speak(utterance);
  }

  /**
   * 渲染常驻信息（note / kind）；无内容时返回空串
   * @param {object} section
   * @param {object} item
   * @returns {string}

  function formatResident(section, item) {

    const field = RESIDENT_FIELD[section.type];

  /**
   * 渲染侧边栏章节树（仅 index 模式）
   * @param {{ chapter: string, files: object[] }[]} tree
   * @returns {void}
   */
  function renderSidebar(tree) {

    const sidebarEl = document.querySelector('[data-role="sidebar"]');
    const favorites = loadFavorites();

    const groupsHtml = tree.map((group, groupIndex) => {

      const linksHtml = group.files.map((file) => {

        const docRecord = favorites.find((fav) => fav.kind === 'doc' && fav.id === file.slug);
        const favorited = Boolean(docRecord && docRecord.favorited);

        return `
        <li class="doc-item">
          <button type="button" class="doc-link" data-slug="${escapeAttr(file.slug)}">${escapeHtml(file.title || file.slug)}</button>
          <button type="button" class="fav-btn${favorited ? ' is-favorited' : ''}" data-action="toggle-favorite-doc" data-slug="${escapeAttr(file.slug)}" aria-label="收藏整篇">${favorited ? '★' : '☆'}</button>
        </li>`;
      }).join('');

      // 默认展开第一个章节
      return `
        <details class="chapter"${groupIndex === 0 ? ' open' : ''}>
          <summary class="chapter-title">${escapeHtml(group.chapter)}</summary>
          <ul class="doc-list">${linksHtml}</ul>
        </details>`;
    }).join('');

    // 构建期传了 homeLink 才显示"返回全部课程"，本地单独跑一门课时不出现；固定贴在
    // 侧边栏最底部（配合 .sidebar-scroll 的 flex 布局，章节数少时也不会往上飘），
    // 避免跟上面的章节/文件点击混在一起
    const homeLink = state.data.homeLink;
    const homeLinkHtml = homeLink
      ? `<a class="sidebar-home" href="${escapeAttr(homeLink)}">◀ 全部课程</a>`
      : '';

    sidebarEl.innerHTML = `<div class="sidebar-scroll">${groupsHtml}</div>${homeLinkHtml}`;
  }

  /**
   * 渲染内容区最下面的一组按钮（EN⇄CN / 全部展开收起），跟顶部的按钮共用同一个 data-action，

   * @param {string} [leadingHtml] - 排在最前面的额外按钮（目前只有测验视图的"换一批"用），

  /**
   * 渲染内容区：某个 NoteDoc 的三段表格
   * @param {object} doc - NoteDoc
   * @returns {void}
   */
  function renderContent(doc) {

    const contentEl = document.querySelector('[data-role="content"]');

    const shownSide = state.mode;
    const hiddenSide = state.mode === 'en' ? 'cn' : 'en';

    // 恢复该篇已展开的 item
    const expanded = loadExpanded(doc.slug);

    // 该篇内已收藏的 item id 集合，用于渲染每个 item 的收藏星标状态
    const favoriteIds = new Set(
      loadFavorites().filter((fav) => fav.kind === 'item' && fav.favorited).map((fav) => fav.id)
    );

    const sectionsHtml = doc.sections.map((section) => {

      const itemsHtml = section.items.map((item, index) => {

        const key = `${section.type}:${index}`;
        const expandedClass = expanded.has(key) ? ' is-expanded' : '';
        const favorited = favoriteIds.has(`${doc.slug}::${key}`);

        return `
          <li class="item${expandedClass}" data-key="${key}">
            <div class="shown-side">
              <div class="side-cells-row">
                ${formatSide(section.type, shownSide, item[shownSide])}
                <div class="item-actions">
                  ${renderSpeakButton(section.type, item.en)}
                  <button type="button" class="fav-btn${favorited ? ' is-favorited' : ''}" data-action="toggle-favorite-item" aria-label="收藏">${favorited ? '★' : '☆'}</button>
                </div>
              </div>
            </div>
            <div class="hidden-side">${formatSide(section.type, hiddenSide, item[hiddenSide])}</div>
            ${formatResident(section, item)}
          </li>`;
      }).join('');

      return `
        <section class="section section--${section.type}">
          <h2 class="section-title">${escapeHtml(section.heading)}</h2>
          <ul class="item-list">${itemsHtml}</ul>
        </section>`;
    }).join('');

    const chapterLabelHtml = doc.chapter
      ? `<div class="doc-chapter-label">${escapeHtml(doc.chapter)}</div>`
      : '';

    const titleRowHtml = state.data.tree
      ? `<div class="doc-title-row">
          ${renderDocPagerButton(getAdjacentDoc(doc.slug, -1), -1)}
          <h2 class="doc-title">${escapeHtml(doc.title || doc.slug)}</h2>
          ${renderDocPagerButton(getAdjacentDoc(doc.slug, 1), 1)}
        </div>`
      : `<h2 class="doc-title">${escapeHtml(doc.title || doc.slug)}</h2>`;

    const headerHtml = `<header class="doc-header">${chapterLabelHtml}${titleRowHtml}</header>`;

    contentEl.innerHTML = `
      ${headerHtml}
      ${sectionsHtml}
      ${renderBottomControls()}
      ${renderDocPager(doc.slug)}`;

    updateAppTitle(doc.chapter);

    // 根据这篇实际的展开状态同步"全部展开/收起"切换按钮的图标（+ / −）
    const totalItems = doc.sections.reduce((sum, section) => sum + section.items.length, 0);
    state.allExpanded = totalItems > 0 && expanded.size === totalItems;
    updateExpandToggleIcon();
  }
