    listeningBatchOffset: 0, // 当前显示的是听力池子里第几批
    training: null, // 句子训练当前会话（只练当前这篇），结构见 startTraining；null 表示没进过训练视图
    trainingSettings: null, // 句子训练的设置（标签页 / 难度 / 循环 / 语速 / 译），持久化到 localStorage
    currentSlug: null, // index 模式下当前查看的 NoteDoc
    data: null,        // { docs, tree } 或 { doc }

    // 「我的收藏」词条列表的筛选条件，只存内存不持久化，刷新页面重置；'all' 表示不筛选
    // 课程 / 章节筛选的取值加 'c:' 前缀，避免跟 'all' 撞名；课程为 null 表示还没选过，默认当前课程
    favoritesCourseFilter: null, // null | 'all' | 'c:<课程短标识>'
    favoritesChapterFilter: 'all', // 'all' | 'c:<章节名>'
    favoritesTypeFilter: 'all', // 'all' | 'vocab' | 'phrases' | 'sentences'
    favoritesMarkFilter: 'all', // 'all' | 'none' | 1 | 2 | 3
    favoritesSort: 'newest', // 'newest' | 'oldest' | 'course'
    favoritesSearch: '', // 搜索关键词，空串表示不搜索
    favoritesPage: 1, // 词条列表当前页码（从 1 开始），渲染时会按实际总页数修正
    favoritesSearchTimer: null, // 搜索框 debounce 用的 setTimeout 句柄

    syncPanelOpen: false, // "同步设置"面板是否展开，只存内存，刷新页面重置为收起

    // 阅读进度：以下都只存内存，持久化的数据在收藏列表里的 read / position / course 记录
    resumeHint: null, // 打开页面时"上次看到"提示条要指向的位置记录，null 表示不显示
    isResumeHintDismissed: false, // 用户点过"继续"或"×"、或自己选了别的文档后不再显示提示
    docOpenedAt: 0, // 当前这篇是什么时候打开的，用来判断停留够不够 AUTO_READ_DELAY_MS
    manualUnreadSlugs: new Set(), // 本次打开期间手动取消过"已看"的文档，不再被自动标回去
    isPositionDirty: false, // 用户在本页有过切换文档 / 滚动，才需要在离开时记录位置
    autoReadTimer: null, // 打开文档后 AUTO_READ_DELAY_MS 检查一次（短文档一屏就看完，不会触发滚动）

    // 收藏跨设备同步状态，只存内存不持久化
    sync: {
      status: 'unconfigured', // 'unconfigured' | 'idle' | 'syncing' | 'error'
      lastError: null,
      lastSyncedAt: null,
      pushTimer: null, // 推送 debounce 用的 setTimeout 句柄
    },
  };


  /**
   * 读取页面内嵌的 JSON 数据
   * @returns {object}
   */
  function loadData() {

    const node = document.querySelector('[data-role="livenotes-data"]');

    return JSON.parse(node.textContent);
  }

  /**
   * 转义 HTML 文本节点中的特殊字符
   * @param {*} value
   * @returns {string}
   */
  function escapeHtml(value) {

    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  /**
   * 转义 HTML 属性值（在 escapeHtml 基础上再处理引号）
   * @param {*} value
   * @returns {string}
   */
  function escapeAttr(value) {

    return escapeHtml(value).replace(/"/g, '&quot;');
  }

  /**
   * 当前正在查看的 NoteDoc 的 slug（单篇模式取内嵌 doc，index 模式取 state.currentSlug）
   * @returns {string|null}
   */
  function currentSlug() {

    return state.data.doc ? state.data.doc.slug : state.currentSlug;
  }

  /**
   * 当前页面所属的课程短标识（构建时嵌进页面数据，单篇/index 模式都有），
   * 没有就返回空串——用于收藏时记录"这条来自哪门课"
   * @returns {string}
   */
  function currentCourseLabel() {

    return state.data.courseLabel || '';
  }

  /**
   * 更新顶部标题文字（课程标识 + 当前章节，没有章节就只显示课程标识）和浏览器标签页
   * 标题；正文视图切换文档、进/出收藏 · 测验视图都要调用这个保持同步
   * @param {string} [chapter] - 当前章节，不传就只显示课程标识（收藏/测验视图没有
   *   "当前章节"这个概念）
   * @returns {void}
   */
  function updateAppTitle(chapter) {

    const courseLabel = currentCourseLabel();
    const text = courseLabel
      ? (chapter ? `${courseLabel} · ${chapter}` : courseLabel)
      : (chapter || 'livenotes');

    const titleEl = document.querySelector('.app-title');

    if (titleEl) {
      titleEl.textContent = text;
    }

    document.title = text;
  }

  /**
   * 收藏记录展示用的"课程 · "前缀；老记录没有 courseLabel 字段，返回空串
   * （跨课程收藏混在同一个列表里时，用来提示这条是哪门课的）
   * @param {object} fav
   * @returns {string}
   */
  function formatCoursePrefix(fav) {

    return fav.courseLabel ? `${escapeHtml(fav.courseLabel)} · ` : '';
  }

  /**
   * 收藏记录的"收藏于 xxx"展示文字，没有 favoritedAt（比如纯打了评分没收藏）就返回空串
   * @param {object} fav
   * @returns {string}
   */
  function formatFavoritedAt(fav) {

    if (!fav.favoritedAt) {

      return '';
    }

    const date = new Date(fav.favoritedAt);

    return `收藏于 ${date.toLocaleDateString('zh-CN', {
      year: 'numeric', month: '2-digit', day: '2-digit',
    })}`;
  }

  /**
   * 按 slug 取当前应渲染的 NoteDoc
   * @param {string|null} slug
   * @returns {object|null}
   */
  function findDoc(slug) {

    if (state.data.doc) {

      return state.data.doc;
    }

    return (state.data.docs || []).find((doc) => doc.slug === slug) || null;
  }

  /**
   * 摊平章节树成一条线性的文档顺序列表（按构建时扫描出来的章节 / 文件顺序），
   * "上一节 / 下一节"就是这条线上的前一个 / 后一个。单篇页面没有 tree 数据，返回空数组
   * @returns {{slug: string, title: string}[]}
   */
  function flattenDocOrder() {

    return (state.data.tree || []).flatMap((group) => group.files);
  }

  /**
   * 取某篇文档在摊平顺序里的前一篇 / 后一篇，取不到（在列表头尾，或单篇页面没有
   * tree 数据）返回 null
   * @param {string} slug
   * @param {1|-1} direction
   * @returns {{slug: string, title: string}|null}
   */
  function getAdjacentDoc(slug, direction) {

    const order = flattenDocOrder();
    const index = order.findIndex((entry) => entry.slug === slug);

    if (index === -1) {

      return null;
    }

    return order[index + direction] || null;
  }

  /**
   * 渲染单个"上一节"或"下一节"按钮；没有对应邻居（在列表头尾）时渲染成禁用态的 span
   * @param {{slug: string, title: string}|null} entry
   * @param {-1|1} direction
   * @returns {string}
   */
  function renderDocPagerButton(entry, direction) {

    const label = direction === -1 ? '◀ 上一节' : '下一节 ▶';
    const action = direction === -1 ? 'prev-doc' : 'next-doc';

    if (!entry) {

      return `<span class="btn doc-pager-btn doc-pager-btn--disabled" aria-disabled="true">${label}</span>`;
    }

    return `<button type="button" class="btn doc-pager-btn" data-action="${action}" data-slug="${escapeAttr(entry.slug)}" title="${escapeAttr(entry.title)}">${label}</button>`;
  }

  /**
   * 渲染"上一节 / 下一节"翻页条（两个按钮一起，用于内容区底部）；单篇页面
   * （没有 tree 数据）不渲染，返回空串
   * @param {string} slug - 当前文档 slug
   * @returns {string}
   */
  function renderDocPager(slug) {

    if (!state.data.tree) {

      return '';
    }

    return `<div class="doc-pager">${renderDocPagerButton(getAdjacentDoc(slug, -1), -1)}${renderDocPagerButton(getAdjacentDoc(slug, 1), 1)}</div>`;
  }

  /**
   * 从 localStorage 恢复模式，无则用默认
   * @returns {'en'|'cn'}
   */
  function loadMode() {

    try {

      return localStorage.getItem(STORAGE_MODE_KEY) || DEFAULT_MODE;
    } catch (err) {

      // localStorage 不可用（隐私模式 / 被禁用）时回退默认
      return DEFAULT_MODE;
    }
  }

  /**
   * 持久化当前模式
   * @param {'en'|'cn'} mode
   * @returns {void}
   */
  function saveMode(mode) {

    try {
      localStorage.setItem(STORAGE_MODE_KEY, mode);
    } catch (err) {
      // 静默降级：不影响页面使用
    }
  }

  /**
   * 从 localStorage 恢复主题 id，无 / 非法值时回退默认
   * @returns {string}
   */
  function loadTheme() {

    try {
      const saved = localStorage.getItem(STORAGE_THEME_KEY);

      return THEMES.some((theme) => theme.id === saved) ? saved : DEFAULT_THEME;
    } catch (err) {

      return DEFAULT_THEME;
    }
  }

  /**
   * 持久化主题 id
   * @param {string} themeId
   * @returns {void}
   */
  function saveTheme(themeId) {

    try {
      localStorage.setItem(STORAGE_THEME_KEY, themeId);
    } catch (err) {
      // 静默降级
    }
  }

  /**
   * 应用主题：light 移除 data-theme（用基础令牌），其余写到 <html data-theme>
   * @param {string} themeId
   * @returns {void}
   */
  function applyTheme(themeId) {

    state.theme = themeId;

    if (themeId === 'light') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', themeId);
    }

    updateThemeSwatch(themeId);
  }

  /**
   * 更新收起态色块的背景色，跟当前主题保持一致
   * @param {string} themeId
   * @returns {void}
   */
  function updateThemeSwatch(themeId) {

    const theme = THEMES.find((item) => item.id === themeId);

    if (!theme) {

      return;
    }

    // 顶部和内容区底部都有色块（同一个 data-role），两个都要同步
    document.querySelectorAll('[data-role="theme-swatch"]').forEach((swatchEl) => {
      swatchEl.style.background = theme.swatch;
    });
  }

  /**
   * 填充主题下拉框选项、同步当前值并绑定切换事件。
   * 顶部的 select 是静态标记、只需要初始化一次；内容区底部的 select 每次 renderContent /
   * renderQuizView 都会被 innerHTML 重新创建，所以每次渲染完都要再调一次这个函数——
   * 用 dataset 标记跳过已经初始化过的，避免重复绑定 change 监听
   * @returns {void}
   */
  function setupThemeSelect() {

    document.querySelectorAll('[data-role="theme-select"]').forEach((selectEl) => {

      if (selectEl.dataset.themeReady) {

        return;
      }

      selectEl.innerHTML = THEMES
        .map((theme) => `<option value="${theme.id}">${theme.label}</option>`)
        .join('');
      selectEl.value = state.theme;

      selectEl.addEventListener('change', () => {
        applyTheme(selectEl.value);
        saveTheme(selectEl.value);
      });

      selectEl.dataset.themeReady = 'true';
    });
  }

  /**
   * 读取某篇已展开的 item key 列表
   * @param {string} slug
   * @returns {Set<string>}
   */
  function loadExpanded(slug) {

    try {
      const raw = localStorage.getItem(STORAGE_EXPANDED_PREFIX + slug);
      const list = raw ? JSON.parse(raw) : [];

      return new Set(Array.isArray(list) ? list : []);
    } catch (err) {

      return new Set();
    }
  }

  /**
   * 持久化某篇已展开的 item key 列表
   * @param {string} slug
   * @param {Set<string>} keys
   * @returns {void}
   */
  function saveExpanded(slug, keys) {

    try {
      localStorage.setItem(STORAGE_EXPANDED_PREFIX + slug, JSON.stringify([...keys]));
    } catch (err) {
      // 静默降级
    }
  }

  /**
   * 读取整个收藏列表（doc + item 两级共用一个数组）
   * @returns {object[]}
   */
  function loadFavorites() {

    try {
      const raw = localStorage.getItem(STORAGE_FAVORITES_KEY);
      const list = raw ? JSON.parse(raw) : [];

      return Array.isArray(list) ? list : [];
    } catch (err) {

      return [];
    }
  }

  /**
   * 持久化整个收藏列表
   * @param {object[]} list
   * @returns {void}
   */
  function saveFavorites(list) {

    try {
      localStorage.setItem(STORAGE_FAVORITES_KEY, JSON.stringify(list));
    } catch (err) {
      // 静默降级
    }
  }

  /**
   * 读取本机保存的同步配置（Token / Gist ID），没有就返回空字符串
   * @returns {{ token: string, gistId: string }}
   */
  function loadSyncConfig() {

    try {

      return {
        token: localStorage.getItem(STORAGE_SYNC_TOKEN_KEY) || '',
        gistId: localStorage.getItem(STORAGE_SYNC_GIST_ID_KEY) || '',
      };
    } catch (err) {

      return { token: '', gistId: '' };
    }
  }

  /**
   * 保存同步配置到本机（每台设备各自存一份，不参与 Gist 同步内容本身）
   * @param {{ token: string, gistId: string }} config
   * @returns {void}
   */
  function saveSyncConfig(config) {

    try {
      localStorage.setItem(STORAGE_SYNC_TOKEN_KEY, config.token || '');
      localStorage.setItem(STORAGE_SYNC_GIST_ID_KEY, config.gistId || '');
    } catch (err) {
      // 静默降级
    }
  }

  /**
   * 清空本机的同步配置（只影响这台设备，不影响 Gist 本身，也不影响其它设备）
   * @returns {void}
   */
  function clearSyncConfig() {

    try {
      localStorage.removeItem(STORAGE_SYNC_TOKEN_KEY);
      localStorage.removeItem(STORAGE_SYNC_GIST_ID_KEY);
    } catch (err) {
      // 静默降级
    }
  }

  /**
   * 判断这台设备是否已经配置好同步（Token + Gist ID 都有才算）
   * @returns {boolean}
   */
  function isSyncConfigured() {

    const { token, gistId } = loadSyncConfig();

    return Boolean(token && gistId);
  }

  /**
   * 判断某条收藏记录是不是"空"的（取消收藏、且 item 没有评分）——
   * 空记录只是为了同步时能覆盖别的设备上的旧数据才保留，过一段时间可以物理清理掉
   * @param {object} fav
   * @returns {boolean}
   */
  function isFavoriteRecordEmpty(fav) {

    if (fav.kind === 'doc') {

      return !fav.favorited;
    }

    // 取消"已看"的记录只是为了同步覆盖别的设备，跟取消收藏一样过期后可以清理
    if (fav.kind === 'read') {

      return !fav.read;
    }

    // 上次看到的位置、课程总篇数是每门课一条的状态记录，永远不清理
    if (fav.kind === 'position' || fav.kind === 'course') {

      return false;
    }

    return !fav.favorited && !fav.mark;
  }

  /**
   * 清理"已经空了很久"的墓碑记录，避免收藏列表随时间无限增长。保留窗口留够时间
   * （TOMBSTONE_RETENTION_MS），确保正常同步节奏内的设备都已经拿到过这条删除
   * @param {object[]} list
   * @returns {object[]}
   */
  function gcStaleFavorites(list) {

    const cutoff = Date.now() - TOMBSTONE_RETENTION_MS;

    return list.filter((fav) => !isFavoriteRecordEmpty(fav) || favoriteUpdatedAtMs(fav) > cutoff);
  }

  /**
   * 判断合并结果是否跟远端数据完全一致——一致就说明本地没有任何远端还没有的更新，
   * 拉取之后不需要再推一次
   * @param {object[]} merged
   * @param {object[]} remote
   * @returns {boolean}
   */
  function remoteAlreadyHasAll(merged, remote) {

    if (merged.length !== remote.length) {

      return false;
    }

    const remoteMap = new Map(remote.map((fav) => [`${fav.kind}:${fav.id}`, fav]));

    return merged.every((fav) => {
      const remoteFav = remoteMap.get(`${fav.kind}:${fav.id}`);

      return remoteFav && favoriteUpdatedAtMs(remoteFav) === favoriteUpdatedAtMs(fav);
    });
  }

  /**
   * 发一次 GitHub Gist API 请求，统一处理鉴权头和错误信息
   * @param {string} method
   * @param {string} path - 拼在 GIST_API_BASE 后面，比如 `/<gistId>`，创建时传空串
   * @param {string} token
   * @param {object} [body]
   * @returns {Promise<object|null>}
   */
  async function gistApiRequest(method, path, token, body) {

    const headers = {
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
    };

    if (token) {
      headers.Authorization = `token ${token}`;
    }

    if (body !== undefined) {
      headers['Content-Type'] = 'application/json';
    }

    const res = await fetch(`${GIST_API_BASE}${path}`, {
      method,
      headers,
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });

    if (!res.ok) {
      const message = res.status === 401 || res.status === 403
        ? 'Token 无效或权限不足，请重新设置同步'
        : res.status === 404
          ? 'Gist 不存在，请检查 Gist ID'
          : `GitHub API 请求失败（状态码 ${res.status}）`;
      const err = new Error(message);

      err.status = res.status;

      throw err;
    }

    return res.status === 204 ? null : res.json();
  }

  /**
   * 创建一个新的私有 Gist 当同步后端，返回新建的 Gist ID
   * （只有第一台设备需要建，建完把 ID 复制到其它设备，其它设备不要再选自动创建）
   * @param {string} token
   * @returns {Promise<string>}
   */
  async function createGist(token) {

    const gist = await gistApiRequest('POST', '', token, {
      description: 'livenotes 收藏数据（跨设备自动同步用，请勿手动编辑）',
      public: false,
      files: {
        [GIST_FILENAME]: {
          content: JSON.stringify({ updatedAt: new Date().toISOString(), records: [] }, null, 2),
        },
      },
    });

    return gist.id;
  }

  /**
   * 从 Gist 读取收藏记录数组
   * @param {string} gistId
   * @param {string} token
   * @returns {Promise<object[]>}
   */
  async function fetchGistRecords(gistId, token) {

    const gist = await gistApiRequest('GET', `/${gistId}`, token);
    const file = gist.files && gist.files[GIST_FILENAME];

    if (!file) {

      return [];
    }

    let text = file.content || '';

    // 内容超过 1MB 时 GitHub 会截断 content 字段，要另外用 raw_url 拉完整内容；
    // 收藏数据体量很小，正常用不到，这里只是防呆
    if (file.truncated && file.raw_url) {
      const rawRes = await fetch(file.raw_url);

      text = await rawRes.text();
    }

    try {
      const parsed = JSON.parse(text);

      return Array.isArray(parsed.records) ? parsed.records : [];
    } catch (err) {

      return [];
    }
  }

  /**
   * 把收藏记录数组写回 Gist
   * @param {string} gistId
   * @param {string} token
   * @param {object[]} records
   * @returns {Promise<void>}
   */
  async function updateGistRecords(gistId, token, records) {

    await gistApiRequest('PATCH', `/${gistId}`, token, {
      files: {
        [GIST_FILENAME]: {
          content: JSON.stringify({ updatedAt: new Date().toISOString(), records }, null, 2),
        },
      },
    });
  }

  /**
   * 同步状态文字 + 图标，工具条和设置面板共用
   * @returns {string}
   */
  function formatSyncStatusText() {

    const { status, lastError, lastSyncedAt } = state.sync;

    if (status === 'syncing') {

      return '⟳ 同步中…';
    }

    if (status === 'error') {

      return `⚠ 同步失败：${lastError || '未知错误'}`;
    }

    if (status === 'idle') {
      const time = lastSyncedAt
        ? new Date(lastSyncedAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
        : '';

      return time ? `✓ 已同步（${time}）` : '✓ 已同步';
    }

    return '未设置跨设备同步';
  }

  /**
   * 收藏视图里如果正显示着同步状态徽标，原地刷新文字/颜色，不用整个视图重渲染
   * （更新状态经常发生在异步请求中途，这时候不适合触发整页重渲染打断用户）
   * @returns {void}
   */
  function refreshSyncStatusBadge() {

    const badgeEl = document.querySelector('[data-role="sync-status"]');

    if (!badgeEl) {

      return;
    }

    badgeEl.textContent = formatSyncStatusText();
    badgeEl.className = `sync-status sync-status--${state.sync.status}`;
  }

  /**
   * 更新同步状态（写进内存 state，并顺带刷新页面上的状态徽标）
   * @param {'unconfigured'|'idle'|'syncing'|'error'} status
   * @param {Error} [err]
   * @returns {void}
   */
  function updateSyncStatus(status, err) {

    state.sync.status = status;
    state.sync.lastError = err ? err.message : null;

    if (status === 'idle') {
      state.sync.lastSyncedAt = new Date().toISOString();
    }

    if (err) {
      console.warn('[livenotes sync]', err);
    }

    refreshSyncStatusBadge();
  }

  /**
   * 拉取合并后刷新当前正在看的视图（收藏 / 测验 / 正文），让星标 / 评分状态跟合并结果同步。
   * 侧边栏的文档星标只在 init() 渲染一次，这里暂不刷新——要看到别的设备新收藏的整篇文档，
   * 目前还需要刷新页面，先记录成已知的后续可以补的点
   * @returns {void}
   */
  function refreshAfterSync() {

    // 别的设备的"已看"和"上次看到"可能刚合并进来
    if (state.data.tree) {
      updateReadProgressUI();
      refreshResumeHint();
    }

    if (state.view === 'favorites') {
      renderFavoritesView();

      return;
    }

    if (state.view === 'quiz') {
      renderQuizView();

      return;
    }

    // 句子训练里可能正在填空 / 打字，同步回来重渲染会把输入清掉，不刷新
    if (state.view === 'training') {

      return;
    }

    const slug = currentSlug();
    const doc = findDoc(slug);

    if (doc) {
      renderContent(doc);
    }
  }

  /**
   * 从 Gist 拉取最新数据，跟本地合并；如果合并结果里有本地独有、远端还没有的更新，
   * 合并后立刻推一次回去（双向同步的核心：既拉又可能补推）
   * @returns {Promise<void>}
   */
  async function pullFavoritesFromGist() {

    const { token, gistId } = loadSyncConfig();

    if (!token || !gistId) {

      return;
    }

    updateSyncStatus('syncing');

    try {
      const remote = await fetchGistRecords(gistId, token);
      const local = loadFavorites();
      const merged = mergeFavoriteLists(remote, local);

      saveFavorites(merged);
      refreshAfterSync();

      if (!remoteAlreadyHasAll(merged, remote)) {
        await updateGistRecords(gistId, token, gcStaleFavorites(merged));
      }

      updateSyncStatus('idle');
    } catch (err) {
      updateSyncStatus('error', err);
    }
  }

  /**
   * 把本地当前收藏数据（清理过期墓碑后）推送到 Gist
   * @returns {Promise<void>}
   */
  async function pushFavoritesToGist() {

    const { token, gistId } = loadSyncConfig();

    if (!token || !gistId) {

      return;
    }

    updateSyncStatus('syncing');

    try {
      const cleaned = gcStaleFavorites(loadFavorites());

      saveFavorites(cleaned);
      await updateGistRecords(gistId, token, cleaned);
      updateSyncStatus('idle');
    } catch (err) {
      updateSyncStatus('error', err);
    }
  }

  /**
   * 推送 debounce：收藏变化后等 SYNC_PUSH_DEBOUNCE_MS 无新改动再真正推送，
   * 避免连续点收藏/评分时每次操作都发一次请求
   * @returns {void}
   */
  function schedulePushFavorites() {

    if (!isSyncConfigured()) {

      return;
    }

    if (state.sync.pushTimer) {
      clearTimeout(state.sync.pushTimer);
    }

    state.sync.pushTimer = setTimeout(() => {
      state.sync.pushTimer = null;
      pushFavoritesToGist();
    }, SYNC_PUSH_DEBOUNCE_MS);
  }

  /**
   * 本地写入收藏 + 触发一次 debounce 推送，所有用户产生的收藏改动都要走这个函数
   * （从 Gist 拉取合并后的写入不走这个，直接调 saveFavorites，避免拉取触发的写入又排一次推送）
   * @param {object[]} list
   * @returns {void}
   */
  function persistFavorites(list) {

    saveFavorites(list);
    schedulePushFavorites();
  }

  /**
   * 页面加载、以及页面从后台切回前台时自动拉取一次远端数据；只有配置好同步才会真正发请求
   * @returns {void}
   */
  function setupFavoritesSync() {

    if (isSyncConfigured()) {
      pullFavoritesFromGist();
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && isSyncConfigured()) {
        pullFavoritesFromGist();
      }
    });
  }

  /**
   * "保存"按钮：读设置面板里的 Token / Gist ID 输入框，Gist ID 留空则自动创建一个新 Gist，
   * 保存配置后立刻拉取一次做首次同步
   * @returns {Promise<void>}
   */
  async function handleSaveSyncConfig() {

    const tokenInput = document.querySelector('[data-role="sync-token-input"]');
    const gistIdInput = document.querySelector('[data-role="sync-gist-id-input"]');

    if (!tokenInput || !gistIdInput) {

      return;
    }

    const token = tokenInput.value.trim();
    let gistId = gistIdInput.value.trim();

    if (!token) {
      window.alert('请先填写 Token');

      return;
    }

    updateSyncStatus('syncing');

    try {
      if (!gistId) {
        gistId = await createGist(token);
        window.alert(`已创建新 Gist，ID 是：\n${gistId}\n\n请把这个 ID 复制到其它设备的同步设置里，其它设备不要再留空创建。`);
      }

      saveSyncConfig({ token, gistId });
      await pullFavoritesFromGist();
    } catch (err) {
      updateSyncStatus('error', err);
      window.alert(`同步设置失败：${err.message}`);
    }

    renderFavoritesView();
  }

  /**
   * "退出同步"按钮：只清空这台设备保存的 Token/Gist ID，不影响 Gist 本身和其它设备
   * @returns {void}
   */
  function handleClearSyncConfig() {

    if (!window.confirm('确定要退出同步吗？只会清空这台设备保存的 Token/Gist ID，不会删除 Gist 或影响其它设备。')) {

      return;
    }

    clearSyncConfig();
    updateSyncStatus('unconfigured');
    renderFavoritesView();
  }

  /**
   * "立即同步"按钮：手动触发一次完整同步，不用等自动拉取/推送的时机
   * （`pullFavoritesFromGist` 本身就是双向的：拉远端合并本地，本地有远端没有的更新会自动
   * 补推回去，所以点这一个按钮就够了，不需要分开的"上传"按钮）
   * @returns {Promise<void>}
   */
  async function handleSyncNow() {

    if (!isSyncConfigured()) {
      window.alert('请先在"同步设置"里填好 Token 和 Gist ID');

      return;
    }

    // 有正在等待的 debounce 推送就取消掉，马上同步这一次已经把它覆盖了，不用重复推
    if (state.sync.pushTimer) {
      clearTimeout(state.sync.pushTimer);
      state.sync.pushTimer = null;
    }

    await pullFavoritesFromGist();
    renderFavoritesView();
  }

  /**
   * 在收藏列表里查找某条记录的下标
   * @param {object[]} list
   * @param {'doc'|'item'} kind
   * @param {string} id
   * @returns {number} 未找到返回 -1
   */
  function favoriteIndex(list, kind, id) {

    return list.findIndex((fav) => fav.kind === kind && fav.id === id);
  }

  /**
   * 判断某篇文档是否已整篇收藏
   * @param {string} docSlug
   * @returns {boolean}
   */
  function isDocFavorited(docSlug) {

    const list = loadFavorites();
    const index = favoriteIndex(list, 'doc', docSlug);

    return index >= 0 && Boolean(list[index].favorited);
  }

  /**
   * 取某条 item 的标注记录（收藏 + 评分共用同一条记录），不存在返回 null
   * @param {string} itemId - `${docSlug}::${sectionType}:${itemIndex}`
   * @returns {object|null}
   */
  function findItemRecord(itemId) {

    return loadFavorites().find((fav) => fav.kind === 'item' && fav.id === itemId) || null;
  }

  /**
   * 判断某条 item 是否已收藏
   * @param {string} itemId - `${docSlug}::${sectionType}:${itemIndex}`
   * @returns {boolean}
   */
  function isItemFavorited(itemId) {

    const record = findItemRecord(itemId);

    return Boolean(record && record.favorited);
  }

  /**
   * 取某条 item 的测验评分（1~3），没评过返回 null
   * @param {string} itemId - `${docSlug}::${sectionType}:${itemIndex}`
   * @returns {number|null}
   */
  function getItemMark(itemId) {

    const record = findItemRecord(itemId);

    return record ? record.mark : null;
  }

  /**
   * 按 slug 找到或新建一条整篇文档收藏记录，返回 { list, record }
   * 新建时 favorited 是 false，由调用方接着填（同步用：不物理删除记录，见 toggleFavoriteDoc）
   * @param {object} doc - NoteDoc
   * @returns {{ list: object[], record: object }}
   */
  function ensureDocRecord(doc) {

    const list = loadFavorites();
    const index = favoriteIndex(list, 'doc', doc.slug);

    if (index >= 0) {

      return { list, record: list[index] };
    }

    const record = {
      kind: 'doc',
      id: doc.slug,
      docSlug: doc.slug,
      docTitle: doc.title || doc.slug,
      chapter: doc.chapter,
      courseLabel: currentCourseLabel(),
      favorited: false,
      favoritedAt: null,
      addedAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
    };

    list.push(record);

    return { list, record };
  }

  /**
   * 切换整篇文档的收藏状态。取消收藏不物理删除记录，只是把 favorited 置为 false
   * （跨设备同步需要靠这条"取消"记录本身去覆盖别的设备上的旧数据，见 mergeFavoriteLists）
   * @param {object} doc - NoteDoc
   * @returns {void}
   */
  function toggleFavoriteDoc(doc) {

    const { list, record } = ensureDocRecord(doc);
    const now = new Date().toISOString();

    record.favorited = !record.favorited;
    record.favoritedAt = record.favorited ? now : null;
    record.updatedAt = now;
    record.docTitle = doc.title || doc.slug;
    record.chapter = doc.chapter;
    record.courseLabel = currentCourseLabel();

    persistFavorites(list);
  }

  /**
   * 组装 toggleFavoriteItem / setItemMark 需要的 context
   * @param {object} doc - NoteDoc
   * @param {object} section - Section
   * @param {number} itemIndex
   * @returns {object}
   */
  function buildItemContext(doc, section, itemIndex) {

    return {
      docSlug: doc.slug,
      docTitle: doc.title || doc.slug,
      chapter: doc.chapter,
      sectionType: section.type,
      sectionHeading: section.heading,
      itemIndex,
      item: section.items[itemIndex],
    };
  }

  /**
   * 按 context 找到或新建一条 item 标注记录（收藏 / 评分共用），返回 { list, record }
   * 新建时 favorited/mark 都是空，由调用方接着填
   * @param {object} context - { docSlug, docTitle, chapter, sectionType, sectionHeading, itemIndex, item }
   * @returns {{ list: object[], record: object }}
   */
  function ensureItemRecord(context) {

    const id = `${context.docSlug}::${context.sectionType}:${context.itemIndex}`;
    const list = loadFavorites();
    const index = favoriteIndex(list, 'item', id);

    if (index >= 0) {

      return { list, record: list[index] };
    }

    const record = {
      kind: 'item',
      id,
      docSlug: context.docSlug,
      docTitle: context.docTitle,
      chapter: context.chapter,
      courseLabel: currentCourseLabel(),
      sectionType: context.sectionType,
      sectionHeading: context.sectionHeading,
      itemIndex: context.itemIndex,
      snapshot: {
        en: context.item.en,
        cn: context.item.cn,
        note: context.item.note,
        kind: context.item.kind,
      },
      favorited: false,
      favoritedAt: null,
      mark: null,
      markedAt: null,
      updatedAt: new Date().toISOString(),
    };

    list.push(record);

    return { list, record };
  }

  /**
   * 切换单条 item 的收藏状态（收藏 / 评分共用同一条记录，见 ensureItemRecord）。
   * 取消收藏不物理删除记录，只是把 favorited 置为 false（跨设备同步需要靠这条"取消"
   * 记录本身去覆盖别的设备上的旧数据，见 mergeFavoriteLists；真正的物理清理见 gcStaleFavorites）
   * @param {object} context - { docSlug, docTitle, chapter, sectionType, sectionHeading, itemIndex, item }
   * @returns {void}
   */
  function toggleFavoriteItem(context) {

    const { list, record } = ensureItemRecord(context);
    const now = new Date().toISOString();

    record.favorited = !record.favorited;
    record.favoritedAt = record.favorited ? now : null;
    record.updatedAt = now;

    persistFavorites(list);
  }

  /**
   * 间隔重复：根据这次评分算出下次复习间隔（天）。1 档＝不熟悉，明天再看；
   * 2/3 档在上一次间隔基础上乘 1.5 / 2.5 倍增长，第一次评分（没有上次间隔）给个
   * 固定起始值。这个函数只管算天数，不碰任何存储，方便以后单独测试/调参
   * @param {number} previousInterval - 上一次的间隔天数，从没评过是 0
   * @param {1|2|3} rating
   * @returns {number} 天数
   */
  function computeNextSrsInterval(previousInterval, rating) {

    if (rating === 1) {

      return 1;
    }

    if (!previousInterval) {

      return rating === 2 ? 2 : 4;
    }

    const multiplier = rating === 2 ? 1.5 : 2.5;

    return Math.max(1, Math.round(previousInterval * multiplier));
  }

  /**
   * 设置单条 item 的测验评分：再点一次当前档位会清空评分。
   * 顺带维护间隔重复的调度字段（srsInterval / srsDueAt）：评分时更新，清空评分时也
   * 一起清空（退回"随时都该复习"的状态），供 sortPoolBySrsPriority 用
   * @param {object} context - { docSlug, docTitle, chapter, sectionType, sectionHeading, itemIndex, item }
   * @param {1|2|3} level
   * @param {{ isToggle?: boolean }} [options] - isToggle 为 false 时直接设成该档，不做"再点一次清空"
   *   （句子训练做错自动记一档用：本来就是一档的句子再错一次，要重新排期而不是被清掉）
   * @returns {void}
   */
  function setItemMark(context, level, { isToggle = true } = {}) {

    const { list, record } = ensureItemRecord(context);
    const now = new Date().toISOString();

    record.mark = isToggle && record.mark === level ? null : level;
    record.markedAt = record.mark ? now : null;

    if (record.mark !== null) {
      record.srsInterval = computeNextSrsInterval(record.srsInterval || 0, record.mark);
      record.srsDueAt = new Date(Date.now() + record.srsInterval * 24 * 60 * 60 * 1000).toISOString();
    } else {
      record.srsInterval = null;
      record.srsDueAt = null;
    }

    // 设置了评分（不是取消）就顺带自动收藏，方便测验时顺手标记；取消评分不会跟着取消收藏，
    // 避免误清掉本来手动收藏的记录
    if (record.mark !== null && !record.favorited) {
      record.favorited = true;
      record.favoritedAt = now;
    }

    record.updatedAt = now;

    persistFavorites(list);
  }

  /**
   * 「我的收藏」视图里取消收藏（doc / item 用同一套逻辑）：只清掉 favorited，
   * 不物理删除记录——item 如果还有评分（mark）会继续显示评分；doc/item 的"取消"记录本身
   * 需要保留下来才能在跨设备同步时覆盖别的设备上的旧数据（见 mergeFavoriteLists）
   * @param {'doc'|'item'} kind
   * @param {string} id
   * @returns {void}
   */
  function removeFavorite(kind, id) {

    const list = loadFavorites();
    const index = favoriteIndex(list, kind, id);

    if (index === -1) {

      return;
    }

    const record = list[index];

    record.favorited = false;
    record.favoritedAt = null;
    record.updatedAt = new Date().toISOString();

    persistFavorites(list);
    renderFavoritesView();
  }

  /**
   * 判断当前页面能否直接跳转到目标文档
   * （单篇页面只内嵌自己那一篇，只有目标就是自己时才能跳）
   * @param {string} docSlug
   * @returns {boolean}
   */
  function canJumpToDoc(docSlug) {

    if (state.data.doc) {

      return state.data.doc.slug === docSlug;
    }

    return (state.data.docs || []).some((doc) => doc.slug === docSlug);
  }

  /**
   * 把收藏列表导出为 json 文件并触发浏览器下载
   * @returns {void}
   */
  function exportFavorites() {

    const json = JSON.stringify(loadFavorites(), null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const dateStr = new Date().toISOString().slice(0, 10);

    const linkEl = document.createElement('a');
    linkEl.href = url;
    linkEl.download = `livenotes-favorites-${dateStr}.json`;
    document.body.appendChild(linkEl);
    linkEl.click();
    document.body.removeChild(linkEl);

    URL.revokeObjectURL(url);
  }

  /**
   * 把当前同步配置（Token + Gist ID）导出为 json 文件下载，方便在别的设备/别的网址上
   * 一次性导入，不用手动复制粘贴两个输入框
   * @returns {void}
   */
  function exportSyncConfig() {

    const config = loadSyncConfig();

    if (!config.token && !config.gistId) {
      window.alert('还没有设置同步，没有可导出的配置');

      return;
    }

    const json = JSON.stringify(config, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);

    const linkEl = document.createElement('a');
    linkEl.href = url;
    linkEl.download = 'livenotes-sync-config.json';
    document.body.appendChild(linkEl);
    linkEl.click();
    document.body.removeChild(linkEl);

    URL.revokeObjectURL(url);
    window.alert('已导出，注意：这个文件里是明文 Token，导入完所有设备后建议删掉，不要一直留在下载目录里');
  }

  /**
   * 取一条收藏记录的"最后修改时间"，没有 updatedAt 的旧数据退化用其它时间字段兜底，
   * 都没有就当作最旧（合并时优先保留有明确时间戳的一方）
   * @param {object} fav
   * @returns {number} 毫秒时间戳
   */
  function favoriteUpdatedAtMs(fav) {

    const raw = fav.updatedAt || fav.markedAt || fav.favoritedAt || fav.addedAt || null;

    return raw ? new Date(raw).getTime() : 0;
  }

  /**
   * 合并两份收藏列表：按 kind+id 分组，每组只保留 updatedAt 较新的一条（record 级
   * last-write-wins）。同时用于 Gist 跨设备同步的拉取合并、和手动导入 json 的合并——
   * 取消收藏/清空评分也是一条"更新"（favorited: false），新的一方照样会覆盖旧的一方，
   * 不会被对面设备的旧数据复活（见 toggleFavoriteItem/toggleFavoriteDoc/removeFavorite
   * 不物理删除记录的注释）
   * @param {object[]} a
   * @param {object[]} b
   * @returns {object[]}
   */
  function mergeFavoriteLists(a, b) {

    const merged = new Map();

    [...a, ...b].forEach((fav) => {

      if (!fav || !fav.kind || !fav.id) {

        return;
      }

      // 兼容收藏 / 评分合并存储之前导出的旧格式：item 记录存在即代表已收藏
      if (fav.kind === 'item' && fav.favorited === undefined) {
        fav.favorited = true;
        fav.favoritedAt = fav.favoritedAt ?? fav.addedAt ?? null;
        fav.mark = fav.mark ?? null;
        fav.markedAt = fav.markedAt ?? null;
      }

      const key = `${fav.kind}:${fav.id}`;
      const existing = merged.get(key);

      if (!existing || favoriteUpdatedAtMs(fav) >= favoriteUpdatedAtMs(existing)) {
        merged.set(key, fav);
      }
    });

    return Array.from(merged.values());
  }

  /**
   * 合并导入的收藏 json：跟本地数据按 mergeFavoriteLists 的规则合并（record 级
   * last-write-wins），不是简单的"已存在就跳过"
   * @param {object[]} incoming
   * @returns {void}
   */
  function mergeFavorites(incoming) {

    const merged = mergeFavoriteLists(loadFavorites(), incoming);

    persistFavorites(merged);
    renderFavoritesView();
    window.alert(`导入完成，当前共 ${merged.length} 条收藏记录`);
  }

  /**
   * 绑定导入收藏用的隐藏文件选择框
   * @returns {void}
   */
  function setupFavoritesImport() {

    const inputEl = document.querySelector('[data-role="favorites-import-input"]');

    if (!inputEl) {

      return;
    }

    inputEl.addEventListener('change', () => {

      const file = inputEl.files && inputEl.files[0];

      if (!file) {

        return;
      }

      const reader = new FileReader();

      reader.onload = () => {

        try {
          const incoming = JSON.parse(reader.result);

          mergeFavorites(Array.isArray(incoming) ? incoming : []);
        } catch (err) {
          window.alert('导入失败：文件内容不是有效的收藏 json');
        }

        inputEl.value = '';
      };

      reader.readAsText(file);
    });
  }

  /**
   * 绑定导入同步配置用的隐藏文件选择框：读到 { token, gistId } 后直接保存并触发一次同步，
   * 不用再手动粘贴两个输入框
   * @returns {void}
   */
  function setupSyncConfigImport() {

    const inputEl = document.querySelector('[data-role="sync-config-import-input"]');

    if (!inputEl) {

      return;
    }

    inputEl.addEventListener('change', () => {

      const file = inputEl.files && inputEl.files[0];

      if (!file) {

        return;
      }

      const reader = new FileReader();

      reader.onload = async () => {

        try {
          const config = JSON.parse(reader.result);

          if (!config || !config.token) {
            window.alert('导入失败：文件内容不是有效的同步配置');
          } else {
            saveSyncConfig({ token: config.token, gistId: config.gistId || '' });
            await pullFavoritesFromGist();
            renderFavoritesView();
          }
        } catch (err) {
          window.alert('导入失败：文件内容不是有效的同步配置');
        }

        inputEl.value = '';
      };

      reader.readAsText(file);
    });
  }

  /**
   * 渲染某一侧（en 或 cn）的单元格 HTML
   * @param {string} type - section 类型
   * @param {'en'|'cn'} which - 哪一侧
   * @param {object} side - item[which] 对象
   * @returns {string}
   */
  function formatSide(type, which, side) {

    const fields = SIDE_FIELDS[type][which];

    return fields
      .map((field) => `<span class="cell cell--${field}">${escapeHtml(side[field])}</span>`)
      .join('');
  }

  /**
   * 渲染朗读按钮，放在操作按钮区（收藏星标前面），不跟着 EN⇄CN 模式走——不管当前
   * 显示的是哪一侧，点了永远读这张卡片的英文内容；取不到可读文字就不渲染
   * @param {string} type - section 类型
   * @param {object} enSide - item.en 对象（不是"当前显示侧"，固定就是 en）
   * @returns {string}
   */
  function renderSpeakButton(type, enSide) {

    const text = (enSide && enSide[SPEAK_FIELD[type]]) || '';

    if (!text) {

      return '';
    }

    return `<button type="button" class="speak-btn" data-action="speak" data-text="${escapeAttr(text)}" aria-label="朗读">▶</button>`;
  }

  /**
   * 当前设备 / 浏览器可用的英文语音列表（原始对象，未排序）
   * @returns {SpeechSynthesisVoice[]}
   */
  function getEnglishVoices() {

    if (typeof window.speechSynthesis === 'undefined') {

      return [];
    }

    return window.speechSynthesis.getVoices().filter((voice) => voice.lang.startsWith('en'));
  }

  /**
   * 从 localStorage 读用户手动选过的语音 voiceURI，没选过就是空串
   * @returns {string}
   */
  function loadVoicePreference() {

    try {

      return localStorage.getItem(STORAGE_VOICE_KEY) || '';
    } catch (err) {

      return '';
    }
  }

  /**
   * 持久化用户选的语音 voiceURI
   * @param {string} voiceURI
   * @returns {void}
   */
  function saveVoicePreference(voiceURI) {

    try {
      localStorage.setItem(STORAGE_VOICE_KEY, voiceURI || '');
    } catch (err) {
      // 静默降级
    }
  }

  /**
   * 挑一个用来朗读的英文语音：用户在下拉框里手动选过就用那个；没选过就自动挑一个
   * "听起来更自然"的（名字里带 Natural / Neural / Enhanced / Premium 这类标注，
   * 是现代系统内置的神经网络合成语音，比老式机械音自然很多），都没有就退回第一个
   * 英文语音；一个英文语音都没有就返回 null（用浏览器的默认语音兜底）
   * @returns {SpeechSynthesisVoice|null}
   */
  // 常见 Windows/Edge Natural、iOS Enhanced/Premium、经典系统英文语音的名字 → 性别
  // 对照表，供"推荐男声/推荐女声"用。接口本身不提供性别字段，只能靠名字猜；遇到
  // 认不出的名字，调用方（pickBestEnglishVoice）会退回不分性别的通用自动挡，
  // 不会因为猜不出就没声音——不追求覆盖所有小众语音，够用就行
  const FEMALE_VOICE_NAMES = new Set([
    'aria', 'jenny', 'sara', 'emma', 'ava', 'michelle', 'zira', 'hazel', 'susan',
    'samantha', 'zoe', 'joelle', 'noelle', 'karen', 'moira', 'fiona', 'tessa',
    'kate', 'serena', 'stephanie', 'victoria', 'allison', 'kathy', 'nicky',
    'isha', 'sangeeta', 'veena', 'matilda', 'amy', 'salli', 'kimberly', 'ivy',
  ]);

  const MALE_VOICE_NAMES = new Set([
    'guy', 'davis', 'tony', 'andrew', 'brian', 'christopher', 'david', 'mark',
    'george', 'evan', 'nathan', 'tom', 'daniel', 'oliver', 'aaron', 'fred',
    'alex', 'rishi', 'lee', 'jamie', 'justin', 'eric', 'ryan',
  ]);

  /**
   * 从语音名字里猜性别（接口本身不提供性别字段），认不出就返回 null
   * @param {string} voiceName
   * @returns {'male'|'female'|null}
   */
  function guessVoiceGender(voiceName) {

    const tokens = voiceName.toLowerCase().match(/[a-z]+/g) || [];

    if (tokens.some((token) => FEMALE_VOICE_NAMES.has(token))) {

      return 'female';
    }

    if (tokens.some((token) => MALE_VOICE_NAMES.has(token))) {

      return 'male';
    }

    return null;
  }

  /**
   * 从候选语音里挑"最自然"的一个：优先命中 Natural/Neural/Enhanced/Premium 命名，
   * 都没有就用第一个
   * @param {SpeechSynthesisVoice[]} voices
   * @returns {SpeechSynthesisVoice|null}
   */
  function pickMostNaturalVoice(voices) {

    if (voices.length === 0) {

      return null;
    }

    const naturalVoice = voices.find((voice) => /natural|neural|enhanced|premium/i.test(voice.name));

    return naturalVoice || voices[0];
  }

  /**
   * 挑一个用来朗读的英文语音。保存的偏好设置有三种形态：
   * 具体 voiceURI（手动选过某个语音）、"auto:male"/"auto:female"（推荐男声/女声，
   * 按名字猜性别，每次都从当前可用语音里动态挑，不锁定成固定某个语音）、
   * 空串（自动，不分性别，优先 Natural/Neural/Enhanced/Premium）
   * @returns {SpeechSynthesisVoice|null}
   */
  function pickBestEnglishVoice() {

    const voices = getEnglishVoices();

    if (voices.length === 0) {

      return null;
    }

    const saved = loadVoicePreference();

    if (saved === 'auto:male' || saved === 'auto:female') {

      const targetGender = saved === 'auto:male' ? 'male' : 'female';
      const matched = voices.filter((voice) => guessVoiceGender(voice.name) === targetGender);

      // 名字对照表认不出可用语音里任何一个是这个性别时，退回不分性别的通用自动挡
      return pickMostNaturalVoice(matched.length > 0 ? matched : voices);
    }

    const savedVoice = saved && voices.find((voice) => voice.voiceURI === saved);

    if (savedVoice) {

      return savedVoice;
    }

    return pickMostNaturalVoice(voices);
  }

  /**
   * 填充"朗读语音"下拉框：语音列表在部分浏览器（尤其 Chrome）里是异步加载的，
   * 先尝试直接填一次，voiceschanged 事件触发时再补填一次；没有可用英文语音就
   * 保持隐藏（page.html 里默认就是 hidden），不展示一个没用的空下拉框
   * @returns {void}
   */
  function setupVoiceSelect() {

    if (typeof window.speechSynthesis === 'undefined') {

      return;
    }

    const selectEl = document.querySelector('[data-role="voice-select"]');

    if (!selectEl) {

      return;
    }

    function populate() {

      const voices = getEnglishVoices();

      if (voices.length === 0) {

        return;
      }

      // 前面 3 个是"动态挡位"（不锁定成具体某个语音，每次朗读时按当前可用语音重新
      // 挑），后面才是可以手动锁定的具体语音列表
      const optionsHtml = [
        '<option value="">自动（推荐）</option>',
        '<option value="auto:female">推荐女声</option>',
        '<option value="auto:male">推荐男声</option>',
        ...voices.map((voice) => `<option value="${escapeAttr(voice.voiceURI)}">${escapeHtml(voice.name)}（${escapeHtml(voice.lang)}）</option>`),
      ].join('');

      selectEl.innerHTML = optionsHtml;

      const saved = loadVoicePreference();
      const isDynamicSlot = saved === '' || saved === 'auto:male' || saved === 'auto:female';

      // 手动锁定的具体语音如果在当前设备上已经不存在了（比如换了台电脑），退回
      // "自动（推荐）"，不要把下拉框的值设成一个选项列表里根本没有的 voiceURI
      selectEl.value = isDynamicSlot || voices.some((voice) => voice.voiceURI === saved) ? saved : '';
      selectEl.hidden = false;
    }

    populate();
    window.speechSynthesis.addEventListener('voiceschanged', populate);

    selectEl.addEventListener('change', () => {
      saveVoicePreference(selectEl.value);
    });
  }

  /**
   * 朗读前清理掉不适合语音合成引擎念的符号：连续下划线（填空线，比如 "I ___ to
   * school"）会被逐个读成"下划线"，省略号会被读成"点点点"，都会念好几遍很难听——
   * 下划线直接去掉（留一个空格），省略号换成逗号制造停顿感。只影响朗读，页面上
   * 显示的原文本不受影响（这个函数只在 speakText 内部用）
   * @param {string} text
   * @returns {string}
   */
  function sanitizeSpeechText(text) {

    return text
      .replace(/_{2,}/g, ' ')
      .replace(/\.{2,}/g, ',')
      .replace(/\s+/g, ' ')
      .trim();
  }

  /**
   * 用浏览器自带的语音合成朗读一段英文；不支持的浏览器（极少见）静默跳过
   * @param {string} text
   * @param {{ rate?: number, onEnd?: Function, onError?: Function }} [options] - 句子训练用：
   *   语速、念完回调（用来做单句循环）、出错回调；普通 ▶ 按钮不传
   * @returns {void}
   */
  function speakText(text, options = {}) {

    if (!text || typeof window.speechSynthesis === 'undefined') {

      return;
    }

    // 先打断上一次还没念完的朗读，避免连续点击时声音叠在一起
    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(sanitizeSpeechText(text));
    const voice = pickBestEnglishVoice();

    if (voice) {
      utterance.voice = voice;
      utterance.lang = voice.lang;
    } else {
      utterance.lang = 'en-US';
    }

    utterance.rate = options.rate || 1;

    if (options.onEnd) {
      utterance.onend = options.onEnd;
    }

    if (options.onError) {
      utterance.onerror = options.onError;
    }

    window.speechSynthesis.speak(utterance);
  }

  /**
   * 渲染常驻信息（note / kind）；无内容时返回空串
   * @param {object} section
   * @param {object} item
   * @returns {string}
   */
  function formatResident(section, item) {

    const field = RESIDENT_FIELD[section.type];

    if (!field || !item[field]) {

      return '';
    }

    return `<div class="resident resident--${field}">${escapeHtml(item[field])}</div>`;
  }

  // ── 阅读进度（已看标记 + 上次看到的位置） ───────────────────────────
  // 跟收藏存在同一个 localStorage 列表里（livenotes:favorites），借用收藏的 Gist 同步 / 导出导入，
  // 用三种 kind 区分：
  //   read     每篇一条，id = <课程>::<文档 slug>，read: true/false（取消标记保留 false 用于同步覆盖）
  //   position 每门课一条，id = <课程>，上次看到的文档 + 滚动比例
  //   course   每门课一条，id = <课程>，总篇数，给网站首页算"已看 x / 总数"
  // 收藏的 doc / item 记录是按文档 slug 区分的，不同课程同名文档会串；进度记录都带课程前缀，不会串

  /**
   * 当前课程在进度记录里的标识：课程短标识为空（本地临时构建没传 --title）时用固定兜底，
   * 因为同步合并会丢弃 id 为空的记录
   * @returns {string}
   */
  function getCourseKey() {

    return currentCourseLabel() || 'livenotes';
  }

  /**
   * 当前课程已看过的文档 slug 集合
   * @returns {Set<string>}
   */
  function loadReadSlugs() {

    const courseKey = getCourseKey();

    return new Set(
      loadFavorites()
        .filter((fav) => fav.kind === 'read' && fav.read && fav.courseLabel === courseKey)
        .map((fav) => fav.docSlug)
    );
  }

  /**
   * 设置某篇的已看状态，状态没变就不写（避免无意义地触发同步推送）
   * @param {string} slug
   * @param {boolean} isRead
   * @returns {void}
   */
  function setDocRead(slug, isRead) {

    const courseKey = getCourseKey();
    const id = `${courseKey}::${slug}`;
    const list = loadFavorites();
    const index = favoriteIndex(list, 'read', id);
    const now = new Date().toISOString();


    if (index >= 0 && Boolean(list[index].read) === isRead) {

      return;
    }

    const record = { kind: 'read', id, courseLabel: courseKey, docSlug: slug, read: isRead, readAt: isRead ? now : null, updatedAt: now };

    if (index >= 0) {
      list[index] = record;
    } else {
      list.push(record);
    }

    persistFavorites(list);
    updateReadProgressUI();
  }

  /**
   * 底部"已看完"按钮：手动切换；手动取消后本次打开期间不再自动标回去
   * @param {string} slug
   * @returns {void}
   */
  function toggleDocRead(slug) {

    const isRead = loadReadSlugs().has(slug);

    if (isRead) {
      state.manualUnreadSlugs.add(slug);
    } else {
      state.manualUnreadSlugs.delete(slug);
    }

    setDocRead(slug, !isRead);
  }

  /**
   * 渲染正文末尾的"已看完"切换按钮（也是自动标记判断"滚动到底部"的参照位置）
   * @param {string} slug
   * @returns {string}
   */
  function renderReadToggle(slug) {

    const isRead = loadReadSlugs().has(slug);

    return `
      <div class="read-toggle-row" data-role="read-toggle">
        <button type="button" class="btn read-toggle${isRead ? ' is-read' : ''}" data-action="toggle-read" data-slug="${escapeAttr(slug)}">${isRead ? '✓ 已看完' : '标记为已看完'}</button>
      </div>`;
  }

  /**
   * 按当前记录刷新所有进度显示：侧边栏 ✓、章节 x/y、整门课进度、正文底部按钮。
   * 原地改 DOM，不重绘侧边栏（重绘会丢掉章节展开状态和当前高亮）
   * @returns {void}
   */
  function updateReadProgressUI() {

    if (!state.data.tree) {

      return;
    }

    const readSlugs = loadReadSlugs();


    document.querySelectorAll('.doc-item[data-slug]').forEach((itemEl) => {
      itemEl.classList.toggle('is-read', readSlugs.has(itemEl.dataset.slug));
    });

    document.querySelectorAll('.chapter[data-chapter-index]').forEach((chapterEl) => {
      const group = state.data.tree[Number(chapterEl.dataset.chapterIndex)];
      const readCount = group ? group.files.filter((file) => readSlugs.has(file.slug)).length : 0;
      const progressEl = chapterEl.querySelector('.chapter-progress');

      if (progressEl && group) {
        progressEl.textContent = `${readCount}/${group.files.length}`;
        progressEl.classList.toggle('is-done', readCount === group.files.length);
      }
    });

    const courseProgressEl = document.querySelector('[data-role="course-progress"]');

    if (courseProgressEl) {
      const readCount = state.data.docs.filter((doc) => readSlugs.has(doc.slug)).length;

      courseProgressEl.textContent = `已看 ${readCount} / ${state.data.docs.length}`;
    }

    // 正文底部按钮可能是同步合并后状态变了，原地更新文字
    const toggleEl = document.querySelector('[data-action="toggle-read"]');

    if (toggleEl) {
      const isRead = readSlugs.has(toggleEl.dataset.slug);

      toggleEl.classList.toggle('is-read', isRead);
      toggleEl.textContent = isRead ? '✓ 已看完' : '标记为已看完';
    }
  }

  /**
   * 自动标记判断：正文视图、停留够 AUTO_READ_DELAY_MS、底部"已看完"按钮已经进入可视区域
   * @returns {void}
   */
  function checkAutoRead() {

    if (state.view !== 'doc' || !state.data.tree) {

      return;
    }

    const slug = currentSlug();

    if (!slug || state.manualUnreadSlugs.has(slug) || Date.now() - state.docOpenedAt < AUTO_READ_DELAY_MS) {

      return;
    }

    const toggleRowEl = document.querySelector('[data-role="read-toggle"]');

    if (toggleRowEl && toggleRowEl.getBoundingClientRect().top <= window.innerHeight) {
      setDocRead(slug, true);
    }
  }

  /**
   * 打开文档后等停留时间够了再检查一次——短文档一屏就显示完，不会有滚动事件触发检查
   * @returns {void}
   */
  function scheduleAutoReadCheck() {

    clearTimeout(state.autoReadTimer);

    const remaining = Math.max(0, AUTO_READ_DELAY_MS - (Date.now() - state.docOpenedAt));

    state.autoReadTimer = setTimeout(checkAutoRead, remaining + 50);
  }

  /**
   * 当前页面滚动到了全文的百分之多少（0～1）
   * @returns {number}
   */
  function getCurrentScrollRatio() {

    const scrollable = document.documentElement.scrollHeight - window.innerHeight;

    if (scrollable <= 0) {

      return 0;
    }

    return Math.min(1, Math.max(0, window.scrollY / scrollable));
  }

  /**
   * 当前课程的"上次看到"记录
   * @returns {object|null}
   */
  function loadPositionRecord() {

    const courseKey = getCourseKey();

    return loadFavorites().find((fav) => fav.kind === 'position' && fav.id === courseKey) || null;
  }

  /**
   * 记录当前课程看到哪一篇、滚动到哪；跟已有记录基本一样就不写，避免频繁触发同步推送
   * @param {number} scrollRatio - 0～1
   * @returns {void}
   */
  function saveReadingPosition(scrollRatio) {

    const doc = findDoc(currentSlug());

    if (!state.data.tree || !doc) {

      return;
    }

    const courseKey = getCourseKey();
    const ratio = Math.round(scrollRatio * 1000) / 1000;
    const list = loadFavorites();
    const index = favoriteIndex(list, 'position', courseKey);
    const existing = index >= 0 ? list[index] : null;


    if (existing && existing.docSlug === doc.slug && Math.abs((existing.scrollRatio || 0) - ratio) < 0.01) {

      return;
    }

    const record = {
      kind: 'position', id: courseKey, courseLabel: courseKey, docSlug: doc.slug, docTitle: doc.title,
      chapter: doc.chapter, scrollRatio: ratio, updatedAt: new Date().toISOString(),
    };

    if (index >= 0) {
      list[index] = record;
    } else {
      list.push(record);
    }

    persistFavorites(list);
  }

  /**
   * 写入 / 更新当前课程的总篇数记录（网站首页算进度用），没变就不写
   * @returns {void}
   */
  function ensureCourseMeta() {

    const courseKey = getCourseKey();
    const docCount = state.data.docs.length;
    const list = loadFavorites();
    const index = favoriteIndex(list, 'course', courseKey);


    if (index >= 0 && list[index].docCount === docCount) {

      return;
    }

    const record = { kind: 'course', id: courseKey, courseLabel: courseKey, docCount, updatedAt: new Date().toISOString() };

    if (index >= 0) {
      list[index] = record;
    } else {
      list.push(record);
    }

    persistFavorites(list);
  }

  /**
   * 渲染正文顶部的"上次看到"提示条，没有要提示的就返回空串
   * @returns {string}
   */
  function renderResumeHint() {

    const hint = state.resumeHint;

    if (!hint || state.isResumeHintDismissed) {

      return '';
    }

    const percent = Math.round((hint.scrollRatio || 0) * 100);
    const label = [hint.chapter, hint.docTitle].filter(Boolean).join(' · ');

    return `
      <div class="resume-hint" data-role="resume-hint">
        <span class="resume-hint-text">上次看到：${escapeHtml(label)}${percent > 0 ? `（${percent}%）` : ''}</span>
        <span class="resume-hint-actions">
          <button type="button" class="btn btn-sync-primary" data-action="resume-continue">继续</button>
          <button type="button" class="btn" data-action="resume-dismiss" aria-label="关闭提示">×</button>
        </span>
      </div>`;
  }

  /**
   * 按最新的位置记录重新决定要不要提示，并原地更新提示条（页面初始化、同步拉取合并后调用）。
   * 上次看到的就是现在打开的第一篇开头时不提示
   * @returns {void}
   */
  function refreshResumeHint() {

    if (state.isResumeHintDismissed) {

      return;
    }

    const record = loadPositionRecord();
    const isSameAsNow = record && record.docSlug === currentSlug() && (record.scrollRatio || 0) < 0.05;

    state.resumeHint = record && findDoc(record.docSlug) && !isSameAsNow ? record : null;

    const existingEl = document.querySelector('[data-role="resume-hint"]');

    if (existingEl) {
      existingEl.remove();
    }

    const contentEl = document.querySelector('[data-role="content"]');

    if (state.view === 'doc' && contentEl) {
      contentEl.insertAdjacentHTML('afterbegin', renderResumeHint());
    }
  }

  /**
   * 点"继续"：跳到上次那一篇，展开它所在的章节，并滚动到上次的位置
   * @returns {void}
   */
  function continueFromResumeHint() {

    const hint = state.resumeHint;

    if (!hint) {

      return;
    }

    selectDoc(hint.docSlug);

    const itemEl = document.querySelector(`.doc-item[data-slug="${CSS.escape(hint.docSlug)}"]`);
    const chapterEl = itemEl ? itemEl.closest('.chapter') : null;

    if (chapterEl) {
      chapterEl.open = true;
    }

    const ratio = hint.scrollRatio || 0;
    const scrollable = document.documentElement.scrollHeight - window.innerHeight;

    window.scrollTo({ top: Math.max(0, scrollable * ratio) });
    saveReadingPosition(ratio);
  }

  /**
   * 点"×"：关闭提示，本次打开期间不再出现
   * @returns {void}
   */
  function dismissResumeHint() {

    state.isResumeHintDismissed = true;
    state.resumeHint = null;

    const hintEl = document.querySelector('[data-role="resume-hint"]');

    if (hintEl) {
      hintEl.remove();
    }
  }

  /**
   * 页面初始化时接入阅读进度：写课程总篇数、决定要不要提示上次位置、监听滚动和离开页面
   * @returns {void}
   */
  function setupReadingProgress() {

    let isScrollCheckQueued = false;


    // 刷新页面时浏览器默认会恢复到原来的滚动位置，顶部的"上次看到"提示就被滚出视野；
    // 位置由提示条的"继续"负责恢复，这里关掉浏览器的自动恢复
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }

    ensureCourseMeta();
    refreshResumeHint();

    // 滚动：自动标记检查用 requestAnimationFrame 合并；提示条还在时滚动不算"开始在这里读"
    window.addEventListener('scroll', () => {

      if (!state.resumeHint || state.isResumeHintDismissed) {
        state.isPositionDirty = true;
      }

      if (isScrollCheckQueued) {
        return;
      }

      isScrollCheckQueued = true;

      requestAnimationFrame(() => {
        isScrollCheckQueued = false;
        checkAutoRead();
      });
    }, { passive: true });

    // 切到别的标签页 / App、关闭页面时记录看到哪；不在滚动时实时写，避免频繁触发同步
    const savePositionOnLeave = () => {

      if (state.isPositionDirty && state.view === 'doc') {
        saveReadingPosition(getCurrentScrollRatio());
      }
    };

    document.addEventListener('visibilitychange', () => {

      if (document.visibilityState === 'hidden') {
        savePositionOnLeave();
      }
    });

    window.addEventListener('pagehide', savePositionOnLeave);
  }

  /**
   * 渲染侧边栏章节树（仅 index 模式）
   * @param {{ chapter: string, files: object[] }[]} tree
   * @returns {void}
   */
  function renderSidebar(tree) {

    const sidebarEl = document.querySelector('[data-role="sidebar"]');
    const favorites = loadFavorites();

    const groupsHtml = tree.map((group, groupIndex) => {

      const linksHtml = group.files.map((file) => {

        const docRecord = favorites.find((fav) => fav.kind === 'doc' && fav.id === file.slug);
        const favorited = Boolean(docRecord && docRecord.favorited);

        return `
        <li class="doc-item" data-slug="${escapeAttr(file.slug)}">
          <button type="button" class="doc-link" data-slug="${escapeAttr(file.slug)}"><span class="doc-read-mark" aria-hidden="true">✓</span>${escapeHtml(file.title || file.slug)}</button>
          <button type="button" class="fav-btn${favorited ? ' is-favorited' : ''}" data-action="toggle-favorite-doc" data-slug="${escapeAttr(file.slug)}" aria-label="收藏整篇">${favorited ? '★' : '☆'}</button>
        </li>`;
      }).join('');

      // 默认展开第一个章节
      return `
        <details class="chapter"${groupIndex === 0 ? ' open' : ''} data-chapter-index="${groupIndex}">
          <summary class="chapter-title">${escapeHtml(group.chapter)}<span class="chapter-progress"></span></summary>
          <ul class="doc-list">${linksHtml}</ul>
        </details>`;
    }).join('');

    // 构建期传了 homeLink 才显示"返回全部课程"，本地单独跑一门课时不出现；固定贴在
    // 侧边栏最底部（配合 .sidebar-scroll 的 flex 布局，章节数少时也不会往上飘），
    // 避免跟上面的章节/文件点击混在一起
    const homeLink = state.data.homeLink;
    const homeLinkHtml = homeLink
      ? `<a class="sidebar-home" href="${escapeAttr(homeLink)}">◀ 全部课程</a>`
      : '';

    sidebarEl.innerHTML = `<div class="sidebar-scroll"><div class="course-progress" data-role="course-progress"></div>${groupsHtml}</div>${homeLinkHtml}`;
    updateReadProgressUI();
  }

  /**
   * 高亮侧边栏中当前篇对应的链接

  /**
   * 渲染内容区最下面的一组按钮（EN⇄CN / 全部展开收起），跟顶部的按钮共用同一个 data-action，
   * 点击行为、状态同步都自动一致——划到内容底部不用再翻回顶部就能切换
   * @param {string} [leadingHtml] - 排在最前面的额外按钮（目前只有测验视图的"换一批"用），
   *   跟后面几个按钮之间留一道更宽的间隔（见 style.css 的 .bottom-controls-leading）

  /**
   * 把当前视图写到 body 的 data-view 上，CSS 据此隐藏在当前视图里不起作用的按钮
   * （「全部展开/收起」和「⇄」在收藏 / 听力 / 训练视图里点了没反应，直接不显示）
   * @returns {void}
   */
  function syncBodyView() {

    document.body.dataset.view = state.view;
  }

  /**
   * 渲染"泛读精读"卡片列表：播放 + 三级顺序揭示（原文→讲解）+ 精选词点击，
   * 跟其它类型的"EN⇄CN 翻面"完全独立，不复用 formatSide/RESIDENT_FIELD/SPEAK_FIELD
   * @param {object} doc - NoteDoc
   * @param {object} section - type 为 'reading' 的 Section
   * @param {Set<string>} expanded - 该篇已展开的 key 集合（loadExpanded 结果，同一套持久化机制）
   * @param {Set<string>} favoriteIds - 该篇已收藏的 item id 集合（`${docSlug}::${key}` 形式）
   * @returns {string}
   */
  function renderReadingItems(doc, section, expanded, favoriteIds) {

    const itemsHtml = section.items.map((item, index) => {

      const baseKey = `reading:${index}`;
      const showText = expanded.has(`${baseKey}:text`);
      const showExplain = expanded.has(`${baseKey}:explain`);
      const favorited = favoriteIds.has(`${doc.slug}::${baseKey}`);

      const originalHtml = renderReadingOriginal(item.en.text || '', item.vocab, baseKey, expanded);
      const grammarHtml = item.grammar
        ? `<div class="reading-grammar">${escapeHtml(item.grammar)}</div>`
        : '';

      // 播放/收藏按钮放进 .item-actions（margin-left: auto 顶到最右边），跟听力页面
      // 卡片是同一套布局类（.side-cells-row + .item-actions），样式尺寸自动保持一致
      return `
        <li class="item reading-item${showText ? ' show-text' : ''}${showExplain ? ' show-explain' : ''}" data-key="${baseKey}">
          <div class="reading-controls side-cells-row">
            <button type="button" class="btn reading-reveal-btn" data-action="reveal-reading-text">查看原文</button>
            <button type="button" class="btn reading-reveal-btn" data-action="reveal-reading-explain">查看讲解</button>
            <div class="item-actions">
              <button type="button" class="fav-btn${favorited ? ' is-favorited' : ''}" data-action="toggle-favorite-item" aria-label="收藏">${favorited ? '★' : '☆'}</button>
              ${renderSpeakButton('reading', item.en)}
            </div>
          </div>
          <div class="reading-text">${originalHtml}</div>
          <div class="reading-explain">
            <div class="reading-gist">${escapeHtml(item.cn.gist || '')}</div>
            ${grammarHtml}
          </div>
        </li>`;
    }).join('');

    return `<ul class="item-list reading-list">${itemsHtml}</ul>`;
  }

  /**
   * 渲染原文，把 vocab 列表里的词/短语在原文中原地标出、做成可点击展开
   * @param {string} text - 原文（item.en.text）
   * @param {{word: string, note: string}[]} vocabList - item.vocab，解析器已拆好的词汇点
   * @param {string} baseKey - 该 item 的 key（形如 "reading:0"）
   * @param {Set<string>} expanded - 该篇已展开的 key 集合，用于恢复词汇点的展开状态
   * @returns {string}
   */
  function renderReadingOriginal(text, vocabList, baseKey, expanded) {

    if (!vocabList || vocabList.length === 0) {

      return `<span class="reading-original">${escapeHtml(text)}</span>`;
    }

    // 按词在原文中第一次出现的位置排序；原文里找不到的词（比如大小写没对上）直接跳过，
    // 不影响其它词的高亮，也不影响原文本身的显示
    const matches = vocabList
      .map((entry, vocabIndex) => ({ ...entry, vocabIndex, start: text.indexOf(entry.word) }))
      .filter((entry) => entry.start !== -1)
      .sort((a, b) => a.start - b.start);

    let cursor = 0;
    let html = '';

    for (const match of matches) {

      // 跳过与上一个已处理片段重叠的词（比如一个词是另一个已标注词的子串）
      if (match.start < cursor) {

        continue;
      }

      html += escapeHtml(text.slice(cursor, match.start));

      const vocabKey = `${baseKey}:vocab:${match.vocabIndex}`;
      const isOpen = expanded.has(vocabKey);

      html += `<span class="vocab-word${isOpen ? ' is-open' : ''}" data-action="toggle-reading-vocab" data-vocab-key="${escapeAttr(vocabKey)}">${escapeHtml(match.word)}</span>`;
      html += `<span class="vocab-note${isOpen ? ' is-open' : ''}">${escapeHtml(match.note)}</span>`;

      cursor = match.start + match.word.length;
    }

    html += escapeHtml(text.slice(cursor));

    return `<span class="reading-original">${html}</span>`;
  }

  /**
   * 展开/收起阅读卡片的"原文"或"讲解"区块——可反复开合（跟"查看原文"按钮本身
   * 常驻不消失是配套的：按钮一直在，点它就是切换这个区块的显隐）
   * @param {HTMLElement} actionEl - 被点击的按钮
   * @param {'text'|'explain'} stage
   * @returns {void}
   */
  function handleRevealReadingStage(actionEl, stage) {

    const itemEl = actionEl.closest('.reading-item');

    if (!itemEl) {

      return;
    }

    const isShown = itemEl.classList.toggle(stage === 'text' ? 'show-text' : 'show-explain');

    const slug = currentSlug();

    if (!slug) {

      return;
    }

    const expanded = loadExpanded(slug);
    const key = `${itemEl.dataset.key}:${stage}`;

    if (isShown) {
      expanded.add(key);
    } else {
      expanded.delete(key);
    }

    saveExpanded(slug, expanded);
  }

  /**
   * 展开/收起某个精选词的解释——可反复开合，跟原文/讲解的单向揭示不同
   * @param {HTMLElement} actionEl - 被点击的词（.vocab-word）
   * @returns {void}
   */
  function handleToggleReadingVocab(actionEl) {

    const isOpen = actionEl.classList.toggle('is-open');
    const noteEl = actionEl.nextElementSibling;

    if (noteEl && noteEl.classList.contains('vocab-note')) {
      noteEl.classList.toggle('is-open', isOpen);
    }

    const slug = currentSlug();
    const vocabKey = actionEl.dataset.vocabKey;

    if (!slug || !vocabKey) {

      return;
    }

    const expanded = loadExpanded(slug);

    if (isOpen) {
      expanded.add(vocabKey);
    } else {
      expanded.delete(vocabKey);
    }

    saveExpanded(slug, expanded);
  }

  /**
   * 渲染内容区：某个 NoteDoc 的三段表格
   * @param {object} doc - NoteDoc
   * @returns {void}
   */
  function renderContent(doc) {

    const contentEl = document.querySelector('[data-role="content"]');

    syncBodyView();

    const shownSide = state.mode;
    const hiddenSide = state.mode === 'en' ? 'cn' : 'en';

    // 恢复该篇已展开的 item
    const expanded = loadExpanded(doc.slug);

    // 该篇内已收藏的 item id 集合，用于渲染每个 item 的收藏星标状态
    const favoriteIds = new Set(
      loadFavorites().filter((fav) => fav.kind === 'item' && fav.favorited).map((fav) => fav.id)
    );

    const sectionsHtml = doc.sections.map((section) => {

      // 泛读精读表是完全独立的一套渲染逻辑（播放 + 三级顺序揭示 + 点词），不走下面
      // 「EN⇄CN 翻面」这套通用逻辑，提前返回
      if (section.type === 'reading') {

        return `
        <section class="section section--reading">
          <h2 class="section-title">${escapeHtml(section.heading)}</h2>
          ${renderReadingItems(doc, section, expanded, favoriteIds)}
        </section>`;
      }

      const itemsHtml = section.items.map((item, index) => {

        const key = `${section.type}:${index}`;
        const expandedClass = expanded.has(key) ? ' is-expanded' : '';
        const favorited = favoriteIds.has(`${doc.slug}::${key}`);

        return `
          <li class="item${expandedClass}" data-key="${key}">
            <div class="shown-side">
              <div class="side-cells-row">
                ${formatSide(section.type, shownSide, item[shownSide])}
                <div class="item-actions">
                  ${renderSpeakButton(section.type, item.en)}
                  <button type="button" class="fav-btn${favorited ? ' is-favorited' : ''}" data-action="toggle-favorite-item" aria-label="收藏">${favorited ? '★' : '☆'}</button>
                </div>
              </div>
            </div>
            <div class="hidden-side">${formatSide(section.type, hiddenSide, item[hiddenSide])}</div>
            ${formatResident(section, item)}
          </li>`;
      }).join('');

      return `
        <section class="section section--${section.type}">
          <h2 class="section-title">${escapeHtml(section.heading)}</h2>
          <ul class="item-list">${itemsHtml}</ul>
        </section>`;
    }).join('');

    const chapterLabelHtml = doc.chapter
      ? `<div class="doc-chapter-label">${escapeHtml(doc.chapter)}</div>`
      : '';

    // 标题单独一行、上一节/下一节按钮另起一行——标题长的时候（比如带来源标注）挤在
    // 同一行里，按钮会把标题挤得很窄，手机上尤其明显，分开两行各自占满宽度更稳
    const titleRowHtml = state.data.tree
      ? `<h2 class="doc-title">${escapeHtml(doc.title || doc.slug)}</h2>
        <div class="doc-pager doc-pager--top">
          ${renderDocPagerButton(getAdjacentDoc(doc.slug, -1), -1)}
          ${renderDocPagerButton(getAdjacentDoc(doc.slug, 1), 1)}
        </div>`
      : `<h2 class="doc-title">${escapeHtml(doc.title || doc.slug)}</h2>`;

    const headerHtml = `<header class="doc-header">${chapterLabelHtml}${titleRowHtml}</header>`;

    contentEl.innerHTML = `
      ${renderResumeHint()}
      ${headerHtml}
      ${sectionsHtml}
      ${state.data.tree ? renderReadToggle(doc.slug) : ''}
      ${renderBottomControls()}
      ${renderDocPager(doc.slug)}`;

    scheduleAutoReadCheck();

    updateAppTitle(doc.chapter);

    // 根据这篇实际的展开状态同步"全部展开/收起"切换按钮的图标（+ / −）
    const totalItems = doc.sections.reduce((sum, section) => sum + section.items.length, 0);
    state.allExpanded = totalItems > 0 && expanded.size === totalItems;
    updateExpandToggleIcon();
  }

  /**
   * 渲染收藏列表视图顶部的导出/导入/同步工具条 + 展开时的同步设置面板
   * @returns {string}

          嫌手动复制粘贴麻烦的话，也可以"导出配置"存成文件，去别的设备/别的网址上"导入配置"
