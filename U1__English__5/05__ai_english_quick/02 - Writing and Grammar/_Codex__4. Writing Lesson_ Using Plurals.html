  <style>/*
 * style.css — livenotes 响应式样式
 *
 * 侧边栏始终 position: fixed 悬浮，不占文档流宽度：
 *   宽屏（>= 900px）：默认展开，.is-collapsed 收起；右边缘可拖拽调宽；正文相对整个视口居中
 *   窄屏：默认收起（抽屉），.is-open 滑入；内容单栏铺满，没有拖拽调宽
 * 热区按钮 >= 44px，不依赖 :hover（用 :active / :focus-visible）
 * 详见 ARCHITECTURE.md §4「布局」
 */

:root {
  --breakpoint: 900px;
  --hit-size: 44px;
  --sidebar-width: 288px;
  --sidebar-min-width: 220px;
  --sidebar-max-width: 480px;
  --topbar-h: 56px;
  --content-max: 760px;
  --radius: 10px;
  --gap: 16px;

  /* 配色令牌（浅色为主） */
  --color-bg: #ffffff;
  --color-surface: #ffffff;
  --color-text: #1a1a1a;
  --color-muted: #6b7280;
  --color-border: #e5e7eb;
  --color-accent: #2563eb;
  --color-on-accent: #ffffff;

  /* 隐藏侧展开后的背景，与显示侧区分 */
  --mask-bg: #f3f4f6;

  --shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.05);
}

/*
 * 主题：每个主题只覆盖约 9 个配色令牌，布局规则复用。
 * 默认（无 data-theme）= 浅色；data-theme="auto" 跟随系统浅 / 深。
 * 主题 id 与 template/app.js 的 THEMES 列表一一对应。
 */

/* 跟随系统：仅当系统为深色时套用「石墨深色」令牌 */
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    --color-bg: #0f1115;
    --color-surface: #171a21;
    --color-text: #e6e8eb;
    --color-muted: #9aa3af;
    --color-border: #2a2f3a;
    --color-accent: #60a5fa;
    --color-on-accent: #0f1115;
    --mask-bg: #232a36;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 16px rgba(0, 0, 0, 0.35);
  }
}

/* 纸质 Sepia：暖米黄，经典阅读模式 */
:root[data-theme="sepia"] {
  --color-bg: #f4ecd8;
  --color-surface: #faf4e4;
  --color-text: #5b4636;
  --color-muted: #8c7a63;
  --color-border: #e2d6bb;
  --color-accent: #a3682f;
  --color-on-accent: #faf4e4;
  --mask-bg: #ece0c6;
  --shadow: 0 1px 2px rgba(91, 70, 54, 0.10), 0 4px 12px rgba(91, 70, 54, 0.07);
}

/* Gruvbox Light：暖米黄底、深棕字，跟已有的 Gruvbox 深色配对 */
:root[data-theme="gruvbox-light"] {
  --color-bg: #fbf1c7;
  --color-surface: #f9f5d7;
  --color-text: #3c3836;
  --color-muted: #7c6f64;
  --color-border: #ebdbb2;
  --color-accent: #af3a03;
  --color-on-accent: #fbf1c7;
  --mask-bg: #ebdbb2;
  --shadow: 0 1px 2px rgba(60, 56, 54, 0.10), 0 4px 12px rgba(60, 56, 54, 0.07);
}

/* 牛皮纸 Kraft：更深一点的黄褐色底，强调色用烧橙棕 */
:root[data-theme="kraft"] {
  --color-bg: #e8dcc3;
  --color-surface: #f0e6d2;
  --color-text: #4a3f2f;
  --color-muted: #8a7a63;
  --color-border: #d4c4a0;
  --color-accent: #b5651d;
  --color-on-accent: #f0e6d2;
  --mask-bg: #ddcfab;
  --shadow: 0 1px 2px rgba(74, 63, 47, 0.12), 0 4px 12px rgba(74, 63, 47, 0.08);
}

/* 米黄旧纸 Parchment：比 Sepia 更浅更柔和的米白纸感 */
:root[data-theme="parchment"] {
  --color-bg: #f7f3e9;
  --color-surface: #fbf8f0;
  --color-text: #3a3a35;
  --color-muted: #7a7566;
  --color-border: #e5ddc8;
  --color-accent: #8c6d46;
  --color-on-accent: #fbf8f0;
  --mask-bg: #eee6d3;
  --shadow: 0 1px 2px rgba(58, 58, 53, 0.08), 0 4px 12px rgba(58, 58, 53, 0.05);
}

/* Solarized Light */
:root[data-theme="solarized-light"] {
  --color-bg: #fdf6e3;
  --color-surface: #fdf6e3;
  --color-text: #586e75;
  --color-muted: #93a1a1;
  --color-border: #e6dfc6;
  --color-accent: #268bd2;
  --color-on-accent: #fdf6e3;
  --mask-bg: #eee8d5;
  --shadow: 0 1px 2px rgba(101, 123, 131, 0.10), 0 4px 12px rgba(101, 123, 131, 0.06);
}

/* 石墨深色：中性深灰 */
:root[data-theme="graphite"] {
  --color-bg: #0f1115;
  --color-surface: #171a21;
  --color-text: #e6e8eb;
  --color-muted: #9aa3af;
  --color-border: #2a2f3a;
  --color-accent: #60a5fa;
  --color-on-accent: #0f1115;
  --mask-bg: #232a36;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 16px rgba(0, 0, 0, 0.35);
}

/* Solarized Dark */
:root[data-theme="solarized-dark"] {
  --color-bg: #002b36;
  --color-surface: #073642;
  --color-text: #93a1a1;
  --color-muted: #657b83;
  --color-border: #0b3f4c;
  --color-accent: #268bd2;
  --color-on-accent: #fdf6e3;
  --mask-bg: #0b4a5a;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.45), 0 6px 16px rgba(0, 0, 0, 0.40);
}

/* Nord：冷蓝极简 */
:root[data-theme="nord"] {
  --color-bg: #2e3440;
  --color-surface: #343b49;
  --color-text: #d8dee9;
  --color-muted: #8b98b0;
  --color-border: #434c5e;
  --color-accent: #88c0d0;
  --color-on-accent: #2e3440;
  --mask-bg: #3b4252;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.40), 0 6px 16px rgba(0, 0, 0, 0.32);
}

/* Gruvbox：暖褐复古 */
:root[data-theme="gruvbox"] {
  --color-bg: #282828;
  --color-surface: #32302f;
  --color-text: #ebdbb2;
  --color-muted: #a89984;
  --color-border: #504945;
  --color-accent: #fe8019;
  --color-on-accent: #282828;
  --mask-bg: #3c3836;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.42), 0 6px 16px rgba(0, 0, 0, 0.34);
}

* { box-sizing: border-box; }

/*
 * iOS 部分容器 App（比如 Documents by Readdle）内置的网页预览会把"点一下页面"识别成
 * "切换阅读器顶部工具栏"的手势，点整行揭示/按钮时会跟着一起触发，体验很差。
 * touch-action: manipulation 去掉双击缩放的判定延迟，让单击更快被网页自己的点击逻辑
 * 消费掉，减少被宿主 App 误判成"点了空白页面"的概率（如果宿主用的是原生手势识别器，
 * 这个也不一定完全压得住，是尽力而为的兼容写法）。
 */
.item, .doc-link, .btn, .fav-btn, .mark-btn, .fav-jump, .speak-btn,
.drawer-toggle, .theme-picker-wrap, .sidebar-resizer {
  touch-action: manipulation;
}

body {
  margin: 0;
  font-size: clamp(15px, 2.5vw, 17px);
  line-height: 1.6;
  color: var(--color-text);
  background: var(--color-bg);
  font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  overflow-x: hidden; /* 禁止横向溢出 */
}

/* ── 顶部工具条 ───────────────────────────── */
.topbar {
  position: sticky;
  top: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: var(--topbar-h);
  padding: 8px 16px;
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

/* 标题跟 ☰ 按钮一样能点，触发同一个 toggleSidebar（见 page.html 的 data-action），
   加个手型光标 + 点击反馈，不然看不出能点 */
.app-title {
  margin: 0;
  font-size: clamp(15px, 3vw, 18px);
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  transition: opacity 0.15s ease;
}

.app-title:active { opacity: 0.6; }

/* 按钮组靠左排（2026-10-07 用户要求），窄屏也一样；之前是 margin-left: auto 推到最右边 */
.controls {
  margin-left: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

/*
 * 宽屏：标题独立留在左边，按钮组紧跟在标题右边靠左排（2026-10-07 用户要求从居中改成左对齐）。
 * 用 grid 三列（左 / 中 / 右）而不是 position: absolute——之前用绝对定位时，
 * 按钮组一旦在中等宽度下换行变成两行，会因为脱离文档流而跟下方正文重叠
 * （工具条自身高度不会跟着换行长高）。grid 让按钮组留在正常文档流里，
 * 换行时工具条本身会跟着长高，不会盖住正文。
 */
@media (min-width: 901px) {
  .topbar {
    display: grid;
    grid-template-columns: auto 1fr auto;
    column-gap: 12px;
  }

  .topbar-left { grid-column: 1; }

  .app-title { max-width: min(32vw, 400px); }

  .controls {
    grid-column: 2;
    justify-self: start;
    margin-left: 0;
    justify-content: flex-start;
    max-width: min(90vw, 640px);
  }

  .back-link {
    grid-column: 3;
    justify-self: end;
  }
}

.btn {
  min-width: var(--hit-size);
  min-height: var(--hit-size);
  padding: 6px 14px;
  font: inherit;
  color: var(--color-text);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  cursor: pointer;
}

.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

/* EN⇄CN 模式按钮：背景跟「➕/➖」按钮一样用普通 .btn 素色，不用强调色；靠文字区分当前模式 */
.btn-mode {
  white-space: nowrap;
}

/* 「全部展开/收起」合并按钮：➕/➖ 图标本身已经是粗体符号，字号调大一点更醒目 */
.btn-expand-toggle {
  font-size: 20px;
  font-weight: 700;
  line-height: 1;
}

/* 「★ 收藏」入口按钮：平时浅色底，跟收藏星标的金色呼应但不抢眼；打开收藏列表视图时换成强调色 */
.btn-favorites {
  color: #b45f06;
  background: rgba(245, 165, 36, 0.15);
  border-color: rgba(245, 165, 36, 0.5);
}

.btn-favorites.is-active {
  color: var(--color-on-accent);
  background: var(--color-accent);
  border-color: var(--color-accent);
}

/* 「📇 测验」入口按钮：打开测验模式时高亮 */
.btn-quiz.is-active {
  color: var(--color-on-accent);
  background: var(--color-accent);
  border-color: var(--color-accent);
}

/* 「🎧 听力」入口按钮：打开听力视图时高亮，跟测验按钮同一套视觉语言 */
.btn-listening.is-active {
  color: var(--color-on-accent);
  background: var(--color-accent);
  border-color: var(--color-accent);
}

/* ── 句子训练（精听 / 听写 / 选词 / 回译）────────── */

/* 入口按钮、当前标签页、「译」开关、主按钮：激活时都用强调色，跟测验 / 听力按钮一致 */
.btn-training.is-active,
.training-tab.is-active,
.training-cn-toggle.is-active,
.training-primary-btn {
  color: var(--color-on-accent);
  background: var(--color-accent);
  border-color: var(--color-accent);
}

/* 标题前面的「🎯 句子训练」：小号灰字，跟文档标题同一行 */
.training-title-label {
  margin-right: 12px;
  color: var(--color-muted);
  font-size: 0.6em;
  font-weight: 400;
  white-space: nowrap;
  vertical-align: middle;
}

.training-tabs {
  --training-tab-gap: 20px;

  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: var(--training-tab-gap);
  margin-bottom: 12px;
}

.training-settings {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;

  /* 跟上面的播放控制按钮用分隔线分开（设置行挪到按钮下面后，两排按钮挨着看不出分组） */
  padding-top: 12px;
  border-top: 1px solid var(--color-border);
}

/* 「译」跟前面的难度 / 循环 / 语速不是一组功能，多空出一段距离分组 */
.training-settings .training-cn-toggle {
  margin-left: 14px;
}

/* 标签页分两组：精听 / 选词（听）和 听写 / 回译（写），组之间的距离是普通间隔的两倍 */
.training-tab[data-tab="dictation"] {
  margin-left: var(--training-tab-gap);
}

/* 「全部展开/收起」和「⇄」在收藏 / 听力 / 训练视图里不起作用，顶部和底部都不显示（data-view 由 app.js 的 syncBodyView 写） */
body[data-view="favorites"] .btn-expand-toggle,
body[data-view="listening"] .btn-expand-toggle,
body[data-view="training"] .btn-expand-toggle,
body[data-view="favorites"] .btn-mode,
body[data-view="listening"] .btn-mode,
body[data-view="training"] .btn-mode {
  display: none;
}

.training-setting {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--color-muted);
  font-size: 0.9em;
}

.training-setting select {
  min-height: 36px;
  padding: 2px 6px;
  font: inherit;
  color: var(--color-text);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
}

.training-progress {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  color: var(--color-muted);
  font-size: 0.9em;
  white-space: nowrap;
}

.training-progress-bar {
  flex: 1;
  height: 6px;
  overflow: hidden;
  background: var(--mask-bg);
  border-radius: 3px;
}

.training-progress-bar > div {
  height: 100%;
  background: var(--color-accent);
}

.training-card {
  padding: 20px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* 句子按词排成可换行的一行，每个词（含前后标点）不在中间断开 */
.training-sentence {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.3em 0.45em;
  font-size: 1.25em;
  line-height: 1.8;
}

.training-sentence--small {
  font-size: 1em;
}

.training-word {
  white-space: nowrap;
}

/* 精听被遮的词：斜纹块，宽度跟单词长度对应（--len 是字母数），点一下露出来 */
.training-mask {
  display: inline-block;
  width: calc(var(--len) * 0.6em + 10px);
  height: 1.1em;
  padding: 0;
  vertical-align: middle;
  background: repeating-linear-gradient(135deg, var(--color-accent) 0 2px, transparent 2px 6px);
  border: 0;
  border-radius: 3px;
  opacity: 0.55;
  cursor: pointer;
  touch-action: manipulation;
}

.training-revealed {
  color: var(--color-accent);
  border-bottom: 2px solid var(--color-accent);
}

/* 听写输入框：只留下划线，字号 >= 16px 避免 iOS 聚焦时自动放大页面 */
.training-blank {
  width: calc(var(--len) * 0.62em + 18px);
  min-width: 2.2em;
  padding: 0 2px;
  font: inherit;
  font-size: max(1em, 16px);
  color: var(--color-text);
  text-align: center;
  background: transparent;
  border: 0;
  border-bottom: 2px solid var(--color-muted);
  border-radius: 0;
  outline: none;
}

.training-blank:focus {
  border-bottom-color: var(--color-accent);
}

.training-answer {
  font-weight: 600;
}

.training-answer.is-correct { color: #16a34a; }
.training-answer.is-wrong { color: #dc2626; }

/* 用了提示才填对的词 / 用过提示的输入框：橙色，跟自己填对的绿色区分开 */
.training-answer.is-hinted { color: #d97706; }
.training-blank.is-hinted { border-bottom-color: #d97706; }

/* 能点了单独发音的词：平时看不出区别，鼠标移上去 / 按下时给个底色反馈 */
.training-speakable {
  border-radius: 3px;
  cursor: pointer;
  touch-action: manipulation;
}

.training-speakable:hover,
.training-speakable:active {
  background: var(--mask-bg);
}

/* 盲听：揭示前不显示句子，只放一行说明，撑住卡片高度避免揭示时页面跳动太大 */
.training-blind {
  padding: 8px 0;
  color: var(--color-muted);
  font-size: 0.85em;
}

.training-card-tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-top: 14px;
}

.training-card-tools .training-note {
  margin: 0;
}

/* 做完一句后的词汇点 / 讲解（泛读原文才有） */
.training-notes {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--color-border);
  font-size: 0.92em;
}

.training-notes-vocab {
  margin: 0 0 8px;
  padding-left: 1.2em;
}

.training-notes-word {
  font-weight: 600;
  color: var(--color-accent);
}

.training-notes-grammar {
  color: var(--color-muted);
}

/* 进度条右边的"从头开始"：做成文字链接样式，不跟播放控制按钮抢眼 */
.training-link-btn {
  padding: 4px 2px;
  font: inherit;
  color: var(--color-accent);
  background: none;
  border: 0;
  cursor: pointer;
  text-decoration: underline;
}

/* 听写错了：先划掉自己填的，后面跟正确答案 */
.training-given {
  margin-right: 0.25em;
  color: var(--color-muted);
  font-weight: 400;
}

/* 回译里自己多写 / 写错的词 */
.training-word.is-extra {
  color: #d97706;
  text-decoration: line-through;
}

/* 选词的空：下划线，当前要填的那个用强调色 */
.training-slot {
  display: inline-block;
  width: calc(var(--len) * 0.6em + 10px);
  height: 1em;
  border-bottom: 2px solid var(--color-border);
}

.training-slot.is-current {
  border-bottom-color: var(--color-accent);
}

.training-tiles {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 8px;
  margin-top: 20px;
}

.training-tile {
  min-height: var(--hit-size);
  padding: 6px 8px;
  font: inherit;
  font-size: 1.05em;
  color: var(--color-text);
  background: var(--mask-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  cursor: pointer;
  touch-action: manipulation;
}

/* 用过的方块留着空位不挪动，其它方块位置不跳 */
.training-tile.is-used {
  visibility: hidden;
}

.training-tile.is-wrong {
  background: #fbd0d0;
  animation: training-shake 0.3s;
}

@keyframes training-shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

.training-cn {
  margin-top: 12px;
  color: var(--color-muted);
}

.training-note {
  margin: 12px 0 0;
  color: var(--color-muted);
  font-size: 0.85em;
}

.training-backtrans-cn {
  margin-bottom: 12px;
  font-size: 1.15em;
}

.training-backtrans-input {
  box-sizing: border-box;
  width: 100%;
  padding: 10px;
  font: inherit;
  font-size: max(1em, 16px);
  color: var(--color-text);
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  resize: vertical;
}

.training-backtrans-label {
  margin: 12px 0 4px;
  color: var(--color-muted);
  font-size: 0.85em;
}

.training-player {
  --training-player-gap: 35px;

  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: var(--training-player-gap);
  margin: 16px 0;
}

/* 换句按钮跟中间的播放 / 主按钮分组：上一句右边、下一句左边的距离是普通间隔的两倍 */
.training-player [data-action="training-prev"] {
  margin-right: var(--training-player-gap);
}

.training-player [data-action="training-next"] {
  margin-left: var(--training-player-gap);
}

.training-play-btn {
  min-width: 96px;
}

.training-player .btn:disabled {
  opacity: 0.45;
  cursor: default;
}

/* 主按钮做完本句操作后（已检查 / 已对比……）换成灰色素底，一眼看出这句已经做过了 */
.training-player .training-primary-btn:disabled,
.training-player .training-primary-btn.is-done {
  color: var(--color-muted);
  background: var(--mask-bg);
  border-color: var(--color-border);
  opacity: 1;
}

.training-shortcuts {
  margin: 0 0 16px;
  color: var(--color-muted);
  font-size: 0.8em;
  text-align: center;
}

.training-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 10px;
}

.training-stat {
  padding: 12px;
  text-align: center;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
}

.training-stat b {
  display: block;
  font-size: 1.4em;
}

.training-stat span {
  color: var(--color-muted);
  font-size: 0.85em;
}

.training-summary-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 16px 0;
}

.training-review-title {
  margin: 20px 0 8px;
  font-size: 1.05em;
}

.training-review-list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.training-review-item {
  padding: 12px 0;
  border-bottom: 1px solid var(--color-border);
}

/* 朗读语音选择：语音名字长短不一，限个最大宽度，太长的用省略号截断 */
.voice-select {
  max-width: 140px;
  padding: 4px 6px;
  font: inherit;
  color: var(--color-text);
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/*
 * 测验模式评分按钮：3 个对号，点第几个就点亮到第几个（类似打分条）。
 * 用固定的灰 / 黄两色（不用主题令牌），跟收藏星标的金色区分开，避免混淆成同一种标记。
 */
.mark-btn {
  min-width: 32px;
  min-height: var(--hit-size);
  padding: 4px 6px;
  font-size: 16px;
  font-weight: 700;
  color: rgba(128, 128, 128, 0.5);
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  cursor: pointer;
}

.mark-btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

/* 点亮态用实心黄底 + 深色对号，比只变文字颜色更醒目，一眼能扫出点亮了几个 */
.mark-btn.is-filled {
  color: #78350f;
  background: #facc15;
  border-color: #facc15;
}

/*
 * 听力测试选项：纵向堆叠的整行按钮，点了立刻判对错——答对的选项变绿，
 * 选错时被点的那个变红、同时把真正的答案也标绿，方便看清正确答案是哪个。
 * disabled 后不用默认的变灰半透明（会盖掉对/错颜色），保持完全不透明可读。
 */
.listening-question { margin-bottom: 10px; }

/* "查看原文"按钮加宽：用固定 width（不是 min-width）保证一定比文字自然宽度大 */
.listening-reveal-btn { width: 180px; }

.listening-choices {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* 按钮内部纵向堆叠：上面一行是文字+图标，下面是展开后的英文解释，
   两行共用同一个按钮背景色，看起来是一整块 */
.listening-choice-btn {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 6px;
  width: 100%;
  text-align: left;
}

/* 文字靠左，答完题插入的 ✓/✗ 图标（.listening-choice-icon）靠右，
   flex + space-between 两个都有内容时自动分居两端 */
.listening-choice-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
}

/* 对/错只改内部背景色，文字颜色、边框颜色都保持不变 */
.listening-choice-btn.is-correct {
  background: #c8f0d9;
}

.listening-choice-btn.is-wrong {
  background: #fbd0d0;
}

/* 答案下面的英文解释现在是按钮的子元素（不再是兄弟节点），用后代选择器
   让它跟着按钮的对/错背景色走，不用额外加 class */
.listening-choice-btn.is-correct .listening-choice-en {
  background: #c8f0d9;
}

.listening-choice-btn.is-wrong .listening-choice-en {
  background: #fbd0d0;
}

/* 圆形描边小徽章，比单纯的文字颜色更醒目，但不像实心色块那么抢眼 */
.listening-choice-icon {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid currentColor;
  font-size: 13px;
  font-weight: 700;
  line-height: 1;
}

.listening-choice-icon--correct { color: #16a34a; }
.listening-choice-icon--wrong { color: #dc2626; }

/* 每个选项对应的英文原文：答完题才会一起露出来（见 handleListeningChoice），
   再点任意一个选项按钮会一起收起/展开，不是每条单独控制，本身不用单独点击；
   用原生 hidden 属性控制，不要在这里另外写 display，避免跟 [hidden] 的默认隐藏
   样式打架（设置菜单那次就是因为这个才卡住的） */
.listening-choice-en {
  padding: 4px 10px;
  color: var(--color-muted);
  font-size: 0.85em;
  background: var(--mask-bg);
  border-radius: var(--radius);
}

/* 收藏星标按钮：侧边栏文档条目 / item 上通用，已收藏用金色区分（跨主题固定色，保持可辨识） */
.fav-btn {
  flex: 0 0 auto;
  min-width: var(--hit-size);
  min-height: var(--hit-size);
  padding: 4px 10px;
  font-size: 18px;
  line-height: 1;
  color: var(--color-muted);
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  cursor: pointer;
}

.fav-btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

/* 已收藏：实心金底 + 白色星标，跟评分对号的"点亮=实心底"用同一套视觉语言，一眼能看出已收藏 */
.fav-btn.is-favorited {
  color: #ffffff;
  background: #f5a524;
  border-color: #f5a524;
}

/* 「我的收藏」列表里只读展示评分（不可点击），跟评分按钮共用 .mark-btn 样式 */
.mark-badges {
  display: inline-flex;
  gap: 4px;
}

.mark-badges .mark-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: auto;
  cursor: default;
}

/*
 * 主题选择：收起态只显示一个方形色块（颜色跟当前主题一致），不显示主题名字。
 * 原生 select 还在，但整个变透明盖在色块上面——点击色块其实点到的是透明的 select，
 * 照常弹出原生选项列表（列表里的文字正常显示，浏览器原生渲染，不用自己写下拉逻辑）。
 */
.theme-picker-wrap {
  position: relative;
  display: inline-flex;
  min-width: var(--hit-size);
  min-height: var(--hit-size);
}

/*
 * 描边用固定的深浅双层（不用 --color-border）：外圈深、内圈浅，不管色块本身是深是浅，
 * 总有一层能跟它区分开，不会跟当前主题背景糊在一起。再加个 🎨 图标，一眼就能认出是主题按钮，
 * 不用完全依赖色块本身的对比度。
 */
.theme-swatch {
  display: flex;
  align-items: center;
  justify-content: center;
  width: var(--hit-size);
  height: var(--hit-size);
  border-radius: var(--radius);
  border: 1px solid rgba(0, 0, 0, 0.25);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35), 0 1px 2px rgba(0, 0, 0, 0.18);
  font-size: 16px;
  line-height: 1;
}

.theme-select {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
}

.theme-picker-wrap:focus-within .theme-swatch {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}

/* 设置菜单：⚙️ 按钮 + 弹出面板，主题/朗读语音这些不常切换的选项收在里面，
   面板绝对定位悬浮在按钮下方，不占用顶部工具条的常驻宽度 */
.settings-menu-wrap {
  position: relative;
  display: inline-flex;
}

/* 设置按钮：菜单展开时换成强调色底，跟"点亮/按下"的状态呼应，展开收起一眼能看出来 */
.settings-menu-wrap > .btn.is-active {
  color: var(--color-on-accent);
  background: var(--color-accent);
  border-color: var(--color-accent);
}

/* 用 class 控制显示/隐藏，不用 hidden 属性——原生 [hidden] 是靠 display:none 生效的，
   跟这里本来就要写的 display:flex 优先级会打架（同优先级时后写的规则赢，[hidden] 的效果
   反而被盖掉），改成 .is-open 类就没有这个冲突，也是项目里侧边栏抽屉一直用的做法 */
.settings-menu {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 65;
  flex-direction: column;
  gap: 12px;
  min-width: 200px;
  padding: 12px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.settings-menu.is-open {
  display: flex;
}

/* 文字标签和控件各占一行（而不是同一行左右分布）：面板宽度有限，语音名字这种长文本
   跟中文标签挤在同一行，标签会因为没有空间被迫一个字一个字往下换行 */
.settings-menu-item {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  font-size: 0.9em;
}

/* 主题这一项空间够（色块按钮宽度固定，不像语音名字那样长短不一），改回同一行：
   文字靠左，色块按钮靠右对齐 */
.settings-menu-item--row {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.settings-menu-item .voice-select {
  width: 100%;
  max-width: none;
}

/* 单篇页面的"返回总目录"：按钮组改成靠左后，它自己用 margin-left: auto 留在最右边 */
.back-link {
  margin-left: auto;
  color: var(--color-accent);
  text-decoration: none;
  white-space: nowrap;
}

.back-link:active { opacity: 0.7; }

/* 汉堡按钮：切换侧边栏，窄屏是抽屉滑入/滑出，宽屏是收起/展开，两种宽度下都常驻显示 */
.drawer-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: var(--hit-size);
  min-height: var(--hit-size);
  font-size: 18px;
  color: var(--color-text);
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: transform 0.15s ease, background 0.15s ease;
}

.drawer-toggle:active {
  background: var(--mask-bg);
  transform: translateY(1px);
}

/* 拖拽调宽时锁定光标、禁止选中文字 */
body.is-resizing-sidebar {
  cursor: col-resize;
  user-select: none;
}

/* ── 布局：侧边栏 fixed 悬浮，不占文档流宽度 ── */
.sidebar {
  position: fixed;
  top: var(--topbar-h);
  left: 0;
  bottom: 0;
  width: var(--sidebar-width);
  z-index: 65;
  display: flex;
  flex-direction: column;
  padding: 12px;
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  transition: transform 0.2s ease;
}

/* 章节树滚动区：占满剩余高度，"返回全部课程"（.sidebar-home）留在它外面，
   固定贴底，不随章节多少变化 */
.sidebar-scroll {
  flex: 1 1 auto;
  min-height: 0; /* 让 flex 子元素允许收缩出现滚动条，而不是撑破容器 */
  overflow-y: auto;
}

.content {
  min-width: 0; /* 允许内容收缩，配合子元素换行避免横向溢出 */
  width: 100%;
  max-width: var(--content-max);
  margin: 0 auto;
  padding: 20px clamp(16px, 4vw, 32px) 64px;
}

/* 拖拽调宽分隔条：贴着侧边栏右边缘，只在宽屏出现（见下方媒体查询） */
.sidebar-resizer { display: none; }

/*
 * 单篇页面没有章节树数据，侧边栏渲染不出导航内容，连 ☰ 按钮一起隐藏，避免空框和摆设按钮；
 * 测验 / 听力模式都需要全部文档数据摊平抽取，单篇页面也做不到，一并隐藏
 */
body.single-doc .drawer-toggle,
body.single-doc .sidebar,
body.single-doc .sidebar-resizer,
body.single-doc .btn-quiz,
body.single-doc .btn-listening {
  display: none;
}

@media (min-width: 901px) {
  body.single-doc .content { margin-left: auto; }
}

/* ── 侧边栏：章节树 ───────────────────────── */

/* "返回全部课程"：只在构建时传了 --home-link 才会出现，多课程站点发布时用，放在章节树
   最下面（划到底才会碰到，避免跟上面的章节/文件误点），箭头跟单篇页面的"返回总目录"
   （.back-link）保持同一种符号 */
.sidebar-home {
  display: block;
  flex: 0 0 auto;
  min-height: var(--hit-size);
  padding: 10px 6px;
  margin-top: 4px;
  font-weight: 600;
  color: var(--color-accent);
  text-decoration: none;
  border-top: 1px solid var(--color-border);
}

.sidebar-home:active { opacity: 0.7; }

.chapter { border-bottom: 1px solid var(--color-border); }

.chapter-title {
  padding: 10px 6px;
  font-weight: 600;
  cursor: pointer;
}

.doc-list {
  list-style: none;
  margin: 0 0 8px;
  padding: 0;
}

/* 文件条目：文件名按钮 + 收藏星标并排 */
.doc-item {
  display: flex;
  align-items: stretch;
  gap: 4px;
}

.doc-link {
  display: block;
  width: auto;
  flex: 1 1 auto;
  min-width: 0;
  min-height: var(--hit-size);
  padding: 8px 10px;
  font: inherit;
  text-align: left;
  color: var(--color-text);
  background: transparent;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
}

.doc-link:active { background: var(--mask-bg); }

.doc-link.is-active {
  color: var(--color-accent);
  background: var(--mask-bg);
  font-weight: 600;
}

/* ── 阅读进度 ───────────────────────────────── */
/* 侧边栏已看文档标题前的 ✓：没看过时不占位，标题不会因为预留空位而缩进 */
.doc-read-mark {
  display: none;
  margin-right: 6px;
  color: var(--color-accent);
  font-weight: 700;
}

.doc-item.is-read .doc-read-mark { display: inline; }

/* 章节标题后的 "3/5"，全部看完时换强调色 */
.chapter-progress {
  margin-left: 8px;
  color: var(--color-muted);
  font-size: 0.8em;
  font-weight: 400;
  white-space: nowrap;
}

.chapter-progress.is-done { color: var(--color-accent); }

/* 侧边栏顶部整门课进度 */
.course-progress {
  padding: 8px 6px;
  color: var(--color-muted);
  font-size: 0.85em;
  border-bottom: 1px solid var(--color-border);
}

.course-progress:empty { display: none; }

/* 正文顶部"上次看到"提示条：文字和按钮一行放不下时按钮换到下一行 */
.resume-hint {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 16px;
  padding: 10px 14px;
  background: var(--color-surface);
  border: 1px solid var(--color-accent);
  border-radius: var(--radius);
}

.resume-hint-text { min-width: 0; overflow-wrap: anywhere; }

.resume-hint-actions {
  display: flex;
  gap: 8px;
  margin-left: auto;
}

/* 正文末尾"已看完"按钮，居中；已看时用强调色描边提示状态 */
.read-toggle-row {
  display: flex;
  justify-content: center;
  margin: 24px 0 8px;
}

.read-toggle.is-read {
  color: var(--color-accent);
  border-color: var(--color-accent);
  font-weight: 600;
}

/* ── 内容区 ───────────────────────────────── */
.doc-header { margin-bottom: 16px; }

/* 标题上方的章节标签（比如"01 - Overview"），小字弱化，帮助区分现在在哪一章 */
.doc-chapter-label {
  margin-bottom: 4px;
  color: var(--color-muted);
  font-size: 0.85em;
}

/* 标题两侧带"上一节/下一节"按钮时改成一行：按钮固定宽度不缩，标题占剩余空间、居中，
   标题长的话自己换行，不会把按钮挤变形 */
/* "上一节/下一节"单独一排，两端对齐——顶部（标题下方）和底部（内容区末尾）共用
   这一套样式，`--top` 变体只是把间距从"内容之后留白"换成"紧跟标题下方" */
.doc-pager {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-top: 20px;
}

.doc-pager--top {
  margin-top: 10px;
}

.doc-pager-btn {
  flex: 0 0 auto;
  white-space: nowrap;
}

/* 翻到列表头/尾时对应按钮禁用：置灰 + 不响应点击，但保留占位不让布局跳动 */
.doc-pager-btn--disabled {
  color: var(--color-muted);
  opacity: 0.5;
  cursor: default;
}

/* 悬浮"回到顶部"按钮：固定在右下角，默认淡出 + 不可点（pointer-events: none 避免
   挡住底下的内容），滚动超过阈值时 app.js 加 .is-visible 才淡入、恢复可点 */
.back-to-top {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 55;
  display: flex;
  align-items: center;
  justify-content: center;
  width: var(--hit-size);
  height: var(--hit-size);
  border-radius: 50%;
  font-size: 26px;
  line-height: 1;
  color: var(--color-on-accent);
  background: var(--color-accent);
  border: none;
  box-shadow: var(--shadow);
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transform: translateY(8px);
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.back-to-top.is-visible {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

.back-to-top:active { transform: translateY(1px); }

/* 内容区最下面的 EN⇄CN / 全部展开收起，跟顶部一样的按钮，划到底不用翻回顶部就能切换 */
.bottom-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 32px;
  padding-top: 20px;
  border-top: 1px solid var(--color-border);
}

/* 测验视图"换一批"排最前面，跟后面几个按钮之间留道更宽的间隔，一眼看出不是一组 */
.bottom-controls-leading { margin-right: 16px; }

.doc-title {
  margin: 0;
  font-size: clamp(19px, 4vw, 24px);
}

.section { margin-top: 28px; }

.section-title {
  margin: 0 0 12px;
  padding-bottom: 6px;
  font-size: clamp(16px, 3vw, 19px);
  border-bottom: 2px solid var(--color-accent);
}

.item-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* item：内容和操作按钮同属一个可换行的行（.side-cells-row），空间够就同一行、
   不够才换行，不再用固定两栏 grid 把按钮锁死在单独一行（历史上是两栏 grid，窄屏
   下按钮被挤到内容下方单独一行，哪怕内容那行还有剩余空间也用不上，改成 flex 换行
   流之后，按钮会先尝试跟内容拼在同一行，真放不下才换到下一行）；揭示侧 / 常驻
   信息还是各自整行排在下方，块级元素天然占满宽度，不需要 grid 的 1/-1 跨列写法 */
.item {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px 14px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  cursor: pointer;
}

.shown-side {
  overflow-wrap: anywhere;
}

/* 内容 cell 和操作按钮同一行、可换行；.item-actions 用 margin-left: auto 顶到
   这一行的最右边——空间够就跟内容拼在同一行右侧，空间不够整行换行时，
   margin-left: auto 在新的一行里同样会把按钮顶到右边，效果不受换不换行影响 */
.side-cells-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 12px;
}

.item-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-left: auto;
}

/* 朗读按钮紧挨着收藏按钮，两个都是容易被拇指扫到的位置，单独加宽间隔防止连续误触
   （用相邻选择器只加宽这两者之间的间隔，评分对号/跳转链接之间的间隔不受影响） */
.speak-btn + .fav-btn,
.fav-btn + .speak-btn {
  margin-left: 12px;
}

/* 卡片里的收藏星标单独加宽（桌面端 --hit-size 44px 的 2 倍），移动端另有更大倍数的
   覆盖（见 @media 区块）。高度维持项目原本统一的 --hit-size，不额外加高 */
.item-actions .fav-btn,
.item-actions .speak-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 88px;
}

.hidden-side {
  display: none;
  padding: 10px 12px;
  background: color-mix(in srgb, var(--mask-bg) 50%, var(--color-surface));
  border-radius: 8px;
  overflow-wrap: anywhere;
}

.item.is-expanded .hidden-side { display: block; }

.resident {
  color: var(--color-muted);
  font-size: 0.9em;
}

/* 词汇表单元格排版：单词加大加粗突出主角，词性/音标进一步弱化拉开主次对比 */
.cell { margin-right: 10px; }

/* 朗读按钮：放在操作按钮区（收藏星标前面），跟收藏按钮同一套视觉语言——
   带边框的方块按钮、按下有位移反馈，不是内联小图标 */
.speak-btn {
  flex: 0 0 auto;
  min-width: var(--hit-size);
  min-height: var(--hit-size);
  padding: 4px 10px;
  font-size: 16px;
  line-height: 1;
  color: var(--color-muted);
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  cursor: pointer;
}

.speak-btn:active { transform: translateY(1px); }
.speak-btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

.cell--word,
.cell--phrase {
  font-size: 1.15em;
  font-weight: 700;
}

/* 句型 & 金句：只稍微加粗，不加大字号——分量比单词/短语轻一点 */
.cell--text_en { font-weight: 600; }

.cell--pos {
  color: var(--color-muted);
  font-size: 0.85em;
}

.cell--ipa {
  color: var(--color-muted);
  font-size: 0.85em;
  font-family: ui-monospace, "SF Mono", "Consolas", monospace;
}

/* 泛读卡片：播放 + 三级顺序揭示（原文→讲解）+ 精选词点击，跟其它类型「EN⇄CN 翻面」
   是独立的一套显隐规则，不复用 .hidden-side/.is-expanded；卡片本身不整行可点
   （见 app.js 点击分发里对 .reading-item 的排除），所以不用 .item 默认的 pointer 光标 */
.reading-item {
  cursor: default;
}

.reading-text,
.reading-explain {
  display: none;
  padding: 10px 12px;
  background: color-mix(in srgb, var(--mask-bg) 50%, var(--color-surface));
  border-radius: 8px;
  overflow-wrap: anywhere;
}

.reading-item.show-text .reading-text { display: block; }
.reading-item.show-explain .reading-explain { display: block; }

.reading-gist {
  margin-bottom: 8px;
}

.reading-grammar {
  color: var(--color-muted);
  font-size: 0.92em;
}

/* 精选词：原文里下划线高亮标出、可点；点击后说明就地展开另起一段，不做成悬浮
   气泡/弹窗——手机上定位和触屏体验更稳，也跟本项目全程没有弹窗的风格一致 */
.vocab-word {
  cursor: pointer;
  border-bottom: 1px dashed var(--color-accent);
}

.vocab-word.is-open {
  border-bottom-style: solid;
}

.vocab-note {
  display: none;
  margin: 6px 0;
  padding: 6px 10px;
  font-size: 0.92em;
  color: var(--color-muted);
  background: var(--color-surface);
  border: 1px dashed var(--color-border);
  border-radius: 6px;
}

.vocab-note.is-open {
  display: block;
}

/*
 * 释义 / 读法各自一个色块（同一行），用已有的主题变量而不是写死颜色，
 * 保证深色主题下也有足够对比度：释义用强调色实心块（更显眼，这是核心信息），
 * 读法用中性浅底块（弱化，只是辅助的拼音读法）。这是收藏页（.favorite-row）
 * 用的原版底色，不要改这个——用户明确说收藏页这个配色挺好看，不要动
 */
.cell--meaning {
  display: inline-block;
  margin: 2px 6px 2px 0;
  padding: 3px 10px;
  border-radius: var(--radius);
  background: var(--mask-bg);
  color: var(--color-accent);
  border: 1px solid var(--color-accent);
  font-weight: 600;
}

.cell--reading {
  display: inline-block;
  margin: 2px 0;
  padding: 3px 10px;
  border-radius: var(--radius);
  background: var(--mask-bg);
  color: var(--color-muted);
}

/*
 * 课程章节页（.item，含测验模式）的释义色块单独换一版底色：这里的色块套在
 * .hidden-side 揭示区域里，.hidden-side 的背景刚好也是 --mask-bg，色块背景
 * 跟容器背景重叠、糊成一片（收藏页没有这层包裹，色块直接摆在卡片底色上，
 * 所以不受影响，维持上面原版）。用 color-mix 跟强调色混出淡色调，不管套在
 * 哪层背景里都能跟周围区分开。读法不用单独处理，跟 .hidden-side 背景融为
 * 一体就是想要的效果（只有释义要用色块凸显出来）
 */
.item .cell--meaning {
  background: color-mix(in srgb, var(--color-accent) 15%, var(--color-surface));
}

/* 读法背景设成透明，永远跟着 .hidden-side 容器的背景走，不用另外维护一份颜色去对齐 */
.item .cell--reading {
  background: transparent;
}

/* ── 我的收藏视图 ─────────────────────────── */
/* "导出/导入收藏"一组、"同步设置/立即同步/状态"另一组，固定分两排，
   不会把同步设置跟立即同步拆到两行、也不会四个按钮挤一行 */
.favorites-toolbar {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 20px;
}

.favorites-toolbar-group {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

/* 类型 / 对号档位两个筛选下拉，跟工具条分开单独一个类（之前误用 .favorites-toolbar，
   工具条改成纵向堆叠时筛选条被一起带歪，拆开避免以后互相影响） */
.favorites-filter-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

/* 收藏页筛选下拉：宽度跟内容走、最小 150px（原来固定 150px，选项文案加长成"全部类型"后数量会被截掉）；
   等宽字体配合 app.js 的 renderAlignedOptions 补空格，让同一个下拉里各选项的 "--" 分隔符尽量对齐 */
.favorites-filter-select {
  width: auto;
  min-width: 150px;
  max-width: 100%;
  text-align: left;
  font-family: ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace;
}

.favorites-hint {
  color: var(--color-muted);
  font-size: 0.85em;
}

.favorites-empty { color: var(--color-muted); }

/* 收藏词条搜索框：样式跟同步面板的输入框一致，占满一行；高度跟按钮统一，手机上好点 */
.favorites-search {
  box-sizing: border-box;
  width: 100%;
  min-height: var(--hit-size);
  margin-bottom: 12px;
  padding: 6px 12px;
  font: inherit;
  color: var(--color-text);
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
}

.favorites-search:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }

/* 翻页后 scrollIntoView 到这个区块顶部，留出窄屏吸顶标题栏的高度，避免搜索框被挡住 */
.favorites-items-section { scroll-margin-top: 72px; }

/* 课程 / 章节名字长；max-width（见上）保证窄屏不撑出横向滚动，选中项过长时由浏览器截断。
   这两个不做 "--" 对齐（见 app.js 的 renderPlainOptions），不需要等宽字体，用正文字体更紧凑 */
.favorites-filter-select--wide {
  font-family: inherit;
}

/* 分页条：上一页 / 页码 / 下一页一排居中，列表上下各一个 */
.favorites-pager {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 12px 0;
}

.favorites-pager-info {
  color: var(--color-muted);
  font-size: 0.9em;
  white-space: nowrap;
}

.favorites-pager .btn:disabled {
  opacity: 0.4;
  cursor: default;
}

/* 同步状态徽标：颜色跟具体状态挂钩，不跟主题色走（保证 10 个主题下都一眼能分清"正常/进行中/出错"） */
.sync-status {
  font-size: 0.85em;
  color: var(--color-muted);
}

.sync-status--idle { color: #16a34a; }
.sync-status--syncing { color: var(--color-muted); }
.sync-status--error { color: #dc2626; }

/* 同步设置面板：跟工具条其它按钮同一行下方展开，用 surface 底色+ 边框跟正文区分开 */
.sync-panel {
  width: 100%;
  margin-top: 4px;
  padding: 14px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.sync-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 0.9em;
}

.sync-field input {
  font: inherit;
  padding: 6px 10px;
  color: var(--color-text);
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
}

/* "保存/退出同步"靠左，"导出/导入配置"靠右，同一排但分成两组，一眼能看出不是同类操作 */
.sync-panel-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 10px;
}

.sync-panel-actions-group {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

/* "保存并同步"是这个面板的主操作，用强调色跟其它素色按钮区分开 */
.btn-sync-primary {
  color: var(--color-on-accent);
  background: var(--color-accent);
  border-color: var(--color-accent);
}

/* "退出同步"会清空本机配置，用警示色描边提示这是需要谨慎点的操作 */
.btn-sync-danger {
  color: #dc2626;
  border-color: #dc2626;
}

/* 收藏列表行：布局仿 .item（同样是 flex 纵向堆叠 + .side-cells-row 换行流），
   但不复用 .item 类名，避免被「点整行揭示」的事件委托误触发 */
.favorite-row {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px 14px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.fav-jump {
  font: inherit;
  color: var(--color-accent);
  background: transparent;
  border: 0;
  padding: 0;
  text-align: left;
  text-decoration: underline;
  cursor: pointer;
}

.fav-jump--disabled {
  color: var(--color-muted);
  text-decoration: none;
  cursor: default;
}

.favorite-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 8px;
  margin-bottom: 4px;
  color: var(--color-muted);
  font-size: 0.85em;
}

/* 收藏日期顶到这一行最右边，空间够就跟前面文字同一行、不够才换行（同一套 margin-left: auto 手法） */
.favorite-time {
  margin-left: auto;
  white-space: nowrap;
}

/* en/cn 各自一行（.favorite-side），不要把两侧的 cell 混在同一个 flex 行里——
   混在一起时短的 cell（比如释义）会跟上一行内容挤在一起换行，长的 cell（比如读法）
   又被挤到单独一行，释义和读法这两个本该一起看的字段反而被拆散了 */
.favorite-both-sides {
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow-wrap: anywhere;
}

.favorite-side {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 12px;
}

.cell--chapter {
  margin-right: 8px;
  color: var(--color-muted);
  font-size: 0.85em;
}

/* ── 宽屏：侧边栏收起/展开、拖拽调宽、正文相对整窗居中 ── */
@media (min-width: 901px) {
  /* 默认展开，.is-collapsed 时滑出隐藏 */
  .sidebar.is-collapsed { transform: translateX(-100%); }

  /* 正文按 max(侧边栏宽度, 整窗居中该有的位置) 计算左边距：
     窗口够宽时严格整窗居中；不够宽时退化成贴着侧边栏右边，避免被遮挡 */
  .content {
    margin-left: max(var(--sidebar-width), calc((100% - var(--content-max)) / 2));
    margin-right: auto;
  }

  /* 侧边栏收起后，正文完全按整窗居中 */
  .sidebar.is-collapsed ~ .content { margin-left: auto; }

  .sidebar-resizer {
    display: block;
    position: fixed;
    top: var(--topbar-h);
    left: var(--sidebar-width);
    bottom: 0;
    width: 6px;
    margin-left: -3px;
    z-index: 66;
    cursor: col-resize;
    background: transparent;
  }

  .sidebar-resizer:hover,
  .sidebar-resizer.is-dragging { background: var(--color-accent); opacity: 0.35; }

  /* 侧边栏收起时分隔条也一起隐藏 */
  .sidebar.is-collapsed ~ .sidebar-resizer { display: none; }
}

/* ── 窄屏：侧边栏转抽屉 ───────────────────── */
@media (max-width: 900px) {
  .sidebar {
    width: min(84vw, 320px);
    z-index: 70;
    transform: translateX(-100%);
    box-shadow: var(--shadow);
  }

  .sidebar.is-open { transform: none; }

  .content {
    max-width: none;
    padding: 16px 16px 56px;
  }

  /*
   * 只让「☰ + 标题」这一条吸顶（position: fixed），按钮那一行（.controls）跟着页面正常滚动，
   * 不再整个工具条都吸顶——手机屏幕小，两行按钮常驻会占掉很大一块阅读区域
   */
  .topbar {
    position: static;
    margin-top: var(--topbar-h);
  }

  .topbar-left {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 60;
    min-height: var(--topbar-h);
    padding: 8px 16px;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    transition: transform 0.25s ease;
  }

  /* 往下滑时收起（滑出屏幕外），往上滑或接近顶部时用 app.js 的滚动监听移除这个类重新露出来 */
  .topbar-left.is-hidden {
    transform: translateY(-100%);
  }

  /* 手机上没有实体键盘，快捷键说明不显示；选词方块固定三列，跟可可 App 的九宫格一样 */
  .training-shortcuts { display: none; }

  .training-tiles { grid-template-columns: repeat(3, 1fr); }

  .training-card { padding: 16px; }

  .item-actions .mark-btn {
    min-width: 36px;
    min-height: 36px;
    padding: 2px 8px;
    font-size: 14px;
  }

  /* 收藏星标按钮：128px 太宽容易误触，减半 → 64px；朗读按钮宽度跟收藏按钮保持一致；
     高度维持跟其它移动端按钮一样的 36px，不额外加高撑高卡片 */
  .item-actions .fav-btn,
  .item-actions .speak-btn {
    min-width: 64px;
    min-height: 36px;
    padding: 2px 8px;
    font-size: 14px;
  }
}

/*
 * 手机竖屏：训练页的标签页、播放控制按钮间距收小，避免挤成两行。
 * 单独用 480px 而不是 --breakpoint（900px）：电脑上浏览器窗口不够 900 宽时也该保持大间距
 */
@media (max-width: 480px) {
  .training-tabs { --training-tab-gap: 8px; }

  .training-player { --training-player-gap: 12px; }
}

/*
 * 电脑端（含不到 900 宽的电脑窗口）：训练页纵向拉开，从上到下三组——练习区（标签页 + 句子卡片）、
 * 控制区（上一句 / 主按钮 / 播放 / 下一句）、设置区（难度行 + 进度条 + 快捷键），组之间 32px、组内适当放松。
 * 手机竖屏（<= 480px）屏幕小，保持紧凑不变
 */
@media (min-width: 481px) {
  body[data-view="training"] .doc-header { margin-bottom: 24px; }

  .training-tabs { margin-bottom: 24px; }

  .training-settings {
    margin-bottom: 16px;
    padding-top: 24px;
  }

  .training-progress { margin-bottom: 20px; }

  .training-card { padding: 32px 20px; }

  .training-sentence {
    font-size: 1.4em;
    line-height: 1.9;
  }

  /* 卡片里的小号句子（回译"你写的"、成绩页回顾）不跟着放大 */
  .training-sentence--small { font-size: 1em; }

  .training-player { margin: 32px 0 24px; }
}
