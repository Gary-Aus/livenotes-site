  /**
   * 渲染一条「整篇文档」收藏记录
   * @param {object} fav - kind === 'doc' 的收藏记录
   * @returns {string}
   */
  function renderDocFavoriteRow(fav) {

    const jumpable = canJumpToDoc(fav.docSlug);

    const titleHtml = jumpable
      ? `<button type="button" class="fav-jump" data-action="jump-to-doc" data-slug="${escapeAttr(fav.docSlug)}">${escapeHtml(fav.docTitle)}</button>`
      : `<span class="fav-jump fav-jump--disabled" title="打开总目录 index.html 才能跳转">${escapeHtml(fav.docTitle)}</span>`;

    return `
      <li class="favorite-row">
        <div class="shown-side">
          <div class="side-cells-row">
            <span class="cell cell--chapter">${formatCoursePrefix(fav)}${escapeHtml(fav.chapter || '')}</span>
            ${titleHtml}
            <div class="item-actions">
              <button type="button" class="fav-btn is-favorited" data-action="remove-favorite" data-kind="doc" data-id="${escapeAttr(fav.id)}" aria-label="取消收藏">★</button>
            </div>
          </div>
        </div>
      </li>`;
  }

  /**
   * 渲染一条「单条 item」收藏记录（用收藏时刻的快照展示，不依赖当前页面是否有原文档数据）
   * @param {object} fav - kind === 'item' 的收藏记录
   * @returns {string}
   */
  function renderItemFavoriteRow(fav) {

    const snapshot = fav.snapshot || {};
    const jumpable = canJumpToDoc(fav.docSlug);
    const itemKey = `${fav.sectionType}:${fav.itemIndex}`;

    const jumpHtml = jumpable
      ? `<button type="button" class="fav-jump" data-action="jump-to-item" data-slug="${escapeAttr(fav.docSlug)}" data-key="${escapeAttr(itemKey)}">跳转原文</button>`
      : `<span class="fav-jump fav-jump--disabled" title="打开总目录 index.html 才能跳转">跳转原文</span>`;

    const residentText = snapshot.note || snapshot.kind || '';

    return `
      <li class="favorite-row">
        <div class="shown-side">
          <div class="favorite-meta">
            <span>${formatCoursePrefix(fav)}${escapeHtml(fav.docTitle)} · ${escapeHtml(fav.sectionHeading || '')}</span>
            ${formatFavoritedAt(fav) ? `<span class="favorite-time">( ${escapeHtml(formatFavoritedAt(fav))} )</span>` : ''}
          </div>
          <div class="favorite-both-sides">
            <div class="favorite-side">${formatSide(fav.sectionType, 'en', snapshot.en || {})}</div>
            <div class="favorite-side">
              ${formatSide(fav.sectionType, 'cn', snapshot.cn || {})}
              <div class="item-actions">
                ${jumpHtml}
                ${renderMarkBadges(fav.mark)}
                ${renderSpeakButton(fav.sectionType, snapshot.en)}
                <button type="button" class="fav-btn is-favorited" data-action="remove-favorite" data-kind="item" data-id="${escapeAttr(fav.id)}" aria-label="取消收藏">★</button>
              </div>
            </div>
          </div>
          ${residentText ? `<div class="resident">${escapeHtml(residentText)}</div>` : ''}
        </div>
      </li>`;
  }

  /**
   * 估算文本显示宽度：中日韩字符算 2、其它算 1（粗略近似，配合等宽字体对齐用）
   * @param {string} text
   * @returns {number}
   */
  function estimateDisplayWidth(text) {

    return [...text].reduce((sum, ch) => sum + (/[一-鿿]/.test(ch) ? 2 : 1), 0);
  }

  /**
   * 把一批 { label, count } 拼成 <option> 列表，label 用不换行空格（&nbsp;，普通空格在 HTML
   * 里会被折叠掉）补齐到这批里最长的宽度，配合 .favorites-filter-select 的等宽字体，让每一项
   * 的 "--" 分隔符和后面的数量尽量对齐在同一列
   * @param {{ value: string, label: string, count: number, selected: boolean }[]} entries
   * @returns {string}
   */
  function renderAlignedOptions(entries) {

    const maxWidth = Math.max(...entries.map((entry) => estimateDisplayWidth(entry.label)));

    return entries.map((entry) => {

      const pad = ' '.repeat(Math.max(0, maxWidth - estimateDisplayWidth(entry.label)));

      return `<option value="${escapeAttr(entry.value)}"${entry.selected ? ' selected' : ''}>${escapeHtml(entry.label)}${pad} -- ${entry.count}</option>`;
    }).join('');
  }

  /**
   * 收藏记录排序用的时间：优先收藏时间，没有就退化用最后修改时间
   * @param {object} fav
   * @returns {number} 毫秒时间戳，都没有返回 0
   */
  function getFavoriteSortTime(fav) {

    const raw = fav.favoritedAt || fav.updatedAt || null;
    const time = raw ? Date.parse(raw) : 0;

    return Number.isNaN(time) ? 0 : time;
  }

  /**
   * 「按课程章节顺序」比较两条词条收藏：课程 → 章节 → 文档 → 小节类型 → 表格内序号
   * @param {object} a
   * @param {object} b
   * @returns {number}
   */
  function compareFavoritesByCourseOrder(a, b) {

    return NATURAL_COLLATOR.compare(a.courseLabel || '', b.courseLabel || '')
      || NATURAL_COLLATOR.compare(a.chapter || '', b.chapter || '')
      || NATURAL_COLLATOR.compare(a.docSlug || '', b.docSlug || '')
      || (SECTION_TYPE_ORDER[a.sectionType] ?? 9) - (SECTION_TYPE_ORDER[b.sectionType] ?? 9)
      || (a.itemIndex ?? 0) - (b.itemIndex ?? 0);
  }

  /**
   * 按 state.favoritesSort 排序词条收藏（返回新数组，不改原数组）
   * @param {object[]} itemFavs
   * @returns {object[]}
   */
  function sortItemFavorites(itemFavs) {

    const sorted = [...itemFavs];

    if (state.favoritesSort === 'course') {

      return sorted.sort(compareFavoritesByCourseOrder);
    }

    if (state.favoritesSort === 'oldest') {

      return sorted.sort((a, b) => getFavoriteSortTime(a) - getFavoriteSortTime(b));
    }

    return sorted.sort((a, b) => getFavoriteSortTime(b) - getFavoriteSortTime(a));
  }

  /**
   * 判断一条词条收藏是否命中搜索关键词：在快照的英文 / 中文全部字段、备注、文档标题里找，不分大小写
   * @param {object} fav
   * @param {string} keyword - 已转小写、去掉首尾空格的关键词，空串视为全部命中
   * @returns {boolean}
   */
  function isFavoriteMatchingSearch(fav, keyword) {

    if (!keyword) {

      return true;
    }

    const snapshot = fav.snapshot || {};
    const texts = [
      ...Object.values(snapshot.en || {}),
      ...Object.values(snapshot.cn || {}),
      snapshot.note,
      snapshot.kind,
      fav.docTitle,
    ];

    return texts.some((text) => typeof text === 'string' && text.toLowerCase().includes(keyword));
  }

  /**
   * 课程筛选的实际取值：还没手动选过（null）时默认"本课程"
   * @returns {string} 'all' | 'c:<课程短标识>'
   */
  function resolveFavoritesCourseFilter() {

    return state.favoritesCourseFilter ?? `c:${currentCourseLabel()}`;
  }

  /**
   * 课程短标识的展示文字：老记录没有 courseLabel 时显示"未标注课程"，当前所在课程加"（本课程）"
   * @param {string} courseLabel
   * @returns {string}
   */
  function formatCourseOptionLabel(courseLabel) {

    const name = courseLabel || '未标注课程';

    return courseLabel === currentCourseLabel() ? `${name}（本课程）` : name;
  }

  /**
   * 按当前筛选条件分层过滤词条收藏。分层是为了让每个下拉框选项后面的数量只受"上游"条件影响：
   * 课程数量受搜索影响，章节数量再受课程影响，类型 / 档位数量再受章节影响
   * @param {object[]} itemFavs - 全部已收藏的 item 记录
   * @returns {{ searched: object[], inCourse: object[], inChapter: object[], filtered: object[] }}
   */
  function applyFavoritesFilter(itemFavs) {

    const keyword = state.favoritesSearch.trim().toLowerCase();
    const courseFilter = resolveFavoritesCourseFilter();


    const searched = itemFavs.filter((fav) => isFavoriteMatchingSearch(fav, keyword));

    const inCourse = courseFilter === 'all'
      ? searched
      : searched.filter((fav) => `c:${fav.courseLabel || ''}` === courseFilter);

    // 章节筛选只在选了具体课程时生效（不同课程的章节名可能重名，混在一起筛没有意义）
    const inChapter = courseFilter === 'all' || state.favoritesChapterFilter === 'all'
      ? inCourse
      : inCourse.filter((fav) => `c:${fav.chapter || ''}` === state.favoritesChapterFilter);

    const filtered = inChapter.filter((fav) => {

      if (state.favoritesTypeFilter !== 'all' && fav.sectionType !== state.favoritesTypeFilter) {

        return false;
      }

      if (state.favoritesMarkFilter === 'none' && fav.mark) {

        return false;
      }

      if (state.favoritesMarkFilter !== 'all' && state.favoritesMarkFilter !== 'none'
          && fav.mark !== Number(state.favoritesMarkFilter)) {

        return false;
      }

      return true;
    });

    return { searched, inCourse, inChapter, filtered };
  }

  /**
   * 把一批 { label, count } 拼成不补空格对齐的 <option> 列表：课程 / 章节名字长短差很多，
   * 补齐到最长会把下拉框撑得过宽，手机上数量直接被挤出可见区域
   * @param {{ value: string, label: string, count: number, selected: boolean }[]} entries
   * @returns {string}
   */
  function renderPlainOptions(entries) {

    return entries.map((entry) => (
      `<option value="${escapeAttr(entry.value)}"${entry.selected ? ' selected' : ''}>${escapeHtml(entry.label)} -- ${entry.count}</option>`
    )).join('');
  }

  /**
   * 渲染"收藏的词条"上方的课程 / 章节 / 类型 / 对号档位 / 排序筛选条，选项文案里带上各筛选项的实际数量
   * @param {{ searched: object[], inCourse: object[], inChapter: object[] }} scopes - applyFavoritesFilter 的分层结果
   * @returns {string}
   */
  function renderFavoritesFilterBar({ searched, inCourse, inChapter }) {

    const courseFilter = resolveFavoritesCourseFilter();

    // 课程选项：本课程固定排第一（即使本课程还没有收藏，也要能选回来），其它课程按名字自然排序
    const currentLabel = currentCourseLabel();
    const otherLabels = [...new Set(searched.map((fav) => fav.courseLabel || ''))]
      .filter((label) => label !== currentLabel)
      .sort(NATURAL_COLLATOR.compare);

    const courseOptions = renderPlainOptions([
      { value: 'all', label: '全部课程', count: searched.length, selected: courseFilter === 'all' },
      ...[currentLabel, ...otherLabels].map((label) => ({
        value: `c:${label}`,
        label: formatCourseOptionLabel(label),
        count: searched.filter((fav) => (fav.courseLabel || '') === label).length,
        selected: courseFilter === `c:${label}`,
      })),
    ]);

    // 章节选项只列当前课程里有收藏的章节；选了"全部课程"时不显示章节下拉
    const chapters = [...new Set(inCourse.map((fav) => fav.chapter || ''))].sort(NATURAL_COLLATOR.compare);

    const chapterOptions = renderPlainOptions([
      { value: 'all', label: '全部章节', count: inCourse.length, selected: state.favoritesChapterFilter === 'all' },
      ...chapters.map((chapter) => ({
        value: `c:${chapter}`,
        label: chapter || '未标注章节',
        count: inCourse.filter((fav) => (fav.chapter || '') === chapter).length,
        selected: state.favoritesChapterFilter === `c:${chapter}`,
      })),
    ]);

    const typeOptions = renderAlignedOptions(['all', 'vocab', 'phrases', 'sentences'].map((type) => ({
      value: type,
      label: type === 'all' ? '全部类型' : SECTION_TYPE_LABELS[type],
      count: type === 'all' ? inChapter.length : inChapter.filter((fav) => fav.sectionType === type).length,
      selected: state.favoritesTypeFilter === type,
    })));

    const markOptions = renderAlignedOptions(['all', 'none', '1', '2', '3'].map((markValue) => ({
      value: markValue,
      // 纯中文数字"一档/二档/三档"：全部选项都是纯中文 2 字，字体宽度比例一致，容易对齐；
      // 中文数字跟后面阿拉伯数字的数量也不会看混
      label: markValue === 'all' ? '全部档位' : markValue === 'none' ? '未评' : `${MARK_LEVEL_CN[markValue]}档`,
      count: inChapter.filter((fav) => {

        if (markValue === 'all') return true;
        if (markValue === 'none') return !fav.mark;

        return fav.mark === Number(markValue);
      }).length,
      selected: String(state.favoritesMarkFilter) === markValue,
    })));

    const sortOptions = Object.entries(FAVORITES_SORT_LABELS).map(([value, label]) => (
      `<option value="${value}"${state.favoritesSort === value ? ' selected' : ''}>${escapeHtml(label)}</option>`
    )).join('');

    return `
      <div class="favorites-filter-bar">
        <select class="btn favorites-filter-select favorites-filter-select--wide" data-role="favorites-course-filter" aria-label="按课程筛选">${courseOptions}</select>
        ${courseFilter === 'all' ? '' : `<select class="btn favorites-filter-select favorites-filter-select--wide" data-role="favorites-chapter-filter" aria-label="按章节筛选">${chapterOptions}</select>`}
        <select class="btn favorites-filter-select" data-role="favorites-type-filter" aria-label="按类型筛选">${typeOptions}</select>
        <select class="btn favorites-filter-select" data-role="favorites-mark-filter" aria-label="按对号档位筛选">${markOptions}</select>
        <select class="btn favorites-filter-select" data-role="favorites-sort" aria-label="排序方式">${sortOptions}</select>
      </div>`;
  }

  /**
   * 渲染词条列表的分页条（只有 1 页时返回空串）
   * @param {number} page - 当前页码（已修正到合法范围）
   * @param {number} totalPages
   * @returns {string}
   */
  function renderFavoritesPager(page, totalPages) {

    if (totalPages <= 1) {

      return '';
    }

    return `
      <div class="favorites-pager">
        <button type="button" class="btn" data-action="favorites-page-prev"${page <= 1 ? ' disabled' : ''}>◀ 上一页</button>
        <span class="favorites-pager-info">第 ${page} / ${totalPages} 页</span>
        <button type="button" class="btn" data-action="favorites-page-next"${page >= totalPages ? ' disabled' : ''}>下一页 ▶</button>
      </div>`;
  }

  /**
   * 渲染"收藏的词条"区块里随筛选 / 搜索 / 翻页变化的部分：标题数量、筛选条、分页条、当前页列表。
   * 搜索框不在这里面，这样输入时只重绘这部分，搜索框不会丢失焦点
   * @param {object[]} itemFavs - 全部已收藏的 item 记录
   * @returns {string}
   */
  function renderFavoriteItemsBody(itemFavs) {

    const scopes = applyFavoritesFilter(itemFavs);
    const sorted = sortItemFavorites(scopes.filtered);
    const totalPages = Math.max(1, Math.ceil(sorted.length / FAVORITES_PAGE_SIZE));


    // 取消收藏 / 改筛选后总页数可能变少，页码超出时退回最后一页
    state.favoritesPage = Math.min(Math.max(1, state.favoritesPage), totalPages);

    const start = (state.favoritesPage - 1) * FAVORITES_PAGE_SIZE;
    const pageHtml = sorted.slice(start, start + FAVORITES_PAGE_SIZE).map(renderItemFavoriteRow).join('');
    const pagerHtml = renderFavoritesPager(state.favoritesPage, totalPages);

    return `
      <h2 class="section-title">收藏的词条（${sorted.length} / ${itemFavs.length}）</h2>
      ${renderFavoritesFilterBar(scopes)}
      ${sorted.length
        ? `${pagerHtml}<ul class="item-list">${pageHtml}</ul>${pagerHtml}`
        : '<p class="favorites-empty">没有符合筛选条件的词条。</p>'}`;
  }

  /**
   * 只重绘"收藏的词条"可变部分（搜索输入、改筛选、翻页时用），不动搜索框和上方工具条
   * @returns {void}
   */
  function refreshFavoriteItemsBody() {

    const bodyEl = document.querySelector('[data-role="favorites-items-body"]');

    if (!bodyEl) {

      return;
    }

    const itemFavs = loadFavorites().filter((fav) => fav.kind === 'item' && fav.favorited);

    bodyEl.innerHTML = renderFavoriteItemsBody(itemFavs);
    setupFavoritesFilterSelects();
  }

  /**
   * 翻页：页码加减后重绘列表，并滚回"收藏的词条"区块顶部（在底部分页条点翻页时不用再手动往上划）
   * @param {number} delta - +1 下一页，-1 上一页
   * @returns {void}
   */
  function changeFavoritesPage(delta) {

    state.favoritesPage += delta;
    refreshFavoriteItemsBody();

    const sectionEl = document.querySelector('[data-role="favorites-items-section"]');

    if (sectionEl) {
      sectionEl.scrollIntoView({ block: 'start' });
    }
  }

  /**
   * 给筛选条的几个下拉框绑定 change 事件：每次重绘筛选条都会重建 DOM，所以每次渲染完都要重新绑定。
   * 改任何筛选条件都回到第 1 页
   * @returns {void}
   */
  function setupFavoritesFilterSelects() {

    const bindings = [
      ['favorites-course-filter', (value) => {
        state.favoritesCourseFilter = value;

        // 换课程后旧章节一般不存在了，章节筛选重置
        state.favoritesChapterFilter = 'all';
      }],
      ['favorites-chapter-filter', (value) => { state.favoritesChapterFilter = value; }],
      ['favorites-type-filter', (value) => { state.favoritesTypeFilter = value; }],
      ['favorites-mark-filter', (value) => { state.favoritesMarkFilter = value; }],
      ['favorites-sort', (value) => { state.favoritesSort = value; }],
    ];

    for (const [role, applyValue] of bindings) {
      const selectEl = document.querySelector(`[data-role="${role}"]`);

      if (!selectEl) {
        continue;
      }

      selectEl.addEventListener('change', () => {
        applyValue(selectEl.value);
        state.favoritesPage = 1;
        refreshFavoriteItemsBody();
      });
    }
  }

  /**
   * 给搜索框绑定 input 事件：停止输入一小段时间后再刷新列表，回到第 1 页
   * @returns {void}
   */
  function setupFavoritesSearchInput() {

    const inputEl = document.querySelector('[data-role="favorites-search"]');

    if (!inputEl) {

      return;
    }

    inputEl.addEventListener('input', () => {
      clearTimeout(state.favoritesSearchTimer);

      state.favoritesSearchTimer = setTimeout(() => {
        state.favoritesSearch = inputEl.value;
        state.favoritesPage = 1;
        refreshFavoriteItemsBody();
      }, FAVORITES_SEARCH_DEBOUNCE_MS);
    });
  }

  /**
   * 渲染「我的收藏」整个视图到内容区
   * @returns {void}
   */
  function renderFavoritesView() {

    const contentEl = document.querySelector('[data-role="content"]');

    syncBodyView();
    const favorites = loadFavorites();

    // 两个列表都是最新收藏排最上面（词条列表另外还能在排序下拉里改）
    const docFavs = favorites
      .filter((fav) => fav.kind === 'doc' && fav.favorited)
      .sort((a, b) => getFavoriteSortTime(b) - getFavoriteSortTime(a));
    const itemFavs = favorites.filter((fav) => fav.kind === 'item' && fav.favorited);

    if (docFavs.length === 0 && itemFavs.length === 0) {
      contentEl.innerHTML = `
        ${renderFavoritesToolbar()}
        <p class="favorites-empty">还没有收藏。点击文档旁或词条旁的 ☆ 试试。</p>`;

      return;
    }

    const docFavsHtml = docFavs.map(renderDocFavoriteRow).join('');

    contentEl.innerHTML = `
      ${renderFavoritesToolbar()}
      ${docFavs.length ? `
        <section class="section">
          <h2 class="section-title">收藏的文档（${docFavs.length}）</h2>
          <ul class="item-list">${docFavsHtml}</ul>
        </section>` : ''}
      ${itemFavs.length ? `
        <section class="section favorites-items-section" data-role="favorites-items-section">
          <input type="search" class="favorites-search" data-role="favorites-search"
            value="${escapeAttr(state.favoritesSearch)}" placeholder="搜索收藏的词条（英文 / 中文）" autocomplete="off">
          <div data-role="favorites-items-body">${renderFavoriteItemsBody(itemFavs)}</div>
        </section>` : ''}`;

    setupFavoritesFilterSelects();
    setupFavoritesSearchInput();
  }

  /**
   * 清掉「我的收藏」「测验」两个视图切换按钮的高亮，同一时刻只有一个视图能高亮
   * @returns {void}
   */
  function clearViewToggleButtons() {

    // 顶部和内容区底部都有这几个按钮（同一个 data-action），两边都要清
    document.querySelectorAll('[data-action="toggle-favorites-view"]').forEach((btn) => {
      btn.classList.remove('is-active');
    });

    document.querySelectorAll('[data-action="toggle-quiz-view"]').forEach((btn) => {
      btn.classList.remove('is-active');
    });

    document.querySelectorAll('[data-action="toggle-listening-view"]').forEach((btn) => {
      btn.classList.remove('is-active');
    });

    document.querySelectorAll('[data-action="toggle-training-view"]').forEach((btn) => {
      btn.classList.remove('is-active');
    });

    // 每次切换视图都会走到这里，顺带停掉句子训练还在循环的朗读，不然离开后还会一直念
    stopTrainingPlayback();
  }

  /**
   * 切换到「我的收藏」视图，或从收藏视图切回当前文档
   * @returns {void}
   */
  function toggleFavoritesView() {

    state.view = state.view === 'favorites' ? 'doc' : 'favorites';

    clearViewToggleButtons();

    document.querySelectorAll('[data-action="toggle-favorites-view"]').forEach((btn) => {
      btn.classList.toggle('is-active', state.view === 'favorites');
    });

    if (state.view === 'favorites') {
      renderFavoritesView();
      updateAppTitle();

      return;
    }

    const doc = findDoc(currentSlug());

    if (doc) {
      renderContent(doc);
    }
  }

  /**
   * 从收藏 / 测验视图跳转回某篇文档：单篇页面里只能跳自己，index 页面走 selectDoc
   * @param {string} slug
   * @returns {void}
   */
  function jumpToDoc(slug) {

    if (state.data.doc) {
      state.view = 'doc';

      clearViewToggleButtons();
      renderContent(state.data.doc);

      return;
    }

    selectDoc(slug);
  }

  /**
   * 从收藏视图跳转到某篇文档的某条 item：跳转后自动展开并滚动定位
   * @param {string} slug
   * @param {string} key - `${sectionType}:${itemIndex}`
   * @returns {void}
   */
  function jumpToItem(slug, key) {

    jumpToDoc(slug);

    requestAnimationFrame(() => {

      const itemEl = document.querySelector(`[data-role="content"] .item[data-key="${CSS.escape(key)}"]`);

      if (!itemEl) {

        return;
      }

      if (!itemEl.classList.contains('is-expanded')) {
        itemEl.classList.add('is-expanded');

        const expanded = loadExpanded(slug);
        expanded.add(key);
        saveExpanded(slug, expanded);
      }

      itemEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }

  /**
   * Fisher-Yates 洗牌，不改动原数组
   * @param {Array} list
   * @returns {Array}
   */
  function shuffleArray(list) {

    const result = list.slice();

    for (let i = result.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));

      [result[i], result[j]] = [result[j], result[i]];
    }

    return result;
  }

  /**
   * 把全部文档的全部 item 摊平成一个池子，供测验模式抽取（只有 index.html 有全部文档数据）
   * @returns {object[]} 每条含 id / docSlug / docTitle / chapter / sectionType / sectionHeading / itemIndex / item
   */
  function buildQuizPool() {

    const pool = [];

    (state.data.docs || []).forEach((doc) => {

      doc.sections.forEach((section) => {

        section.items.forEach((item, itemIndex) => {
          pool.push({
            id: `${doc.slug}::${section.type}:${itemIndex}`,
            docSlug: doc.slug,
            docTitle: doc.title || doc.slug,
            chapter: doc.chapter,
            sectionType: section.type,
            sectionHeading: section.heading,
            itemIndex,
            item,
          });
        });
      });
    });

    return pool;
  }

  /**
   * 某条评分记录的间隔重复到期时间（毫秒）；没评过分 / 评分已清空的记录返回 0，
   * 排序时天然排到最前面（当成"现在就该复习"）
   * @param {object|undefined} record
   * @returns {number}
   */
  function getSrsDueAtMs(record) {

    return record && record.srsDueAt ? new Date(record.srsDueAt).getTime() : 0;
  }

  /**
   * 间隔重复排序：先洗牌保证同一优先级内部顺序不固定，再按到期时间从早到晚稳定排序——
   * 到期的 / 从没复习过的排前面，还没到期的排后面，但因为是稳定排序，不会完全消失，
   * 池子抽完一轮重新排序时还是能抽到。测验模式和以后的听力模式共用这一个函数，
   * 保证两边排的是同一套复习计划，不是各算各的
   * @param {object[]} pool - buildQuizPool() 的结果
   * @returns {object[]}
   */
  function sortPoolBySrsPriority(pool) {

    const recordsById = new Map(
      loadFavorites().filter((fav) => fav.kind === 'item').map((fav) => [fav.id, fav])
    );

    return shuffleArray(pool)
      .map((entry) => ({ entry, dueAtMs: getSrsDueAtMs(recordsById.get(entry.id)) }))
      .sort((a, b) => a.dueAtMs - b.dueAtMs)
      .map((scored) => scored.entry);
  }

  /**
   * 渲染评分用的 3 个对号按钮，点亮到当前评分档位（再点一次已点亮的档位会清空，见 setItemMark）
   * @param {number|null} mark
   * @returns {string}
   */
  function renderMarkButtons(mark) {

    return [1, 2, 3].map((level) => {

      const filled = mark !== null && level <= mark;

      return `<button type="button" class="mark-btn${filled ? ' is-filled' : ''}" data-action="set-quiz-mark" data-level="${level}" aria-label="评分 ${level}">✓</button>`;
    }).join('');
  }

  /**
   * 渲染只读的评分展示（3 个对号，不可点击），用于「我的收藏」列表里展示测验评分
   * @param {number|null} mark
   * @returns {string}
   */
  function renderMarkBadges(mark) {

    if (!mark) {

      return '';
    }

    const dots = [1, 2, 3].map((level) => {

      const filled = level <= mark;

      return `<span class="mark-btn${filled ? ' is-filled' : ''}" aria-hidden="true">✓</span>`;
    }).join('');

    return `<span class="mark-badges" title="测验评分：${mark}/3">${dots}</span>`;
  }

  /**
   * 渲染测验模式里的一条 item（数据来自 buildQuizPool 的池子条目，不是某一篇 doc 的 section）
   * @param {object} entry - buildQuizPool 里的一条
   * @returns {string}
   */
  function renderQuizItemRow(entry, recordsById) {

    const shownSide = state.mode;
    const hiddenSide = state.mode === 'en' ? 'cn' : 'en';
    const record = recordsById.get(entry.id);
    const favorited = Boolean(record && record.favorited);
    const mark = record ? record.mark : null;

    return `
      <li class="item" data-key="${entry.id}">
        <div class="shown-side">
          <div class="favorite-meta">${escapeHtml(entry.sectionHeading)}</div>
          <div class="side-cells-row">
            ${formatSide(entry.sectionType, shownSide, entry.item[shownSide])}
            <div class="item-actions">
              ${renderMarkButtons(mark)}
              ${renderSpeakButton(entry.sectionType, entry.item.en)}
              <button type="button" class="fav-btn${favorited ? ' is-favorited' : ''}" data-action="toggle-favorite-quiz-item" aria-label="收藏">${favorited ? '★' : '☆'}</button>
            </div>
          </div>
        </div>
        <div class="hidden-side">${formatSide(entry.sectionType, hiddenSide, entry.item[hiddenSide])}</div>
        ${formatResident({ type: entry.sectionType }, entry.item)}
      </li>`;
  }

  /**
   * 开始新一轮测验：重新摊平全部文档的 item，按间隔重复优先级排序，批次从头开始
   * @returns {void}
   */
  function startNewQuizPool() {

    state.quizPool = sortPoolBySrsPriority(buildQuizPool());
    state.quizBatchOffset = 0;
  }

  /**
   * 渲染「测验模式」整个视图：只渲染当前这一批（QUIZ_BATCH_SIZE 条），
   * 而不是一次性把全部文档摊平的内容都塞进页面——内容多的话会有几百条，一次性渲染很卡
   * @returns {void}
   */
  function renderQuizView() {

    const contentEl = document.querySelector('[data-role="content"]');

    syncBodyView();

    if (!state.quizPool) {
      startNewQuizPool();
    }

    state.allExpanded = false;

    if (state.quizPool.length === 0) {
      contentEl.innerHTML = `
        <header class="doc-header"><h2 class="doc-title">📇 测验模式</h2></header>
        <p class="favorites-empty">没有可供测验的内容。</p>`;
      updateExpandToggleIcon();

      return;
    }

    const batch = state.quizPool.slice(state.quizBatchOffset, state.quizBatchOffset + QUIZ_BATCH_SIZE);

    // 只读一次 localStorage 建查找表，避免每条 item 都单独读一次
    const recordsById = new Map(
      loadFavorites().filter((fav) => fav.kind === 'item').map((fav) => [fav.id, fav])
    );
    const itemsHtml = batch.map((entry) => renderQuizItemRow(entry, recordsById)).join('');

    const totalBatches = Math.ceil(state.quizPool.length / QUIZ_BATCH_SIZE);
    const currentBatch = Math.floor(state.quizBatchOffset / QUIZ_BATCH_SIZE) + 1;

    contentEl.innerHTML = `
      <header class="doc-header"><h2 class="doc-title">📇 测验模式</h2></header>
      <div class="favorites-toolbar">
        <button type="button" class="btn" data-action="next-quiz-batch">换一批</button>
        <span class="favorites-hint">
          第 ${currentBatch}/${totalBatches} 批，共 ${state.quizPool.length} 条；展开/收起状态不会保存
        </span>
      </div>
      <ul class="item-list">${itemsHtml}</ul>
      ${renderBottomControls('<button type="button" class="btn bottom-controls-leading" data-action="next-quiz-batch">换一批</button>')}`;

    updateExpandToggleIcon();
  }

  /**
   * 「换一批」按钮：按批次顺序往后翻，一轮抽完（翻到底）自动重新洗牌开始下一轮
   * @returns {void}
   */
  function nextQuizBatch() {

    state.quizBatchOffset += QUIZ_BATCH_SIZE;

    if (state.quizBatchOffset >= state.quizPool.length) {
      startNewQuizPool();
    }

    renderQuizView();
  }

  /**
   * 切换到「测验模式」视图，或从测验视图切回当前文档
   * @returns {void}
   */
  function toggleQuizView() {

    state.view = state.view === 'quiz' ? 'doc' : 'quiz';

    clearViewToggleButtons();

    document.querySelectorAll('[data-action="toggle-quiz-view"]').forEach((btn) => {
      btn.classList.toggle('is-active', state.view === 'quiz');
    });

    if (state.view === 'quiz') {
      state.quizPool = null;
      renderQuizView();
      updateAppTitle();

      return;
    }

    const doc = findDoc(currentSlug());

    if (doc) {
      renderContent(doc);
    }
  }

  /**
   * 切换到「听力测试」视图，或从听力视图切回当前文档
   * 占位实现：具体的选择题交互（播放音频、干扰选项、判分）还没做，先接通视图切换和
   * 按钮高亮，跟收藏/测验用同一套模式，方便以后直接在这个函数里补渲染逻辑
   * @returns {void}
   */
  function toggleListeningView() {

    state.view = state.view === 'listening' ? 'doc' : 'listening';

    clearViewToggleButtons();

    document.querySelectorAll('[data-action="toggle-listening-view"]').forEach((btn) => {
      btn.classList.toggle('is-active', state.view === 'listening');
    });

    if (state.view === 'listening') {
      renderListeningView();
      updateAppTitle();

      return;
    }

    const doc = findDoc(currentSlug());

    if (doc) {
      renderContent(doc);
    }
  }

  /**
   * 取一条池子条目的"中文答案文字"（vocab 是释义，phrases 是释义，sentences 是中文译句）——
   * 都是 SIDE_FIELDS[type].cn 的第一个字段，三种类型的字段名不同但位置规律一致
   * @param {object} entry - buildQuizPool 里的一条
   * @returns {string}
   */
  function getListeningAnswerText(entry) {

    const field = SIDE_FIELDS[entry.sectionType].cn[0];

    return (entry.item.cn && entry.item.cn[field]) || '';
  }

  /**
   * 取一条池子条目完整的"英文说明"文字，答完题后每个选项底下显示用——不止朗读的
   * 那一个字段，把 en 侧的全部字段都带上（词汇是单词+词性+音标，短语是短语本身，
   * 句型是整句英文），词汇还额外带上中文读法（reading，虽然存在 cn 侧，但本质是
   * 给这个单词注音的，放在这里一起显示更完整）
   * @param {object} entry
   * @returns {string}
   */
  function getListeningEnText(entry) {

    const enFields = SIDE_FIELDS[entry.sectionType].en;
    const enText = enFields.map((field) => entry.item.en && entry.item.en[field]).filter(Boolean).join('  ');
    const reading = entry.sectionType === 'vocab' && entry.item.cn ? entry.item.cn.reading : '';

    return reading ? `${enText}  ${reading}` : enText;
  }

  /**
   * 给一条听力题生成选项：正确答案 + 3 个同类型的干扰项（干扰项从整个池子里随机抽，
   * 不跨类型混——词汇的释义不会跟句型的整句翻译放一起选，那样一眼就能排除），
   * 去重后打乱顺序。每个选项带上对应的英文原文，供答完题后逐个查看。
   * 池子条目不够 4 个不同答案时，选项数量会少于 4 个
   * @param {object} entry
   * @param {object[]} fullPool
   * @returns {{ text: string, enText: string, isCorrect: boolean }[]}
   */
  function buildListeningChoices(entry, fullPool) {

    const correctText = getListeningAnswerText(entry);
    const seenTexts = new Set([correctText]);

    const distractors = shuffleArray(
      fullPool.filter((other) => other.sectionType === entry.sectionType && other.id !== entry.id)
    ).reduce((acc, other) => {

      const text = getListeningAnswerText(other);

      if (acc.length < 3 && text && !seenTexts.has(text)) {
        seenTexts.add(text);
        acc.push({ text, enText: getListeningEnText(other), isCorrect: false });
      }

      return acc;
    }, []);

    const options = correctText
      ? [{ text: correctText, enText: getListeningEnText(entry), isCorrect: true }, ...distractors]
      : distractors;

    return shuffleArray(options);
  }

  /**
   * 渲染一条听力题：只有播放按钮 + 选项按钮，不显示任何文字线索
   * @param {object} entry
   * @param {object[]} fullPool - 用来生成干扰项
   * @returns {string}
   */
  function renderListeningItemRow(entry, fullPool, recordsById) {

    const choices = buildListeningChoices(entry, fullPool);
    const record = recordsById.get(entry.id);
    const favorited = Boolean(record && record.favorited);

    const choicesHtml = choices.map((choice) => `
      <button type="button" class="btn listening-choice-btn" data-action="listening-choice"
        data-key="${escapeAttr(entry.id)}" data-correct="${choice.isCorrect ? 'true' : 'false'}">
        <span class="listening-choice-top">
          <span class="listening-choice-text">${escapeHtml(choice.text)}</span>
        </span>
        <div class="listening-choice-en" hidden>${escapeHtml(choice.enText)}</div>
      </button>`).join('');

    return `
      <li class="item listening-item" data-key="${entry.id}">
        <div class="favorite-meta">${escapeHtml(entry.sectionHeading)}</div>
        <div class="listening-question side-cells-row">
          <button type="button" class="btn listening-reveal-btn" data-action="toggle-listening-reveal">查看原文</button>
          <div class="item-actions">
            ${renderSpeakButton(entry.sectionType, entry.item.en)}
            <button type="button" class="fav-btn${favorited ? ' is-favorited' : ''}" data-action="toggle-favorite-listening-item" aria-label="收藏">${favorited ? '★' : '☆'}</button>
          </div>
        </div>
        <div class="hidden-side">${formatSide(entry.sectionType, 'en', entry.item.en)}</div>
        <div class="listening-choices">${choicesHtml}</div>
      </li>`;
  }

  /**
   * 听力题选了一个选项之后的判分反馈：只改这一条题目的 DOM（禁用全部选项、
   * 标出对/错），不重渲染整个视图——不然已经答过的其它题目的反馈状态会被冲掉
   * @param {HTMLElement} actionEl - 被点击的选项按钮
   * @returns {void}
   */
  function handleListeningChoice(actionEl) {

    const itemEl = actionEl.closest('.listening-item');

    if (!itemEl) {

      return;
    }

    // 这道题已经答过了：再点任意一个选项按钮，不重新判分，只是把 4 个选项的英文
    // 原文一起切换显示/隐藏（一次性全部展开或全部收起，不是每条单独控制）
    if (itemEl.classList.contains('is-answered')) {
      itemEl.querySelectorAll('.listening-choice-en').forEach((enEl) => {
        enEl.hidden = !enEl.hidden;
      });

      return;
    }

    const entry = findListeningEntry(itemEl.dataset.key);

    if (!entry) {

      return;
    }

    const isCorrect = actionEl.dataset.correct === 'true';

    itemEl.classList.add('is-answered');
    itemEl.querySelectorAll('.listening-choice-btn').forEach((btnEl) => {

      const topEl = btnEl.querySelector('.listening-choice-top');

      if (btnEl.dataset.correct === 'true') {
        btnEl.classList.add('is-correct');
        topEl.insertAdjacentHTML('beforeend', '<span class="listening-choice-icon listening-choice-icon--correct" aria-hidden="true">✓</span>');
      } else if (btnEl === actionEl) {
        btnEl.classList.add('is-wrong');
        topEl.insertAdjacentHTML('beforeend', '<span class="listening-choice-icon listening-choice-icon--wrong" aria-hidden="true">✗</span>');
      }
    });

    // 答完之后把 4 个选项对应的英文原文都露出来，方便顺便学一下干扰项的词；
    // 按钮本身不禁用，再点一下（不管点哪个选项）就是上面那个分支，一起收起
    itemEl.querySelectorAll('.listening-choice-en').forEach((enEl) => {
      enEl.hidden = false;
    });

    // 答对给 3 档、答错给 1 档，接入现有的评分 + 间隔重复调度，测验模式也会看到这次结果
    setItemMark(entry, isCorrect ? 3 : 1);
  }

  /**
   * 开始新一轮听力测试：重新摊平全部文档的 item，按间隔重复优先级排序，批次从头开始
   * @returns {void}
   */
  function startNewListeningPool() {

    state.listeningPool = sortPoolBySrsPriority(buildQuizPool());
    state.listeningBatchOffset = 0;
  }

  /**
   * 「换一批」按钮：按批次顺序往后翻，一轮抽完自动重新排序开始下一轮
   * @returns {void}
   */
  function nextListeningBatch() {

    state.listeningBatchOffset += QUIZ_BATCH_SIZE;

    if (state.listeningBatchOffset >= state.listeningPool.length) {
      startNewListeningPool();
    }

    renderListeningView();
  }

  /**
   * 渲染「听力测试」视图：播放英文音频，从选项里选中文意思，选完立刻判对错
   * @returns {void}
   */
  function renderListeningView() {

    const contentEl = document.querySelector('[data-role="content"]');

    syncBodyView();

    if (!state.listeningPool) {
      startNewListeningPool();
    }

    if (state.listeningPool.length === 0) {
      contentEl.innerHTML = `
        <header class="doc-header"><h2 class="doc-title">🎧 听力测试</h2></header>
        <p class="favorites-empty">没有可供听力测试的内容。</p>`;

      return;
    }

    const batch = state.listeningPool.slice(state.listeningBatchOffset, state.listeningBatchOffset + QUIZ_BATCH_SIZE);

    // 只读一次 localStorage 建查找表，避免每条 item 都单独读一次
    const recordsById = new Map(
      loadFavorites().filter((fav) => fav.kind === 'item').map((fav) => [fav.id, fav])
    );
    const itemsHtml = batch.map((entry) => renderListeningItemRow(entry, state.listeningPool, recordsById)).join('');

    const totalBatches = Math.ceil(state.listeningPool.length / QUIZ_BATCH_SIZE);
    const currentBatch = Math.floor(state.listeningBatchOffset / QUIZ_BATCH_SIZE) + 1;

    contentEl.innerHTML = `
      <header class="doc-header"><h2 class="doc-title">🎧 听力测试</h2></header>
      <div class="favorites-toolbar">
        <button type="button" class="btn" data-action="next-listening-batch">换一批</button>
        <span class="favorites-hint">
          第 ${currentBatch}/${totalBatches} 批，共 ${state.listeningPool.length} 条；点🔊听音频，选中文意思
        </span>
      </div>
      <ul class="item-list">${itemsHtml}</ul>
      ${renderBottomControls('<button type="button" class="btn bottom-controls-leading" data-action="next-listening-batch">换一批</button>')}`;
  }

  // ── 句子训练（精听 / 听写 / 选词 / 回译）───────────
  // 借鉴可可英语的"文章精听 / 文章听写 / 九宫格"：只练当前这篇的句子类内容，一句一句往下，
  // 声音用浏览器自带朗读（speakText），不需要音频文件

  /**
   * 读取句子训练设置，缺字段 / 非法值时用默认值补齐
   * @returns {object} 结构同 DEFAULT_TRAINING_SETTINGS
   */
  function loadTrainingSettings() {

    let saved = {};

    try {
      saved = JSON.parse(localStorage.getItem(STORAGE_TRAINING_KEY) || '{}') || {};
    } catch (err) {
      saved = {};
    }

    const settings = {
      ...DEFAULT_TRAINING_SETTINGS,
      ...saved,
      levels: { ...DEFAULT_TRAINING_SETTINGS.levels, ...(saved.levels || {}) },
    };

    if (!TRAINING_TABS.some((tab) => tab.id === settings.tab)) {
      settings.tab = DEFAULT_TRAINING_SETTINGS.tab;
    }

    if (!TRAINING_LOOP_OPTIONS.includes(settings.loop)) {
      settings.loop = DEFAULT_TRAINING_SETTINGS.loop;
    }

    if (!TRAINING_RATE_OPTIONS.includes(settings.rate)) {
      settings.rate = DEFAULT_TRAINING_SETTINGS.rate;
    }

    Object.keys(TRAINING_LEVELS).forEach((tabId) => {
      if (!TRAINING_LEVELS[tabId].some((level) => level.id === settings.levels[tabId])) {
        settings.levels[tabId] = DEFAULT_TRAINING_SETTINGS.levels[tabId];
      }
    });

    return settings;
  }

  /**
   * 持久化句子训练设置
   * @returns {void}
   */
  function saveTrainingSettings() {

    try {
      localStorage.setItem(STORAGE_TRAINING_KEY, JSON.stringify(state.trainingSettings));
    } catch (err) {
      // 静默降级：不影响页面使用
    }
  }

  /**
   * 读取每篇练到第几句（只存本机，不跟收藏一起同步）
   * @returns {Object<string, number>} key 为文档 slug
   */
  function loadTrainingPositions() {

    try {
      const positions = JSON.parse(localStorage.getItem(STORAGE_TRAINING_POS_KEY) || '{}');

      return positions && typeof positions === 'object' ? positions : {};
    } catch (err) {

      return {};
    }
  }

  /**
   * 记下这篇练到第几句；先删再加，让最近练的排在最后，超出上限时从最早的开始删
   * @param {string} slug
   * @param {number} index
   * @returns {void}
   */
  function saveTrainingPosition(slug, index) {

    const positions = loadTrainingPositions();

    delete positions[slug];
    positions[slug] = index;

    const slugs = Object.keys(positions);

    slugs.slice(0, Math.max(slugs.length - TRAINING_POS_MAX_ENTRIES, 0)).forEach((oldSlug) => {
      delete positions[oldSlug];
    });

    try {
      localStorage.setItem(STORAGE_TRAINING_POS_KEY, JSON.stringify(positions));
    } catch (err) {
      // 静默降级：不影响页面使用
    }
  }

  /**
   * 收集一篇里可以拿来训练的句子：「句型 & 金句」和泛读「阅读原文」，词汇 / 短语太短不收
   * @param {object} doc - NoteDoc
   * @returns {{ text: string, cn: string, context: object }[]} context 供 setItemMark 记错题用
   */
  function collectTrainingSentences(doc) {

    const sentences = [];

    doc.sections.forEach((section) => {

      if (section.type !== 'sentences' && section.type !== 'reading') {

        return;
      }

      section.items.forEach((item, itemIndex) => {

        const en = item.en || {};
        const cn = item.cn || {};
        const text = (section.type === 'reading' ? en.text : en.text_en) || '';

        if (!text.trim()) {

          return;
        }

        sentences.push({
          text: text.trim(),
          cn: (section.type === 'reading' ? cn.gist : cn.text_cn) || '',
          context: buildItemContext(doc, section, itemIndex),
        });
      });
    });

    return sentences;
  }

  /**
   * 按空格把句子切成词，每个词再拆成"前导标点 + 词本体 + 尾随标点"，
   * 挖空 / 遮挡只针对词本体，标点保持显示
   * @param {string} text
   * @returns {{ raw: string, prefix: string, core: string, suffix: string }[]}
   */
  function tokenizeSentence(text) {

    return text.split(/\s+/).filter(Boolean).map((raw) => {

      const match = raw.match(/^([^A-Za-z0-9]*)(.*?)([^A-Za-z0-9]*)$/);

      return { raw, prefix: match[1], core: match[2], suffix: match[3] };
    });
  }

  /**
   * 比对用的词形归一：小写、弯引号转直引号、去掉连字符等符号，避免大小写 / 标点差异判错
   * @param {string} word
   * @returns {string}
   */
  function normalizeTrainingWord(word) {

    return (word || '')
      .toLowerCase()
      .replace(/[’‘]/g, "'")
      .replace(/[^a-z0-9']/g, '');
  }

  /**
   * 判断一个词在当前标签页 + 难度下要不要挖空 / 遮挡。规则参考可可英语前端代码：
   * - 精听：简单 = 6 个字母以上的长词，中等 = 超过 3 个字母的词（可可默认档），困难 = 全部；
   *   盲听 = 全部，而且连遮挡块都不显示（借鉴每日英语听力的盲听模式，见 renderTrainingListenTokens）
   * - 听写：只挖全小写单词（大写开头的人名 / 句首词保留显示），简单再限超过 3 个字母
   * - 选词：简单同听写简单，困难 = 全部词都做成方块（跟可可 App 的九宫格一样）
   * @param {{ core: string }} token
   * @param {string} tab
   * @param {string} level
   * @returns {boolean}
   */
  function isTrainingBlank(token, tab, level) {

    if (!/[A-Za-z0-9]/.test(token.core)) {

      return false;
    }

    const letterCount = token.core.replace(/[^A-Za-z]/g, '').length;
    const isLowerWord = /^[a-z][a-z'’-]*$/.test(token.core);

    if (tab === 'listen') {

      if (level === 'hard' || level === 'blind') {

        return true;
      }

      return level === 'medium' ? letterCount > 3 : letterCount >= 6;
    }

    if (tab === 'dictation') {

      return isLowerWord && (level === 'hard' || letterCount > 3);
    }

    if (tab === 'pick') {

      return level === 'hard' || (isLowerWord && letterCount > 3);
    }

    return false;
  }

  /**
   * 进入句子训练视图（或在训练视图里换了一篇），练这篇的句子
   * @param {object} doc - NoteDoc
   * @returns {void}
   */
  function enterTrainingView(doc) {

    state.view = 'training';

    if (!state.trainingSettings) {
      state.trainingSettings = loadTrainingSettings();
    }

    document.querySelectorAll('[data-action="toggle-training-view"]').forEach((btn) => {
      btn.classList.add('is-active');
    });

    const sentences = collectTrainingSentences(doc);

    // 接着上次练到的那句；源文件改过、句子变少时夹到最后一句
    const savedIndex = loadTrainingPositions()[doc.slug] || 0;

    state.training = {
      slug: doc.slug,
      sentences,
      index: Math.min(savedIndex, Math.max(sentences.length - 1, 0)),
      results: [], // 按句子下标存听写 / 选词的判分结果，用于成绩页
      startedAt: Date.now(),
      finishedAt: 0,
      isFinished: false, // 是否在显示成绩页
      sentence: null, // 当前这句的界面状态，见 buildTrainingSentenceState
      playToken: 0, // 每次停止 / 重新播放都加 1，旧的念完回调发现对不上就不再循环
      loopTimer: null,
      isPlaying: false,
    };

    if (state.training.sentences.length > 0) {
      buildTrainingSentenceState();
    }

    renderTrainingView();
    updateAppTitle(doc.chapter);
    window.scrollTo(0, 0);
  }

  /**
   * 顶部 / 底部「训练」按钮：进入当前这篇的句子训练，再点一次回到正文
   * @returns {void}
   */
  function toggleTrainingView() {

    const isEntering = state.view !== 'training';
    const doc = findDoc(currentSlug());

    clearViewToggleButtons();

    if (!doc) {

      return;
    }

    if (isEntering) {
      enterTrainingView(doc);

      return;
    }

    state.view = 'doc';
    renderContent(doc);
  }

  /**
   * 按当前标签页 + 难度，给当前这句重建界面状态（换句 / 换标签页 / 换难度时调用）
   * @returns {void}
   */
  function buildTrainingSentenceState() {

    const training = state.training;
    const { tab } = state.trainingSettings;
    const level = state.trainingSettings.levels[tab];
    const sentence = training.sentences[training.index];

    const tokens = tokenizeSentence(sentence.text).map((token) => ({
      ...token,
      isBlank: isTrainingBlank(token, tab, level),
    }));
    const blankOrder = tokens
      .map((token, tokenIndex) => (token.isBlank ? tokenIndex : -1))
      .filter((tokenIndex) => tokenIndex >= 0);


    training.sentence = {
      tokens,
      blankOrder, // 挖空的词在 tokens 里的下标，按句子顺序
      revealed: new Set(), // 精听：已点开的词
      drafts: new Map(), // 听写：重渲染前暂存还没提交的输入，key 为 token 下标
      hintLevels: new Map(), // 听写：用过提示的空，key 为 token 下标，值 1 = 给了首字母、2 = 给了整个词
      activeTokenIndex: null, // 听写：最近一次获得焦点的空，💡 提示给这个空
      outcomes: new Map(), // 听写 / 选词判分结果，key 为 token 下标，值 { given, isCorrect, score }
      isChecked: false, // 听写已检查 / 选词已填完 / 回译已对比
      filledCount: 0, // 选词：已经按顺序填对了几个空
      wrongBlanks: new Set(), // 选词：点错过方块的空（按 blankOrder 的序号）
      flashTileId: null, // 选词：刚点错的方块，渲染时加抖动效果
      tiles: shuffleArray(blankOrder.map((tokenIndex, tileId) => ({
        id: tileId,
        text: tokens[tokenIndex].core,
        isUsed: false,
      }))),
      backtransInput: '', // 回译：用户输入的英文
      isGivenUp: false, // 选词：是点「显示答案」结束的（主按钮显示"已显示"），不是自己点完的（"已完成"）
    };
  }

  /**
   * 停掉句子训练的朗读（包括还没开始的下一遍循环）
   * @returns {void}
   */
  function stopTrainingPlayback() {

    const training = state.training;

    if (!training) {

      return;
    }

    const wasPlaying = training.isPlaying;

    training.playToken += 1;
    clearTimeout(training.loopTimer);
    training.isPlaying = false;

    if (wasPlaying && typeof window.speechSynthesis !== 'undefined') {
      window.speechSynthesis.cancel();
    }

    updateTrainingPlayButton();
  }

  /**
   * 从头播放当前这句，按设置的遍数循环（0 = 无限循环，直到手动停止 / 换句）
   * @returns {void}
   */
  function playTrainingSentence() {

    const training = state.training;

    if (!training || training.sentences.length === 0 || training.isFinished) {

      return;
    }

    stopTrainingPlayback();

    const token = training.playToken;
    const { loop, rate } = state.trainingSettings;
    const text = training.sentences[training.index].text;
    let playedCount = 0;


    // 念完一遍后决定要不要再念；token 对不上说明期间被停止 / 换句了，旧回调直接作废
    const finishPlayback = () => {
      if (token !== training.playToken) {

        return;
      }

      training.isPlaying = false;
      updateTrainingPlayButton();
    };

    const speakOnce = () => {
      if (token !== training.playToken || state.view !== 'training') {

        return;
      }

      playedCount += 1;

      speakText(text, {
        rate,
        onEnd: () => {
          if (token !== training.playToken) {

            return;
          }

          if (loop === 0 || playedCount < loop) {
            training.loopTimer = setTimeout(speakOnce, TRAINING_LOOP_GAP_MS);

            return;
          }

          finishPlayback();
        },
        onError: finishPlayback,
      });
    };

    training.isPlaying = true;
    updateTrainingPlayButton();
    speakOnce();
  }

  /**
   * 播放 / 停止切换
   * @returns {void}
   */
  function toggleTrainingPlayback() {

    if (state.training && state.training.isPlaying) {
      stopTrainingPlayback();

      return;
    }

    playTrainingSentence();
  }

  /**
   * 同步播放按钮文字（播放中显示"停止"）
   * @returns {void}
   */
  function updateTrainingPlayButton() {

    const isPlaying = Boolean(state.training && state.training.isPlaying);

    document.querySelectorAll('[data-role="training-play-btn"]').forEach((btn) => {
      btn.textContent = isPlaying ? '■ 停止' : '▶ 播放';
      btn.classList.toggle('is-active', isPlaying);
    });
  }

  /**
   * 跳到第 index 句；听写 / 选词在最后一句再往后就进成绩页
   * @param {number} index
   * @param {{ shouldPlay?: boolean }} [options]
   * @returns {void}
   */
  function goToTrainingSentence(index, { shouldPlay = true } = {}) {

    const training = state.training;
    const { tab } = state.trainingSettings;

    if (!training || index < 0) {

      return;
    }

    stopTrainingPlayback();

    if (index >= training.sentences.length) {

      if (tab === 'dictation' || tab === 'pick') {
        training.isFinished = true;
        training.finishedAt = Date.now();
        renderTrainingView();
      }

      return;
    }

    training.index = index;
    training.isFinished = false;
    saveTrainingPosition(training.slug, index);
    buildTrainingSentenceState();
    renderTrainingView();

    if (shouldPlay) {
      playTrainingSentence();
    }
  }

  /**
   * 重渲染前把还没提交的输入（听写的空、回译的输入框）存进状态，避免切"译"之类的操作清掉输入。
   * 只能在"同一句重渲染"之前调用——换句时 DOM 里还是上一句的输入框，读进来会串到新句子里
   * @returns {void}
   */
  function captureTrainingDrafts() {

    const sentenceState = state.training && state.training.sentence;

    if (!sentenceState || sentenceState.isChecked) {

      return;
    }

    document.querySelectorAll('[data-role="training-blank"]').forEach((inputEl) => {
      sentenceState.drafts.set(Number(inputEl.dataset.tokenIndex), inputEl.value);
    });

    const backtransEl = document.querySelector('[data-role="training-backtrans-input"]');

    if (backtransEl) {
      sentenceState.backtransInput = backtransEl.value;
    }
  }

  /**
   * 一个可以点了单独发音的词：词本体包一层可点击的 span，前后标点照常显示。
   * 听不清的往往只是其中一个词，单独听比整句重放高效
   * @param {{ raw: string, prefix: string, core: string, suffix: string }} token
   * @param {string} [extraClass] - 词本体额外的 class（揭示 / 对错颜色）
   * @param {string} [innerHtml] - 词本体里面的内容，默认就是这个词（听写错了要先放划掉的输入）
   * @returns {string}
   */
  function renderTrainingSpeakableWord(token, extraClass = '', innerHtml = escapeHtml(token.core)) {

    if (!normalizeTrainingWord(token.core)) {

      return `<span class="training-word">${escapeHtml(token.raw)}</span>`;
    }

    const coreHtml = `<span class="training-speakable${extraClass ? ` ${extraClass}` : ''}" data-action="training-speak-word" data-word="${escapeAttr(token.core)}">${innerHtml}</span>`;

    return `<span class="training-word">${escapeHtml(token.prefix)}${coreHtml}${escapeHtml(token.suffix)}</span>`;
  }

  /**
   * 渲染一个已判分的句子：对的词绿色，错的词红色（划掉自己填的 + 正确答案），
   * 用过提示才填对的词橙色（只算半对）；每个词都能点了单独发音
   * @param {object[]} tokens
   * @param {Map<number, { given: string, isCorrect: boolean, score: number }>} outcomes
   * @returns {string}
   */
  function renderTrainingCheckedTokens(tokens, outcomes) {

    return tokens.map((token, tokenIndex) => {

      const outcome = outcomes.get(tokenIndex);

      if (!outcome) {

        return renderTrainingSpeakableWord(token);
      }

      const givenHtml = !outcome.isCorrect && outcome.given
        ? `<s class="training-given">${escapeHtml(outcome.given)}</s>`
        : '';
      let stateClass = outcome.isCorrect ? 'is-correct' : 'is-wrong';

      if (outcome.isCorrect && outcome.score < 1) {
        stateClass = 'is-hinted';
      }

      return renderTrainingSpeakableWord(token, `training-answer ${stateClass}`, `${givenHtml}${escapeHtml(token.core)}`);
    }).join('');
  }

  /**
   * 精听：被遮的词显示成斜纹块，点一下露出来；盲听档在全部揭示之前连句子都不显示，只出声音
   * @param {object} sentenceState
   * @returns {string}
   */
  function renderTrainingListenTokens(sentenceState) {

    const isBlind = state.trainingSettings.levels.listen === 'blind';
    const isAllRevealed = sentenceState.blankOrder.every((tokenIndex) => sentenceState.revealed.has(tokenIndex));

    if (isBlind && !isAllRevealed) {

      return '<div class="training-blind">🎧 盲听：只听声音，听懂了再点「显示原文」核对</div>';
    }

    return sentenceState.tokens.map((token, tokenIndex) => {

      if (!token.isBlank) {

        return renderTrainingSpeakableWord(token);
      }

      if (sentenceState.revealed.has(tokenIndex)) {

        return renderTrainingSpeakableWord(token, 'training-revealed');
      }

      const maskHtml = `<button type="button" class="training-mask" data-action="training-reveal-word" data-token-index="${tokenIndex}" style="--len: ${token.core.length}" aria-label="显示这个词"></button>`;

      return `<span class="training-word">${escapeHtml(token.prefix)}${maskHtml}${escapeHtml(token.suffix)}</span>`;
    }).join('');
  }

  /**
   * 听写：挖空的词换成输入框，宽度跟单词长度对应（可可也是这样给一点长度提示）
   * @param {object} sentenceState
   * @returns {string}
   */
  function renderTrainingDictationTokens(sentenceState) {

    if (sentenceState.isChecked) {

      return renderTrainingCheckedTokens(sentenceState.tokens, sentenceState.outcomes);
    }

    let blankNumber = 0;

    return sentenceState.tokens.map((token, tokenIndex) => {

      if (!token.isBlank) {

        return renderTrainingSpeakableWord(token);
      }

      blankNumber += 1;

      const draft = sentenceState.drafts.get(tokenIndex) || '';
      const hintedClass = sentenceState.hintLevels.has(tokenIndex) ? ' is-hinted' : '';
      const inputHtml = `<input type="text" class="training-blank${hintedClass}" data-role="training-blank" data-token-index="${tokenIndex}" value="${escapeAttr(draft)}" style="--len: ${token.core.length}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="第 ${blankNumber} 个空">`;

      return `<span class="training-word">${escapeHtml(token.prefix)}${inputHtml}${escapeHtml(token.suffix)}</span>`;
    }).join('');
  }

  /**
   * 选词：已填的空显示单词，当前要填的空高亮，后面的空是下划线
   * @param {object} sentenceState
   * @returns {string}
   */
  function renderTrainingPickTokens(sentenceState) {

    if (sentenceState.isChecked) {

      return renderTrainingCheckedTokens(sentenceState.tokens, sentenceState.outcomes);
    }

    const currentTokenIndex = sentenceState.blankOrder[sentenceState.filledCount];

    return sentenceState.tokens.map((token, tokenIndex) => {

      if (!token.isBlank) {

        return renderTrainingSpeakableWord(token);
      }

      const outcome = sentenceState.outcomes.get(tokenIndex);

      if (outcome) {

        return renderTrainingSpeakableWord(token, `training-answer ${outcome.isCorrect ? 'is-correct' : 'is-wrong'}`);
      }

      const slotHtml = `<span class="training-slot${tokenIndex === currentTokenIndex ? ' is-current' : ''}" style="--len: ${token.core.length}"></span>`;

      return `<span class="training-word">${escapeHtml(token.prefix)}${slotHtml}${escapeHtml(token.suffix)}</span>`;
    }).join('');
  }

  /**
   * 选词：打乱的单词方块，用过的留空位不挪动（跟可可 App 一样，位置不跳，方便找）
   * @param {object} sentenceState
   * @returns {string}
   */
  function renderTrainingPickTiles(sentenceState) {

    if (sentenceState.isChecked) {

      return '';
    }

    const tilesHtml = sentenceState.tiles.map((tile) => {

      const classes = ['training-tile'];

      if (tile.isUsed) {
        classes.push('is-used');
      }

      if (tile.id === sentenceState.flashTileId) {
        classes.push('is-wrong');
      }

      return `<button type="button" class="${classes.join(' ')}" data-action="training-pick-tile" data-tile-id="${tile.id}"${tile.isUsed ? ' disabled' : ''}>${escapeHtml(tile.text)}</button>`;
    }).join('');

    return `<div class="training-tiles">${tilesHtml}</div>`;
  }

  /**
   * 用最长公共子序列比对两串词，标出哪些词对上了（回译用：顺序也算进去，不是只看词有没有出现）
   * @param {string[]} expectedWords - 已归一化
   * @param {string[]} givenWords - 已归一化
   * @returns {{ expectedMatched: boolean[], givenMatched: boolean[] }}
   */
  function diffTrainingWords(expectedWords, givenWords) {

    const rows = expectedWords.length;
    const cols = givenWords.length;
    const table = Array.from({ length: rows + 1 }, () => new Array(cols + 1).fill(0));

    const expectedMatched = new Array(rows).fill(false);
    const givenMatched = new Array(cols).fill(false);


    for (let i = rows - 1; i >= 0; i -= 1) {
      for (let j = cols - 1; j >= 0; j -= 1) {
        table[i][j] = expectedWords[i] === givenWords[j]
          ? table[i + 1][j + 1] + 1
          : Math.max(table[i + 1][j], table[i][j + 1]);
      }
    }

    // 沿着表格走一遍，把公共子序列上的词标记出来
    let i = 0;
    let j = 0;

    while (i < rows && j < cols) {
      if (expectedWords[i] === givenWords[j]) {
        expectedMatched[i] = true;
        givenMatched[j] = true;
        i += 1;
        j += 1;
      } else if (table[i + 1][j] >= table[i][j + 1]) {
        i += 1;
      } else {
        j += 1;
      }
    }

    return { expectedMatched, givenMatched };
  }

  /**
   * 回译：看中文打英文；对比后原文里漏掉的词标红，自己多写 / 写错的词划掉
   * @param {object} sentence
   * @param {object} sentenceState
   * @returns {string}
   */
  function renderTrainingBacktrans(sentence, sentenceState) {

    const cnHtml = `<div class="training-backtrans-cn">${escapeHtml(sentence.cn || '（这句没有中文意思）')}</div>`;

    if (!sentenceState.isChecked) {

      return `
        ${cnHtml}
        <textarea class="training-backtrans-input" data-role="training-backtrans-input" rows="3" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="把这句中文翻成英文，写完按「对比」（Ctrl + Enter）">${escapeHtml(sentenceState.backtransInput)}</textarea>`;
    }

    const expectedTokens = sentenceState.tokens.filter((token) => normalizeTrainingWord(token.core));
    const givenTokens = sentenceState.backtransInput.split(/\s+/).filter((word) => normalizeTrainingWord(word));
    const { expectedMatched, givenMatched } = diffTrainingWords(
      expectedTokens.map((token) => normalizeTrainingWord(token.core)),
      givenTokens.map((word) => normalizeTrainingWord(word))
    );

    const expectedHtml = expectedTokens.map((token, index) => (
      renderTrainingSpeakableWord(token, `training-answer ${expectedMatched[index] ? 'is-correct' : 'is-wrong'}`)
    )).join('');
    const givenHtml = givenTokens.length > 0
      ? givenTokens.map((word, index) => (
        `<span class="training-word${givenMatched[index] ? '' : ' is-extra'}">${escapeHtml(word)}</span>`
      )).join('')
      : '<span class="training-word">（没有填写）</span>';
    const matchedCount = expectedMatched.filter(Boolean).length;

    return `
      ${cnHtml}
      <div class="training-backtrans-label">你写的：</div>
      <div class="training-sentence training-sentence--small">${givenHtml}</div>
      <div class="training-backtrans-label">原文（对上 ${matchedCount} / ${expectedTokens.length} 个词）：</div>
      <div class="training-sentence">${expectedHtml}</div>
      <p class="training-note">泛读的中文是意译的大意，跟原文对不上很正常，这里只做对照，不计分。</p>`;
  }

  /**
   * 当前标签页 + 状态下，主按钮（Enter 键）该干什么、显示什么字。
   * 主按钮只管"本句操作"，做完就变灰显示已完成状态，不会变成"下一句"——
   * 同一位置的按钮点完立刻换成别的功能，连点两下很容易误跳句；换句只用两边的「上一句」「下一句」/ ← → 键
   * @returns {{ label: string, action: string, isDone?: boolean }} action 为 'none' 时按钮禁用；
   *   isDone 表示按钮显示成灰色完成态但仍可点击（回译「已对比」点了退回编辑）
   */
  function getTrainingPrimaryAction() {

    const sentenceState = state.training.sentence;
    const { tab } = state.trainingSettings;

    // 完成态都能再点一次退回：精听重新遮住、听写回到填空（保留填过的内容）、
    // 选词重新打乱再做、回译回到编辑（保留写过的英文）
    if (tab === 'listen') {

      const isAllRevealed = sentenceState.blankOrder.every((tokenIndex) => sentenceState.revealed.has(tokenIndex));
      const isBlind = state.trainingSettings.levels.listen === 'blind';

      if (isAllRevealed) {

        return { label: '已显示', action: 'uncheck', isDone: true };
      }

      return { label: isBlind ? '显示原文' : '全部显示', action: 'reveal-all' };
    }

    if (tab === 'dictation') {

      return sentenceState.isChecked ? { label: '已检查', action: 'uncheck', isDone: true } : { label: '检查', action: 'check' };
    }

    if (tab === 'pick') {

      if (!sentenceState.isChecked) {

        return { label: '显示答案', action: 'give-up' };
      }

      // 点了「显示答案」才算"已显示"；自己把方块全部点完的是"已完成"
      return { label: sentenceState.isGivenUp ? '已显示' : '已完成', action: 'uncheck', isDone: true };
    }

    return sentenceState.isChecked ? { label: '已对比', action: 'uncheck', isDone: true } : { label: '对比', action: 'check' };
  }

  /**
   * 主按钮 / Enter 键：按当前状态执行检查、对比、显示答案或全部显示（不负责换句）；
   * 完成态再点一次退回（undoTrainingSentence）
   * @param {{ isFromKeyboard?: boolean }} [options] - Enter 键触发时不做退回：检查完再按一次 Enter
   *   就撤掉检查，跟"连点两下误触"是同一个问题，退回只认鼠标 / 手指点按钮
   * @returns {void}
   */
  function handleTrainingPrimary({ isFromKeyboard = false } = {}) {

    const training = state.training;

    if (!training || training.isFinished || training.sentences.length === 0) {

      return;
    }

    const { action } = getTrainingPrimaryAction();
    const sentenceState = training.sentence;

    if (action === 'uncheck' && isFromKeyboard) {

      return;
    }

    if (action === 'reveal-all') {
      sentenceState.blankOrder.forEach((tokenIndex) => sentenceState.revealed.add(tokenIndex));
      renderTrainingView();
    }

    if (action === 'check' && state.trainingSettings.tab === 'dictation') {
      checkTrainingDictation();
    }

    if (action === 'check' && state.trainingSettings.tab === 'backtrans') {
      captureTrainingDrafts();
      sentenceState.isChecked = true;
      renderTrainingView();
    }

    if (action === 'give-up') {
      finishTrainingPick({ isGivingUp: true });
    }

    if (action === 'uncheck') {
      undoTrainingSentence();
    }
  }

  /**
   * 主按钮完成态再点一次：把当前这句退回到做之前的状态。
   * 听写 / 选词会撤掉这句已记的成绩（重新检查 / 做完时再记），但已经记进复习的评分不撤回
   * @returns {void}
   */
  function undoTrainingSentence() {

    const training = state.training;
    const sentenceState = training.sentence;
    const { tab } = state.trainingSettings;


    if (tab === 'listen') {
      sentenceState.revealed.clear();
      renderTrainingView();

      return;
    }

    delete training.results[training.index];

    if (tab === 'pick') {
      buildTrainingSentenceState();
      renderTrainingView();

      return;
    }

    // 听写：记下第一个填错的空，退回后光标直接放过去改
    const firstWrongTokenIndex = sentenceState.blankOrder.find((tokenIndex) => {
      const outcome = sentenceState.outcomes.get(tokenIndex);

      return outcome && !outcome.isCorrect;
    });

    sentenceState.outcomes.clear();
    sentenceState.isChecked = false;
    renderTrainingView();

    if (tab === 'dictation' && firstWrongTokenIndex !== undefined) {
      const wrongInputEl = document.querySelector(`[data-role="training-blank"][data-token-index="${firstWrongTokenIndex}"]`);

      if (wrongInputEl) {
        wrongInputEl.focus();
        wrongInputEl.select();
      }
    }

    // 回译：光标放到已有文字末尾，直接接着改
    const backtransEl = document.querySelector('[data-role="training-backtrans-input"]');

    if (backtransEl) {
      backtransEl.focus();
      backtransEl.setSelectionRange(backtransEl.value.length, backtransEl.value.length);
    }
  }

  /**
   * 听写：逐个空比对（忽略大小写和标点），记录成绩。
   * 计分：自己填对 1 分；用过首字母提示后填对 0.5 分；直接要了整个词 0 分（显示成对，但不算分）
   * @returns {void}
   */
  function checkTrainingDictation() {

    const sentenceState = state.training.sentence;

    captureTrainingDrafts();

    sentenceState.blankOrder.forEach((tokenIndex) => {
      const given = (sentenceState.drafts.get(tokenIndex) || '').trim();
      const expected = sentenceState.tokens[tokenIndex].core;
      const isCorrect = normalizeTrainingWord(given) === normalizeTrainingWord(expected);
      const hintLevel = sentenceState.hintLevels.get(tokenIndex) || 0;
      let score = isCorrect ? 1 : 0;

      if (isCorrect && hintLevel === 1) {
        score = TRAINING_HINT_SCORE;
      }

      if (hintLevel === 2) {
        score = 0;
      }

      sentenceState.outcomes.set(tokenIndex, { given, isCorrect, score });
    });

    sentenceState.isChecked = true;
    recordTrainingResult();
    renderTrainingView();
  }

  /**
   * 选词：点一个方块，对就填进当前空，错就让方块抖一下并记下这个空错过
   * @param {HTMLElement} actionEl
   * @returns {void}
   */
  function handleTrainingPickTile(actionEl) {

    const sentenceState = state.training && state.training.sentence;

    if (!sentenceState || sentenceState.isChecked) {

      return;
    }

    const tileId = Number(actionEl.dataset.tileId);
    const tile = sentenceState.tiles.find((entry) => entry.id === tileId);
    const blankPosition = sentenceState.filledCount;
    const tokenIndex = sentenceState.blankOrder[blankPosition];

    if (!tile || tile.isUsed || tokenIndex === undefined) {

      return;
    }

    // 同一个词出现两次时两块方块都算对，按词形比，不按方块 id 比
    const isMatch = normalizeTrainingWord(tile.text) === normalizeTrainingWord(sentenceState.tokens[tokenIndex].core);

    if (!isMatch) {
      sentenceState.wrongBlanks.add(blankPosition);
      sentenceState.flashTileId = tileId;
      renderTrainingView();

      return;
    }

    tile.isUsed = true;
    sentenceState.flashTileId = null;
    const isFirstTry = !sentenceState.wrongBlanks.has(blankPosition);

    sentenceState.outcomes.set(tokenIndex, { given: tile.text, isCorrect: isFirstTry, score: isFirstTry ? 1 : 0 });
    sentenceState.filledCount += 1;

    if (sentenceState.filledCount >= sentenceState.blankOrder.length) {
      finishTrainingPick({ isGivingUp: false });

      return;
    }

    renderTrainingView();
  }

  /**
   * 选词这句结束：全部填完，或点了"显示答案"（剩下没填的空都算错）
   * @param {{ isGivingUp: boolean }} options
   * @returns {void}
   */
  function finishTrainingPick({ isGivingUp }) {

    const sentenceState = state.training.sentence;

    if (isGivingUp) {
      sentenceState.blankOrder.forEach((tokenIndex) => {
        if (!sentenceState.outcomes.has(tokenIndex)) {
          sentenceState.outcomes.set(tokenIndex, { given: '', isCorrect: false, score: 0 });
        }
      });
    }

    sentenceState.isChecked = true;
    sentenceState.isGivenUp = isGivingUp;
    sentenceState.flashTileId = null;
    recordTrainingResult();
    renderTrainingView();
  }

  /**
   * 听写 💡 提示：给当前（最近聚焦过的）空，没有就给第一个还空着的空。
   * 第一次给首字母，第二次给整个词；直接改输入框的值，不重渲染，免得打断正在打的字
   * @returns {void}
   */
  function giveTrainingHint() {

    const sentenceState = state.training && state.training.sentence;

    if (!sentenceState || sentenceState.isChecked || state.trainingSettings.tab !== 'dictation') {

      return;
    }

    const inputEls = [...document.querySelectorAll('[data-role="training-blank"]')];
    const activeInputEl = inputEls.find((inputEl) => Number(inputEl.dataset.tokenIndex) === sentenceState.activeTokenIndex);
    const targetInputEl = activeInputEl || inputEls.find((inputEl) => !inputEl.value.trim());

    if (!targetInputEl) {

      return;
    }

    const tokenIndex = Number(targetInputEl.dataset.tokenIndex);
    const word = sentenceState.tokens[tokenIndex].core;
    const nextLevel = Math.min((sentenceState.hintLevels.get(tokenIndex) || 0) + 1, 2);

    sentenceState.hintLevels.set(tokenIndex, nextLevel);
    sentenceState.activeTokenIndex = tokenIndex;

    targetInputEl.value = nextLevel === 1 ? word.charAt(0) : word;
    targetInputEl.classList.add('is-hinted');
    targetInputEl.focus();
    targetInputEl.setSelectionRange(targetInputEl.value.length, targetInputEl.value.length);
  }

  /**
   * 句子训练检查 / 揭示之后，显示这句的词汇点和讲解（泛读「阅读原文」才有，句型表没有这两列）。
   * 借鉴每日英语听力的"重点单词智能提示"：练完马上知道难点在哪
   * @param {object} sentence - collectTrainingSentences 里的一条
   * @returns {string}
   */
  function renderTrainingNotes(sentence) {

    const item = sentence.context.item;
    const vocabs = item.vocab || [];
    const grammar = item.grammar || '';

    if (vocabs.length === 0 && !grammar) {

      return '';
    }

    const vocabHtml = vocabs.length > 0
      ? `<ul class="training-notes-vocab">${vocabs.map((entry) => `
          <li>${renderTrainingSpeakableWord({ raw: entry.word, prefix: '', core: entry.word, suffix: '' }, 'training-notes-word')} ${escapeHtml(entry.note)}</li>`).join('')}
        </ul>`
      : '';
    const grammarHtml = grammar ? `<div class="training-notes-grammar">${escapeHtml(grammar)}</div>` : '';

    return `<div class="training-notes">${vocabHtml}${grammarHtml}</div>`;
  }

  /**
   * 记下当前这句的判分结果（成绩页用）；有错的句子记成测验评分一档，进间隔复习，
   * 测验 / 听力模式会优先抽到，「我的收藏」里按评分筛选也能找到
   * @returns {void}
   */
  function recordTrainingResult() {

    const training = state.training;
    const sentenceState = training.sentence;
    const outcomes = [...sentenceState.outcomes.values()];

    if (outcomes.length === 0) {

      return;
    }

    // 按分数累加（用过提示的空只算半个），所以 correct 可能是小数；没拿满分的句子（含靠提示填对的）都进复习
    const correct = outcomes.reduce((sum, outcome) => sum + outcome.score, 0);

    training.results[training.index] = {
      tokens: sentenceState.tokens,
      outcomes: new Map(sentenceState.outcomes),
      cn: training.sentences[training.index].cn,
      total: outcomes.length,
      correct,
    };

    if (correct < outcomes.length) {
      setItemMark(training.sentences[training.index].context, 1, { isToggle: false });
    }
  }

  /**
   * 成绩页：正确率、耗时、每句的红绿回顾（参考可可的"成绩解析 / 回顾详情"）
   * @returns {string}
   */
  function renderTrainingSummary() {

    const training = state.training;
    const results = training.results.filter(Boolean);
    const total = results.reduce((sum, result) => sum + result.total, 0);
    const correct = results.reduce((sum, result) => sum + result.correct, 0);
    const accuracy = total > 0 ? Math.round((correct / total) * 100) : 0;
    const elapsedSeconds = Math.round((training.finishedAt - training.startedAt) / 1000);
    const wrongSentenceCount = results.filter((result) => result.correct < result.total).length;

    const reviewHtml = results.map((result) => `
      <li class="training-review-item">
        <div class="training-sentence training-sentence--small">${renderTrainingCheckedTokens(result.tokens, result.outcomes)}</div>
        ${result.cn ? `<div class="training-cn">${escapeHtml(result.cn)}</div>` : ''}
      </li>`).join('');

    const nextDoc = state.data.tree ? getAdjacentDoc(training.slug, 1) : null;
    const nextDocHtml = nextDoc
      ? `<button type="button" class="btn" data-action="next-doc" data-slug="${escapeAttr(nextDoc.slug)}">下一篇 ›</button>`
      : '';
    const wrongNoteHtml = wrongSentenceCount > 0
      ? `<p class="training-note">有 ${wrongSentenceCount} 句没全对（靠提示填对的也算），已记成评分「一」进入复习，测验 / 听力模式会优先出现。</p>`
      : '';

    return `
      <div class="training-summary">
        <div class="training-stats">
          <div class="training-stat"><b>${results.length}</b><span>完成句数</span></div>
          <div class="training-stat"><b>${Number.isInteger(correct) ? correct : correct.toFixed(1)} / ${total}</b><span>正确词数</span></div>
          <div class="training-stat"><b>${accuracy}%</b><span>正确率</span></div>
          <div class="training-stat"><b>${Math.floor(elapsedSeconds / 60)}分${elapsedSeconds % 60}秒</b><span>耗时</span></div>
        </div>
        ${wrongNoteHtml}
        <div class="training-summary-actions">
          <button type="button" class="btn training-primary-btn" data-action="training-restart">重新开始</button>
          ${nextDocHtml}
        </div>
        <h3 class="training-review-title">回顾详情</h3>
        <ul class="training-review-list">${reviewHtml}</ul>
      </div>`;
  }

  /**
   * 难度 / 循环 / 语速 / 译 这一排设置
   * @returns {string}
   */
  function renderTrainingSettings() {

    const settings = state.trainingSettings;
    const levels = TRAINING_LEVELS[settings.tab];

    const levelHtml = levels
      ? `<label class="training-setting"><span>难度</span>
          <select data-role="training-setting" data-setting="level">
            ${levels.map((level) => `<option value="${level.id}"${level.id === settings.levels[settings.tab] ? ' selected' : ''}>${level.label}</option>`).join('')}
          </select></label>`
      : '';
    const loopHtml = TRAINING_LOOP_OPTIONS.map((count) => {
      const label = count === 0 ? '无限循环' : (count === 1 ? '播放 1 遍' : `循环 ${count} 遍`);

      return `<option value="${count}"${count === settings.loop ? ' selected' : ''}>${label}</option>`;
    }).join('');
    const rateHtml = TRAINING_RATE_OPTIONS.map((rate) => (
      `<option value="${rate}"${rate === settings.rate ? ' selected' : ''}>${rate.toFixed(1)}x</option>`
    )).join('');

    // 回译本来就显示中文，不需要「译」开关
    const cnToggleHtml = settings.tab === 'backtrans'
      ? ''
      : `<button type="button" class="btn training-cn-toggle${settings.showCn ? ' is-active' : ''}" data-action="training-toggle-cn" aria-label="显示中文">译</button>`;

    return `
      <div class="training-settings">
        ${levelHtml}
        <label class="training-setting"><span>循环</span>
          <select data-role="training-setting" data-setting="loop">${loopHtml}</select></label>
        <label class="training-setting"><span>语速</span>
          <select data-role="training-setting" data-setting="rate">${rateHtml}</select></label>
        ${cnToggleHtml}
      </div>`;
  }

  /**
   * 渲染句子训练视图：标签页 + 设置 + 进度 + 当前句子卡片 + 播放控制（或成绩页）
   * @returns {void}
   */
  function renderTrainingView() {

    const contentEl = document.querySelector('[data-role="content"]');

    syncBodyView();
    const training = state.training;
    const settings = state.trainingSettings;
    const doc = findDoc(training.slug);

    // 「句子训练」标签和文档标题放同一行，省一行纵向空间
    const headerHtml = `
      <header class="doc-header">
        <h2 class="doc-title"><span class="training-title-label">🎯 句子训练</span>${escapeHtml((doc && (doc.title || doc.slug)) || '')}</h2>
      </header>`;

    if (training.sentences.length === 0) {
      contentEl.innerHTML = `
        ${headerHtml}
        <p class="favorites-empty">这篇没有句子类内容（「句型 & 金句」或泛读「阅读原文」），换一篇试试。</p>`;

      return;
    }

    const tabsHtml = `
      <div class="training-tabs" role="tablist">
        ${TRAINING_TABS.map((tab) => `<button type="button" class="btn training-tab${tab.id === settings.tab ? ' is-active' : ''}" data-action="training-tab" data-tab="${tab.id}" role="tab">${tab.label}</button>`).join('')}
      </div>`;

    if (training.isFinished) {
      contentEl.innerHTML = `${headerHtml}${tabsHtml}${renderTrainingSummary()}`;

      return;
    }

    const sentence = training.sentences[training.index];
    const sentenceState = training.sentence;
    const total = training.sentences.length;
    const percent = Math.round(((training.index + 1) / total) * 100);

    // 会接着上次练到的那句，不在第一句时给个"从头开始"
    const restartHtml = training.index > 0
      ? '<button type="button" class="training-link-btn" data-action="training-restart">从头开始</button>'
      : '';
    const progressHtml = `
      <div class="training-progress">
        <span>第 ${training.index + 1} / ${total} 句</span>
        <div class="training-progress-bar"><div style="width: ${percent}%"></div></div>
        ${restartHtml}
      </div>`;

    let bodyHtml = '';

    if (settings.tab === 'listen') {
      bodyHtml = `<div class="training-sentence">${renderTrainingListenTokens(sentenceState)}</div>`;
    }

    if (settings.tab === 'dictation') {
      const hintHtml = !sentenceState.isChecked && sentenceState.blankOrder.length > 0
        ? '<div class="training-card-tools"><button type="button" class="btn training-hint-btn" data-action="training-hint">💡 提示</button><span class="training-note">先给首字母，再点给整个词；用了提示只算半对</span></div>'
        : '';

      bodyHtml = `<div class="training-sentence">${renderTrainingDictationTokens(sentenceState)}</div>${hintHtml}`;
    }

    if (settings.tab === 'pick') {
      bodyHtml = `<div class="training-sentence">${renderTrainingPickTokens(sentenceState)}</div>${renderTrainingPickTiles(sentenceState)}`;
    }

    if (settings.tab === 'backtrans') {
      bodyHtml = renderTrainingBacktrans(sentence, sentenceState);
    }

    // 这句没有符合当前难度的词可挖（比如很短的句子），提示一下，不然看起来像没反应
    const hasNoBlank = settings.tab !== 'backtrans' && sentenceState.blankOrder.length === 0;
    const noBlankHtml = hasNoBlank ? '<p class="training-note">这句在当前难度下没有要遮 / 要填的词，可以换个难度或直接下一句。</p>' : '';
    const cnHtml = settings.showCn && settings.tab !== 'backtrans' && sentence.cn
      ? `<div class="training-cn">${escapeHtml(sentence.cn)}</div>`
      : '';

    const primary = getTrainingPrimaryAction();

    // 做完这句（主按钮进入完成态）才显示词汇点和讲解，做之前显示等于提前给答案
    const notesHtml = primary.isDone ? renderTrainingNotes(sentence) : '';

    const isLast = training.index === total - 1;
    const hasSummary = settings.tab === 'dictation' || settings.tab === 'pick';
    const canGoNext = !isLast || hasSummary;
    const nextLabel = isLast && hasSummary ? '查看成绩' : '下一句';

    // 最后一句做完了，提示去哪看成绩（主按钮不再兼任"下一句"，不提示的话不知道下一步点哪）
    const lastHintHtml = isLast && hasSummary && sentenceState.isChecked
      ? '<p class="training-note">这是最后一句，点「下一句」查看成绩。</p>'
      : '';

    const enterLabels = { listen: '全部显示', dictation: '检查', pick: '显示答案', backtrans: '对比（输入框里用 Ctrl + Enter）' };
    const shortcutsHtml = `
      <p class="training-shortcuts">快捷键：空格 播放/停止 · R 重听 · ← → 上一句/下一句 · Enter ${enterLabels[settings.tab]}${settings.tab === 'dictation' ? ' · 填空时按空格跳到下一个空' : ''} · 点任意单词单独发音</p>`;

    // 训练页内容短，一屏就能看完，不放底部那排「收藏 / 测验……」按钮（用户要求去掉），视图切换用顶部工具条
    // 设置行和进度条放在播放控制下面（用户要求）：上方只留标签页，句子卡片更靠上、更突出
    contentEl.innerHTML = `
      ${headerHtml}
      ${tabsHtml}
      <div class="training-card">
        ${bodyHtml}
        ${cnHtml}
        ${noBlankHtml}
        ${notesHtml}
        ${lastHintHtml}
      </div>
      <div class="training-player">
        <button type="button" class="btn" data-action="training-prev"${training.index === 0 ? ' disabled' : ''}>上一句</button>
        <button type="button" class="btn training-primary-btn${primary.isDone ? ' is-done' : ''}" data-action="training-primary"${primary.action === 'none' ? ' disabled' : ''}>${escapeHtml(primary.label)}</button>
        <button type="button" class="btn training-play-btn" data-action="training-toggle-play" data-role="training-play-btn">▶ 播放</button>
        <button type="button" class="btn" data-action="training-next" title="${nextLabel}"${canGoNext ? '' : ' disabled'}>下一句</button>
      </div>
      ${renderTrainingSettings()}
      ${progressHtml}
      ${shortcutsHtml}`;

    updateTrainingPlayButton();

    // 听写刚进一句就把光标放进第一个空，直接开始打字；手机上不自动聚焦，免得键盘一下弹出来挡住句子
    if (settings.tab === 'dictation' && !sentenceState.isChecked && !isNarrowViewport()) {
      const firstInputEl = contentEl.querySelector('[data-role="training-blank"]');

      if (firstInputEl) {
        firstInputEl.focus();
      }
    }
  }

  /**
   * 切换标签页：保留当前句子位置，成绩重新算
   * @param {string} tabId
   * @returns {void}
   */
  function switchTrainingTab(tabId) {

    const training = state.training;

    if (!training || !TRAINING_TABS.some((tab) => tab.id === tabId)) {

      return;
    }

    stopTrainingPlayback();

    state.trainingSettings.tab = tabId;
    saveTrainingSettings();

    training.results = [];
    training.startedAt = Date.now();

    // 从成绩页切过来就从第一句开始，不然停在"最后一句之后"
    if (training.isFinished) {
      training.isFinished = false;
      training.index = 0;
    }

    buildTrainingSentenceState();
    renderTrainingView();
  }

  /**
   * 设置下拉框变化：难度要重建当前这句，循环 / 语速只存设置（下次播放生效）
   * @param {HTMLSelectElement} selectEl
   * @returns {void}
   */
  function handleTrainingSettingChange(selectEl) {

    const settings = state.trainingSettings;
    const { setting } = selectEl.dataset;

    if (setting === 'level') {
      settings.levels[settings.tab] = selectEl.value;
      saveTrainingSettings();
      buildTrainingSentenceState();
      renderTrainingView();

      return;
    }

    if (setting === 'loop') {
      settings.loop = Number(selectEl.value);
    }

    if (setting === 'rate') {
      settings.rate = Number(selectEl.value);
    }

    saveTrainingSettings();
  }

  /**
   * 句子训练快捷键；输入框里只处理 Enter（检查 / 下一句）和空格（听写跳到下一个空）
   * @param {KeyboardEvent} event
   * @returns {void}
   */
  function handleTrainingKeydown(event) {

    if (state.view !== 'training' || !state.training || event.isComposing) {

      return;
    }

    const targetEl = event.target;
    const isTyping = targetEl.matches && targetEl.matches('input, textarea, select');


    // 成绩页上没有当前句子，快捷键都不响应
    if (state.training.isFinished) {

      return;
    }

    if (isTyping) {

      if (targetEl.dataset.role === 'training-blank' && event.key === 'Enter') {
        event.preventDefault();
        handleTrainingPrimary({ isFromKeyboard: true });
      }

      if (targetEl.dataset.role === 'training-blank' && event.key === ' ') {
        event.preventDefault();

        const inputEls = [...document.querySelectorAll('[data-role="training-blank"]')];
        const nextInputEl = inputEls[inputEls.indexOf(targetEl) + 1];

        if (nextInputEl) {
          nextInputEl.focus();
        }
      }

      if (targetEl.dataset.role === 'training-backtrans-input' && event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
        event.preventDefault();
        handleTrainingPrimary({ isFromKeyboard: true });
      }

      return;
    }

    if (event.ctrlKey || event.metaKey || event.altKey) {

      return;
    }

    if (event.key === ' ') {
      event.preventDefault();
      toggleTrainingPlayback();
    }

    if (event.key === 'r' || event.key === 'R') {
      playTrainingSentence();
    }

    if (event.key === 'ArrowLeft') {
      goToTrainingSentence(state.training.index - 1);
    }

    if (event.key === 'ArrowRight') {
      goToTrainingSentence(state.training.index + 1);
    }

    if (event.key === 'Enter') {
      event.preventDefault();
      handleTrainingPrimary({ isFromKeyboard: true });
    }
  }

  /**

   * @param {HTMLElement} buttonEl
   * @returns {void}
   */
  function handleToggleFavoriteItem(buttonEl) {

    const slug = currentSlug();

  /**

   * @returns {void}
   */
  function toggleMode() {

    // 收藏 / 听力 / 句子训练视图下不响应模式切换（这几个视图没有 EN/CN 显示侧的概念）
    if (state.view === 'favorites' || state.view === 'listening' || state.view === 'training') {

      return;
    }

    state.mode = state.mode === 'en' ? 'cn' : 'en';
    saveMode(state.mode);

    // 测验模式没有单一的"当前文档"，直接用当前池子重渲染，不走 doc 分支
    if (state.view === 'quiz') {
      renderQuizView();

      return;
    }

    const slug = currentSlug();
    const doc = findDoc(slug);

    // 切换模式即清空该篇展开记录
    if (slug) {
      saveExpanded(slug, new Set());
    }

    if (doc) {
      renderContent(doc);
    }
